      const g = ctx.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, '#2a0f17'); g.addColorStop(1, '#0d0508');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-w * 0.42, 0); ctx.quadraticCurveTo(-w * 0.3, -h * 0.6, -w * 0.14, -h * 0.74); ctx.lineTo(w * 0.14, -h * 0.74); ctx.quadraticCurveTo(w * 0.3, -h * 0.6, w * 0.42, 0); ctx.closePath(); ctx.fill();
      // 얼굴
      ctx.fillStyle = '#e9d6cb'; ctx.beginPath(); ctx.ellipse(0, -h * 0.82, 26, 32, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#120a0d'; ctx.beginPath(); ctx.moveTo(-34, -h * 0.84); ctx.quadraticCurveTo(0, -h * 1.08, 34, -h * 0.84); ctx.lineTo(30, -h * 0.66); ctx.lineTo(22, -h * 0.82); ctx.lineTo(-22, -h * 0.82); ctx.lineTo(-30, -h * 0.66); ctx.fill();
      ctx.fillStyle = '#ff2f55'; ctx.fillRect(-14, -h * 0.82, 9, 3); ctx.fillRect(6, -h * 0.82, 9, 3);
      // 컴퍼스 지팡이
      ctx.strokeStyle = '#c9c4cf'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(w * 0.36, -h * 0.75); ctx.lineTo(w * 0.28, 0); ctx.moveTo(w * 0.36, -h * 0.75); ctx.lineTo(w * 0.48, -h * 0.05); ctx.stroke();
      ctx.fillStyle = '#ff2f55'; ctx.font = '800 22px ' + R.FONT; ctx.textAlign = 'center'; ctx.fillText('f∘g', 0, -h * 0.35);
    },
    daeyoung(ctx, R, b) { // 천국의 지배자 김대영 (허구의 캐릭터)
      const w = b.w_, h = b.h_, tier = b.tier || 0;
      ctx.save(); ctx.translate(0, -h * 0.82);
      // 두루마리 왕관 광륜
      for (let i = 0; i < 9 + tier; i++) {
        const a = -Math.PI + (i + 0.5) / (9 + tier) * Math.PI;
        ctx.save(); ctx.rotate(a + Math.PI / 2 + Math.sin(b.t + i) * 0.03); ctx.translate(0, -84);
        ctx.fillStyle = '#f1e2b3'; ctx.fillRect(-7, -34, 14, 34); ctx.fillStyle = '#b8892e'; ctx.fillRect(-9, -36, 18, 5);
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(255,215,120,0.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 70 + Math.sin(b.t * 2) * 4, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      // 법복
      const g = ctx.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, '#f6e7b8'); g.addColorStop(1, '#a8833b');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-w * 0.5, 0); ctx.quadraticCurveTo(-w * 0.4, -h * 0.55, -w * 0.18, -h * 0.72); ctx.lineTo(w * 0.18, -h * 0.72); ctx.quadraticCurveTo(w * 0.4, -h * 0.55, w * 0.5, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7a5a1e'; ctx.fillRect(-6, -h * 0.7, 12, h * 0.7);
      // 가면 같은 얼굴
      ctx.fillStyle = '#fbf3dc'; ctx.beginPath(); ctx.ellipse(0, -h * 0.82, 30, 36, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#b8892e'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#2a1f0e'; ctx.fillRect(-16, -h * 0.84, 10, 3); ctx.fillRect(6, -h * 0.84, 10, 3);
      ctx.fillStyle = tier >= 4 ? '#ff4040' : '#ffd76a'; ctx.beginPath(); ctx.arc(0, -h * 0.9, 4, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#e9d9a8'; ctx.save(); ctx.translate(-w * 0.32, -h * 0.5); ctx.rotate(-0.3); ctx.fillRect(-6, -60, 12, 110); ctx.restore();
      ctx.fillStyle = '#7a5a1e'; ctx.font = '800 20px ' + R.FONT; ctx.textAlign = 'center'; ctx.fillText(['見習', '正記', '首史', '守護', '神'][Math.min(4, tier)], 0, -h * 0.35);
    }
  };

  /* 먹물 마스코트 (도트 스프라이트 4프레임 × 표정 3종) */
  function mascot(ctx, R, x, y, t, mood, px, flip) {
    const PXL = MG.Pixel, frame = Math.floor(t * 8) % 4;
    const img = PXL.inkSprite(frame, mood || 'normal');
    const bob = Math.round(Math.sin(t * 3) * 2);
    PXL.draw(ctx, img, x, y + bob * (px || PXL.PX), 11, 10, flip === -1 ? -1 : 1, px);
  }

  /* NPC: 역할별 외형 → 도트 사람 퍼펫 (2프레임 숨쉬기, 말할 때 손짓) */
  function npc(ctx, R, x, y, look, t, talking) {
    const PXL = MG.Pixel, L = look || {};
    const ph = t * 2 + (L.seed || 0);
    const f2 = Math.floor(ph / Math.PI) % 2;
    const talkF = talking ? Math.floor(t * 8) % 2 : 0;
    const handsProp = L.prop === 'flag' || L.prop === 'hoe';
    const pose = {
      lt: 0.05, rt: -0.05, lk: 0, rk: 0,
      la: 0.12 + f2 * 0.05, lf: 0.15,
      ra: handsProp ? 0.25 : (talking ? -0.9 - talkF * 0.5 : -0.5), rf: handsProp ? -1.1 : -1.0,
      lean: 0, eye: Math.sin(t * 1.1 + (L.seed || 0)) > 0.98 ? 'c' : 'o'
    };
    const img = PXL.humanSprite(PXL.npcSpec(L), pose, 0);
    const [ax, ay] = PXL.HUMAN_ANCHOR;
    const px = L.px || PXL.PX;
    PXL.draw(ctx, img, x, y - (f2 || talkF) * px, ax, ay, L.face === -1 ? -1 : 1, px);
  }

  MG.BossArt = {
    draw(ctx, R, type, b, look) { (ART[type] || ART.billboard)(ctx, R, b, look); },
    mascot, npc, ART
  };
})();

</script>
<script>/* js/systems/BossSystem.js */
/* BossSystem — 공통 보스 엔진
 * 체력·방어막·공격 패턴·예고·회피 구간·전투 단계·문제 연동(정답=방어막 파괴→공격 기회, 오답=목숨 1 + 분노 패턴) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  class Boss {
    constructor(world, cfg) {
      this.w = world; this.cfg = cfg;
      this.name = cfg.name; this.title = cfg.title || '';
      this.maxHp = cfg.hp || 100; this.hp = this.maxHp;
      this.need = cfg.correctNeeded || 3;
      this.shield = true; this.state = 'idle'; this.stateT = 0;
      const a = world.arena;
      this.groundY = a.groundY;
      this.w_ = (cfg.look && cfg.look.w) || 170; this.h_ = (cfg.look && cfg.look.h) || 200;
      this.x = a.x1 - 300; this.y = this.groundY - this.h_ - 30; this.tx = this.x; this.ty = this.y;
      this.flash = 0; this.t = 0; this.patIdx = 0; this.cycleLeft = 0; this.pattern = null; this.patT = 0;
      this.waves = []; this.beams = []; this.pillars = []; this.windowT = 0; this.windowLeft = 0; this.lastHit = -1;
      this.correct = 0; this.wrong = 0; this.dmgTaken = 0; this.enraged = 0; this.tier = cfg.tier || 0;
      this.onQuestion = null; this.onDefeat = null;
      this.speedMul = 1;
      this.phaseNotes = cfg.phases || [];
      this._phaseSaid = {};
    }
    get cx() { return this.x + this.w_ / 2; }
    get cy() { return this.y + this.h_ / 2; }
    get rect() { return { x: this.x + 10, y: this.y + 10, w: this.w_ - 20, h: this.h_ - 20 }; }

    start() { this.state = 'attack'; this.cycleLeft = this.cfg.cycle || 2; this._next(); }
    _next() {
      const pats = this.cfg.patterns;
      if (this.cycleLeft <= 0) { this.state = 'question'; this.stateT = 0; if (this.onQuestion) this.onQuestion(); return; }
      this.cycleLeft--;
      let p = pats[Math.floor(Math.random() * pats.length)];
      if (pats.length > 1 && this.pattern && p === this.pattern.name) p = pats[(pats.indexOf(p) + 1) % pats.length];
      this.pattern = { name: p, t: 0, step: 0, data: {} };
      // 다음 위치로 이동
      const a = this.w.arena;
      const hover = this.cfg.ground ? this.groundY - this.h_ : this.groundY - this.h_ - 60 - Math.random() * 90;
      this.tx = U.lerp(a.x0 + 360, a.x1 - this.w_ - 160, Math.random());
      if (Math.abs(this.tx - this.w.player.x) < 260) this.tx = this.w.player.x > (a.x0 + a.x1) / 2 ? a.x0 + 260 : a.x1 - this.w_ - 200;
      this.ty = hover;
    }
    /* 문제 결과 처리 (월드가 호출) */
    answer(correct) {
      if (correct) {
        this.correct++;
        this.shield = false; this.state = 'vulnerable'; this.stateT = 0;
        this.windowT = 6.5; this.windowLeft = this.maxHp / this.need + 0.01;
        this.ty = this.groundY - this.h_;
        MG.Audio.sfx('shield'); MG.R.cam.shake(14, 0.4); MG.R.flash('#bfe3ff', 0.4); MG.Core.slowmo(0.35, 0.5);
        MG.R.particles.burst(this.cx, this.cy, 40, { color: ['#bfe3ff', '#fff', '#7fb8ff'], speedMin: 200, speedMax: 700, lifeMax: 0.9, shape: 'square', sizeMin: 4, sizeMax: 10, grav: 600 });
      } else {
        this.wrong++;
        this.enraged = 1;
        this.state = 'attack'; this.cycleLeft = 2;
        MG.R.flash('#ff2a2a', 0.3); MG.R.cam.shake(12, 0.35);
        this._next();
      }
    }
    hitBy(hb, dmgMul) {
      if (!hb || hb.id === this.lastHit) return;
      if (!U.aabb(hb, this.rect)) return;
      this.lastHit = hb.id;
      if (this.state !== 'vulnerable') {
        MG.Audio.sfx('hit');
        MG.R.particles.burst(hb.x + hb.w / 2, hb.y + hb.h / 2, 6, { color: '#9ad0ff', speedMin: 60, speedMax: 180, lifeMax: 0.25 });
        return;
      }
      const base = this.maxHp / this.need / 4.2;
      const d = Math.min(this.windowLeft, base * dmgMul);
      this.hp = Math.max(0, this.hp - d); this.windowLeft -= d; this.dmgTaken += d;
      this.flash = 0.12;
      MG.Audio.sfx('bossHit'); MG.Core.hitstop(0.06); MG.R.cam.shake(8, 0.15);
      MG.R.particles.burst(this.cx, this.cy, 14, { color: [this.cfg.look.color || '#222', '#fff', '#ffd76a'], speedMin: 150, speedMax: 520, lifeMax: 0.6, grav: 700 });
      MG.R.particles.spawn({ x: this.cx + (Math.random() - 0.5) * 60, y: this.y - 10, vy: -120, life: 0.8, size: 26, size2: 20, color: '#ffd76a', shape: 'text', text: '-' + Math.round(d) });
      if (this.hp <= 0.5) { this.hp = 0; this.die(); }
      else if (this.windowLeft <= 0.02) this._endWindow();
    }
    _endWindow() {
      this.shield = true; this.state = 'attack'; this.cycleLeft = this.cfg.cycle || 2; this.enraged = 0;
      MG.Audio.sfx('warn');
      this._next();
    }
    /* 약점 고리가 부서지면: 패턴 중단 + 잠깐 기절 + 다음 문제(봉인 해제 기회)가 한 단계 빨리 온다 */
    stagger(t) {
      if (this.state !== 'attack') return false;
      this.pattern = null; this._stunT = t || 2.2; this.beams.length = 0;
      this.cycleLeft = Math.max(0, this.cycleLeft - 1);
      MG.Audio.sfx('shield'); MG.R.cam.shake(10, 0.3); MG.R.flash('#ffd76a', 0.2);
      MG.R.particles.spawn({ x: this.cx, y: this.y - 30, vy: -50, life: 1.1, size: 24, size2: 20, color: '#ffd76a', shape: 'text', text: '기절!' });
      return true;
    }
    die() {
      this.state = 'dead'; this.stateT = 0; this.waves.length = 0; this.beams.length = 0; this.pillars.length = 0;
      this.w.combat.proj.length = 0; this.w.combat.drops.length = 0;
      MG.Audio.sfx('victory'); MG.R.flash('#fff', 0.7); MG.Core.slowmo(0.25, 1.2); MG.R.cam.shake(20, 0.8);
      if (this.onDefeat) setTimeout(() => this.onDefeat(), 1400);
    }

    update(dt) {
      this.t += dt; this.stateT += dt;
      if (this.flash > 0) this.flash -= dt;
      const hpr = this.hp / this.maxHp;
      this.speedMul = 1 + (1 - hpr) * 0.55 + this.tier * 0.12 + (this.enraged ? 0.35 : 0);
      // 단계 대사
      this.phaseNotes.forEach((ph, i) => { if (hpr <= ph.at && !this._phaseSaid[i]) { this._phaseSaid[i] = true; if (this.w.bossLine) this.w.bossLine(ph.line); } });
      // 위치 이동 (스프링)
      const k = 1 - Math.exp(-3 * dt);
      this.x += (this.tx - this.x) * k; this.y += (this.ty - this.y) * k + Math.sin(this.t * 2) * (this.cfg.ground || this.state === 'vulnerable' ? 0 : 0.4);
      const p = this.w.player;
      if (this.state === 'dead') { this.y += dt * 40; return; }
      if (this.state === 'vulnerable') {
        this.windowT -= dt;
        if (this.windowT <= 0) this._endWindow();
      } else if (this.state === 'special') {
        // 특수 단계(문제 없이 패턴만 반복) — 천국 5단계 연표 붕괴 등
        if (!this.pattern) {
          this._specialCd = (this._specialCd || 0) - dt;
          if (this._specialCd <= 0) { const sp = this.cfg.specialPatterns || this.cfg.patterns; this.pattern = { name: sp[Math.floor(Math.random() * sp.length)], t: 0, step: 0, data: {} }; }
        } else {
          this.pattern.t += dt * this.speedMul;
          if (this._runPattern(this.pattern, dt)) { this.pattern = null; this._specialCd = 0.6; }
        }
      } else if (this.state === 'attack' && this._stunT > 0) {
        // 기절: 공격 패턴 중단 (약점 고리 파괴 보상)
        this._stunT -= dt;
        if (Math.random() < dt * 10) MG.R.particles.spawn({ x: this.cx + (Math.random() - 0.5) * this.w_, y: this.y - 10, vy: -40, life: 0.6, size: 3, color: '#ffd76a', glow: true });
        if (this._stunT <= 0) this._next();
      } else if (this.state === 'attack' && this.pattern) {
        this.pattern.t += dt * this.speedMul;
        if (this._runPattern(this.pattern, dt)) { this.pattern = null; setTimeout(() => { if (this.state === 'attack' && !(this._stunT > 0) && !this.pattern) this._next(); }, 350 / this.speedMul); }
      }
      // 접촉 피해
      if (this.state !== 'vulnerable' && this.state !== 'question' && !(this._stunT > 0) && U.aabb({ x: p.x + 6, y: p.y + 6, w: p.w - 12, h: p.h - 8 }, this.rect)) this.w.combat.hurtPlayer(15, this.cx, 'boss:body');
      // 지면 충격파
      for (const wv of this.waves) {
        wv.x += wv.dir * wv.speed * dt; wv.life -= dt;
        if (Math.abs(wv.x - p.cx) < 34 && p.bottom > this.groundY - 46) this.w.combat.hurtPlayer(16, wv.x, 'boss:wave');
      }
      this.waves = this.waves.filter((w) => w.life > 0);
      // 레이저/곡선 빔
      for (const b of this.beams) {
        b.t += dt;
        if (b.t > b.warn && b.t < b.warn + b.dur) {
          if (b.kind === 'h') { if (Math.abs(p.cy - b.y) < 22 + 40 && p.y < b.y + 20 && p.bottom > b.y - 20) this.w.combat.hurtPlayer(18, p.cx - 1, 'boss:beam'); }
          else if (b.kind === 'curve') { const yy = b.f(p.cx); if (yy != null && Math.abs(yy - p.cy) < 48) this.w.combat.hurtPlayer(18, p.cx - 1, 'boss:curve'); }
          else if (b.kind === 'v') { if (Math.abs(p.cx - b.x) < b.w / 2 + 14) this.w.combat.hurtPlayer(18, b.x, 'boss:pillar'); }
        }
      }
      this.beams = this.beams.filter((b) => b.t < b.warn + b.dur);
      // 공격 판정
      const hb = p.hitbox();
      if (this.inkMarkT > 0) this.inkMarkT -= dt;
      if (hb) {
        let mul = (MG.State.combo >= 8 ? 1.6 : MG.State.combo >= 4 ? 1.25 : 1) * (hb.mul || 1);
        // 먹·붓 합격: 먹물 탄에 맞은 보스를 바로 붓으로 치면 1.5배
        if (this.inkMarkT > 0 && this.state === 'vulnerable' && MG.Abilities && MG.Abilities.has('joint') && U.aabb(hb, this.rect) && hb.id !== this.lastHit) { mul *= 1.5; this.inkMarkT = 0; MG.R.particles.burst(this.cx, this.cy, 24, { color: ['#1a1030', '#a98bff', '#fff'], speedMin: 150, speedMax: 500, lifeMax: 0.6, shape: 'square', sizeMin: 4, sizeMax: 10 }); }
        if (hb.counter && U.aabb(hb, this.rect) && hb.id !== this.lastHit) p.counterT = 0;
        this.hitBy(hb, mul);
      }
    }

    /* 패턴 실행: 끝나면 true */
    _runPattern(P, dt) {
      const C = this.w.combat, p = this.w.player, a = this.w.arena, col = this.cfg.look.proj || '#15151c';
      const shapes = this.cfg.look.shapes || ['orb'];
      const sh = () => shapes[Math.floor(Math.random() * shapes.length)];
      const glyph = () => { const g = this.cfg.look.glyphs; return g ? g[Math.floor(Math.random() * g.length)] : null; };
      const step = (at) => { if (P.t >= at && P.step === P._s) { P._s++; return true; } return false; };
      P._s = P._s || 0; P.step = P.step || 0;
      const fire = (n, fn) => { for (let i = 0; i < n; i++) fn(i); };
      switch (P.name) {
        case 'barrage': {
          if (P.t < 0.6) { this._telegraph(P, 'ring'); return false; }
          const waves = 3 + (this.enraged ? 1 : 0);
          while (P.step < waves && P.t >= 0.6 + P.step * 0.55) {
            const n = 10 + this.tier * 2, off = P.step * 0.3;
            fire(n, (i) => { const ang = off + i / n * Math.PI * 2; const s = sh(); C.shoot(this.cx, this.cy, Math.cos(ang) * 300, Math.sin(ang) * 300, { color: col, r: 11, dmg: 12, kind: 'pass', life: 5, shape: s, label: glyph(), glow: this.cfg.look.glow }); });
            MG.Audio.sfx('attack'); P.step++;
          }
          return P.t > 0.6 + waves * 0.55 + 0.6;
        }
        case 'aimed': {
          if (P.t < 0.5) { this._telegraph(P, 'eye'); return false; }
          const n = 4 + this.tier + (this.enraged ? 2 : 0);
          while (P.step < n && P.t >= 0.5 + P.step * 0.32) {
            const ang = Math.atan2(p.cy - this.cy, p.cx - this.cx) + (Math.random() - 0.5) * 0.12;
            C.shoot(this.cx, this.cy, Math.cos(ang) * 520, Math.sin(ang) * 520, { color: col, r: 12, dmg: 13, kind: 'pass', life: 4, shape: sh(), label: glyph(), glow: this.cfg.look.glow });
            MG.Audio.sfx('dash'); P.step++;
          }
          return P.t > 0.5 + n * 0.32 + 0.4;
        }
        case 'slam': {
          if (P.step === 0) { this.ty = this.groundY - this.h_ - 220; P.step = 1; }
          if (P.t > 0.7 && P.step === 1) { this.ty = this.groundY - this.h_; P.step = 2; }
          if (P.t > 1.0 && P.step === 2) {
            P.step = 3; MG.R.cam.shake(16, 0.35); MG.Audio.sfx('door');
            const sp = 520 + this.tier * 60;
            this.waves.push({ x: this.cx, dir: 1, speed: sp, life: 2.6 }, { x: this.cx, dir: -1, speed: sp, life: 2.6 });
            if (this.enraged || this.tier >= 2) setTimeout(() => this.waves.push({ x: this.cx, dir: 1, speed: sp * 0.8, life: 2.8 }, { x: this.cx, dir: -1, speed: sp * 0.8, life: 2.8 }), 700);
            MG.R.particles.burst(this.cx, this.groundY, 30, { angle: -Math.PI / 2, spread: 2.8, color: ['#fff', '#999'], speedMin: 150, speedMax: 520, grav: 1200, lifeMax: 0.7 });
          }
          return P.t > 2.2;
        }
        case 'rain': {
          if (P.step === 0) {
            P.step = 1;
            const n = 7 + this.tier * 2 + (this.enraged ? 3 : 0);
            for (let i = 0; i < n; i++) {
              const x = i === 0 ? p.cx : U.lerp(a.x0 + 120, a.x1 - 120, Math.random());
              C.drops.push({ x, y: this.groundY - 720, vy: 0, warn: 0.75 + i * 0.12, gy: this.groundY });
            }
          }
          return P.t > 2.4;
        }
        case 'laser': {
          if (P.step === 0) {
            P.step = 1;
            const low = Math.random() < 0.5;
            const y = low ? this.groundY - 34 : this.groundY - 150;
            this.beams.push({ kind: 'h', y, warn: 1.0 / this.speedMul + 0.25, dur: 0.6, t: 0, col: this.cfg.look.beam || '#ff4d6d', hint: low ? '점프!' : '점프 금지!' });
            if (this.tier >= 2 || this.enraged) this.beams.push({ kind: 'h', y: low ? this.groundY - 150 : this.groundY - 34, warn: 2.2 / this.speedMul + 0.3, dur: 0.6, t: 0, col: this.cfg.look.beam || '#ff4d6d', hint: low ? '점프 금지!' : '점프!' });
          }
          return P.t > (this.tier >= 2 || this.enraged ? 3.2 : 2.0);
        }
        case 'charge': {
          if (P.step === 0) { P.step = 1; P.data.dir = p.cx < this.cx ? -1 : 1; this.ty = this.groundY - this.h_; }
          if (P.t < 0.9) { this._telegraph(P, 'charge'); return false; }
          if (P.step === 1) { P.step = 2; this.tx = P.data.dir < 0 ? a.x0 + 60 : a.x1 - this.w_ - 60; MG.Audio.sfx('dash'); }
          if (P.t > 0.9 && P.t < 1.6) { const k = U.clamp((P.t - 0.9) / 0.6, 0, 1); this.x = U.lerp(this.x, this.tx, k * 0.35); }
          return P.t > 1.9;
        }
        case 'summon': {
          if (P.step === 0) {
            P.step = 1;
            const n = 2 + (this.tier >= 2 ? 1 : 0);
            for (let i = 0; i < n; i++) {
              const ex = U.lerp(a.x0 + 200, a.x1 - 260, Math.random());
              if (Math.random() < 0.5) C.spawnEnemy('blob', ex, this.groundY - 46, { minX: a.x0 + 40, maxX: a.x1 - 100 });
              else C.spawnEnemy('scroll', ex, this.groundY - 260, {});
            }
            MG.R.particles.burst(this.cx, this.cy, 20, { color: '#111', speedMin: 100, speedMax: 300, lifeMax: 0.6 });
          }
          return P.t > 1.4;
        }
        case 'graph': { // 지옥 전용: 함수 그래프 빔
          if (P.step === 0) {
            P.step = 1;
            const kinds = ['inv', 'sqrt', 'line', 'invNeg'];
            const k = kinds[Math.floor(Math.random() * kinds.length)];
            const x0 = a.x0, x1 = a.x1, gy = this.groundY;
            const mid = (x0 + x1) / 2;
            let f, label;
            if (k === 'inv') { const pX = mid + (Math.random() - 0.5) * 300; f = (x) => { const d = (x - pX) / 120; if (Math.abs(d) < 0.15) return null; return gy - 230 + (1 / d) * 90; }; label = 'y = k/(x−p) + q'; }
            else if (k === 'invNeg') { const pX = mid + (Math.random() - 0.5) * 300; f = (x) => { const d = (x - pX) / 120; if (Math.abs(d) < 0.15) return null; return gy - 230 - (1 / d) * 90; }; label = 'y = −k/(x−p) + q'; }
            else if (k === 'sqrt') { const pX = x0 + 120 + Math.random() * 300; f = (x) => (x < pX ? null : gy - 20 - Math.sqrt((x - pX) / 1) * 7.5); label = 'y = √(a(x−p)) + q'; }
            else { const s = Math.random() < 0.5 ? 1 : -1; f = (x) => gy - 230 + s * (x - mid) * 0.28; label = 'y = ax + b'; }
            this.beams.push({ kind: 'curve', f, x0, x1, warn: 1.2 / this.speedMul + 0.3, dur: 0.7, t: 0, col: '#ff3355', label });
          }
          return P.t > 2.3;
        }
        case 'pillars': { // 천국 전용: 빛기둥
          if (P.step === 0) {
            P.step = 1;
            const n = 3 + this.tier;
            const pxs = [p.cx];
            for (let i = 1; i < n; i++) pxs.push(U.lerp(a.x0 + 100, a.x1 - 100, Math.random()));
            pxs.forEach((x, i) => this.beams.push({ kind: 'v', x, w: 70, warn: 0.9 + i * 0.18, dur: 0.55, t: 0, col: '#ffd76a' }));
          }
          return P.t > 2.4;
        }
        case 'orbit': {
          if (P.step === 0) {
            P.step = 1;
            const n = 8 + this.tier * 2;
            for (let i = 0; i < n; i++) {
              const ang = i / n * Math.PI * 2;
              const q = C.shoot(this.cx + Math.cos(ang) * 60, this.cy + Math.sin(ang) * 60, Math.cos(ang) * 120, Math.sin(ang) * 120, { color: col, r: 12, dmg: 12, kind: 'pass', life: 6, shape: sh(), label: glyph(), glow: this.cfg.look.glow });
              q.grav = 0;
            }
          }
          if (P.t > 1 && P.step === 1) { P.step = 2; for (const q of C.proj) { const ang = Math.atan2(p.cy - q.y, p.cx - q.x); q.vx = Math.cos(ang) * 380; q.vy = Math.sin(ang) * 380; } }
          return P.t > 2.4;
        }
        default: return true;
      }
    }
    _telegraph(P, kind) { P.tele = kind; }

    draw(R) {
      const ctx = R.ctx;
      // 충격파
      for (const wv of this.waves) {
        ctx.fillStyle = this.cfg.look.wave || 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.moveTo(wv.x - 30, this.groundY); ctx.quadraticCurveTo(wv.x, this.groundY - 70, wv.x + 30, this.groundY); ctx.fill();
        R.light(wv.x, this.groundY - 20, 80, 'rgba(255,255,255,0.6)', 0.3);
      }
      // 빔 예고/발사
      for (const b of this.beams) {
        const active = b.t > b.warn;
        const a = active ? 0.85 : 0.25 + 0.25 * Math.sin(R.time * 25);
        ctx.strokeStyle = b.col; ctx.globalAlpha = a;
        if (b.kind === 'h') {
          ctx.lineWidth = active ? 40 : 4;
          ctx.beginPath(); ctx.moveTo(this.w.arena.x0, b.y); ctx.lineTo(this.w.arena.x1, b.y); ctx.stroke();
          if (!active && b.hint) { ctx.globalAlpha = 0.9; R.text(b.hint, this.w.player.cx, b.y - 34, 26, b.col); }
          if (active) R.light(this.w.player.cx, b.y, 220, b.col, 0.4);
        } else if (b.kind === 'curve') {
          ctx.lineWidth = active ? 30 : 4;
          ctx.beginPath(); let first = true;
          for (let x = b.x0; x <= b.x1; x += 12) { const y = b.f(x); if (y == null || y < this.groundY - 700 || y > this.groundY + 40) { first = true; continue; } if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); }
          ctx.stroke();
          ctx.globalAlpha = 0.95; R.text(b.label, (b.x0 + b.x1) / 2, this.groundY - 520, 28, '#ffb3c0');
        } else if (b.kind === 'v') {
          ctx.fillStyle = b.col;
          if (active) { ctx.fillRect(b.x - b.w / 2, this.groundY - 900, b.w, 900); R.light(b.x, this.groundY - 200, 200, 'rgba(255,220,120,0.9)', 0.5); }
          else { ctx.fillRect(b.x - b.w / 2, this.groundY - 8, b.w, 8); ctx.lineWidth = 2; ctx.strokeRect(b.x - b.w / 2, this.groundY - 900, b.w, 900); }
        }
        ctx.globalAlpha = 1;
      }
      // 본체
      const look = this.cfg.look;
      R.shadow(this.cx, this.groundY, this.w_ * 0.6, 0.45);
      if (look.glow) R.light(this.cx, this.cy, this.w_ * 1.4, look.glow, 0.45);
      ctx.save();
      ctx.translate(this.cx, this.y + this.h_);
      if (this.state === 'dead') { ctx.globalAlpha = Math.max(0, 1 - this.stateT * 0.6); ctx.rotate(Math.sin(this.stateT * 20) * 0.05); }
      const P = this.pattern;
      const telegraph = P && P.tele && P.t < 1 && this.state === 'attack';
      if (telegraph) { ctx.translate(Math.sin(R.time * 60) * 3, 0); }
      // 보스 그림을 저해상도 격자에 다시 그려 도트화 (초당 12프레임, 외곽선·색 단계화)
      const bw = this.w_, bh = this.h_;
      MG.Pixel.pixelated(ctx, this, [-bw * 0.95, -bh * 1.32, bw * 0.95, bh * 0.12], (g) => MG.BossArt.draw(g, R, look.type, this, look));
      ctx.restore();
      if (this.flash > 0) { R.light(this.cx, this.cy, this.w_, 'rgba(255,255,255,1)', 0.8); }
      // 방어막
      if (this.shield && this.state !== 'dead') {
        ctx.strokeStyle = 'rgba(160,210,255,' + (0.45 + 0.25 * Math.sin(R.time * 3)) + ')'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.ellipse(this.cx, this.cy, this.w_ * 0.72, this.h_ * 0.64, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(this.cx, this.cy, this.w_ * 0.66, this.h_ * 0.58, 0, 0, Math.PI * 2); ctx.stroke();
      }
      if (this.state === 'vulnerable') {
        R.text('기록 봉인 해제! 붓으로 공격', this.cx, this.y - 34, 24, '#ffd76a');
        ctx.fillStyle = 'rgba(255,215,106,0.8)'; ctx.fillRect(this.cx - 80, this.y - 16, 160 * U.clamp(this.windowT / 6.5, 0, 1), 6);
      }
      if (telegraph && P.tele === 'charge') R.text('돌진 — 회피!', this.cx, this.y - 30, 26, '#ff6b6b');
    }
  }

  MG.Boss = Boss;
})();

</script>
<script>/* js/systems/QuestionEngine.js */
/* QuestionEngine — 문제·수수께끼 출제 UI와 정답 판정
 * 유형: mc(객관식/보기 조합), liar(거짓말하는 NPC), forgery(위조 문서), order(기록의 문), match(기억의 미궁)
 * 문제를 읽는 동안 게임 시간은 멈춘다(읽기 시간과 조작 속도를 경쟁시키지 않음).
 * 확정 버튼 2단계 선택 + 최소 읽기 시간으로 무작정 빠르게 누르는 플레이를 막는다. */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const NUM = ['①', '②', '③', '④', '⑤', '⑥'];
  const TYPE_LABEL = { mc: '객관식', liar: '거짓말하는 NPC', forgery: '위조된 문서', order: '기록의 문', match: '기억의 미궁', cause: '역사적 인과관계' };
  const IMP_LABEL = { S: '최상위', A: '매우 중요', B: '높음', C: '중요', D: '형광펜', P: '54~55쪽 전체 중요', T: '튜토리얼' };

  const Q = {
    open: false, _resolve: null,
    root: null,
    ask(q, ctx) {
      ctx = ctx || {};
      return new Promise((resolve) => {
        if (this.open) { console.warn('이미 문제가 열려 있음'); resolve({ correct: false, skipped: true }); return; }
        this.open = true; this._resolve = resolve;
        MG.Core.pushFreeze();
        MG.Input.setTouchVisible(false);
        this._render(q, ctx);
      });
    },
    _close(result) {
      if (!this.open) return;
      this.open = false;
      const r = this.root;
      r.classList.remove('show');
      setTimeout(() => r.remove(), 260);
      MG.Core.popFreeze();
      MG.Input.setTouchVisible(true);
      const res = this._resolve; this._resolve = null;
      document.removeEventListener('keydown', this._key);
      res && res(result);
    },
    _hdr(q, ctx) {
      const t = q.type === 'mc' && q.kind === 'cause' ? 'cause' : q.type;
      return U.el('div', { class: 'q-head' },
        ctx.label ? U.el('span', { class: 'chip ctx' }, ctx.label) : null,
        q.pages && q.pages.length ? U.el('span', { class: 'chip' }, '교과서 p.' + q.pages.join('·')) : null,
        q.importance ? U.el('span', { class: 'chip imp imp-' + q.importance }, '중요도 ' + (IMP_LABEL[q.importance] || q.importance)) : null,
        U.el('span', { class: 'chip' }, TYPE_LABEL[t] || '문제'),
        q.difficulty ? U.el('span', { class: 'chip diff' }, '난이도 ' + '★'.repeat(q.difficulty)) : null);
    },
    _render(q, ctx) {
      const root = this.root = U.el('div', { class: 'qmodal' });
      const card = U.el('div', { class: 'qcard glass' });
      root.appendChild(card);
      card.appendChild(this._hdr(q, ctx));
      if (q.story) card.appendChild(U.el('div', { class: 'q-story' }, q.story));
      card.appendChild(U.el('div', { class: 'q-stem', html: U.esc(U.fill(q.stem, { nick: MG.State.nick })).replace(/\n/g, '<br>') }));
      if (q.figure) card.appendChild(U.el('div', { class: 'q-figure', html: q.figure }));
      if (q.source) card.appendChild(U.el('div', { class: 'q-source' }, q.source.title ? U.el('b', {}, q.source.title) : null, U.el('div', { html: U.esc(q.source.text).replace(/\n/g, '<br>') }), q.source.cite ? U.el('div', { class: 'cite' }, '— ' + q.source.cite) : null));
      if (q.statements) card.appendChild(U.el('div', { class: 'q-statements' }, q.statements.map((s) => U.el('div', {}, s))));
      const body = U.el('div', { class: 'q-body' });
      card.appendChild(body);
      const foot = U.el('div', { class: 'q-foot' });
      const confirm = U.el('button', { class: 'btn primary big', disabled: true }, '확정');
      const hint = U.el('span', { class: 'q-hint' }, '');
      foot.appendChild(hint); foot.appendChild(confirm);
      card.appendChild(foot);
      document.getElementById('ui-root').appendChild(root);
      requestAnimationFrame(() => root.classList.add('show'));

      const minRead = ctx.minRead != null ? ctx.minRead : 0.9;
      const shownAt = U.now();
      let ready = false;
      const st = { sel: null };
      const refresh = () => {
        const okNow = (U.now() - shownAt) / 1000 >= minRead;
        confirm.disabled = !(ready && okNow);
        if (ready && !okNow) setTimeout(refresh, 120);
      };
      const setReady = (v, msg) => { ready = v; hint.textContent = msg || ''; refresh(); };

      let evaluate;
      if (q.type === 'mc' || q.type === 'liar') evaluate = this._mc(q, body, st, setReady);
      else if (q.type === 'forgery') evaluate = this._forgery(q, body, st, setReady);
      else if (q.type === 'order') evaluate = this._order(q, body, st, setReady);
      else if (q.type === 'match') evaluate = this._match(q, body, st, setReady);
      else { body.textContent = '알 수 없는 문제 유형'; evaluate = () => ({ correct: false }); setReady(true); }

      this._key = (e) => {
        if (e.key >= '1' && e.key <= '6' && st.pick) st.pick(+e.key - 1);
        if (e.key === 'Enter' && !confirm.disabled) { e.preventDefault(); confirm.click(); }
      };
      document.addEventListener('keydown', this._key);

      confirm.addEventListener('click', () => {
        if (confirm.disabled) return;
        const r = evaluate();
        card.classList.add('answered', r.correct ? 'is-correct' : 'is-wrong');
        foot.remove();
        MG.Audio.sfx(r.correct ? 'correct' : 'wrong');
        if (r.correct && MG.State.combo >= 1) setTimeout(() => MG.Audio.sfx('combo'), 160);
        U.vibrate(r.correct ? 15 : [40, 40, 40]);
        if (!ctx.noRecord) MG.State.recordAnswer(q, r.correct, ctx);
        const res = U.el('div', { class: 'q-result' });
        res.appendChild(U.el('div', { class: 'q-verdict' }, r.correct ? '정답' : '오답', ctx.resultNote ? U.el('span', { class: 'note' }, ctx.resultNote(r.correct)) : null));
        if (r.detail) res.appendChild(r.detail);
        if (q.explain) res.appendChild(U.el('div', { class: 'q-explain' }, U.el('b', {}, '교과서 근거 '), q.explain));
        if (q.marks && q.marks.length) res.appendChild(U.el('div', { class: 'q-marks' }, '필기 표시: ' + q.marks.join(' · ')));
        const cont = U.el('button', { class: 'btn primary big' }, '계속');
        cont.addEventListener('click', () => { MG.Audio.sfx('ui'); this._close(r); });
        res.appendChild(cont);
        card.appendChild(res);
        setTimeout(() => res.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
        this._key = (e) => { if (e.key === 'Enter') { e.preventDefault(); cont.click(); } };
        document.addEventListener('keydown', this._key);
      });
    },

    /* 객관식 / 거짓말하는 NPC */
    _mc(q, body, st, setReady) {
      const order = q.shuffle === false ? q.options.map((_, i) => i) : U.shuffle(q.options.map((_, i) => i));
      const list = U.el('div', { class: 'q-options' + (q.optionFigures ? ' figs' : '') + (q.type === 'liar' ? ' liar' : '') });
      const btns = [];
      order.forEach((oi, pos) => {
        const label = q.type === 'liar' ? null : U.el('span', { class: 'num' }, NUM[pos]);
        let content;
        if (q.type === 'liar') {
          const s = q.speakers[oi];
          content = U.el('div', { class: 'speaker' }, U.el('div', { class: 'who' }, s.name), U.el('div', { class: 'says' }, '“' + s.says + '”'));
        } else content = U.el('span', { class: 'txt', html: U.esc(q.options[oi]) });
        const b = U.el('button', { class: 'opt' }, label, content, q.optionFigures ? U.el('div', { class: 'ofig', html: q.optionFigures[oi] }) : null);
        b.addEventListener('click', () => st.pick(pos));
        btns.push(b); list.appendChild(b);
      });
      body.appendChild(list);
      st.pick = (pos) => {
        if (pos >= btns.length) return;
        btns.forEach((b, i) => b.classList.toggle('sel', i === pos));
        st.sel = pos; MG.Audio.sfx('select');
        setReady(true);
      };
      setReady(false, q.type === 'liar' ? '거짓말을 하는 사람을 고르세요' : '답을 고른 뒤 확정');
      return () => {
        const chosen = order[st.sel];
        const correct = chosen === q.answer;
        btns.forEach((b, i) => {
          b.disabled = true;
          if (order[i] === q.answer) b.classList.add('right');
          else if (i === st.sel) b.classList.add('wrong');
        });
        let detail = null;
        if (q.why && q.why.length) {
          detail = U.el('div', { class: 'q-why' });
          order.forEach((oi, pos) => {
            if (!q.why[oi]) return;
            detail.appendChild(U.el('div', { class: 'why-row' + (oi === q.answer ? ' ok' : '') }, U.el('span', { class: 'num' }, q.type === 'liar' ? q.speakers[oi].name : NUM[pos]), U.el('span', {}, q.why[oi])));
          });
        }
        return { correct, detail, chosen };
      };
    },

    /* 위조된 문서: 틀린 문장을 모두 찾기 */
    _forgery(q, body, st, setReady) {
      const segs = q.doc.segments;
      const need = segs.filter((s) => s.wrong).length;
      const doc = U.el('div', { class: 'q-doc' }, U.el('div', { class: 'doc-title' }, q.doc.title));
      const picked = new Set();
      const els = segs.map((s, i) => {
        const e = U.el('span', { class: 'seg' }, s.t + ' ');
        e.addEventListener('click', () => {
          if (picked.has(i)) picked.delete(i); else picked.add(i);
          e.classList.toggle('sel', picked.has(i)); MG.Audio.sfx('select');
          setReady(picked.size === need, picked.size + ' / ' + need + '곳 선택');
        });
        doc.appendChild(e); return e;
      });
      body.appendChild(U.el('div', { class: 'q-tip' }, '역사적 사실과 다른 문장 ' + need + '곳을 눌러 표시하세요.'));
      body.appendChild(doc);
      setReady(false, '0 / ' + need + '곳 선택');
      return () => {
        let correct = true;
        segs.forEach((s, i) => {
          const p = picked.has(i);
          if (p !== !!s.wrong) correct = false;
          if (s.wrong) els[i].classList.add('right');
          else if (p) els[i].classList.add('wrong');
        });
        const detail = U.el('div', { class: 'q-why' }, segs.filter((s) => s.wrong).map((s) => U.el('div', { class: 'why-row' }, U.el('span', { class: 'num' }, '정정'), U.el('span', {}, s.fix))));
        return { correct, detail };
      };
    },

    /* 기록의 문: 사건을 시간 순서대로 배열 */
    _order(q, body, st, setReady) {
      const items = q.items.map((t, i) => ({ t, i }));
      const pool = U.shuffle(items);
      const seq = [];
      const slots = U.el('div', { class: 'q-seq' });
      const poolEl = U.el('div', { class: 'q-pool' });
      body.appendChild(U.el('div', { class: 'q-tip' }, q.tip || '먼저 일어난 사건부터 차례로 누르세요. 놓은 카드를 다시 누르면 빠집니다.'));
      body.appendChild(slots); body.appendChild(poolEl);
      const draw = () => {
        slots.innerHTML = ''; poolEl.innerHTML = '';
        for (let k = 0; k < items.length; k++) {
          const it = seq[k];
          const s = U.el('button', { class: 'slot' + (it ? ' filled' : '') }, U.el('span', { class: 'num' }, String(k + 1)), it ? it.t : '');
          if (it) s.addEventListener('click', () => { seq.splice(k, 1); MG.Audio.sfx('select'); draw(); });
          slots.appendChild(s);
        }
        pool.filter((p) => !seq.includes(p)).forEach((p) => {
          const c = U.el('button', { class: 'card' }, p.t);
          c.addEventListener('click', () => { seq.push(p); MG.Audio.sfx('select'); draw(); });
          poolEl.appendChild(c);
        });
        setReady(seq.length === items.length, seq.length + ' / ' + items.length);
      };
      draw();
      return () => {
        const correct = seq.every((p, k) => p.i === k);
        [...slots.children].forEach((s, k) => s.classList.add(seq[k].i === k ? 'right' : 'wrong'));
        const detail = U.el('div', { class: 'q-why' }, U.el('div', { class: 'why-row ok' }, U.el('span', { class: 'num' }, '순서'), U.el('span', {}, (q.labels || q.items).join('  →  '))));
        return { correct, detail };
      };
    },

    /* 기억의 미궁: 짝 연결 */
    _match(q, body, st, setReady) {
      const L = q.pairs.map((p, i) => ({ t: p[0], i }));
      const Rr = U.shuffle(q.pairs.map((p, i) => ({ t: p[1], i })));
      const link = {}; // 왼쪽 i → 오른쪽 i
      let cur = null;
      const colors = ['#6c8cff', '#ffb547', '#41d1a5', '#ff6b9a', '#b38cff', '#5fd0ff'];
      const wrap = U.el('div', { class: 'q-match' });
      const lc = U.el('div', { class: 'col' }), rc = U.el('div', { class: 'col' });
      wrap.appendChild(lc); wrap.appendChild(rc);
      body.appendChild(U.el('div', { class: 'q-tip' }, q.tip || '왼쪽 항목을 누른 뒤 알맞은 오른쪽 항목을 누르세요.'));
      body.appendChild(wrap);
      const lEls = [], rEls = [];
      const paint = () => {
        const used = Object.keys(link);
        lEls.forEach((e, k) => { const li = L[k].i; const idx = used.indexOf(String(li)); e.style.setProperty('--mc', idx >= 0 ? colors[idx % colors.length] : 'transparent'); e.classList.toggle('linked', idx >= 0); e.classList.toggle('cur', cur === li); });
        rEls.forEach((e, k) => { const ri = Rr[k].i; const li = Object.keys(link).find((x) => link[x] === ri); const idx = li != null ? used.indexOf(li) : -1; e.style.setProperty('--mc', idx >= 0 ? colors[idx % colors.length] : 'transparent'); e.classList.toggle('linked', idx >= 0); });
        setReady(used.length === L.length, used.length + ' / ' + L.length + ' 연결');
      };
      L.forEach((it) => { const e = U.el('button', { class: 'mitem' }, it.t); e.addEventListener('click', () => { cur = it.i; delete link[it.i]; MG.Audio.sfx('select'); paint(); }); lEls.push(e); lc.appendChild(e); });
      Rr.forEach((it) => { const e = U.el('button', { class: 'mitem' }, it.t); e.addEventListener('click', () => {
        if (cur == null) return;
        Object.keys(link).forEach((k) => { if (link[k] === it.i) delete link[k]; });
        link[cur] = it.i; cur = null; MG.Audio.sfx('select'); paint();
      }); rEls.push(e); rc.appendChild(e); });
      paint();
      return () => {
        let correct = true;
        L.forEach((it, k) => { const ok = link[it.i] === it.i; if (!ok) correct = false; lEls[k].classList.add(ok ? 'right' : 'wrong'); });
        const detail = U.el('div', { class: 'q-why' }, q.pairs.map((p) => U.el('div', { class: 'why-row ok' }, U.el('span', { class: 'num' }, p[0]), U.el('span', {}, p[1]))));
        return { correct, detail };
      };
    }
  };
  MG.Q = Q;
})();

</script>
<script>/* js/systems/NPCSystem.js */
/* NPCSystem — NPC 엔티티, 짧은 대화창, 먹물 말풍선(비차단), 미션 진행 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  /* ── 대화창 (차단형: 게임 일시 정지) ── */
  const Dialog = {
    open: false,
    talk(lines, opts) {
      opts = opts || {};
      if (!lines || !lines.length) return Promise.resolve();
      return new Promise((resolve) => {
        this.open = true;
        MG.Core.pushFreeze();
        MG.Input.setTouchVisible(false);
        const box = U.el('div', { class: 'dialog glass' });
        const name = U.el('div', { class: 'dname' });
        const text = U.el('div', { class: 'dtext' });
        const next = U.el('div', { class: 'dnext' }, '▶');
        const skip = U.el('button', { class: 'dskip btn small ghost' }, '건너뛰기');
        box.append(name, text, next, skip);
        document.getElementById('ui-root').appendChild(box);
        requestAnimationFrame(() => box.classList.add('show'));
        let i = 0, typing = null, full = '';
        const show = () => {
          const L = lines[i];
          const who = L.who === 'ink' ? '먹물' : L.who === 'me' ? MG.State.nick : (L.name || '???');
          name.textContent = who;
          box.dataset.who = L.who || 'npc';
          full = U.fill(L.text, { nick: MG.State.nick });
          if (opts.onLine) { try { opts.onLine(L, i); } catch (e) { console.error(e); } }
          text.textContent = '';
          let k = 0;
          clearInterval(typing);
          typing = setInterval(() => {
            k += 2; text.textContent = full.slice(0, k);
            if (k % 6 === 0) MG.Audio.sfx('type');
            if (k >= full.length) { clearInterval(typing); typing = null; }
          }, 22);
        };
        const close = () => {
          clearInterval(typing);
          box.classList.remove('show');
          setTimeout(() => box.remove(), 250);
          document.removeEventListener('keydown', key);
          this.open = false;
          MG.Core.popFreeze();
          MG.Input.setTouchVisible(true);
          resolve();
        };
        const adv = () => {
          if (typing) { clearInterval(typing); typing = null; text.textContent = full; return; }
          i++; MG.Audio.sfx('ui');
          if (i >= lines.length) close(); else show();
        };
        const key = (e) => { if (['Enter', 'Space', 'KeyE', 'KeyF'].includes(e.code)) { e.preventDefault(); adv(); } };
        box.addEventListener('click', (e) => { if (e.target === skip) return; adv(); });
        skip.addEventListener('click', (e) => { e.stopPropagation(); close(); });
        document.addEventListener('keydown', key);
        show();
      });
    },
    /* 대화 중 선택지 (자세히 듣기 / 넘어가기 등) — 대화창과 같은 자리에 작은 버튼만 */
    choice(prompt, options) {
      return new Promise((resolve) => {
        MG.Core.pushFreeze();
        MG.Input.setTouchVisible(false);
        const box = U.el('div', { class: 'dialog glass choice', 'data-who': 'minjun' });
        box.appendChild(U.el('div', { class: 'dname' }, '김민준'));
        box.appendChild(U.el('div', { class: 'dtext' }, prompt));
        const row = U.el('div', { class: 'dchoices' });
        const done = (i) => { document.removeEventListener('keydown', key); box.classList.remove('show'); setTimeout(() => box.remove(), 250); MG.Core.popFreeze(); MG.Input.setTouchVisible(true); MG.Audio.sfx('ui'); resolve(i); };
        options.forEach((o, i) => row.appendChild(U.el('button', { class: 'btn ' + (i === 0 ? 'primary' : 'ghost'), onclick: (e) => { e.stopPropagation(); done(i); } }, o)));
        box.appendChild(row);
        const key = (e) => { if (e.code === 'Digit1' || e.code === 'Enter') { e.preventDefault(); done(0); } else if (e.code === 'Digit2' || e.code === 'Escape') { e.preventDefault(); done(options.length - 1); } };
        document.addEventListener('keydown', key);
        document.getElementById('ui-root').appendChild(box);
        requestAnimationFrame(() => box.classList.add('show'));
      });
    },
    /* 비차단 말풍선 (먹물의 짧은 한마디) */
    bark(text, who, dur) {
      const root = document.getElementById('ui-root');
      const old = root.querySelector('.bark'); if (old) old.remove();
      const b = U.el('div', { class: 'bark glass', 'data-who': who || 'ink' }, U.el('b', {}, who === 'boss' ? '' : (who === 'me' ? MG.State.nick : who === 'minjun' ? '김민준' : '먹물')), U.fill(text, { nick: MG.State.nick }));
      root.appendChild(b);
      requestAnimationFrame(() => b.classList.add('show'));
      setTimeout(() => { b.classList.remove('show'); setTimeout(() => b.remove(), 300); }, (dur || 2.6) * 1000);
    }
  };

  /* ── NPC 엔티티 ── */
  class NPC {
    constructor(def, x, groundY) {
      this.def = def; this.x = x; this.y = groundY; this.t = Math.random() * 5; this.talkT = 0; this.done = false;
      this.name = def.name; this.range = 110;
    }
    near(p) { return Math.abs(p.cx - this.x) < this.range && Math.abs(p.bottom - this.y) < 140; }
    update(dt) { this.t += dt; if (this.talkT > 0) this.talkT -= dt; }
    draw(R, p) {
      R.shadow(this.x, this.y, 22, 0.35);
      if (!this._look || this._face !== (p && p.cx < this.x ? -1 : 1)) { this._face = p && p.cx < this.x ? -1 : 1; this._look = Object.assign({}, this.def.look, { face: this._face }); }
      MG.BossArt.npc(R.ctx, R, this.x, this.y, this._look, this.t, this.talkT > 0);
      if (!this.done || this.def.repeatable) {
        const a = 0.6 + 0.4 * Math.sin(this.t * 4);
        R.ctx.globalAlpha = a;
        R.text(this.done ? '…' : '!', this.x, this.y - 138, 30, this.def.role === 'quest' ? '#ffd76a' : '#9ad0ff');
        R.ctx.globalAlpha = 1;
      }
      R.text(this.name, this.x, this.y - 118, 15, 'rgba(255,255,255,0.85)', 'center', 600);
      if (p && this.near(p)) R.text('조사', this.x, this.y + 20, 14, 'rgba(255,255,255,0.7)', 'center', 600);
    }
  }

  /* ── 미션 진행 ── */
  class Mission {
    constructor(steps, onChange) {
      this.steps = (steps || []).map((s) => Object.assign({ have: 0, done: false }, s));
      this.onChange = onChange;
    }
    get current() { return this.steps.find((s) => !s.done) || null; }
    progress(id, n) {
      const s = this.steps.find((x) => x.id === id);
      if (!s || s.done) return;
      s.have += n == null ? 1 : n;
      if (s.have >= (s.need || 1)) s.done = true;
      this.onChange && this.onChange(this);
    }
    complete(id) { const s = this.steps.find((x) => x.id === id); if (s && !s.done) { s.have = s.need || 1; s.done = true; this.onChange && this.onChange(this); } }
    get ratio() { if (!this.steps.length) return 1; return this.steps.reduce((a, s) => a + Math.min(1, s.have / (s.need || 1)), 0) / this.steps.length; }
    label() {
      const c = this.current;
      if (!c) return '모든 목표 완료 — 앞으로!';
      return c.text + (c.need > 1 ? ' (' + Math.min(c.have, c.need) + '/' + c.need + ')' : '');
    }
  }

  MG.Dialog = Dialog;
  MG.NPC = NPC;
  MG.Mission = Mission;
})();

</script>
<script>/* js/systems/Companion.js */
/* Companion — 동료 '먹물': 따라다니기(관성·탄성), 위험 방향 주시, 원거리 공격(챕터 1 해금), 자동 보호막, 능력 해금 목록
 * 실제 게임 로직과 연결: 발사체는 위치·속도·사정거리·벽 충돌·적 피해를 직접 계산하고,
 * 보호막은 Combat.hurtPlayer 안에서 피해 처리 직전에 판정한다(막으면 HP가 줄지 않음). */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  /* ── 능력 해금 (저장 데이터 d.abilities에 누적) ── */
  const Abilities = {
    list() { return (MG.Data.companion && MG.Data.companion.abilities) || []; },
    has(id) { const d = MG.State.d; return !!(d && d.abilities && d.abilities.includes(id)); },
    def(id) { return this.list().find((a) => a.id === id); },
    forStage(stageId) { return this.list().find((a) => a.stage === stageId); },
    unlock(id) {
      const d = MG.State.d;
      if (!d.abilities) d.abilities = [];
      if (d.abilities.includes(id)) return false;
      d.abilities.push(id);
      if (id === 'inkShot') d.companion.ranged = true;
      if (id === 'shieldPlus') d.companion.shieldLv = Math.max(d.companion.shieldLv || 1, 2);
      if (id === 'shield2') d.companion.shieldLv = Math.max(d.companion.shieldLv || 1, 3);
      MG.State.markDirty(true);
      MG.bus.emit('ability:unlock', id);
      return true;
    }
  };

  class Companion {
    constructor(scene) {
      this.s = scene;
      const p = scene.player;
      this.ink = scene.ink || (scene.ink = { x: p.cx - 60, y: p.y - 60, t: 0, mood: 'normal' });
      this.vx = 0; this.vy = 0; this.look = 1;
      this.holdT = 0; this.aiming = false; this.aimT = 0; this.cd = 0; this.target = null; this._cancel = false;
      this.shots = []; this._sid = 1e6;
      const lv = (MG.State.d.companion && MG.State.d.companion.shieldLv) || 1;
      this.shieldMax = lv >= 3 ? 2 : 1;
      this.shieldCds = [0, 0].slice(0, this.shieldMax);
      this.shieldT = 0; this.shieldDir = 1; this.blocks = 0;
      this.training = false;   // 챕터 1 훈련 중에는 해금 전이라도 원거리 공격 허용
      this.charge = 0; this.moodT = 0;
      this._btnState = '';
    }
    get cfg() { return MG.Data.companion; }
    get rangedOn() { return (Abilities.has('inkShot') && !this.s.tutorial) || this.training; } // 튜토리얼에선 기본 조작만 (미래 능력 노출 금지)
    get range() { return this.cfg.ranged.range; }
    shieldReady() { return this.shieldCds.some((c) => c <= 0); }

    /* 피해 직전 호출: 막으면 true (HP 감소 없음) */
    tryBlock(tag, srcX, proj) {
      if (this.s.tutorial) return false;
      if (MG.State.invulnerable) return false;
      const sh = this.cfg.shield;
      if (!sh.blockable.some((b) => tag.indexOf(b) === 0)) return false;
      const i = this.shieldCds.findIndex((c) => c <= 0);
      if (i < 0) return false;
      const plus = Abilities.has('shieldPlus');
      this.shieldCds[i] = plus ? sh.cooldownPlus : sh.cooldown;
      const p = this.s.player;
      this.shieldDir = srcX != null ? U.sign(srcX - p.cx) || p.facing : p.facing;
      this.shieldT = 0.42; this.blocks++;
      MG.State.setInvuln(sh.grace); // 같은 공격이 다음 프레임에 다시 닿아 HP가 깎이는 것 방지 (짧게)
      MG.Audio.sfx('shield'); MG.Core.hitstop(0.04); MG.R.cam.shake(4, 0.12);
      MG.R.particles.burst(p.cx + this.shieldDir * 40, p.cy, 14, { color: ['#c9b6ff', '#ffffff', '#3a2a6a'], speedMin: 90, speedMax: 300, lifeMax: 0.4, shape: 'square', sizeMin: 3, sizeMax: 6 });
      this.ink.mood = 'smug'; this.moodT = 1.2;
      // 되받아치기 (먹물 방어 강화)
      if (plus && proj) {
        this._spawnShot(proj.x, proj.y, -proj.vx * 1.1, -proj.vy * 1.1, { dmg: 1, r: 12, reflect: true, max: 700 });
      }
      if (this.blocks === 1 && !MG.State.d.companion.shieldHinted) { MG.State.d.companion.shieldHinted = true; MG.Dialog.bark('내가 막았어! 보호막은 잠깐 쉬어야 다시 쓸 수 있어.', 'ink', 3.2); }
      return true;
    }

    /* ── 매 프레임 ── */
    update(dt) {
      const p = this.s.player, ink = this.ink, C = this.cfg;
      ink.t += dt;
      if (this.moodT > 0) { this.moodT -= dt; if (this.moodT <= 0 && !this.s.minjunTalking) ink.mood = 'normal'; }
      for (let i = 0; i < this.shieldCds.length; i++) if (this.shieldCds[i] > 0) this.shieldCds[i] -= dt;
      if (this.shieldT > 0) this.shieldT -= dt;
      if (this.cd > 0) this.cd -= dt;
      // 위험 방향 주시: 가장 가까운 적·적 탄환
      let danger = null, dd = 520;
      const cb = this.s.combat;
      if (cb) {
        for (const e of cb.enemies) { if (e.dead || e.type === 'target' || e.type === 'weak') continue; const d = U.dist(e.x + e.w / 2, e.y + e.h / 2, p.cx, p.cy); if (d < dd) { dd = d; danger = e.x + e.w / 2; } }
        for (const q of cb.proj) { const d = U.dist(q.x, q.y, p.cx, p.cy); if (d < dd) { dd = d; danger = q.x; } if (d < 150 && this.moodT <= 0) { ink.mood = 'worry'; this.moodT = 0.5; } }
      }
      const boss = this.s.boss;
      if (boss && boss.state !== 'dead' && danger == null) danger = boss.cx;
      this.look = danger != null ? (U.sign(danger - ink.x) || this.look) : p.facing;
      // 원거리: 공격 버튼 길게 누르기 → 조준, 떼면 발사, 구르기로 취소
      this._aimInput(dt);
      // 따라다니기 (관성 + 작은 탄성: 감쇠 스프링)
      let tx, ty;
      if (this.aiming) { tx = p.cx + p.facing * 44; ty = p.y - 26; }
      else {
        const still = Math.abs(p.vx) < 20 && p.onGround;
        const orb = still ? C.follow.idleOrbit : 0;
        tx = p.cx - p.facing * C.follow.back + Math.cos(ink.t * 1.3) * orb;
        ty = p.y - C.follow.up + Math.sin(ink.t * 2.1) * orb * 0.6;
      }
      if (this.s.minjunInkTarget) { tx = this.s.minjunInkTarget.x; ty = this.s.minjunInkTarget.y; }
      const k = C.follow.stiffness, c = C.follow.damping;
      this.vx += ((tx - ink.x) * k - this.vx * c) * dt; this.vy += ((ty - ink.y) * k - this.vy * c) * dt;
      ink.x += this.vx * dt; ink.y += this.vy * dt;
      if (Math.abs(tx - ink.x) > 600 || Math.abs(ty - ink.y) > 500) { ink.x = tx; ink.y = ty; this.vx = this.vy = 0; } // 순간이동·부활 시 따라붙기
      this._updateShots(dt);
      this._syncButton();
    }
    _aimInput(dt) {
      const In = MG.Input, p = this.s.player, R = this.cfg.ranged;
      const can = this.rangedOn && !p.special && p.hurtT <= 0 && !this.s.busy && !MG.Core.frozen;
      if (!can) { if (this.aiming) this._endAim(false); this.holdT = 0; return; }
      if (In.held.attack && this._needRelease) { this.holdT = 0; return; } // 취소한 뒤에는 버튼을 한 번 떼야 다시 조준
      if (!In.held.attack) this._needRelease = false;
      if (In.held.attack) {
        this.holdT += dt;
        if (!this.aiming && this.holdT >= R.holdTime) {
          if (this.cd > 0) { if (!this._cdWarn) { this._cdWarn = true; MG.R.particles.spawn({ x: this.ink.x, y: this.ink.y - 26, vy: -30, life: 0.6, size: 13, size2: 13, color: '#bcb3d8', shape: 'text', text: '재충전' }); } }
          else { this.aiming = true; this.aimT = 0; this._cancel = false; MG.Audio.sfx('dash'); }
        }
        if (this.aiming) {
          this.aimT += dt;
          if (In.pressed('dodge') || In.consumeCancel()) { this._endAim(false); this._needRelease = true; MG.R.particles.spawn({ x: this.ink.x, y: this.ink.y - 26, vy: -30, life: 0.5, size: 13, size2: 13, color: '#bcb3d8', shape: 'text', text: '취소' }); return; }
          this.target = this._pickTarget();
          if (MG.Settings.get('bgEffects') && Math.random() < dt * 30) {
            const a = Math.random() * 6.28, r = 26;
            MG.R.particles.spawn({ x: this.ink.x + Math.cos(a) * r, y: this.ink.y + Math.sin(a) * r, vx: -Math.cos(a) * 70, vy: -Math.sin(a) * 70, life: 0.35, size: 2, size2: 1, color: this.aimT > R.charge.time && Abilities.has('charge') ? '#ffd76a' : '#c9b6ff', glow: true, drag: 0 });
          }
        }
      } else {
        if (this.aiming) this._endAim(true);
        this.holdT = 0; this._cdWarn = false;
      }
    }
    _endAim(fire) {
      const R = this.cfg.ranged;
      if (fire && this.cd <= 0) {
        const charged = Abilities.has('charge') && this.aimT >= R.charge.time;
        const t = this.target;
        const sx = this.ink.x, sy = this.ink.y;
        let ang;
        if (t) ang = Math.atan2(t.y - sy, t.x - sx);
        else ang = this.s.player.facing > 0 ? 0 : Math.PI;
        const sp = R.speed;
        this._spawnShot(sx, sy, Math.cos(ang) * sp, Math.sin(ang) * sp, charged
          ? { dmg: R.charge.damage, r: R.charge.radius, pierce: true, bossMul: R.charge.bossMul, charged: true }
          : { dmg: R.damage, r: R.radius, bossMul: R.bossMul });
        this.cd = R.cooldown;
        this.vx -= Math.cos(ang) * 260; this.vy -= Math.sin(ang) * 260; // 반동
        MG.Audio.sfx('attack');
        MG.R.particles.burst(sx, sy, 10, { color: ['#c9b6ff', '#ffffff'], speedMin: 80, speedMax: 240, lifeMax: 0.3, glow: true });
        this.ink.mood = 'smug'; this.moodT = 0.6;
        MG.bus.emit('ink:fire', { charged });
      }
      this.aiming = false; this.aimT = 0; this.target = null;
    }
    /* 조준 대상: 사정거리 안에서 가장 가까운 적(앞쪽 우선). 없으면 null → 정면 발사 */
    _pickTarget() {
      const p = this.s.player, sx = this.ink.x, sy = this.ink.y, range = this.range;
      let best = null, bs = Infinity;
      for (const t of this.targets()) {
        const d = U.dist(t.x, t.y, sx, sy);
        if (d > range) continue;
        const behind = U.sign(t.x - p.cx) !== p.facing ? 260 : 0;
        if (d + behind < bs) { bs = d + behind; best = t; }
      }
      return best;
    }
    /* 조준 가능한 대상 목록 (적 + 표적 + 약점 고리 + 보스) */
    targets() {
      const out = [], cb = this.s.combat;
      if (cb) for (const e of cb.enemies) if (!e.dead && (!e.shield || e.type === 'guardian')) out.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, e });
      const b = this.s.boss;
      if (b && b.state !== 'dead') out.push({ x: b.cx, y: b.cy, boss: b });
      return out;
    }
    _spawnShot(x, y, vx, vy, o) {
      this.shots.push(Object.assign({ x, y, vx, vy, dist: 0, max: this.range, id: ++this._sid, hit: [], t: 0 }, o));
    }
    _updateShots(dt) {
      const cb = this.s.combat, phys = this.s.phys, boss = this.s.boss;
      for (const s of this.shots) {
        if (s.dead) continue;
        const step = Math.hypot(s.vx, s.vy) * dt;
        s.x += s.vx * dt; s.y += s.vy * dt; s.dist += step; s.t += dt;
        if (MG.Settings.get('particles') > 0.3 && Math.random() < 0.7) MG.R.particles.spawn({ x: s.x, y: s.y, vx: -s.vx * 0.05, vy: -s.vy * 0.05, life: 0.22, size: s.r * 0.35, size2: 0, color: s.charged ? '#ffd76a' : '#9b7bff', glow: true, drag: 0 });
        // 최대 사정거리: 넘으면 소멸 (그 너머로는 절대 맞지 않음)
        if (s.dist >= s.max) { s.dead = true; MG.R.particles.burst(s.x, s.y, 6, { color: '#6a5a8a', speedMin: 30, speedMax: 90, lifeMax: 0.3 }); continue; }
        // 벽·장애물
        const wall = phys && phys.solidAt(s.x, s.y);
        if (wall && !wall.disabled) { s.dead = true; this._hitFx(s, '#8a7ab0'); continue; }
        // 적
        if (cb) {
          for (const e of cb.enemies) {
            if (e.dead || s.hit.includes(e)) continue;
            if (s.x + s.r > e.x && s.x - s.r < e.x + e.w && s.y + s.r > e.y && s.y - s.r < e.y + e.h) {
              s.hit.push(e);
              cb.damageEnemy(e, s.dmg, U.sign(s.vx), 'ink');
              e.inkMarkT = 1.2;
              this._hitFx(s, '#c9b6ff');
              if (!s.pierce) { s.dead = true; break; }
            }
          }
          // 적 잉크탄 상쇄
          if (!s.dead) for (const q of cb.proj) { if (!q.dead && q.kind === 'ink' && U.dist(q.x, q.y, s.x, s.y) < q.r + s.r) { q.dead = true; this._hitFx(s, '#ffffff'); if (!s.pierce) { s.dead = true; break; } } }
        }
        // 보스 (봉인 해제 중일 때만 피해, 아니면 튕김)
        if (!s.dead && boss && boss.state !== 'dead' && !s.hit.includes(boss)) {
          const r = boss.rect;
          if (s.x > r.x && s.x < r.x + r.w && s.y > r.y && s.y < r.y + r.h) {
            s.hit.push(boss);
            boss.hitBy({ x: s.x - 4, y: s.y - 4, w: 8, h: 8, id: s.id, ink: true }, s.bossMul || 0.6);
            boss.inkMarkT = 1.2;
            this._hitFx(s, '#c9b6ff');
            if (!s.pierce) s.dead = true;
          }
        }
      }
      this.shots = this.shots.filter((s) => !s.dead);
    }
    _hitFx(s, col) {
      MG.R.particles.burst(s.x, s.y, s.charged ? 18 : 10, { color: [col, '#ffffff', '#2a1a4a'], speedMin: 80, speedMax: 320, lifeMax: 0.4, shape: 'square', sizeMin: 3, sizeMax: 6 });
      MG.R.light(s.x, s.y, 60, 'rgba(200,180,255,0.9)', 0.4);
    }
    /* 공격 버튼의 작은 시각 변화: 해금 표시 · 조준 중 · 재충전 */
    _syncButton() {
      const b = MG.Input.els && MG.Input.els.attack; if (!b) return;
      const st = (this.rangedOn ? 'ink' : '') + (this.aiming ? ' aim' : '') + (this.cd > 0 && this.rangedOn ? ' cd' : '');
      if (st === this._btnState) return;
      this._btnState = st;
      b.classList.toggle('ink-ready', this.rangedOn);
      b.classList.toggle('aiming', this.aiming);
      b.classList.toggle('ink-cd', this.cd > 0 && this.rangedOn);
    }

    /* ── 그리기 ── */
    draw(R) {
      const ctx = R.ctx, PXL = MG.Pixel, P = PXL.PX, ink = this.ink, p = this.s.player;
      // 조준 표시: 사정거리 안 적은 약한 윤곽, 밖은 회색 ✕ (큰 원형 UI 없음)
      if (this.aiming) {
        const range = this.range;
        for (const t of this.targets()) {
          const d = U.dist(t.x, t.y, ink.x, ink.y);
          if (d > range * 1.8) continue;
          const inR = d <= range, sel = this.target && this.target.x === t.x && this.target.y === t.y;
          const hw = t.boss ? t.boss.w_ * 0.45 : t.e ? t.e.w / 2 + 6 : 24, hh = t.boss ? t.boss.h_ * 0.45 : t.e ? t.e.h / 2 + 6 : 24;
          ctx.fillStyle = inR ? (sel ? '#ffffff' : 'rgba(201,182,255,0.75)') : 'rgba(150,150,160,0.55)';
          const x0 = PXL.snap(t.x - hw), x1 = PXL.snap(t.x + hw), y0 = PXL.snap(t.y - hh), y1 = PXL.snap(t.y + hh), L = P * 3;
          [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.fillRect(sx > 0 ? x : x - L, y - (sy > 0 ? 0 : P), L, P); ctx.fillRect(x - (sx > 0 ? 0 : P), sy > 0 ? y : y - L, P, L); });
          if (!inR) { R.text('사정거리 밖', t.x, y0 - 14, 13, 'rgba(200,200,210,0.85)', 'center', 700); ctx.fillStyle = 'rgba(200,200,210,0.85)'; for (let k = -2; k <= 2; k++) { ctx.fillRect(PXL.snap(t.x + k * P) - P / 2, PXL.snap(t.y + k * P) - P / 2, P, P); ctx.fillRect(PXL.snap(t.x + k * P) - P / 2, PXL.snap(t.y - k * P) - P / 2, P, P); } }
        }
        // 조준선 (도트 점선) + 사정거리 끝 표시
        const t = this.target;
        const ang = t ? Math.atan2(t.y - ink.y, t.x - ink.x) : (p.facing > 0 ? 0 : Math.PI);
        const len = t ? Math.min(range, U.dist(t.x, t.y, ink.x, ink.y)) : range;
        const step = Math.floor(R.time * 12);
        for (let d = 30, i = 0; d < len; d += 18, i++) {
          if ((i + step) % 3 === 0) continue;
          const x = ink.x + Math.cos(ang) * d, y = ink.y + Math.sin(ang) * d;
          ctx.fillStyle = '#1a1030'; ctx.fillRect(PXL.snap(x) - P, PXL.snap(y) - P, P * 2, P * 2);
          ctx.fillStyle = t ? '#e9ddff' : 'rgba(233,221,255,0.5)'; ctx.fillRect(PXL.snap(x) - P / 2, PXL.snap(y) - P / 2, P, P);
        }
        if (!t) { const ex = ink.x + Math.cos(ang) * range, ey = ink.y + Math.sin(ang) * range; ctx.fillStyle = 'rgba(233,221,255,0.6)'; ctx.fillRect(PXL.snap(ex) - P, PXL.snap(ey) - P * 3, P * 2, P * 6); }
        const charged = Abilities.has('charge') && this.aimT >= this.cfg.ranged.charge.time;
        R.light(ink.x, ink.y, charged ? 70 : 46, charged ? 'rgba(255,215,106,0.9)' : 'rgba(180,150,255,0.9)', 0.45);
      }
      // 발사체: 밝은 보라·흰 핵 + 어두운 테두리 (어두운 배경에서도 잘 보이게)
      for (const s of this.shots) {
        R.light(s.x, s.y, s.r * 4, s.charged ? 'rgba(255,215,106,0.9)' : 'rgba(170,140,255,0.9)', 0.5);
        const r = Math.max(2, Math.round(s.r / P));
        const img = PXL.cached('inkshot|' + r + (s.charged ? 'c' : ''), () => {
          const c = PXL.mk(r * 2 + 4, r * 2 + 4), g = c.getContext('2d'), m = r + 2;
          PXL.disc(g, m, m, r + 0.6, '#1a1030'); PXL.disc(g, m, m, r - 0.4, s.charged ? '#ffd76a' : '#a98bff'); PXL.disc(g, m - 0.5, m - 0.5, Math.max(1, r - 1.6), '#ffffff');
          return c;
        });
        PXL.draw(ctx, img, s.x, s.y, img.width / 2, img.height / 2, 1);
      }
      // 보호막: 막는 순간 앞쪽에 짧게 (도트 육각 호)
      if (this.shieldT > 0) {
        const a = U.clamp(this.shieldT / 0.42, 0, 1), cx = p.cx + this.shieldDir * 36, cy = p.cy;
        ctx.globalAlpha = a;
        for (let i = -6; i <= 6; i++) {
          const y = cy + i * 9, x = cx + this.shieldDir * (Math.abs(i) * Math.abs(i) * 0.7);
          ctx.fillStyle = i % 2 ? '#c9b6ff' : '#ffffff'; ctx.fillRect(PXL.snap(x) - P, PXL.snap(y) - P, P * 2, P * 3);
          ctx.fillStyle = 'rgba(40,20,80,0.6)'; ctx.fillRect(PXL.snap(x - this.shieldDir * P * 2) - P / 2, PXL.snap(y), P, P);
        }
        ctx.globalAlpha = 1;
        R.light(cx, cy, 90, 'rgba(190,170,255,0.9)', 0.4 * a);
      }
      // 먹물 본체 (기존 외형 그대로, 바라보는 방향만 반영)
      MG.BossArt.mascot(ctx, R, ink.x, ink.y, ink.t, ink.mood, null, this.look);
      // 보호막 준비 표시: 먹물 옆 작은 점 (재충전 중이면 비움)
      if (!this.s.tutorial) {
        this.shieldCds.forEach((c0, i) => {
          ctx.fillStyle = c0 <= 0 ? '#c9b6ff' : 'rgba(120,110,150,0.6)';
          ctx.fillRect(PXL.snap(ink.x + 26 + i * 8) - P / 2, PXL.snap(ink.y - 18), P, P);
        });
      }
    }
  }

  MG.Abilities = Abilities;
  MG.Companion = Companion;
})();
