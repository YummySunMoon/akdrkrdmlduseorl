<script>/* js/worlds/LevelBuilder.js */
/* LevelBuilder — 스테이지 데이터(구간 목록)를 실제 지형·적·함정·문·제단·보스 경기장으로 변환 (시드 고정) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const GY = 600;          // 기본 지면 높이
  const DEEP = 600;        // 지면 블록 두께
  const PIT_Y = 1000;      // 이 아래로 떨어지면 낙사 판정

  function build(stage, world) {
    const rnd = U.rng(stage.id + '-layout');
    const L = {
      ground: [], plats: [], deco: [], gates: [], altars: [], records: [], checkpoints: [], npcs: [], triggers: [],
      chase: null, arena: null, endX: 0, startX: 120, GY, PIT_Y, bridges: [], segX: []
    };
    const phys = world.phys, combat = world.combat;
    const recs = (stage.records || []).slice();
    let recI = 0;
    let x = 0;
    const ground = (x0, w, opts) => {
      const g = phys.add(Object.assign({ x: x0, y: GY, w, h: DEEP, kind: 'ground' }, opts || {}));
      L.ground.push(g); return g;
    };
    const plat = (x0, y, w, opts) => {
      const p = phys.add(Object.assign({ x: x0, y, w, h: 28, kind: 'plat', oneway: true }, opts || {}));
      L.plats.push(p); return p;
    };
    const record = (rx, ry) => {
      if (recI >= recs.length) return;
      L.records.push({ x: rx, y: ry, def: recs[recI++], got: false, t: rnd() * 6 });
    };
    const deco = (type, dx, dy, o) => L.deco.push(Object.assign({ type, x: dx, y: dy, seed: rnd() }, o || {}));

    for (const seg of stage.segments) {
      L.segX.push(x);
      switch (seg.t) {
        /* ── 초보자 튜토리얼 구간: 각 구간 끝에 '빛의 장막'(성공하면 열림) ── */
        case 'tutMove': case 'tutJump': case 'tutDummy': case 'tutDash': case 'tutDodge': case 'tutBattle': {
          const len = seg.len || 700;
          if (seg.t === 'tutMove') { ground(x - 400, 400 + len); L.startX = x + 200; L.checkpoints.push({ x: x + 200, y: GY, id: 'cp0', start: true }); deco('sign', x - 150, GY, { text: '기록 속으로' }); }
          else ground(x, len);
          const T = L.tut || (L.tut = {});
          const z = T[{ tutMove: 'move', tutJump: 'jump', tutDummy: 'attack', tutDash: 'dash', tutDodge: 'dodge', tutBattle: 'battle' }[seg.t]] = { x0: x, x1: x + len };
          const bx = seg.t === 'tutDash' ? x + 150 + (seg.dist || 380) + 120 : x + len - 40;
          z.barrier = phys.add({ x: bx, y: GY - 1400, w: 30, h: 1400, kind: 'tutWall' });
          z.bx = bx;
          if (seg.t === 'tutJump') {
            const h = seg.h || 56;
            z.block = phys.add({ x: x + 330, y: GY - h, w: 64, h, kind: 'block' });
            L.blocks = L.blocks || []; L.blocks.push({ x: x + 330, y: GY - h, w: 64, h });
          } else if (seg.t === 'tutDummy') {
            z.dummy = combat.spawnEnemy('dummy', x + 400, GY - 96, { w: 44, h: 96, hp: 99, maxHp: 99, dummy: true, hits: 0 });
          } else if (seg.t === 'tutDash') {
            z.start = x + 150; z.goal = x + 150 + (seg.dist || 380);
          } else if (seg.t === 'tutDodge') {
            z.turret = combat.spawnEnemy('turret', x + len - 150, GY - 72, { w: 54, h: 72, hp: 99, maxHp: 99, dummy: true, dir: -1 });
            z.turret.solid = phys.add({ x: x + len - 150, y: GY - 72, w: 54, h: 72, kind: 'block' }); // 발사대는 지나갈 수 없음
          } else if (seg.t === 'tutBattle') {
            z.spawnX = x + 640;
          }
          x += len;
          break;
        }
        case 'block': { // 튜토리얼: 점프로 넘는 블록
          const len = seg.len || 700;
          ground(x, len);
          phys.add({ x: x + len * 0.55, y: GY - (seg.h || 100), w: 90, h: seg.h || 100, kind: 'block' });
          L.blocks = L.blocks || []; L.blocks.push({ x: x + len * 0.55, y: GY - (seg.h || 100), w: 90, h: seg.h || 100 });
          x += len;
          break;
        }
        case 'gap': { // 튜토리얼: 대시가 필요한 넓은 틈
          const len = seg.len || 1000, w = seg.w || 440;
          const a = Math.round((len - w) / 2);
          ground(x, a);
          ground(x + a + w, len - a - w);
          deco('sign', x + a - 70, GY, { text: '점프 → 대시' });
          x += len;
          break;
        }
        case 'start': {
          ground(x - 400, 400 + (seg.len || 700));
          deco('sign', x + 260, GY, { text: stage.title });
          L.startX = x + 140;
          L.checkpoints.push({ x: x + 120, y: GY, id: 'cp0', start: true });
          x += seg.len || 700;
          break;
        }
        case 'npc': case 'memorial': {
          const len = seg.len || (seg.t === 'memorial' ? 1400 : 700);
          ground(x, len);
          const def = stage.npcs[seg.npc];
          if (def) L.npcs.push({ key: seg.npc, def, x: x + len * 0.55 });
          if (seg.t === 'memorial') {
            L.triggers.push({ x0: x, x1: x + len, type: 'memorial', id: 'mem' });
            for (let i = 0; i < 5; i++) deco('lantern', x + 120 + i * (len - 240) / 4, GY);
            if (seg.record) record(x + len * 0.8, GY - 120);
          } else deco('lamp', x + len * 0.3, GY);
          x += len;
          break;
        }
        case 'run': {
          const len = seg.len || 1600;
          const gaps = seg.gaps || 0, spikes = seg.spikes || 0;
          // 지형 조각: 구멍 위치 결정
          const holes = [];
          for (let i = 0; i < gaps; i++) holes.push(x + len * (i + 1) / (gaps + 1) + rnd.range(-80, 80));
          let cur = x;
          holes.forEach((h) => {
            const w = rnd.range(170, 240);
            ground(cur, h - cur);
            if (rnd() < 0.6) plat(h - 10, GY - 150 - rnd() * 60, 140);
            cur = h + w;
          });
          ground(cur, x + len - cur);
          for (let i = 0; i < spikes; i++) {
            const sx = x + len * (i + 0.5) / spikes + rnd.range(-120, 120);
            if (holes.some((h) => Math.abs(h - sx) < 320)) continue;
            combat.addHazard({ type: 'spikes', x: sx, y: GY - 26, w: 88, h: 26 });
          }
          for (let i = 0; i < (seg.enemies || 0); i++) {
            const ex = x + len * (i + 1) / ((seg.enemies || 0) + 1) + 60;
            if (holes.some((h) => Math.abs(h - ex) < 260)) continue;
            combat.spawnEnemy('blob', ex, GY - 46, { minX: ex - 180, maxX: ex + 180 });
          }
          for (let i = 0; i < (seg.scrolls || 0); i++) combat.spawnEnemy('scroll', x + len * (i + 0.6) / (seg.scrolls || 1), GY - 300 - rnd() * 80, {});
          for (let i = 0; i < (seg.records || 0); i++) record(x + len * (i + 0.7) / (seg.records + 0.4), GY - 230 - rnd() * 60);
          for (let i = 0; i < 3; i++) deco(rnd() < 0.5 ? 'post' : 'crate', x + rnd() * len, GY);
          x += len;
          break;
        }
        case 'climb': {
          const len = seg.len || 1400;
          ground(x, 220);
          // 구덩이 위 계단식 발판
          let px = x + 260, py = GY - 120, up = true;
          const n = Math.floor((len - 480) / 230);
          for (let i = 0; i < n; i++) {
            const mover = seg.movers && i % 3 === 1;
            plat(px, py, 150, mover ? { oneway: true, move: { dx: 0, dy: 70, speed: 1.6, phase: i } } : { oneway: false, noWall: false });
            if (seg.records && i === Math.floor(n * 0.6)) record(px + 75, py - 120);
            if (seg.scrolls && i === Math.floor(n / 2)) combat.spawnEnemy('scroll', px + 40, py - 260, {});
            px += 230;
            py += up ? -70 : 70;
            if (py < GY - 340) up = false; if (py > GY - 110) up = true;
          }
          ground(x + len - 240, 240);
          x += len;
          break;
        }
        case 'drops': {
          const len = seg.len || 1200;
          ground(x, len);
          const n = Math.max(2, Math.floor(len / 260));
          for (let i = 0; i < n; i++) combat.addHazard({ type: 'dropper', x: x + 160 + i * (len - 320) / (n - 1), y: GY - 520, gy: GY, period: 1.6 + rnd() * 0.6, delay: rnd() * 1.2 });
          if (seg.records) record(x + len * 0.5, GY - 160);
          x += len;
          break;
        }
        case 'gate': case 'guardian': {
          const len = seg.len || 500;
          ground(x, len);
          const gx = x + len * 0.6;
          if (seg.t === 'gate') {
            const door = phys.add({ x: gx, y: GY - 260, w: 60, h: 260, kind: 'door' });
            L.gates.push({ id: seg.id, x: gx, door, open: false, openT: 0, kind: 'gate', label: seg.label || '기록의 문' });
          } else {
            const e = combat.spawnEnemy('guardian', gx, GY - 120, {});
            L.gates.push({ id: seg.id, x: gx, guard: e, open: false, kind: 'guardian', label: seg.label || '봉인 수호병' });
          }
          x += len;
          break;
        }
        case 'riddle': {
          const len = seg.len || 900;
          const effect = seg.effect || 'door';
          const ax = x + 220;
          if (effect === 'bridge') {
            ground(x, 420);
            const gapW = len - 640;
            ground(x + 420 + gapW, len - 420 - gapW);
            const pieces = [];
            for (let i = 0; i < 4; i++) pieces.push({ x: x + 420 + 20 + i * (gapW - 40) / 4, y: GY - 10 - (i % 2) * 70, w: (gapW - 40) / 4 - 10 });
            L.bridges.push({ id: seg.id, pieces, made: false });
          } else {
            ground(x, len);
            if (effect === 'door') {
              const door = phys.add({ x: x + len * 0.7, y: GY - 260, w: 60, h: 260, kind: 'door' });
              L.gates.push({ id: seg.id + '#door', x: x + len * 0.7, door, open: false, openT: 0, kind: 'riddleDoor', link: seg.id });
            } else if (effect === 'trap') {
              const traps = [];
              for (let i = 0; i < 3; i++) traps.push(combat.addHazard({ type: 'spikes', x: x + 380 + i * 150, y: GY - 26, w: 110, h: 26 }));
              traps.push(combat.addHazard({ type: 'dropper', x: x + 520, y: GY - 520, gy: GY, period: 1.2 }));
              L.trapsFor = L.trapsFor || {}; L.trapsFor[seg.id] = traps;
            }
          }
          L.altars.push({ id: seg.id, x: ax, effect, solved: false, t: 0, kind: seg.kind || 'order' });
          x += len;
          break;
        }
        case 'checkpoint': {
          ground(x, 320);
          L.checkpoints.push({ x: x + 160, y: GY, id: 'cp' + L.checkpoints.length });
          x += 320;
          break;
        }
        case 'chase': {
          const len = seg.len || 2600;
          let cur = x;
          const holes = [x + len * 0.3, x + len * 0.62];
          holes.forEach((h) => { ground(cur, h - cur); cur = h + 190; plat(h + 10, GY - 170, 170); });
          ground(cur, x + len - cur);
          for (let i = 0; i < 3; i++) combat.addHazard({ type: 'spikes', x: x + len * (0.15 + i * 0.25), y: GY - 26, w: 80, h: 26 });
          combat.spawnEnemy('blob', x + len * 0.5, GY - 46, { minX: x + len * 0.45, maxX: x + len * 0.56 });
          const wall = combat.addHazard({ type: 'wall', x: x - 700, speed: seg.speed || 360, active: false });
          L.chase = { x0: x, x1: x + len, wall, started: false, done: false };
          if (seg.records) record(x + len * 0.8, GY - 200);
          x += len;
          break;
        }
        case 'boss': {
          const len = 1900;
          ground(x - 40, len + 80);
          const wl = phys.add({ x: x - 80, y: GY - 1200, w: 40, h: 1200, kind: 'wall', disabled: true });
          const wr = phys.add({ x: x + len, y: GY - 1200, w: 40, h: 1200, kind: 'wall' });
          L.arena = { x0: x, x1: x + len, groundY: GY, trigger: x + 260, wallL: wl, wallR: wr };
          for (let i = 0; i < 4; i++) deco('pillar', x + 100 + i * (len - 200) / 3, GY);
          x += len;
          break;
        }
        case 'end': {
          ground(x, 700);
          L.exit = { x: x + 360, y: GY };
          x += 700;
          break;
        }
        default: console.warn('알 수 없는 구간', seg.t);
      }
    }
    L.endX = x;
    // 끝 벽
    phys.add({ x: x, y: GY - 1400, w: 60, h: 2000, kind: 'wall' });
    phys.add({ x: -460, y: GY - 1400, w: 60, h: 2000, kind: 'wall' });
    return L;
  }

  MG.LevelBuilder = { build, GY, PIT_Y };
})();

<script>/* js/worlds/EarthWorld.js */
/* EarthWorld — 이승 역사 스테이지 (튜토리얼 겸용)
 * NPC 대화 → 기록 조각 수집 → 기록의 문/수수께끼 → 추격전 → 보스전 → 기록 복구 → 평가 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  const GRADE = [[96, 'SSS'], [90, 'SS'], [82, 'S'], [70, 'A'], [55, 'B'], [0, 'C']];
  function gradeOf(score) { for (const [s, g] of GRADE) if (score >= s) return g; return 'C'; }

  class StageScene {
    constructor() { this.name = 'stage'; }

    enter(opts) {
      this.tutorial = !!opts.tutorial;
      this.tutReplay = !!opts.replay;
      this.stage = this.tutorial ? MG.Data.story.tutorialStage : MG.Data.stageMap[opts.stageId];
      const st = this.stage;
      MG.State.setWorld(this.tutorial ? 'tutorial' : 'earth');
      this.subs = [];
      this.phys = new MG.PhysicsWorld();
      this.combat = new MG.Combat(this);
      this.L = MG.LevelBuilder.build(st, this);
      this.arena = this.L.arena;
      this.t = 0; this.leaving = false; this.busy = false; this.boss = null; this.bossStarted = false;
      this.npcs = this.L.npcs.map((n) => new MG.NPC(n.def, n.x, this.L.GY));
      this.npcs.forEach((n, i) => (n.key = this.L.npcs[i].key));
      this.mission = new MG.Mission(st.mission, () => MG.UI.hud.mission(this.mission.label()));
      // 진행 중 기록 불러오기 (중간 저장)
      const d = MG.State.d;
      if (!this.tutorial) {
        d.location = 'stage'; d.earth.currentStage = st.id;
        if (!d.earth.run || d.earth.run.stageId !== st.id) {
          d.earth.run = { stageId: st.id, checkpoint: null, solved: [], records: [], usedQ: [], bossDone: false, talked: [],
            stats: { correct: 0, wrong: 0, maxCombo: 0, elapsed: 0, bossDmg: 0, answered: 0 } };
          if (opts.fresh !== false) MG.State.restoreEarth();
        }
        this.run = d.earth.run;
      } else {
        this.run = { stageId: 'tutorial', checkpoint: null, solved: [], records: [], usedQ: [], talked: [], stats: { correct: 0, wrong: 0, maxCombo: 0, elapsed: 0, bossDmg: 0, answered: 0 } };
      }
      this._applyRun();
      const cp = this.run.checkpoint;
      this.player = new MG.Player(cp ? cp.x : this.L.startX, (cp ? cp.y : this.L.GY) - 90);
      this.ink = { x: this.player.cx - 60, y: this.player.y - 60, t: 0, mood: 'normal' };
      this.companion = new MG.Companion(this);   // 동료 먹물: 따라다니기·원거리·보호막
      MG.Minjun.attach(this);                     // 김민준 (포탈로만 등장)
      this.weakT = 0; this.weakRing = null; this.training = null;
      // 탐험 중 깜짝 등장: 가끔(약 35%), 같은 스테이지 연속 금지, 챕터 1 이벤트 전에는 없음
      const mjd = MG.State.d.minjun;
      this.exploreRoll = !this.tutorial && !!mjd.events.ch1 && !MG.Minjun.noExplore && Math.random() < 0.35 && mjd.lastExploreStage !== st.id;
      this.exploreX = this.L.endX * (0.3 + Math.random() * 0.25);
      this.exploreDone = false;
      MG.R.setTheme(st.theme);
      MG.R.cam.snap(this.player.cx, this.player.cy - 80);
      MG.R.cam.tzoom = 1; MG.R.cam.bounds = { x0: -420, x1: this.L.endX + 20 };
      this.music = (st.theme && st.theme.music) || 'earth';
      MG.Audio.music(this.tutorial ? 'tutorial' : this.music);
      MG.UI.hud.show(st.title, this.tutorial);
      MG.UI.hud.mission(this.mission.label());
      MG.Input.setTouchVisible(true);
      this.combo0 = MG.State.combo = 0;
      this.subs.push(MG.bus.on('player:hpDepleted', (info) => this._onHpDepleted(info)));
      this.subs.push(MG.bus.on('world:livesDepleted', () => this._toHell()));
      this.subs.push(MG.bus.on('player:damaged', (amt) => { if (this.boss && this.boss.state !== 'dead') this.bossDmgTaken = (this.bossDmgTaken || 0) + amt; }));
      this.subs.push(MG.bus.on('lives:change', (e) => { if (e.reason === 'hp') this._inkSay('lifeLost'); }));
      this.subs.push(MG.bus.on('combo:change', (c) => { if (c > this.run.stats.maxCombo) this.run.stats.maxCombo = c; if (c === 5 || c === 8) { this._inkSay(c === 8 ? 'awaken' : 'combo'); if (c === 8) { this.player.setSpecial('awaken', 0.8); MG.Audio.sfx('awaken'); MG.R.flash('#ffd76a', 0.35); } } }));
      MG.R.fadeA = 1; MG.R.fade(0, 0.8);
      this.tutStep = 0;
      if (!this.tutorial) setTimeout(() => this._inkSay('enter'), 900);
      // 챕터 1 훈련 도중 종료했다면 이어서
      if (!this.tutorial && st.id === MG.Data.stages[0].id && this.run.bossDone && !MG.State.d.minjun.events.ch1) setTimeout(() => { if (MG.Core.scene === this && !this.leaving) this._chapter1(); }, 1500);
      else if (this.tutorial) MG.Tutorial.start(this, { replay: this.tutReplay });
      MG.State.markDirty(true);
    }
    exit() {
      this.subs.forEach((f) => f());
      if (this.tut) { this.tut.destroy(); this.tut = null; }
      MG.UI.hud.hide();
      MG.UI.hud.boss(null);
      MG.Input.setInteract(null);
      MG.Input.setTouchVisible(false);
    }
    _applyRun() {
      const r = this.run;
      for (const g of this.L.gates) if (r.solved.includes(g.id) || (g.link && r.solved.includes(g.link))) this._openGate(g, true);
      for (const b of this.L.bridges) if (r.solved.includes(b.id)) this._makeBridge(b, true);
      for (const a of this.L.altars) if (r.solved.includes(a.id)) { a.solved = true; this._altarEffect(a, true); }
      for (const rec of this.L.records) if (r.records.includes(rec.def.id)) rec.got = true;
      this.npcs.forEach((n) => { if (r.talked.includes(n.key)) n.done = true; });
      // 미션 복원
      if (this.mission) {
        this.mission.steps.forEach((s) => {
          if (s.id === 'talk' && r.talked.length) s.done = true, s.have = 1;
          if (s.id === 'records') { s.have = r.records.length; s.done = s.have >= (s.need || 1); }
          if (s.id === 'riddle') { s.have = this.L.altars.filter((a) => a.solved).length; s.done = s.have >= (s.need || 1); }
          if (s.id === 'gate') { s.have = this.L.gates.filter((g) => g.open && g.kind !== 'riddleDoor').length; s.done = s.have >= (s.need || 1); }
        });
      }
    }

    /* ── 먹물 대사 (진행 상황 반영) ── */
    _inkSay(kind) {
      const S = MG.Data.story.ink;
      const st = this.stage;
      let pool = (st.inkLines && st.inkLines[kind]) || S[kind];
      if (kind === 'wrong' && this.run.stats.wrong >= 3) pool = (st.inkLines && st.inkLines.wrongMany) || S.wrongMany;
      if (kind === 'lifeLost' && MG.State.lives <= 2) pool = S.lastLives;
      if (!pool || !pool.length) return;
      if (this.inMemorial && kind !== 'enter') return;
      const line = Array.isArray(pool) ? pool[Math.floor(Math.random() * pool.length)] : pool;
      this.ink.mood = ['wrong', 'lifeLost', 'hpLow'].includes(kind) ? 'worry' : ['combo', 'awaken', 'correct'].includes(kind) ? 'smug' : 'normal';
      MG.Dialog.bark(line, 'ink', 3);
    }

    /* ── 문제 출제 공통: 오답 → 목숨 1개 (실패 ID로 중복 차감 방지) ── */
    async ask(q, label, extra) {
      if (!q) return true;
      const inst = U.uid('quiz');
      this.busy = true;
      const r = await MG.Q.ask(q, Object.assign({ label, stage: this.stage.id }, extra || {}));
      this.busy = false;
      if (r.skipped) return false;
      const s = this.run.stats;
      s.answered++;
      if (!this.run.usedQ.includes(q.id)) this.run.usedQ.push(q.id);
      if (r.correct) { s.correct++; this.run.wrongStreak = 0; this._inkSay('correct'); }
      else {
        s.wrong++; this.run.wrongStreak = (this.run.wrongStreak || 0) + 1;
        if (!this.tutorial) MG.State.loseLife('quiz', 'quiz#' + inst);
        if (!this.leaving) this._inkSay('wrong');
      }
      MG.State.markDirty();
      // 김민준 도움: 같은 문제 3번 이상 오답 또는 3연속 오답일 때만, 스테이지당 2번, 60초 간격, 보스전 중에는 없음
      if (!r.correct && this._needHelp(q, extra)) {
        this.busy = true;
        this.run.minjunHelps = (this.run.minjunHelps || 0) + 1; this.run.lastHelpAt = s.elapsed; this.run.wrongStreak = 0;
        await MG.Minjun.help(this, q, r);
        this.busy = false;
        if (this.leaving || MG.Core.scene !== this) return false;
        return this.ask(q, label + ' · 다시 도전', Object.assign({}, extra || {}, { noHelp: true }));
      }
      return r.correct;
    }
    _needHelp(q, extra) {
      if (this.tutorial || this.leaving || (extra && extra.noHelp) || !q) return false;
      if (this.boss && this.boss.state !== 'dead') return false;
      if (MG.State.lives <= 0 || MG.State.dying) return false;
      const w = MG.State.d.wrongLog[q.id];
      const hard = (w && w.total >= 3) || (this.run.wrongStreak || 0) >= 3;
      if (!hard) return false;
      if ((this.run.minjunHelps || 0) >= 2) return false;
      if (this.run.lastHelpAt != null && this.run.stats.elapsed - this.run.lastHelpAt < 60) return false;
      return true;
    }
    pickQ(opts) {
      if (this.tutorial) return MG.Data.tutorialQuestion();
      return MG.Bank.pick(this.stage.id, Object.assign({ used: this.run.usedQ }, opts || {}));
    }

    /* ── HP 소진 → (목숨은 GameState에서 이미 1개 차감) → 체크포인트 부활 ── */
    _onHpDepleted(info) {
      if (this.leaving) return;
      const p = this.player;
      p.setSpecial('defeat', 1.2);
      MG.Audio.sfx('lifeLost');
      MG.R.cam.shake(14, 0.4);
      MG.Core.slowmo(0.4, 0.6);
      setTimeout(() => {
        if (this.leaving || MG.Core.scene !== this) return;
        if (!info.practice && MG.State.lives <= 0) return; // 지옥 이동은 별도 처리
        MG.R.fade(1, 0.25);
        setTimeout(() => {
          if (this.leaving || MG.Core.scene !== this) return;
          this._respawn();
          MG.R.fade(0, 0.4);
        }, 280);
      }, 950);
    }
    _respawn() {
      const p = this.player;
      const cp = this.run.checkpoint || { x: this.L.startX, y: this.L.GY };
      p.x = cp.x; p.y = cp.y - p.h - 4; p.vx = p.vy = 0; p.clearSpecial(); p.hurtT = 0;
      MG.State.respawn();
      MG.R.cam.snap(p.cx, p.cy - 80);
      if (this.L.chase && this.L.chase.started && !this.L.chase.done) this.L.chase.wall.x = p.x - 800;
      if (this.boss && this.boss.state !== 'dead') { this.boss.waves.length = 0; this.boss.beams.length = 0; this.combat.proj.length = 0; }
    }
    _toHell() {
      if (this.leaving || this.tutorial) return;
      this.leaving = true;
      const d = MG.State.d;
      d.hell.pending = true; d.hell.returnStage = this.stage.id; d.location = 'hell'; d.stats.hellFalls++;
      MG.State.markDirty(true);
      this.player.setSpecial('defeat', 99);
      MG.Audio.sfx('defeat');
      MG.R.cam.tzoom = 1.6; MG.R.cam.shake(24, 1.6);
      MG.R.flash('#ff0000', 0.5);
      MG.UI.toast('목숨 7개를 모두 잃었다… 바닥이 갈라진다', 'danger');
      setTimeout(() => { MG.R.fade(1, 0.8, '#300'); }, 900);
      setTimeout(() => MG.Game.goHell(), 1900);
    }

    /* ── 상호작용 대상 ── */
    _interactable() {
      const p = this.player;
      for (const n of this.npcs) if (n.near(p)) return { kind: 'npc', o: n, label: '대화' };
      for (const g of this.L.gates) {
        if (g.open || g.kind === 'riddleDoor') continue;
        if (Math.abs(p.cx - g.x) < 170) {
          if (g.kind === 'guardian' && g.guard && !g.guard.shield) continue;
          return { kind: 'gate', o: g, label: g.kind === 'guardian' ? '봉인 해제' : '문 조사' };
        }
      }
      for (const a of this.L.altars) if (!a.solved && Math.abs(p.cx - a.x) < 110 && Math.abs(p.bottom - this.L.GY) < 60) return { kind: 'altar', o: a, label: '제단' };
      return null;
    }
    async _interact(it) {
      if (this.busy) return;
      if (it.kind === 'npc') {
        const n = it.o;
        this.busy = true;
        n.talkT = 3;
        const lines = n.done && n.def.after ? n.def.after : n.def.lines;
        await MG.Dialog.talk(lines.map((l) => Object.assign({ name: n.name }, l)));
        this.busy = false;
        if (!n.done) {
          n.done = true;
          if (!this.run.talked.includes(n.key)) this.run.talked.push(n.key);
          this.mission.progress('talk');
          if (n.def.codex) n.def.codex.forEach((c) => (MG.State.d.codex[c] = MG.State.d.codex[c] || { stage: this.stage.id, at: Date.now() }));
          if (this.tutorial) this._tutorialStep('talked');
        }
        return;
      }
      if (it.kind === 'gate') {
        const g = it.o;
        const q = this.pickQ({ types: ['mc', 'liar', 'forgery'] });
        const ok = await this.ask(q, g.kind === 'guardian' ? '봉인 수호병 — 정답으로 방어막 파괴' : (g.label || '기록의 문') + ' — 정답으로 문 개방');
        if (this.leaving) return;
        if (ok) {
          if (g.kind === 'guardian') {
            g.guard.shield = false;
            MG.Audio.sfx('shield'); MG.R.flash('#bfe3ff', 0.3);
            MG.UI.toast('방어막 파괴! 붓으로 수호병을 쓰러뜨려라', 'ok');
          } else this._openGate(g);
          if (this.tutorial) this._tutorialStep('answered');
        } else {
          // 오답 → 적의 공격 패턴 시작
          if (g.kind === 'guardian') {
            for (let i = -1; i <= 1; i++) { const a = Math.atan2(this.player.cy - (g.guard.y + 40), this.player.cx - g.x) + i * 0.25; this.combat.shoot(g.x + 35, g.guard.y + 40, Math.cos(a) * 420, Math.sin(a) * 420, { dmg: 12 }); }
          } else if (!this.tutorial) {
            this.combat.spawnEnemy('blob', g.x - 120, this.L.GY - 46, { minX: g.x - 420, maxX: g.x - 70 });
            MG.R.particles.burst(g.x, this.L.GY - 120, 20, { color: '#111', speedMin: 100, speedMax: 300, lifeMax: 0.5 });
          }
          if (this.tutorial) this._tutorialStep('answered');
        }
        return;
      }
      if (it.kind === 'altar') {
        const a = it.o;
        const q = MG.Data.qMap[a.id];
        const label = { order: '기록의 문 — 사건을 순서대로', match: '기억의 미궁 — 정확히 연결', liar: '거짓말하는 NPC', forgery: '위조된 문서', cause: '역사적 인과관계' }[q ? q.type : 'order'];
        const ok = await this.ask(q, label + (a.effect === 'bridge' ? ' · 성공 시 발판 생성' : a.effect === 'trap' ? ' · 성공 시 함정 해제' : ' · 성공 시 문 개방'));
        if (this.leaving) return;
        if (ok) {
          a.solved = true;
          if (!this.run.solved.includes(a.id)) this.run.solved.push(a.id);
          this.mission.progress('riddle');
          this._altarEffect(a);
          MG.State.markDirty();
        } else if (a.effect === 'trap') {
          (this.L.trapsFor[a.id] || []).forEach((h) => { if (h.type === 'dropper') h.period = 0.8; });
        }
      }
    }
    _openGate(g, instant) {
      g.open = true;
      if (g.door) { g.door.disabled = true; }
      if (!instant) {
        g.openT = 0.001;
        MG.Audio.sfx('door'); MG.R.cam.shake(8, 0.4);
        MG.R.particles.burst(g.x + 30, this.L.GY - 130, 26, { color: ['#e8d48a', '#fff'], speedMin: 80, speedMax: 320, lifeMax: 0.8, glow: true });
        if (!this.run.solved.includes(g.id)) this.run.solved.push(g.id);
        if (g.kind !== 'riddleDoor') this.mission.progress('gate');
        MG.State.markDirty();
      } else g.openT = 1;
    }
    _altarEffect(a, instant) {
      if (a.effect === 'bridge') { const b = this.L.bridges.find((x) => x.id === a.id); if (b) this._makeBridge(b, instant); }
      else if (a.effect === 'door') { const g = this.L.gates.find((x) => x.link === a.id); if (g) this._openGate(g, instant); }
      else if (a.effect === 'trap') { (this.L.trapsFor[a.id] || []).forEach((h) => (h.disabled = true)); if (!instant) { MG.Audio.sfx('door'); MG.UI.toast('함정 해제!', 'ok'); } }
    }
    _makeBridge(b, instant) {
      if (b.made) return;
      b.made = true;
      b.pieces.forEach((pc, i) => {
        const add = () => {
          pc.solid = this.phys.add({ x: pc.x, y: pc.y, w: pc.w, h: 26, oneway: false, kind: 'bridge' });
          pc.bornT = instant ? 1 : 0;
          if (!instant) { MG.Audio.sfx('pickup'); MG.R.particles.burst(pc.x + pc.w / 2, pc.y, 12, { color: ['#ffd76a', '#fff'], speedMin: 60, speedMax: 200, lifeMax: 0.5, glow: true }); }
        };
        if (instant) add(); else setTimeout(add, 200 + i * 220);
      });
      if (!instant) { if (!this.run.solved.includes(b.id)) this.run.solved.push(b.id); MG.UI.toast('연표가 맞춰지자 발판이 생겨났다!', 'ok'); }
    }
    onInkOnlyHit(e) { if (!this._inkOnlyHinted) { this._inkOnlyHinted = true; MG.Dialog.bark('표적은 먹물 탄으로 맞혀야 해! 공격 버튼을 길게 눌러.', 'minjun', 3); } }
    onEnemyKilled(e) {
      if (this.tut) this.tut.onEnemyKilled(e);
      if (e.type === 'weak') { this.weakRing = null; this.weakT = 0; if (this.boss) this.boss.stagger(MG.Data.companion.weakRing.stun); MG.UI.toast('약점 고리 파괴 — 보스가 비틀거린다!', 'ok'); return; }
      if (e.type === 'target' && this.training) { this.training.hits++; MG.UI.hud.mission(MG.Data.minjun.ch1.training.replace('{n}', this.training.hits)); if (this.training.hits >= this.training.total && this.training.resolve) this.training.resolve(); return; }
      const g = this.L.gates.find((x) => x.guard === e);
      if (g) { g.open = true; if (!this.run.solved.includes(g.id)) this.run.solved.push(g.id); this.mission.progress('gate'); MG.UI.toast('봉인 수호병 격파', 'ok'); MG.State.markDirty(); }
    }

    /* ── 보스전 ── */
    _startBoss() {
      this.bossStarted = true;
      const A = this.arena;
      A.wallL.disabled = false;
      this.run.checkpoint = { x: A.x0 + 120, y: A.groundY };
      MG.R.cam.bounds = { x0: A.x0 - 60, x1: A.x1 + 40 };
      const cfg = Object.assign({}, this.stage.boss);
      this.boss = new MG.Boss(this, cfg);
      this.bossLine = (line) => MG.Dialog.bark(line, 'boss', 3);
      this.boss.onQuestion = async () => {
        if (this.leaving) return;
        const q = this.pickQ({ types: ['mc', 'liar'], minImp: 'B' });
        const ok = await this.ask(q, '보스 「' + this.boss.name + '」의 봉인 — 정답 시 공격 기회', { resultNote: (c) => (c ? '방어막 파괴! 지금 공격하라' : '보스가 분노한다 — 회피 준비') });
        if (this.leaving) return;
        this.boss.answer(ok);
      };
      this.boss.onDefeat = () => this._bossDefeated();
      MG.Audio.music('boss');
      MG.Audio.sfx('boss');
      MG.R.letterboxT = 1; MG.R.cam.tzoom = 0.82;
      MG.UI.hud.boss(this.boss);
      MG.UI.bossCard(cfg.name, cfg.title);
      setTimeout(async () => {
        if (this.leaving) return;
        await MG.Dialog.talk((cfg.intro || []).map((l) => Object.assign({ name: cfg.name }, l)));
        MG.R.letterboxT = 0;
        this._inkSay('boss');
        this.boss.start();
      }, 1300);
    }
    async _bossDefeated() {
      if (this.leaving) return;
      this.run.bossDone = true;
      this.run.stats.bossDmg = this.bossDmgTaken || 0;
      MG.State.d.stats.bossKills++;
      MG.UI.hud.boss(null);
      this.arena.wallR.disabled = true;
      MG.R.cam.bounds = { x0: -420, x1: this.L.endX + 20 };
      MG.R.cam.tzoom = 1;
      await MG.Dialog.talk((this.stage.boss.defeat || []).map((l) => Object.assign({ name: this.stage.boss.name }, l)));
      MG.Audio.music(this.music);
      if (this.weakRing) { this.weakRing.dead = true; this.weakRing = null; }
      if (this.stage.id === MG.Data.stages[0].id && !MG.State.d.minjun.events.ch1) { await this._chapter1(); }
      else {
        const ab = MG.Abilities.forStage(this.stage.id);
        if (ab && MG.Abilities.unlock(ab.id)) this._announceAbility(ab);
      }
      MG.UI.toast('왜곡된 기록이 풀려난다 — 출구로 이동하라', 'ok');
      MG.State.markDirty(true);
    }
    _announceAbility(ab) {
      this.newAbility = ab.id;
      MG.Audio.sfx('awaken'); MG.R.flash('#c9b6ff', 0.2);
      MG.UI.toast('새 능력: ' + ab.name, 'ok');
      setTimeout(() => MG.Dialog.bark(ab.how, 'ink', 5), 600);
      const btn = ab.button && MG.Input.els[ab.button];
      if (btn) { btn.classList.remove('new-skill'); void btn.offsetWidth; btn.classList.add('new-skill'); }
      if (ab.id === 'shield2' && this.companion) { this.companion.shieldMax = 2; this.companion.shieldCds = [0, 0]; }
    }
    /* ── 챕터 1: 김민준 첫 등장 → 먹물 원거리 공격 시연 → 훈련 → 영구 해금 ── */
    async _chapter1() {
      if (this._ch1Running) return; this._ch1Running = true;
      const C = MG.Data.minjun.ch1, p = this.player, A = this.arena, comp = this.companion;
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      this.busy = true; this.training = { hits: 0, total: 3 };
      await wait(700);
      MG.Dialog.bark(C.rest[0].text, 'ink', 2); this.ink.mood = 'smug';
      await wait(1300);
      await MG.Minjun.enter(this, { prefer: [200, 260, 150, -200, -260] });
      await MG.Minjun.say(this, C.intro);
      // 시연: 먹물이 앞으로 나가 에너지를 모아 먼 표적을 맞힌다 (실제 발사체)
      const f = p.facing || 1;
      const clampX = (x) => U.clamp(x, (A ? A.x0 : 0) + 60, (A ? A.x1 : this.L.endX) - 60);
      const demo = this.combat.spawnEnemy('target', clampX(p.cx + f * 380) - 24, this.L.GY - 90, { w: 48, h: 90, hp: 1, maxHp: 1, inkOnly: true, isDemo: true });
      this.minjunInkTarget = { x: p.cx + f * 56, y: p.y - 30 };
      await wait(500);
      for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; MG.R.particles.spawn({ x: this.ink.x + Math.cos(a) * 40, y: this.ink.y + Math.sin(a) * 40, vx: -Math.cos(a) * 80, vy: -Math.sin(a) * 80, life: 0.5, size: 3, size2: 1, color: '#c9b6ff', glow: true, drag: 0 }); }
      MG.Audio.sfx('dash');
      await wait(650);
      comp.training = true;
      const ang = Math.atan2(demo.y + demo.h / 2 - this.ink.y, demo.x + demo.w / 2 - this.ink.x);
      comp._spawnShot(this.ink.x, this.ink.y, Math.cos(ang) * 980, Math.sin(ang) * 980, { dmg: 1, r: 12, bossMul: 0.6 });
      MG.Audio.sfx('attack');
      await wait(900);
      this.minjunInkTarget = null;
      if (!demo.dead) this.combat.killEnemy(demo);
      await MG.Minjun.say(this, C.afterDemo);
      // 훈련: 가까운 표적 2개 + 사정거리 밖 표적 1개 (다가가야 맞힘)
      const R = MG.Data.companion.ranged.range;
      const left = p.cx - (A ? A.x0 : 0), right = (A ? A.x1 : this.L.endX) - p.cx;
      const dir = right >= left ? 1 : -1;
      const xs = [p.cx + dir * 260, p.cx + dir * 430, p.cx + dir * Math.min(Math.max(right, left) - 80, R + 360)].map(clampX);
      this.training.targets = xs.map((x) => this.combat.spawnEnemy('target', x - 24, this.L.GY - 90, { w: 48, h: 90, hp: 1, maxHp: 1, inkOnly: true }));
      MG.UI.hud.mission(C.training.replace('{n}', 0));
      this.busy = false;
      await new Promise((res) => { this.training.resolve = res; if (this.training.hits >= this.training.total) res(); });
      // 영구 해금 + 저장
      MG.Abilities.unlock('inkShot');
      MG.State.d.minjun.events.ch1 = true;
      comp.training = false;
      MG.State.markDirty(true); MG.Save.autosave();
      this.busy = true;
      await MG.Minjun.say(this, C.done);
      await MG.Minjun.leave(this, {});
      this.busy = false; this.training = null;
      MG.UI.hud.mission(this.mission.label());
      this._announceAbility(MG.Abilities.def('inkShot'));
      this._ch1Running = false; this._ch1Done = true;
    }

    /* ── 클리어 ── */
    async _clear() {
      if (this.leaving) return;
      this.leaving = true;
      const p = this.player;
      p.setSpecial(MG.State.d.rewards.victory === 'spin' ? 'spin' : 'victory', 99);
      MG.Audio.sfx('victory'); MG.R.flash('#fff', 0.5);
      MG.R.particles.burst(p.cx, p.cy, 60, { color: ['#ffd76a', '#fff', '#9ad0ff'], speedMin: 100, speedMax: 600, lifeMax: 1.2, glow: true, grav: 200 });
      if (this.tutorial) {
        MG.State.d.tutorialDone = true; MG.State.markDirty(true);
        // 처음: 첫 실제 스테이지로 자연스럽게 / 설정에서 다시 한 경우: 지도로
        const replay = this.tutReplay;
        setTimeout(() => { MG.R.fade(1, 0.6); setTimeout(() => (replay ? MG.Game.toMap() : MG.Game.startStage(MG.Data.stages[0].id, { fromTutorial: true })), 700); }, 600);
        return;
      }
      const st = this.stage, s = this.run.stats, d = MG.State.d;
      const total = s.correct + s.wrong;
      const parts = {
        acc: total ? s.correct / total : 1,
        lives: MG.State.lives / MG.State.maxLives,
        time: U.clamp((st.parTime || 300) / Math.max(1, s.elapsed), 0, 1),
        combo: U.clamp(s.maxCombo / Math.max(3, total), 0, 1),
        mission: this.mission.ratio,
        boss: U.clamp(1 - (this.bossDmgTaken || 0) / 100, 0, 1)
      };
      const score = Math.round(100 * (parts.acc * 0.4 + parts.lives * 0.2 + parts.time * 0.1 + parts.combo * 0.1 + parts.mission * 0.1 + parts.boss * 0.1));
      const grade = gradeOf(score);
      const prev = d.earth.cleared[st.id];
      const first = !prev;
      d.earth.cleared[st.id] = {
        grade: prev && prev.best >= score ? prev.grade : grade, best: Math.max(score, prev ? prev.best : 0),
        time: prev ? Math.min(prev.time, s.elapsed) : s.elapsed, records: this.run.records.length, recordsTotal: (st.records || []).length,
        clears: (prev ? prev.clears : 0) + 1, last: { score, grade }
      };
      // 보상 해금 (외형만 — 정답을 알려주는 보상 없음)
      const unlocked = [];
      const rw = st.reward || {};
      ['skin', 'trail', 'title', 'victory', 'effect'].forEach((k) => { if (rw[k] && MG.State.unlock(k, rw[k])) unlocked.push([k, rw[k]]); });
      if (['S', 'SS', 'SSS'].includes(grade) && MG.State.unlock('title', st.title + ' 수호자')) unlocked.push(['title', st.title + ' 수호자']);
      d.earth.run = null;
      const idx = st.index;
      const next = MG.Data.stages[idx + 1];
      d.earth.currentStage = next ? next.id : st.id;
      d.location = 'map';
      MG.State.restoreEarth(); // 다음 스테이지는 HP 100%·목숨 7개로 시작
      MG.State.markDirty(true);
      MG.Save.autosave();
      setTimeout(async () => {
        // 김민준: 모든 스테이지 클리어마다 포탈로 등장해 보충 설명 (자세히 듣기 / 넘어가기)
        try { await MG.Minjun.stageClear(this, { ability: this.newAbility, afterCh1: this._ch1Done }); } catch (e) { console.error(e); }
        await MG.UI.result({ stage: st, score, grade, parts, stats: s, unlocked, first, lives: MG.State.maxLives });
        // 서사 이벤트
        const ev = MG.Data.story.afterStage && MG.Data.story.afterStage[st.id];
        if (ev && first) await MG.Story.play(ev, { music: 'title' });
        if (MG.State.allStagesCleared && first) await MG.Story.play('heavenGate', { music: 'heaven' });
        MG.Game.toMap();
      }, 1400);
    }

    /* ── 튜토리얼 진행 (짧은 먹물 대사) ── */
    /* (v4) 예전 대사형 튜토리얼 진행 함수 — 이제 MG.Tutorial 감독이 맡는다. 호출부 호환용으로 비워 둠 */
    _tutorialStep() {}
    /* 튜토리얼 감독으로 이벤트 전달 */
    onDummyHit(e, src) { if (this.tut) this.tut.onDummyHit(e, src); }
    onPlayerDodged(tag, proj) { if (this.tut) this.tut.onPlayerDodged(tag, proj); }
    onPlayerHitTut(tag) { if (this.tut) this.tut.onPlayerHit(tag); }

    update(dt) {
      if (this.leaving && !this.player.special) return;
      this.t += dt;
      if (!this.tutorial && !this.leaving) this.run.stats.elapsed += dt;
      const p = this.player;
      this.phys.updateMovers(dt);
      p.update(dt, this.phys);
      // 낙사
      if (p.y > this.L.PIT_Y && !MG.State.dying) {
        const r = MG.State.damage(25, 'pit');
        if (!r.died && !this.leaving) {
          const s = p.lastSafe; p.x = s.x; p.y = s.y - 6; p.vx = p.vy = 0;
          MG.R.cam.snap(p.cx, p.cy - 80);
        } else if (!r.hit) { const s = p.lastSafe; p.x = s.x; p.y = s.y - 6; p.vx = p.vy = 0; }
      }
      this.combat.update(dt);
      // 기록 조각
      for (const rec of this.L.records) {
        if (rec.got) continue;
        rec.t += dt;
        if (U.dist(p.cx, p.cy, rec.x, rec.y) < 60) {
          rec.got = true;
          if (!this.run.records.includes(rec.def.id)) this.run.records.push(rec.def.id);
          if (!MG.State.d.rewards.records.includes(rec.def.id)) MG.State.d.rewards.records.push(rec.def.id);
          if (rec.def.concept) MG.State.d.codex[rec.def.concept] = MG.State.d.codex[rec.def.concept] || { stage: this.stage.id, at: Date.now() };
          this.mission.progress('records');
          MG.Audio.sfx('pickup');
          MG.R.particles.burst(rec.x, rec.y, 24, { color: ['#ffd76a', '#fff'], speedMin: 80, speedMax: 300, lifeMax: 0.7, glow: true });
          MG.UI.recordCard(rec.def);
          MG.State.markDirty();
        }
      }
      for (const n of this.npcs) n.update(dt);
      // 체크포인트
      for (const cp of this.L.checkpoints) {
        if (cp.on || cp.start) continue;
        if (p.cx > cp.x && Math.abs(p.bottom - cp.y) < 80) {
          cp.on = true;
          if (!this.run.checkpoint || this.run.checkpoint.x < cp.x) { this.run.checkpoint = { x: cp.x, y: cp.y }; MG.UI.toast('체크포인트 — 기록이 저장되었다', 'info'); MG.State.markDirty(true); }
          MG.Audio.sfx('pickup');
        }
      }
      // 추모 구역
      const inMem = this.L.triggers.some((tr) => tr.type === 'memorial' && p.cx > tr.x0 && p.cx < tr.x1);
      if (inMem !== this.inMemorial) { this.inMemorial = inMem; MG.Audio.music(inMem ? 'memorial' : this.music); if (inMem) MG.UI.toast('추모의 공간 — 조용히 기록을 살펴보자', 'info'); }
      // 추격전
      const ch = this.L.chase;
      if (ch && !ch.done && !this.tutorial) {
        if (!ch.started && p.cx > ch.x0 + 120) {
          ch.started = true; ch.wall.active = true; ch.wall.x = p.x - 760;
          MG.Audio.music('chase'); MG.R.cam.shake(10, 0.6); this._inkSay('chase');
          MG.UI.toast('망각의 파도가 기록을 지우며 쫓아온다 — 달려!', 'danger');
        }
        if (ch.started && p.cx > ch.x1) { ch.done = true; ch.wall.active = false; MG.Audio.music(this.music); MG.UI.toast('따돌렸다!', 'ok'); }
      }
      // 보스
      if (this.arena && !this.bossStarted && !this.run.bossDone && p.cx > this.arena.trigger) this._startBoss();
      if (this.boss) this.boss.update(dt);
      // 출구
      const ex = this.L.exit;
      const exitOpen = (!this.arena || this.run.bossDone) && !this.training && !this._ch1Running && !this.tutorial;
      if (ex && exitOpen && !this.leaving && Math.abs(p.cx - ex.x) < 50 && p.bottom > ex.y - 20) this._clear();
      // 상호작용
      const it = (this.busy || this.leaving) ? null : this._interactable();
      MG.Input.setInteract(it ? it.label : null);
      this._it = it;
      if (it && MG.Input.pressed('interact')) this._interact(it);
      // 초보자 튜토리얼 감독
      if (this.tut) this.tut.update(dt);
      // HP 경고
      if (MG.State.hp <= 30 && !this._hpWarned) { this._hpWarned = true; this._inkSay('hpLow'); }
      if (MG.State.hp > 30) this._hpWarned = false;
      // 동료 먹물 (따라다니기·조준·발사체·보호막)
      this.companion.update(dt);
      MG.Minjun.update(this, dt);
      // 훈련 표적: 사정거리 안이면 색이 살아남, 밖이면 회색 + 한 번 안내
      if (this.training && this.training.targets) {
        for (const e of this.training.targets) {
          if (e.dead) continue;
          e.lit = U.dist(e.x + e.w / 2, e.y + e.h / 2, this.ink.x, this.ink.y) <= MG.Data.companion.ranged.range;
          if (!e.lit && this.companion.aiming && !this._oorHint) { this._oorHint = true; MG.Dialog.bark(MG.Data.minjun.ch1.outOfRange[0].text, 'minjun', 3.2); }
        }
      }
      // 약점 고리: 2번째 스테이지 보스부터, 공격 중 가끔 머리 위 높이(붓이 닿지 않는 곳)에 생김 → 먹물 탄·공중 베기로 부수면 기절
      const WR = MG.Data.companion.weakRing;
      if (this.boss && this.boss.state === 'attack' && this.stage.index >= WR.fromStage && !this.tutorial) {
        if (!this.weakRing || this.weakRing.dead) {
          this.weakT += dt;
          if (this.weakT > WR.every) {
            this.weakT = 0;
            const Ar = this.arena, x = U.lerp(Ar.x0 + 160, Ar.x1 - 160, Math.random());
            this.weakRing = this.combat.spawnEnemy('weak', x - WR.radius, Ar.groundY - WR.height - WR.radius, { w: WR.radius * 2, h: WR.radius * 2, hp: 1, maxHp: 1, fly: true, life: 7 });
            MG.Audio.sfx('warn');
          }
        } else { this.weakRing.life -= dt; if (this.weakRing.life <= 0) { this.weakRing.dead = true; this.weakRing = null; } }
      } else if (this.weakRing && this.boss && this.boss.state !== 'attack') { this.weakRing.dead = true; this.weakRing = null; }
      // 탐험 중 깜짝 등장 (전투·보스전·대화 중 아님)
      if (this.exploreRoll && !this.exploreDone && !this.bossStarted && !this.busy && !this.leaving && p.cx > this.exploreX && this.run.stats.elapsed > 15 && p.onGround
        && !this.combat.enemies.some((e) => !e.dead && U.dist(e.x, e.y, p.cx, p.cy) < 520) && !this.combat.proj.length) {
        this.exploreDone = true; this.busy = true;
        MG.Minjun.explore(this).catch((e) => console.error(e)).then(() => { this.busy = false; });
      }
      // 카메라
      const cam = MG.R.cam;
      cam.lead = U.lerp(cam.lead, p.vx * 0.32, 1 - Math.exp(-2.5 * dt));
      if (this.boss && this.boss.state !== 'dead') { cam.tx = (p.cx + this.boss.cx) / 2; cam.ty = Math.min(p.cy - 60, this.L.GY - 300); }
      else { cam.tx = p.cx + cam.lead; cam.ty = Math.min(p.cy - 70, this.L.GY - 250); }
      // 튜토리얼 장면 전환: 다음 목표 쪽을 잠깐 비춤
      if (this.camPeek) { this.camPeek.t -= dt; if (this.camPeek.t <= 0) this.camPeek = null; else cam.tx = U.lerp(cam.tx, this.camPeek.x, 0.55 * Math.min(1, this.camPeek.t / 0.4)); }
      const speed = Math.abs(p.vx);
      if (!this.boss) cam.tzoom = p.state === 'dash' ? 0.95 : speed > 400 ? 0.97 : 1;
      // 주변 파티클
      this._ambient(dt);
    }
    _ambient(dt) {
      const kind = this.stage.theme && this.stage.theme.particles;
      if (!kind || !MG.Settings.get('bgEffects')) return;
      const v = MG.R.view;
      if (Math.random() < dt * 14) {
        const x = U.lerp(v.x0, v.x1, Math.random()), y = U.lerp(v.y0, v.y1, Math.random());
        const def = { dust: { color: 'rgba(255,240,210,0.5)', vy: -10, vx: 14, size: 2 }, ink: { color: 'rgba(10,10,14,0.55)', vy: 20, vx: -10, size: 3 }, ember: { color: '#ff8a4d', vy: -40, vx: 6, size: 2, glow: true }, light: { color: 'rgba(255,230,160,0.8)', vy: -18, vx: 0, size: 2, glow: true }, snow: { color: 'rgba(255,255,255,0.8)', vy: 40, vx: -8, size: 2.5 }, ash: { color: 'rgba(120,120,120,0.5)', vy: 22, vx: 12, size: 2 } }[kind];
        if (def) MG.R.particles.spawn({ x, y, vx: def.vx + (Math.random() - 0.5) * 20, vy: def.vy, life: 3, size: def.size, size2: def.size, color: def.color, drag: 0, glow: def.glow });
      }
    }

    render(R) {
      const ctx = R.ctx, th = this.stage.theme, L = this.L;
      R.drawBackground();
      R.beginWorld();
      // 뒤 장식
      for (const d of L.deco) this._deco(R, d);
      // 지형
      const gs = th.ground, ps = th.platform || th.ground;
      for (const g of L.ground) R.block(g.x, g.y, g.w, g.h, gs);
      for (const p of L.plats) R.block(p.x, p.y, p.w, p.h, ps);
      if (L.blocks) for (const b of L.blocks) R.block(b.x, b.y, b.w, b.h, ps);
      for (const b of L.bridges) for (const pc of b.pieces) {
        if (!pc.solid) { ctx.strokeStyle = 'rgba(255,215,106,0.35)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2; ctx.strokeRect(pc.x, pc.y, pc.w, 26); ctx.setLineDash([]); continue; }
        pc.bornT = Math.min(1, (pc.bornT || 0) + 0.05);
        ctx.globalAlpha = pc.bornT;
        R.block(pc.x, pc.y, pc.w, 26, { top: '#f3dc8e', front: '#c9a54a', frontDark: '#8a6c24', edge: '#fff4c2' });
        ctx.globalAlpha = 1;
        R.light(pc.x + pc.w / 2, pc.y, 80, 'rgba(255,215,106,0.8)', 0.25);
      }
      // 문
      for (const g of L.gates) {
        if (!g.door) continue;
        if (g.openT > 0 && g.openT < 1) g.openT = Math.min(1, g.openT + 0.02);
        const lift = U.easeInOutCubic(g.openT) * 250;
        if (lift < 250) {
          const x = g.door.x, y = g.door.y - lift, h = 260;
          ctx.save(); ctx.beginPath(); ctx.rect(x - 40, L.GY - 400, 140, 400); ctx.clip();
          R.block(x, y, 60, h, { top: '#6a6f80', front: '#4a4f60', frontDark: '#2c2f3a', side: '#3a3e4c' });
          ctx.fillStyle = '#e8d48a'; ctx.font = '800 22px ' + R.FONT; ctx.textAlign = 'center'; ctx.fillText('記', x + 30, y + 120);
          ctx.restore();
          if (!g.open) R.light(x + 30, L.GY - 130, 140, 'rgba(232,212,138,0.7)', 0.25);
        }
        if (!g.open && g.kind !== 'riddleDoor') R.text(g.label, g.x + 30, L.GY - 290, 18, '#e8d48a');
      }
      // 제단
      for (const a of L.altars) {
        const x = a.x, y = L.GY;
        R.shadow(x, y, 40, 0.4);
        R.block(x - 40, y - 60, 80, 60, { top: '#8d8576', front: '#5e584c', frontDark: '#3c382f' });
        const glow = a.solved ? 'rgba(120,255,180,0.8)' : 'rgba(255,215,106,0.9)';
        R.light(x, y - 90, 120, glow, 0.35 + 0.15 * Math.sin(this.t * 3));
        MG.Pixel.draw(ctx, MG.Pixel.crystalSprite(!!a.solved, Math.floor(this.t * 3) % 2), x, y - 100 + Math.round(Math.sin(this.t * 2) * 2) * MG.Pixel.PX, 6, 7, 1);
        if (!a.solved) R.text({ order: '기록의 문', match: '기억의 미궁', liar: '거짓말하는 NPC', forgery: '위조된 문서' }[(MG.Data.qMap[a.id] || {}).type] || '수수께끼', x, y - 150, 17, '#ffe39a');
      }
      // 체크포인트
      for (const cp of L.checkpoints) {
        if (cp.start) continue;
        MG.Pixel.draw(ctx, MG.Pixel.flagSprite(!!cp.on, Math.floor(this.t * 6) % 4), cp.x, cp.y, 2, 42, 1);
        if (cp.on) R.light(cp.x + 20, cp.y - 106, 70, 'rgba(255,215,106,0.8)', 0.3);
      }
      // 기록 조각
      for (const rec of L.records) {
        if (rec.got) continue;
        const y = rec.y + Math.sin(rec.t * 2.4) * 8;
        R.light(rec.x, y, 90, 'rgba(255,220,140,0.9)', 0.4);
        const ry = Math.round((rec.y + Math.round(Math.sin(rec.t * 2.4) * 3) * MG.Pixel.PX) / MG.Pixel.PX) * MG.Pixel.PX;
        MG.Pixel.draw(ctx, MG.Pixel.recordSprite(), rec.x, ry, 7, 9, 1);
        ctx.fillStyle = '#7a5a1e'; ctx.font = '800 13px ' + R.FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(rec.def.year || '記', MG.Pixel.snap(rec.x), ry - 4);
      }
      // 출구 포털
      const ex = L.exit;
      if (ex) {
        const open = (!this.arena || this.run.bossDone) && !(this.tut && !this.tut.finished);
        const r = open ? 70 + Math.sin(this.t * 3) * 6 : 40;
        // 도트 포털: 회전하는 점선 타원 고리
        const P = MG.Pixel.PX, cx0 = ex.x, cy0 = ex.y - 110, step = Math.floor(this.t * 10);
        for (let i = 0; i < 6; i++) {
          const rx = r - i * 8, ry2 = r * 1.4 - i * 10, n = Math.max(10, Math.round(rx * 0.55));
          ctx.fillStyle = open ? (i % 2 ? '#ffe39a' : '#fff6d8') : '#8a8a8a';
          ctx.globalAlpha = open ? 0.45 + i * 0.09 : 0.35;
          for (let k = 0; k < n; k++) {
            if ((k + step * (i % 2 ? 1 : -1)) % 4 === 0) continue;
            const a = k / n * Math.PI * 2;
            ctx.fillRect(MG.Pixel.snap(cx0 + Math.cos(a) * rx) - P, MG.Pixel.snap(cy0 + Math.sin(a) * ry2) - P, P * 2, P * 2);
          }
        }
        ctx.globalAlpha = 1;
        if (open) { R.light(ex.x, ex.y - 110, 220, 'rgba(255,220,140,0.9)', 0.5); R.text('기록 복구', ex.x, ex.y - 230, 18, '#ffe39a'); }
      }
      if (this.tut) this.tut.draw(R);
      for (const n of this.npcs) n.draw(R, this.player);
      this.combat.draw(R);
      if (this.boss) this.boss.draw(R);
      this.player.draw(R, this.phys);
      MG.Minjun.draw(this, R);
      this.companion.draw(R);
      R.particles.draw(ctx, R.view);
      // 상호작용 표시
      if (this._it) {
        const o = this._it.o; const x = o.x != null ? o.x + (o.door ? 30 : 0) : this.player.cx;
        R.text('▼ ' + this._it.label, x, (this._it.kind === 'npc' ? o.y - 160 : L.GY - 330) + Math.sin(this.t * 5) * 4, 18, '#fff');
      }
      R.speedLines(this.player.state === 'dash' ? 1 : 0, this.player.facing);
    }
    _deco(R, d) {
      const ctx = R.ctx;
      if (!R.visible(d.x - 80, d.y - 300, 160, 300)) return;
      const th = this.stage.theme;
      if (d.type === 'sign') {
        // 도트 나무 간판
        const P = MG.Pixel.PX, sx = MG.Pixel.snap(d.x);
        ctx.fillStyle = '#4a3a2a'; ctx.fillRect(sx - P, d.y - 120, P * 2, 120); ctx.fillStyle = '#6a5640'; ctx.fillRect(sx - P, d.y - 120, P, 120);
        ctx.fillStyle = '#2a1f16'; ctx.fillRect(sx - 93, d.y - 162, 186, 54);
        ctx.fillStyle = '#e9dcbc'; ctx.fillRect(sx - 90, d.y - 159, 180, 48);
        ctx.fillStyle = '#fff6e0'; ctx.fillRect(sx - 90, d.y - 159, 180, P);
        ctx.fillStyle = '#c9b88e'; ctx.fillRect(sx - 90, d.y - 114, 180, P);
        R.text(d.text, d.x, d.y - 135, 18, '#3a2a1a');
      } else if (d.type === 'lamp' || d.type === 'lantern') {
        MG.Pixel.draw(ctx, MG.Pixel.lampSprite(d.type === 'lantern'), d.x, d.y, 6, 58, 1);
        R.light(d.x, d.y - 160, 160, d.type === 'lantern' ? 'rgba(255,240,200,0.8)' : 'rgba(255,200,120,0.9)', 0.35);
      } else if (d.type === 'post') {
        const P = MG.Pixel.PX, sx = MG.Pixel.snap(d.x); ctx.fillStyle = th.ground.side || '#333'; ctx.fillRect(sx, d.y - 72, P * 3, 72); ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(sx, d.y - 72, P, 72); ctx.fillRect(sx - P, d.y - 75, P * 5, P);
      } else if (d.type === 'crate') {
        R.block(d.x, d.y - 40, 46, 40, { top: '#a58a5e', front: '#7d6440', frontDark: '#5a4630' });
      } else if (d.type === 'pillar') {
        const P = MG.Pixel.PX, sx = MG.Pixel.snap(d.x - 20); ctx.globalAlpha = 0.5; ctx.fillStyle = th.ground.side || '#333'; ctx.fillRect(sx, d.y - 420, 42, 420); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(sx + P, d.y - 420, P, 420); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(sx + 42 - P * 2, d.y - 420, P * 2, 420); ctx.globalAlpha = 1;
      }
    }
  }

  MG.StageScene = StageScene;
  MG.gradeOf = gradeOf;
})();

</script>
<script>/* js/worlds/HellWorld.js */
/* HellWorld — 지옥: 안예닮의 공통수학2 시험 전투, 실패 시 빡지 감옥(시험 범위 따라 적기) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  /* 보스 경기장 공통 (지옥·천국) */
  function buildArena(scene, opts) {
    const GY = 600, W = opts.width || 2000;
    scene.phys = new MG.PhysicsWorld();
    scene.combat = new MG.Combat(scene);
    scene.ground = scene.phys.add({ x: -200, y: GY, w: W + 400, h: 600 });
    scene.phys.add({ x: -60, y: GY - 1400, w: 60, h: 2000 });
    scene.phys.add({ x: W, y: GY - 1400, w: 60, h: 2000 });
    scene.plats = (opts.plats || [[360, GY - 200, 220], [W - 580, GY - 200, 220], [W / 2 - 110, GY - 330, 220]]).map((p) => scene.phys.add({ x: p[0], y: p[1], w: p[2], h: 26, oneway: true }));
    scene.arena = { x0: 0, x1: W, groundY: GY };
    scene.player = new MG.Player(200, GY - 100);
    // 동료 먹물은 지옥·천국에서도 함께 싸운다 (원거리·보호막은 이승에서 해금한 상태 그대로)
    scene.ink = { x: 140, y: GY - 160, t: 0, mood: 'normal' };
    scene.companion = new MG.Companion(scene);
    MG.R.cam.snap(W / 2, GY - 260);
    MG.R.cam.bounds = { x0: -40, x1: W + 40 };
  }
  function arenaRender(scene, R) {
    const th = scene.theme;
    R.drawBackground();
    R.beginWorld();
    R.block(scene.ground.x, scene.ground.y, scene.ground.w, scene.ground.h, th.ground);
    scene.plats.forEach((p) => R.block(p.x, p.y, p.w, p.h, th.platform || th.ground));
  }
  function arenaCamera(scene, dt) {
    const p = scene.player, b = scene.boss, cam = MG.R.cam;
    if (b && b.state !== 'dead') { cam.tx = (p.cx * 0.6 + b.cx * 0.4); cam.ty = Math.min(p.cy - 80, scene.arena.groundY - 300); cam.tzoom = 0.8; }
    else { cam.tx = p.cx; cam.ty = scene.arena.groundY - 280; cam.tzoom = 0.9; }
  }

  const HELL_THEME = {
    id: 'hell', sky: ['#120206', '#3b080c'], orb: { x: 0.5, y: 0.18, r: 70, color: '#ff3355', glow: 'rgba(255,40,70,0.3)' },
    layers: [
      { type: 'hellspires', color: '#2a0609', accent: 'rgba(255,60,90,0.35)', factor: 0.15, base: 600 },
      { type: 'hellspires', color: '#1a0305', accent: 'rgba(255,60,90,0.25)', factor: 0.35, base: 650 },
      { type: 'mountains', color: '#0e0203', factor: 0.55, base: 700 }
    ],
    ground: { top: '#5a1a1f', front: '#2c0a0d', frontDark: '#120305', side: '#1e0608', edge: 'rgba(255,90,110,0.5)' },
    platform: { top: '#7a2a30', front: '#3a0e12', frontDark: '#1a0507', edge: 'rgba(255,90,110,0.6)' },
    fog: 'rgba(80,0,10,0.5)', tint: 'rgba(120,0,20,0.08)', particles: 'ember', music: 'hell'
  };

  class HellScene {
    constructor() { this.name = 'hell'; }
    enter(opts) {
      MG.State.setWorld('hell');
      MG.State.restoreHell();
      const d = MG.State.d;
      d.location = 'hell'; d.hell.pending = false;
      this.theme = HELL_THEME;
      MG.R.setTheme(this.theme);
      buildArena(this, { width: 2000 });
      this.subs = [];
      this.leaving = false; this.t = 0; this.level = Math.min(3, d.hell.visits);
      d.hell.visits++;
      MG.State.markDirty(true);
      MG.Audio.music('hell');
      MG.UI.hud.show('지옥 — 안예닮의 시험', false, 'hell');
      MG.UI.hud.mission('안예닮의 수학 문제를 맞혀 방어막을 깨고 공격하라');
      MG.Input.setTouchVisible(true);
      MG.R.fadeA = 1; MG.R.fade(0, 1);
      this.subs.push(MG.bus.on('player:hpDepleted', () => this._hpOut()));
      this.subs.push(MG.bus.on('world:livesDepleted', () => this._fail()));
      const cfg = {
        name: '안예닮', title: '지옥의 지배자 · 함수의 심판관', hp: 100, correctNeeded: 4 + Math.min(2, this.level), cycle: 2, tier: Math.min(2, this.level),
        patterns: ['graph', 'barrage', 'rain', 'laser', 'orbit', 'aimed', 'graph'],
        look: { type: 'yedam', w: 180, h: 300, color: '#2a0f17', proj: '#ff3355', glow: 'rgba(255,50,90,0.6)', shapes: ['tri', 'square', 'glyph'], glyphs: ['f', 'g', '∘', '√', 'x', '⁻¹', 'π'], beam: '#ff3355', wave: 'rgba(255,90,120,0.9)' },
        phases: [{ at: 0.6, line: '정의역 밖으로 도망쳐 봤자 소용없어.' }, { at: 0.3, line: '…일대일대응이 아니면 역함수도 없지. 너처럼.' }]
      };
      this.boss = new MG.Boss(this, cfg);
      this.boss.x = 1400; this.boss.tx = 1400;
      this.bossLine = (l) => MG.Dialog.bark(l, 'boss', 3);
      this.boss.onQuestion = async () => {
        if (this.leaving) return;
        const q = MG.MathData.generate(this.level + Math.floor(this.boss.correct / 2));
        const inst = U.uid('mq');
        const r = await MG.Q.ask(q, { label: '안예닮의 시험 — 공통수학 2', resultNote: (c) => (c ? '방어막 붕괴 — 공격하라!' : '영혼 불꽃 1개 소멸') });
        if (this.leaving) return;
        if (!r.correct) MG.State.loseLife('quiz', 'hellq#' + inst);
        if (this.leaving) return;
        this.boss.answer(r.correct);
      };
      this.boss.onDefeat = () => this._escape();
      const first = d.hell.visits === 1;
      setTimeout(async () => {
        if (first) { await MG.Story.play('hellIntro', { music: 'hell' }); MG.Audio.music('hell'); }
        else await MG.Dialog.talk(MG.Data.story.yedamTaunts[Math.floor(Math.random() * MG.Data.story.yedamTaunts.length)].map((l) => Object.assign({ name: '안예닮' }, l)));
        this._begin();
      }, 700);
    }
    _begin() {
      if (this._begun) return;
      this._begun = true;
      MG.UI.hud.boss(this.boss);
      MG.UI.bossCard('안예닮', '지옥의 지배자 · 함수의 심판관');
      MG.Audio.sfx('boss');
      setTimeout(() => this.boss.start(), 1200);
    }
    exit() {
      this.subs.forEach((f) => f());
      MG.UI.hud.hide(); MG.UI.hud.boss(null);
      MG.Input.setTouchVisible(false); MG.Input.setInteract(null);
    }
    _hpOut() {
      if (this.leaving) return;
      this.player.setSpecial('defeat', 1);
      setTimeout(() => {
        if (this.leaving || MG.State.lives <= 0) return;
        const p = this.player; p.x = 200; p.y = this.arena.groundY - 100; p.vx = p.vy = 0; p.clearSpecial();
        this.combat.proj.length = 0; this.boss.waves.length = 0; this.boss.beams.length = 0;
        MG.State.respawn();
      }, 1000);
    }
    _fail() {
      if (this.leaving) return;
      this.leaving = true;
      const d = MG.State.d;
      d.hell.bbakji.active = true; d.hell.bbakji.startedAt = d.hell.bbakji.startedAt || Date.now();
      d.location = 'bbakji';
      MG.State.markDirty(true);
      this.player.setSpecial('defeat', 99);
      MG.Audio.sfx('defeat');
      setTimeout(async () => {
        await MG.Story.play('bbakjiIntro', { music: 'hell' });
        MG.Game.goBbakji();
      }, 1400);
    }
    async _escape() {
      if (this.leaving) return;
      this.leaving = true;
      const d = MG.State.d;
      d.hell.escapes++;
      MG.State.unlock('skin', 'ember'); MG.State.unlock('trail', 'ember'); MG.State.unlock('title', '지옥에서 돌아온 자');
      MG.State.markDirty(true);
      await MG.Dialog.talk(MG.Data.story.yedamDefeat.map((l) => Object.assign({ name: '안예닮' }, l)));
      await MG.Story.play('hellEscape', { music: 'title' });
      MG.Game.returnFromHell();
    }
    update(dt) {
      this.t += dt;
      const p = this.player;
      this.phys.updateMovers(dt);
      p.update(dt, this.phys);
      if (p.y > 1000) { p.x = 200; p.y = 400; MG.State.damage(20, 'pit'); }
      this.combat.update(dt);
      if (this.companion) this.companion.update(dt);
      if (this.boss && this._begun) this.boss.update(dt);
      arenaCamera(this, dt);
      if (MG.Settings.get('bgEffects') && Math.random() < dt * 18) {
        const v = MG.R.view;
        MG.R.particles.spawn({ x: U.lerp(v.x0, v.x1, Math.random()), y: v.y1, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 60, life: 3, size: 2.5, size2: 0, color: '#ff7a4d', glow: true, drag: 0 });
      }
    }
    render(R) {
      arenaRender(this, R);
      const ctx = R.ctx;
      // 바닥의 좌표축
      ctx.strokeStyle = 'rgba(255,80,110,0.25)'; ctx.lineWidth = 2;
      for (let x = 0; x <= 2000; x += 100) { ctx.beginPath(); ctx.moveTo(x, 600); ctx.lineTo(x, 586); ctx.stroke(); }
      R.text('x', 1980, 570, 22, 'rgba(255,120,140,0.6)');
      this.combat.draw(R);
      if (this.boss) this.boss.draw(R);
      this.player.draw(R, this.phys);
      if (this.companion) this.companion.draw(R);
      R.particles.draw(ctx, R.view);
      R.speedLines(this.player.state === 'dash' ? 1 : 0, this.player.facing);
    }
  }

  /* ── 빡지 감옥: 시험 범위 전체를 따라 적기 ── */
  class BbakjiScene {
    constructor() { this.name = 'bbakji'; }
    enter() {
      MG.State.setWorld('none');
      const d = MG.State.d;
      d.location = 'bbakji'; d.hell.bbakji.active = true;
      MG.State.markDirty(true);
      MG.R.setTheme(Object.assign({}, HELL_THEME, { id: 'bbakji', layers: [{ type: 'pillars', color: '#1a0306', factor: 0.1, base: 720 }] }));
      MG.Audio.music('hell');
      this.t = 0;
      this.chunks = MG.Data.bbakji.chunks;
      this.total = this.chunks.reduce((a, c) => a + U.normalizeCopy(c.text).length, 0);
      this._ui();
    }
    exit() { if (this.root) this.root.remove(); }
    _ui() {
      const d = MG.State.d.hell.bbakji;
      const root = this.root = U.el('div', { class: 'bbakji' });
      const head = U.el('div', { class: 'bb-head' },
        U.el('div', { class: 'bb-title' }, '빡지 감옥'),
        U.el('div', { class: 'bb-sub' }, '안예닮: “시험 범위를 처음부터 끝까지 따라 적어. 다 적기 전엔 못 나가.”'));
      const prog = U.el('div', { class: 'bb-prog' }, U.el('div', { class: 'bar' }, U.el('i')), U.el('span', { class: 'pct' }));
      const meta = U.el('div', { class: 'bb-meta' });
      const src = U.el('div', { class: 'bb-src', 'aria-label': '따라 적을 원문' });
      const ta = U.el('textarea', { class: 'bb-input', rows: 4, placeholder: '위 문장을 그대로 따라 적으세요 (띄어쓰기·따옴표 차이는 허용)', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false' });
      const status = U.el('div', { class: 'bb-status' });
      const btns = U.el('div', { class: 'bb-btns' },
        U.el('button', { class: 'btn ghost', onclick: () => { MG.Save.manualSave(); MG.UI.toast('빡지 진행 상황을 저장했습니다', 'ok'); } }, '저장'),
        U.el('button', { class: 'btn ghost', onclick: () => { MG.Save.manualSave(); MG.Game.toTitle(); } }, '저장하고 쉬기'));
      root.append(head, prog, meta, src, ta, status, btns);
      document.getElementById('ui-root').appendChild(root);
      ta.addEventListener('paste', (e) => { e.preventDefault(); MG.UI.toast('직접 따라 적어야 합니다', 'warn'); });
      ta.addEventListener('drop', (e) => e.preventDefault());
      src.addEventListener('copy', (e) => e.preventDefault());
      let saveT = null;
      const render = () => {
        const ci = d.chunk;
        if (ci >= this.chunks.length) return this._done();
        const c = this.chunks[ci];
        const target = U.normalizeCopy(c.text);
        const typed = U.normalizeCopy(ta.value);
        let k = 0; while (k < typed.length && k < target.length && typed[k] === target[k]) k++;
        // 원문 글자별 색 표시 (공백 등 무시 문자를 건너뛰며 매핑)
        src.innerHTML = '';
        let ni = 0;
        for (const ch of c.text) {
          const n = U.normalizeCopy(ch);
          let cls = 'todo';
          if (n.length) { cls = ni < k ? 'ok' : (ni === k && typed.length > k ? 'bad' : (ni === k ? 'cur' : 'todo')); ni++; }
          else cls = ni <= k ? 'ok soft' : 'todo';
          src.appendChild(U.el('span', { class: cls }, ch));
        }
        const doneBefore = this.chunks.slice(0, ci).reduce((a, x) => a + U.normalizeCopy(x.text).length, 0);
        const pct = (doneBefore + k) / this.total;
        prog.querySelector('i').style.width = (pct * 100).toFixed(2) + '%';
        prog.querySelector('.pct').textContent = (pct * 100).toFixed(1) + '%  ·  ' + (doneBefore + k) + ' / ' + this.total + '자';
        meta.textContent = (ci + 1) + ' / ' + this.chunks.length + ' 구절  ·  교과서 p.' + c.page + '  ·  ' + c.topic;
        status.textContent = typed.length > k ? '틀린 글자가 있습니다 — 빨간 글자부터 다시 확인하세요' : (k === target.length ? '' : '이어서 입력하세요');
        status.className = 'bb-status' + (typed.length > k ? ' bad' : '');
        if (typed === target) {
          // 구절 완료 (정확히 일치할 때만)
          d.chunk++; d.completed = Math.max(d.completed, d.chunk); d.typed = '';
          ta.value = '';
          MG.Audio.sfx('correct');
          MG.State.markDirty(true);
          setTimeout(render, 30);
          return;
        }
        d.typed = ta.value;
        clearTimeout(saveT); saveT = setTimeout(() => MG.State.markDirty(), 600);
      };
      ta.value = d.typed || '';
      ta.addEventListener('input', () => { MG.Audio.sfx('type'); render(); });
      render();
      setTimeout(() => ta.focus(), 300);
    }
    _done() {
      if (this._finished) return;
      this._finished = true;
      const d = MG.State.d;
      d.hell.bbakji = { active: false, chunk: 0, typed: '', completed: 0, startedAt: 0 };
      MG.State.unlock('title', '빡지 완주자');
      MG.State.markDirty(true);
      MG.UI.toast('빡지 완료! 지옥의 문이 열린다', 'ok');
      setTimeout(async () => {
        this.root.remove();
        await MG.Dialog.talk(MG.Data.story.bbakjiDone.map((l) => Object.assign({ name: '안예닮' }, l)));
        MG.Game.returnFromHell();
      }, 600);
    }
    update(dt) { this.t += dt; }
    render(R) {
      R.drawBackground();
      const ctx = R.ctx; ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.strokeStyle = 'rgba(30,5,8,0.9)'; ctx.lineWidth = 14 * R.dpr;
      for (let x = 0; x < R.W; x += 90 * R.dpr) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, R.H); ctx.stroke(); }
    }
  }

  MG.HellScene = HellScene;
  MG.BbakjiScene = BbakjiScene;
  MG.Arena = { build: buildArena, render: arenaRender, camera: arenaCamera };
})();

</script>
<script>/* js/worlds/HeavenWorld.js */
/* HeavenWorld — 천국: 김대영의 다섯 단계 승급 시험. 5단계에는 '연표 붕괴' 특수 전투(연도 기둥을 시간순으로 타격) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const TL_CX = 1050, TL_ZOOM = 0.66; // 연표 붕괴 전투의 카메라 중심·확대율

  const THEME = (tier) => ({
    id: 'heaven' + tier, sky: tier >= 4 ? ['#2a1a40', '#f0b960'] : ['#fff6dc', '#e2b968'],
    orb: { x: 0.5, y: 0.16, r: 60 + tier * 8, color: '#fffbe8', glow: 'rgba(255,240,190,0.5)' },
    layers: [
      { type: 'clouds', color: 'rgba(255,255,255,0.8)', factor: 0.05, base: 400 },
      { type: 'pillars', color: tier >= 4 ? '#c99a52' : '#ecd8a4', factor: 0.2, base: 620 },
      { type: 'clouds', color: 'rgba(255,250,235,0.9)', factor: 0.45, base: 760 }
    ],
    ground: { top: '#fff4cf', front: '#e2c27a', frontDark: '#a8833b', side: '#c9a452', edge: '#fffbe8', pattern: 'stripe' },
    platform: { top: '#fffbe8', front: '#ecd39a', frontDark: '#b8913e', edge: '#fff' },
    fog: 'rgba(255,240,200,0.35)', particles: 'light', music: 'judge'
  });

  class HeavenScene {
    constructor() { this.name = 'heaven'; }
    enter(opts) {
      const d = MG.State.d;
      this.tierIdx = U.clamp(opts.tier != null ? opts.tier : d.heaven.tier, 0, 4);
      this.tier = MG.Data.heaven.tiers[this.tierIdx];
      MG.State.setWorld('heaven');
      MG.State.restoreHeaven();
      d.location = 'heaven'; d.heaven.inTier = true;
      MG.State.markDirty(true);
      this.theme = THEME(this.tierIdx);
      MG.R.setTheme(this.theme);
      MG.Arena.build(this, { width: 2100, plats: [[300, 400, 240], [1560, 400, 240], [930, 270, 240]] });
      this.subs = []; this.leaving = false; this.t = 0; this.used = []; this.pillars = null; this.specialDone = false;
      MG.Audio.music('judge');
      MG.UI.hud.show('천국 — ' + (this.tierIdx + 1) + '단계 승급: ' + this.tier.title, false, 'heaven');
      MG.UI.hud.mission(this.tier.goal);
      MG.Input.setTouchVisible(true);
      MG.R.fadeA = 1; MG.R.fade(0, 0.9, '#fff');
      this.subs.push(MG.bus.on('player:hpDepleted', () => this._hpOut()));
      this.subs.push(MG.bus.on('world:livesDepleted', () => this._fail()));
      const patterns = [['aimed', 'pillars', 'barrage'], ['aimed', 'pillars', 'laser', 'rain'], ['pillars', 'barrage', 'laser', 'slam', 'summon'], ['pillars', 'orbit', 'laser', 'slam', 'rain', 'charge'], ['pillars', 'orbit', 'laser', 'slam', 'rain', 'charge', 'barrage']][this.tierIdx];
      const cfg = {
        name: '김대영', title: '천국의 지배자 · ' + this.tier.title + ' 심판', hp: 100, correctNeeded: this.tier.need, cycle: this.tierIdx >= 3 ? 3 : 2, tier: this.tierIdx,
        patterns, specialPatterns: ['pillars', 'rain', 'aimed'], look: { type: 'daeyoung', w: 220, h: 320, color: '#c99a2e', proj: '#e0a82e', glow: 'rgba(255,215,120,0.7)', shapes: ['orb', 'glyph'], glyphs: ['史', '記', '年', '?'], beam: '#ffcf4d', wave: 'rgba(255,230,160,0.95)' },
        phases: this.tier.phases || []
      };
      this.boss = new MG.Boss(this, cfg);
      this.boss.x = 1500; this.boss.tx = 1500;
      this.bossLine = (l) => MG.Dialog.bark(l, 'boss', 3);
      this.boss.onQuestion = () => this._question();
      this.boss.onDefeat = () => this._tierClear();
      setTimeout(async () => {
        await MG.Story.play('tier' + (this.tierIdx + 1), { music: 'heaven' });
        MG.Audio.music('judge');
        MG.UI.hud.boss(this.boss);
        MG.UI.bossCard('김대영', this.tier.title + ' 승급 심판');
        MG.Audio.sfx('boss');
        setTimeout(() => { if (!this.leaving) { this._begun = true; this.boss.start(); } }, 1200);
      }, 600);
    }
    exit() {
      this.subs.forEach((f) => f());
      MG.UI.hud.hide(); MG.UI.hud.boss(null);
      MG.Input.setTouchVisible(false);
    }
    async _question() {
      if (this.leaving) return;
      const q = MG.Bank.pick('heaven', { pool: this.tier.questions, used: this.used });
      this.used.push(q.id);
      const inst = U.uid('hq');
      const r = await MG.Q.ask(q, { label: '김대영의 ' + (this.tierIdx + 1) + '단계 심판', stage: 'heaven', minRead: 1.5, resultNote: (c) => (c ? '심판의 방어막이 깨졌다!' : '자격의 촛불 하나가 꺼진다') });
      if (this.leaving) return;
      if (!r.correct) MG.State.loseLife('quiz', 'heavenq#' + inst);
      if (this.leaving) return;
      this.boss.answer(r.correct);
    }
    /* 5단계 특수 전투: 연표 붕괴 */
    _startTimeline() {
      this.specialDone = true;
      const tl = U.shuffle(MG.Data.timeline.filter((e) => e.final)).slice(0, 5);
      const years = new Set(); const pick = [];
      for (const e of tl) if (!years.has(e.year)) { years.add(e.year); pick.push(e); }
      // 서로 다른 연도 5개 확보
      for (const e of U.shuffle(MG.Data.timeline)) { if (pick.length >= 5) break; if (!years.has(e.year)) { years.add(e.year); pick.push(e); } }
      const sorted = pick.slice().sort((a, b) => a.year - b.year || a.order - b.order);
      // 기둥 5개를 '지금 화면에 실제로 보이는 범위' 안에 고르게 배치 (화면 비율과 무관하게 잘리지 않도록)
      const a = this.arena, b = this.boss;
      b.tx = a.x1 - b.w_ - 180; b.x = Math.min(b.x, b.tx + 200);
      const halfVis = MG.R.viewW / 2 / TL_ZOOM;
      const lo = Math.max(a.x0 + 120, TL_CX - halfVis + 110);
      const hi = Math.min(TL_CX + halfVis - 110, b.tx - 110);
      const pos = U.shuffle([0, 1, 2, 3, 4].map((i) => Math.round(U.lerp(lo, hi, i / 4))));
      this.pillars = pick.map((e, i) => ({ e, x: pos[i], y: 360 + (i % 2) * 80, hit: false, rank: sorted.indexOf(e), t: Math.random() * 6 }));
      this.pillarNext = 0;
      this.boss.state = 'special'; this.boss.pattern = null; this.boss._specialCd = 1.5;
      MG.R.cam.shake(18, 1);
      MG.Audio.sfx('boss');
      MG.UI.toast('연표 붕괴! 사건 기둥을 일어난 순서대로 붓으로 쳐라', 'danger');
      MG.Dialog.bark('내가 뒤섞은 연표를 바로잡아 보거라. 순서 하나라도 틀리면 처음부터다.', 'boss', 4);
    }
    _hitPillar(pl) {
      if (pl.hit) return;
      if (pl.rank === this.pillarNext) {
        pl.hit = true; this.pillarNext++;
        MG.Audio.sfx('correct');
        MG.R.particles.burst(pl.x, pl.y, 24, { color: ['#ffd76a', '#fff'], speedMin: 100, speedMax: 360, lifeMax: 0.7, glow: true });
        if (this.pillarNext >= this.pillars.length) {
          MG.UI.toast('연표 복원! 심판이 무너진다 — 공격하라', 'ok');
          this.pillars = null;
          this.boss.state = 'attack';
          this.boss.answer(true);
          this.boss.correct--; // 문제 정답 수에는 포함하지 않음
        }
      } else {
        MG.Audio.sfx('wrong');
        this.combat.hurtPlayer(20, pl.x, 'timeline');
        this.pillars.forEach((p) => (p.hit = false));
        this.pillarNext = 0;
        MG.Dialog.bark(pl.e.label + '(' + pl.e.year + ')은 그 순서가 아니다.', 'boss', 3);
      }
    }
    _hpOut() {
      if (this.leaving) return;
      this.player.setSpecial('defeat', 1);
      setTimeout(() => {
        if (this.leaving || MG.State.lives <= 0) return;
        const p = this.player; p.x = 200; p.y = 480; p.vx = p.vy = 0; p.clearSpecial();
        this.combat.proj.length = 0; this.boss.waves.length = 0; this.boss.beams.length = 0;
        MG.State.respawn();
      }, 1000);
    }
    async _fail() {
      if (this.leaving) return;
      this.leaving = true;
      this.player.setSpecial('defeat', 99);
      MG.Audio.sfx('defeat');
      MG.State.d.heaven.inTier = false;
      MG.State.markDirty(true);
      await new Promise((r) => setTimeout(r, 1200));
      await MG.Dialog.talk(MG.Data.heaven.failLines.map((l) => Object.assign({ name: '김대영' }, l)));
      const again = await MG.UI.confirm((this.tierIdx + 1) + '단계 승급 실패', '자격의 촛불이 모두 꺼졌습니다. 같은 단계에 다시 도전할까요?', '다시 도전', '지도로');
      if (again) MG.Game.startHeaven(this.tierIdx); else MG.Game.toMap();
    }
    async _tierClear() {
      if (this.leaving) return;
      this.leaving = true;
      const d = MG.State.d;
      d.heaven.tier = Math.max(d.heaven.tier, this.tierIdx + 1);
      d.heaven.best = Math.max(d.heaven.best, this.tierIdx + 1);
      d.heaven.inTier = false;
      MG.State.unlock('title', this.tier.title);
      MG.State.markDirty(true);
      this.player.setSpecial('victory', 99);
      await MG.Dialog.talk(this.tier.clearLines.map((l) => Object.assign({ name: '김대영' }, l)));
      if (this.tierIdx >= 4) { MG.Game.ending(); return; }
      await MG.UI.alert((this.tierIdx + 1) + '단계 승급 성공', '자격 「' + this.tier.title + '」을(를) 얻었습니다. 다음 심판이 기다립니다.');
      MG.Game.startHeaven(this.tierIdx + 1);
    }
    update(dt) {
      this.t += dt;
      const p = this.player;
      p.update(dt, this.phys);
      if (p.y > 1000) { p.x = 200; p.y = 400; MG.State.damage(20, 'pit'); }
      this.combat.update(dt);
      if (this.companion) this.companion.update(dt);
      if (this.boss && this._begun) {
        this.boss.update(dt);
        if (this.boss.state === 'special') {
          const hb = p.hitbox();
          if (hb && this.pillars) for (const pl of this.pillars) if (!pl.hit && hb.x < pl.x + 50 && hb.x + hb.w > pl.x - 50 && hb.y < pl.y + 90 && hb.y + hb.h > pl.y - 90 && this._lastHb !== hb.id) { this._lastHb = hb.id; this._hitPillar(pl); }
        } else {
          if (this.tierIdx === 4 && !this.specialDone && this.boss.hp <= 50 && this.boss.state === 'attack') this._startTimeline();
        }
      }
      MG.Arena.camera(this, dt);
      if (this.pillars) { MG.R.cam.tx = TL_CX; MG.R.cam.tzoom = TL_ZOOM; if (this.boss.state === 'special') this.boss.tx = this.arena.x1 - this.boss.w_ - 180; }
      if (MG.Settings.get('bgEffects') && Math.random() < dt * 14) {
        const v = MG.R.view;
        MG.R.particles.spawn({ x: U.lerp(v.x0, v.x1, Math.random()), y: v.y1, vy: -40, life: 4, size: 2, size2: 0, color: '#fff3c2', glow: true, drag: 0 });
      }
    }
    render(R) {
      MG.Arena.render(this, R);
      const ctx = R.ctx;
      if (this.pillars) {
        for (const pl of this.pillars) {
          pl.t += 0.016;
          const y = pl.y + Math.sin(pl.t * 2) * 8;
          R.light(pl.x, y, 140, pl.hit ? 'rgba(120,255,180,0.9)' : 'rgba(255,215,106,0.9)', 0.4);
          R.block(pl.x - 46, y - 80, 92, 160, pl.hit ? { top: '#c8f7da', front: '#7fd6a2', frontDark: '#3c9a64' } : { top: '#fff4cf', front: '#e2c27a', frontDark: '#a8833b' });
          R.text(pl.e.label, pl.x, y - 20, 17, '#3a2a10');
          R.text(pl.hit ? pl.e.year + '' : '????', pl.x, y + 24, 22, pl.hit ? '#1f5a3a' : '#7a5a1e');
        }
      }
      this.combat.draw(R);
      if (this.boss) this.boss.draw(R);
      this.player.draw(R, this.phys);
      if (this.companion) this.companion.draw(R);
      R.particles.draw(ctx, R.view);
      R.speedLines(this.player.state === 'dash' ? 1 : 0, this.player.facing);
    }
  }
  MG.HeavenScene = HeavenScene;
})();

</script>
<script>/* js/worlds/MetaScenes.js */
/* MetaScenes — 타이틀, 역사 스테이지 지도, 복습(오답 재도전) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const el = U.el;

  const ARCHIVE_THEME = {
    id: 'archive', sky: ['#070a18', '#1d1530'], stars: true, orb: { x: 0.8, y: 0.2, r: 40, color: '#fff2cc', glow: 'rgba(255,230,170,0.25)' },
    layers: [
      { type: 'shelves', color: '#10142a', accent: 'rgba(255,215,140,0.18)', factor: 0.1, base: 680 },
      { type: 'shelves', color: '#0b0e1e', accent: 'rgba(255,215,140,0.28)', factor: 0.25, base: 760 }
    ],
    ground: { top: '#2a2540', front: '#151226', frontDark: '#0a0814' }, fog: 'rgba(10,8,20,0.6)'
  };

  function pagesBg(scene, R, dt) {
    R.drawBackground();
    const ctx = R.ctx; R.beginWorld();
    scene.pages = scene.pages || Array.from({ length: 26 }, (_, i) => ({ x: Math.random() * 2200 - 1100, y: Math.random() * 900 - 200, r: Math.random() * 6, s: 0.4 + Math.random() * 0.8, v: 10 + Math.random() * 30, yr: [1920, 1922, 1923, 1925, 1926, 1927, 1929, 1931, 1932, 1935, 1937, 1938, 1940, 1941, 1942, 1944][i % 16] }));
    for (const p of scene.pages) {
      p.y -= p.v * dt; p.r += dt * 0.3; if (p.y < -500) { p.y = 900; p.x = Math.random() * 2200 - 1100; }
      // 도트 종이 조각 (작은 것은 1배, 큰 것은 2배 도트) — 흔들림은 1px 단위로 끊어서
      const PXL = MG.Pixel, sz = p.s > 0.8 ? 2 : 1, px = PXL.PX * sz;
      const x = p.x + MG.R.cam.x + Math.round(Math.sin(p.r) * 3) * px;
      ctx.globalAlpha = 0.6;
      PXL.draw(ctx, PXL.recordSprite(), x, p.y, 7, 9, 1, px);
      ctx.fillStyle = '#6a4a1a'; ctx.font = '800 ' + (sz === 2 ? 20 : 12) + 'px ' + R.FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(String(p.yr), PXL.snap(x, px), PXL.snap(p.y, px) - px * 3);
    }
    ctx.globalAlpha = 1;
    R.particles.draw(ctx, R.view);
  }

  /* ── 타이틀 ── */
  class TitleScene {
    constructor() { this.name = 'title'; }
    enter() {
      MG.State.setWorld('none');
      MG.R.setTheme(ARCHIVE_THEME);
      MG.R.cam.snap(0, 300);
      MG.Audio.music('title');
      this.t = 0;
      const has = MG.Save.hasSave();
      const latest = has ? MG.Save.latest() : null;
      const ui = this.ui = el('div', { class: 'title-ui' });
      ui.append(
        el('div', { class: 'logo' }, el('div', { class: 'logo-sub' }, 'PROJECT · 2.5D CINEMATIC HISTORY ACTION'), el('h1', {}, '망각의 연대기'), el('div', { class: 'logo-tag' }, '미대에 떨어진 주인공이 한국사에 눈을 뜨게 되는데…')),
        el('div', { class: 'title-btns' },
          has ? el('button', { class: 'btn primary big', onclick: () => { MG.Audio.sfx('confirm'); MG.Game.continueGame(); } }, '이어하기', el('small', {}, latest.data.nickname + ' · ' + MG.Game.whereLabel(latest.data))) : null,
          el('button', { class: 'btn big' + (has ? '' : ' primary'), onclick: () => { MG.Audio.sfx('confirm'); MG.Game.newGame(); } }, '새로 시작'),
          el('div', { class: 'row' },
            el('button', { class: 'btn', onclick: () => MG.UI.settings() }, '설정'),
            el('button', { class: 'btn', onclick: () => { const m = MG.UI.modal(el('div', { class: 'pane' }, ...MG.UI._savePane()), { title: '저장 데이터', closeable: true }); } }, '저장 데이터'))),
        el('div', { class: 'title-foot' }, '교과서 시험 범위 18장 기반 · 이승 11개 역사 스테이지 · 지옥 · 천국 5단계 승급 · 첫 터치 후 소리가 켜집니다'));
      document.getElementById('ui-root').appendChild(ui);
      requestAnimationFrame(() => ui.classList.add('show'));
    }
    exit() { if (this.ui) this.ui.remove(); }
    update(dt) { this.t += dt; MG.R.cam.tx = Math.sin(this.t * 0.1) * 200; MG.R.cam.ty = 300; }
    render(R, dt) { pagesBg(this, R, dt); }
  }

  /* ── 역사 스테이지 지도 ── */
  class MapScene {
