<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<title>망각의 연대기 II : 존재의 부정</title>
<style>
/* VOICE: 재수생의 두 번째 모험 — 진지한 역사와 블랙코미디 메타픽션이 한 화면에.
   IDEA: 먹물이 번진 교과서 페이지가 게임 세계가 된다. UI는 밑줄·여백 필기의 언어를 쓴다.
   PICTURE: 2.5D 도트 세계 그 자체(캔버스)가 첫 화면의 그림.
   COLOUR and TYPE: 먹색 #0c0b10 바탕, 한지 #f3ecdb, 교사 밑줄 파랑 #4b6bff·빨강 #ff4d5e, 김대영 금색 #ffd76a. Black Han Sans 제목 + Noto Sans KR 본문.
   LAYOUT: 가로 화면 기준, 안전 영역 패딩, 버튼 44px 이상, 세로 화면은 아래 안내만. */
:root{--ink:#07080f;--paper:#f3ecdb;--txt:#f5f3ee;--sub:rgba(245,243,238,.62);--line:rgba(255,255,255,.12);
--blue:#6c8cff;--red:#ff5a6e;--gold:#ffd76a;--ok:#41d1a5;--bad:#ff5a6e;--violet:#b9a6ff;
--glass:rgba(18,19,28,.62);--glass-solid:rgba(18,19,28,.94);--r:18px;--fs:calc(clamp(13px,1.05vw + 8px,19px)*var(--ui,1));
--spring:cubic-bezier(.2,1.3,.35,1);--ease:cubic-bezier(.2,.8,.2,1);
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;--title:var(--font);
--btn:1;--btnop:.55;--fit:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--font);font-size:var(--fs);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font:inherit;color:inherit}
.hide{display:none!important}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);padding:.7em 1.15em;border-radius:12px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:transform .15s,background .15s}
.btn:active{transform:scale(.96)}.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.pri{background:var(--paper);color:#14121a;border-color:transparent}
.btn.gold{background:linear-gradient(180deg,#ffe8a0,#d6a53a);color:#2a1d05;border-color:transparent}
.btn.dng{background:rgba(255,77,94,.16);border-color:rgba(255,77,94,.45);color:#ffc0c7}
.btn.sm{padding:.4em .85em;min-height:38px;font-size:.88em}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn small{display:block;font-weight:500;opacity:.6;font-size:.74em}
.chip{display:inline-flex;align-items:center;padding:.18em .6em;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:.74em;font-weight:700;color:var(--sub);white-space:nowrap}
.chip.S{background:rgba(255,77,94,.2);color:#ffc2ca;border-color:rgba(255,77,94,.45)}.chip.A{background:rgba(75,107,255,.2);color:#c9d3ff;border-color:rgba(75,107,255,.45)}
.chip.g{color:var(--gold);border-color:rgba(255,215,106,.45)}
/* 화면 공통 패널 */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) calc(16px + var(--safe-l));background:rgba(8,8,12,.82);overflow:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text;z-index:30;background:rgba(9,9,13,.97)}
.screen h2{font-family:var(--title);font-weight:400;font-size:1.7em;margin:.1em 0 .5em;letter-spacing:.02em}
.screen .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.screen .top h2{margin:0;flex:1}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.muted{color:var(--sub)}.small{font-size:.82em}.tiny{font-size:.72em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* 타이틀 */
#title{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(280px,400px);align-items:center;gap:24px;padding:calc(20px + var(--safe-t)) calc(28px + var(--safe-r)) calc(20px + var(--safe-b)) calc(28px + var(--safe-l));background:linear-gradient(90deg,rgba(8,7,12,.15),rgba(8,7,12,.78) 62%);z-index:20}
.logo .k{font-size:.8em;letter-spacing:.35em;color:var(--sub)}
.logo h1{font-family:var(--title);font-weight:400;font-size:clamp(40px,6.4vw,96px);line-height:1.02;margin:.08em 0;color:var(--paper);text-shadow:0 6px 40px rgba(0,0,0,.7)}
.logo h1 em{font-style:normal;color:var(--red);display:block;font-size:.56em;letter-spacing:.02em}
.logo .en{font-size:.82em;color:var(--sub);letter-spacing:.08em}
.logo .catch{margin-top:14px;font-size:1.12em;color:var(--paper);border-bottom:3px solid var(--blue);display:inline-block;padding-bottom:3px}
.logo .glitch{color:var(--red);font-size:.78em;margin-top:8px;min-height:1.2em;font-family:ui-monospace,monospace}
.menu{display:grid;gap:8px}
.menu .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfoot{grid-column:1/-1;font-size:.7em;color:var(--sub);text-align:center}
@media (max-width:760px){#title{grid-template-columns:1fr;align-content:center;overflow:auto;touch-action:pan-y}.logo h1{font-size:clamp(34px,11vw,60px)}}
@media (max-height:520px){#title{gap:12px}.menu .btn{min-height:38px;padding:.4em .9em}.logo h1{font-size:clamp(30px,6vw,56px)}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.hpbox{position:absolute;left:calc(12px + var(--safe-l));top:calc(10px + var(--safe-t));padding:8px 12px;border-radius:14px;background:rgba(10,10,16,.66);border:1px solid var(--line);display:grid;gap:5px;min-width:calc(230px*var(--ui,1))}
.hpbox .nm{font-size:.74em;color:var(--sub);display:flex;gap:8px}
.bar{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .15s}
.bar.hp i{background:linear-gradient(90deg,#3fd6a0,#9af2cf)}.bar.hp.low i{background:linear-gradient(90deg,#ff4d5e,#ff9aa6)}
.bar.en i{background:linear-gradient(90deg,#6b4bd6,#c9b6ff)}.bar.xp{height:4px}.bar.xp i{background:var(--gold)}
.bar.res{height:8px}.bar.res i{background:linear-gradient(90deg,#7a5cff,#e0d4ff)}
.bar.res.full i{background:linear-gradient(90deg,#ffd76a,#fff3c2);box-shadow:0 0 12px #ffd76a}
.hpbox .lbl{display:grid;grid-template-columns:3.4em 1fr;gap:6px;align-items:center;font-size:.68em;color:var(--sub)}
.hpbox.warp{animation:warp 1.6s infinite}
@keyframes warp{0%,100%{transform:none}25%{transform:skewX(-8deg) scaleY(1.2)}50%{transform:skewX(10deg)}75%{transform:rotate(-2deg) scaleX(.8)}}
.mission{position:absolute;left:50%;top:calc(10px + var(--safe-t));transform:translateX(-50%);text-align:center;max-width:46vw;pointer-events:none}
.mission b{display:block;font-size:.7em;color:var(--sub);letter-spacing:.06em}
.mission span{font-size:.88em;font-weight:700;text-shadow:0 2px 8px #000}
.pausebtn{position:absolute;right:calc(12px + var(--safe-r));top:calc(10px + var(--safe-t));width:50px;height:50px;border-radius:50%;background:rgba(10,10,16,.66);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.pausebtn i{display:block;width:4px;height:16px;background:var(--txt);border-radius:2px}
.bossbar{position:absolute;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(56vw,700px);text-align:center;pointer-events:none}
.bossbar b{font-size:.8em;letter-spacing:.05em;text-shadow:0 2px 8px #000}
.bossbar .bar{height:11px;margin-top:4px}.bossbar .bar i{background:linear-gradient(90deg,#ff4d5e,#ffb547)}
.bossbar .bar.seal{box-shadow:0 0 0 2px #a8d8ff}
.bossbar .bq{display:block;margin-top:5px;font-size:.68em;letter-spacing:.12em;color:#ffd76a;text-shadow:0 2px 8px #000;min-height:1.2em}.bossbar .bq.now{animation:bqp .5s ease-in-out infinite alternate}@keyframes bqp{from{opacity:.55}to{opacity:1}}
.bossbar .bq.open{color:#3fd6a0}
/* 1편 결과창 */
.result-modal .mc{max-width:min(720px,94vw)}
.result .rtop{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.grade{font-size:3.4em;font-weight:900;min-width:2.2em;text-align:center;animation:gradeIn .9s cubic-bezier(.2,1.6,.4,1)}
.g-SSS,.g-SS,.g-S{color:#ffd76a;text-shadow:0 0 30px rgba(255,215,106,.5)}.g-A{color:#9ad0ff}.g-B{color:#b7f5df}.g-C{color:var(--sub)}
@keyframes gradeIn{0%{transform:scale(2.4);opacity:0}100%{transform:none;opacity:1}}
.rstage{font-weight:800;font-size:1.1em}.rsub{color:var(--sub);font-size:.8em}.rscore{font-size:1.3em;font-weight:800;margin-top:4px}
.rgrid{display:grid;gap:7px}.rrow{display:grid;grid-template-columns:8em 1fr 5.5em;gap:10px;align-items:center;font-size:.82em}
.rbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.rbar i{display:block;height:100%;background:linear-gradient(90deg,#9b7bff,#c9b6ff)}
.rrow b{text-align:right;font-variant-numeric:tabular-nums}.rstats,.rnote{font-size:.76em;color:var(--sub);margin-top:10px}.rmis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.78em}
.bguide{font-size:.86em;line-height:1.55;max-height:58vh;overflow:auto}.bguide .bg-steps{margin:8px 0 10px 1.2em;padding:0}.bguide .bg-steps li{margin:3px 0}.bguide .bg-weak{padding:7px 10px;border-radius:10px;background:rgba(255,215,106,.1);border:1px solid rgba(255,215,106,.35);margin-bottom:8px}.bguide .bg-weak b{color:#ffd76a}.bguide .bg-ph{margin:6px 0}.bguide .bg-ph b{color:#c9b6ff}.bguide .bg-ph div{color:var(--sub);font-size:.95em}
.toasts{position:absolute;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:12}
.toast{padding:.5em 1em;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.84em;font-weight:700;animation:tin .25s ease-out;max-width:84vw;text-align:center}
.toast.ok{border-color:rgba(63,214,160,.5);color:#b9f5df}.toast.bad{border-color:rgba(255,77,94,.5);color:#ffc0c7}.toast.gold{border-color:rgba(255,215,106,.6);color:var(--gold)}.toast.vio{border-color:rgba(169,139,255,.6);color:#d9ccff}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.savedot{position:absolute;right:calc(70px + var(--safe-r));top:calc(26px + var(--safe-t));font-size:.68em;color:var(--sub);opacity:0;transition:opacity .3s;pointer-events:none}
.savedot.on{opacity:1}
/* 터치 조작 */
#touch{position:fixed;inset:0;pointer-events:none;z-index:11}
#touch.off{display:none}
.tc{position:absolute;pointer-events:auto;touch-action:none;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,calc(.35 + var(--btnop)*.6));background:rgba(255,255,255,calc(var(--btnop)*.16));border:2px solid rgba(255,255,255,calc(var(--btnop)*.55));-webkit-user-select:none;user-select:none}
.tc.on{background:rgba(255,255,255,calc(var(--btnop)*.5))}
.tc.stick{width:calc(150px*var(--btn)*var(--fit));height:calc(150px*var(--btn)*var(--fit))}
.tc.stick .knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,calc(var(--btnop)*.85))}
.tc.b{width:calc(70px*var(--btn)*var(--fit));height:calc(70px*var(--btn)*var(--fit));font-size:calc(13px*var(--btn)*var(--fit))}
.tc.b.big{width:calc(92px*var(--btn)*var(--fit));height:calc(92px*var(--btn)*var(--fit));font-size:calc(15px*var(--btn)*var(--fit))}
.tc.cd::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.55) var(--cd,0%),transparent 0)}
.tc.glow{box-shadow:0 0 0 3px rgba(255,215,106,.7),0 0 24px rgba(255,215,106,.5)}
@media (max-height:520px){:root{--fit:.8}.hpbox{min-width:170px;padding:5px 9px;gap:3px;border-radius:11px}.hpbox .lbl{font-size:.6em}.hpbox .nm{font-size:.66em}.bar{height:7px}.mission{max-width:40vw}.mission span{font-size:.78em}.pausebtn{width:42px;height:42px}}@media (max-height:380px){:root{--fit:.68}}
/* 대화 */
#dlg{position:fixed;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);width:min(900px,94vw);padding:14px 18px 16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);z-index:40;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
#dlg .pt{width:72px;height:72px;border-radius:12px;background:#000 center/cover;image-rendering:pixelated;border:1px solid var(--line)}
#dlg .nm{font-size:.78em;font-weight:800;margin-bottom:4px}
#dlg .tx{line-height:1.6;min-height:3.2em;white-space:pre-wrap}
#dlg .ctl{position:absolute;right:10px;top:-44px;display:flex;gap:6px}
#dlg .nx{position:absolute;right:14px;bottom:8px;font-size:.7em;color:var(--sub);animation:blink 1s infinite}
#dlg.kw{border-color:rgba(255,77,94,.6);box-shadow:0 0 30px rgba(255,40,60,.25)}#dlg.dy{border-color:rgba(255,215,106,.6);box-shadow:0 0 30px rgba(255,215,106,.25)}
#dlg.jh{border-color:rgba(93,255,154,.5);font-family:ui-monospace,var(--font)}#dlg.mj{border-color:rgba(169,139,255,.55)}#dlg.yd{border-color:rgba(255,60,90,.5)}
#dlg.sys{grid-template-columns:1fr}#dlg.sys .pt{display:none}#dlg.sys .tx{color:var(--paper);font-style:italic}
@keyframes blink{50%{opacity:.2}}
/* 문제 카드 */
#qm{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,5,9,.7);z-index:45;padding:calc(8px + var(--safe-t)) 10px calc(8px + var(--safe-b))}
.qc{width:min(980px,97vw);max-height:96vh;overflow:auto;border-radius:20px;padding:clamp(14px,2.2vw,26px);background:rgba(18,17,24,.97);border:1px solid var(--line);-webkit-user-select:text;user-select:text;touch-action:pan-y}
.qc.right{box-shadow:0 0 0 2px rgba(63,214,160,.7)}.qc.wrong{box-shadow:0 0 0 2px rgba(255,77,94,.7)}
.qh{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.qlabel{font-size:.74em;color:var(--sub);margin-right:auto}
.qs{font-size:1.06em;font-weight:700;line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
.src{background:var(--paper);color:#241f16;border-radius:12px;padding:12px 14px;margin-bottom:10px;line-height:1.75;font-size:.95em;white-space:pre-wrap}
.src b{display:block;font-size:.8em;color:#7a5418;margin-bottom:3px}.src .ct{font-size:.74em;color:#6b6252;text-align:right;margin-top:4px}
.chart{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.chart .cr{display:grid;grid-template-columns:minmax(7em,auto) 1fr 3.6em;gap:8px;align-items:center;font-size:.84em;margin:4px 0}
.chart .cb{height:12px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.chart .cb i{display:block;height:100%;background:var(--blue)}
.chart .cr b{text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;line-height:1.5;min-height:48px;align-items:flex-start}
.opt .n{font-weight:800;color:var(--sub);min-width:1.3em}
.opt.sel{border-color:var(--blue);background:rgba(75,107,255,.15)}.opt.right{border-color:var(--ok);background:rgba(63,214,160,.14)}.opt.wrong{border-color:var(--bad);background:rgba(255,77,94,.14)}
.seq{display:grid;gap:6px;margin-bottom:8px}.slot{min-height:44px;border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left;background:none}
.slot.f{border-style:solid;background:rgba(255,255,255,.06)}.slot.right{border-color:var(--ok)}.slot.wrong{border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px}.pool .btn{text-align:left;font-weight:600}
.tin{width:100%;font:inherit;font-size:1.05em;padding:.75em 1em;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);outline:none;-webkit-user-select:text;user-select:text}
.tin:focus{border-color:var(--blue)}textarea.tin{min-height:7em;resize:vertical;line-height:1.6}
.qf{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:12px;flex-wrap:wrap}
.res{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.verdict{font-size:1.4em;font-weight:900}.right .verdict{color:var(--ok)}.wrong .verdict{color:var(--bad)}
.why{font-size:.88em;color:var(--sub);line-height:1.55;display:grid;gap:4px}.why .ok{color:var(--txt)}
.exp{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;line-height:1.65;font-size:.92em}
.exp b{color:var(--gold);font-size:.82em;margin-right:6px}
.hint{background:rgba(169,139,255,.12);border:1px solid rgba(169,139,255,.35);border-radius:12px;padding:10px 12px;font-size:.88em;line-height:1.55}
.hint.dy{background:rgba(255,215,106,.12);border-color:rgba(255,215,106,.45)}
.keys{display:flex;flex-wrap:wrap;gap:6px}.keys span{padding:.2em .6em;border-radius:8px;border:1px solid var(--line);font-size:.82em}.keys span.hit{border-color:var(--ok);color:#b9f5df}.keys span.miss{border-color:var(--bad);color:#ffc0c7}
/* 일반 모달 */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,5,9,.66);z-index:50;padding:calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b))}
.mc{width:min(560px,94vw);max-height:92vh;overflow:auto;border-radius:20px;padding:20px;background:rgba(18,17,24,.98);border:1px solid var(--line);-webkit-user-select:text;user-select:text;touch-action:pan-y}
.mc.wide{width:min(900px,96vw)}
.mc h3{margin:0 0 10px;font-family:var(--title);font-weight:400;font-size:1.35em}
.mc p{color:var(--sub);line-height:1.6;margin:0 0 12px}
.mlist{display:grid;gap:8px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:.4em .85em;border-radius:999px;cursor:pointer;font-size:.86em;font-weight:700;min-height:36px}
.seg button.on{background:var(--paper);color:#14121a}
select.tin{padding:.55em .8em}
/* 결과·지도 */
.stagecard{display:grid;gap:4px;text-align:left;cursor:pointer;border:1.5px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;min-height:44px}
.stagecard.lock{opacity:.4;cursor:default}.stagecard.clr{border-color:rgba(255,215,106,.45)}

{ id:'M119', t:'mc', d:4, k:'C8', q:'세 조건 p, q, r에 대하여 두 명제 p→q, q→r가 모두 참일 때, 다음 중 반드시 참인 명제는?', o:['r→p','~p→~r','~r→~p','q→p'], a:2,
  e:'삼단논법으로 p→r가 참이고, 그 대우 ~r→~p도 참이다. 나머지는 진리표에서 거짓인 경우가 있다.' },
{ id:'M120', t:'mc', d:4, k:'C8', q:'세 조건 p, q, r에 대하여 두 명제 p→~q, r→q가 모두 참일 때, 다음 중 반드시 참인 명제는?', o:['p→r','~p→r','r→~p','~r→q'], a:2,

{ id:'M121', t:'mc', d:4, k:'C9', q:'"자연수 n에 대하여 n²이 짝수이면 n은 짝수이다."를 대우를 이용하여 증명할 때, 실제로 보여야 하는 것은?', o:['n이 짝수이면 n²이 짝수이다.','n이 홀수이면 n²이 홀수이다.','n²이 홀수이면 n이 홀수이다.','n이 짝수이면 n²이 홀수이다.'], a:1,
  e:'대우는 "n이 짝수가 아니면(홀수이면) n²이 짝수가 아니다(홀수이다)"이다. ①은 역, ③은 이이다.' },
{ id:'M122', t:'order', d:4, k:'C12', q:'"자연수 n에 대하여 n²이 짝수이면 n은 짝수이다."의 증명 과정을 순서대로 배열하시오.',
  o:['대우 "n이 홀수이면 n²은 홀수이다"가 참임을 보이면 된다.','n이 홀수이면 n=2k-1 (k는 자연수)로 나타낼 수 있다.','n²=4k²-4k+1=2(2k²-2k)+1이다.','n²은 홀수이므로 대우가 참이고, 주어진 명제도 참이다.'],
  e:'대우 설정 → 홀수의 표현 → 제곱 계산 → 결론. 2k²-2k는 0 이상의 정수이므로 n²은 홀수이다.' },
{ id:'M123', t:'mc', d:4, k:'C10', q:'귀류법으로 "√2는 무리수이다."를 증명할 때, √2=m/n (m, n은 서로소인 자연수)이라 가정하면 어떤 모순이 생기는가?', o:['m과 n이 모두 짝수가 되어 서로소라는 가정에 모순','m이 홀수가 되어 m²=2n²에 모순','n=0이 되어 분모에 모순','√2>2가 되어 모순'], a:0,
  e:'m²=2n²에서 m은 짝수, m=2k를 넣으면 n²=2k²이므로 n도 짝수가 된다. 서로소라는 가정에 모순이다.' },
{ id:'M124', t:'order', d:5, k:'C10', q:'귀류법으로 "√2는 무리수이다."를 증명하는 과정을 순서대로 배열하시오.',

  e:'결론의 부정(유리수 가정) → m 짝수 → n 짝수 → 모순 → 결론.' },
{ id:'M125', t:'mc', d:4, k:'C11', q:'다음 "증명"에서 잘못된 단계는?\n(가) a=b라 하자.  (나) 양변에 a를 곱하면 a²=ab\n(다) 양변에서 b²을 빼면 a²-b²=ab-b², 즉 (a+b)(a-b)=b(a-b)\n(라) 양변을 a-b로 나누면 a+b=b  (마) a=b이므로 2b=b, 따라서 2=1', o:['(나)','(다)','(라)','(마)'], a:2,
  e:'a=b이므로 a-b=0이다. 0으로 나누는 (라) 단계가 잘못되었다.' },
{ id:'M126', t:'mc', d:5, k:'C11', q:'"모든 실수 a, b에 대하여 a>b이면 a²>b²이다."를 다음과 같이 증명하였다. 잘못된 점은?\n"a>b의 양변에 a를 곱하면 a²>ab, 양변에 b를 곱하면 ab>b²이다. 따라서 a²>b²이다."', o:['a, b가 양수라는 보장이 없어 곱할 때 부등호 방향이 바뀔 수 있다.','양변에 같은 수를 곱하면 안 된다.','a²>ab와 ab>b²에서 a²>b²을 이끌 수 없다.','잘못된 점이 없다.'], a:0,
  e:'음수를 곱하면 부등호 방향이 바뀐다. 실제로 a=1, b=-2이면 a>b이지만 a²=1<4=b²이므로 명제 자체가 거짓이다.' },
{ id:'M127', t:'mc', d:3, k:'C2', q:'두 조건 p, q의 진리집합을 각각 P, Q라 할 때, 명제 p→q가 참일 조건은?', o:['P⊂Q','Q⊂P','P∩Q=∅','P∪Q=U'], a:0,

  e:'참·거짓을 판별할 수 있으므로 명제이고, 2는 짝수이므로 거짓인 명제이다. 거짓이어도 명제이다.' },

  e:'실수의 제곱은 0 이상이므로 x²+y²=0 ⇔ x=0 그리고 y=0이다. P=Q이므로 필요충분조건이다.' },
{ id:'M130', t:'mc', d:3, k:'C6', q:'실수 x, y에 대하여 p: xy=0, q: x=0일 때, p는 q이기 위한 어떤 조건인가?', o:['충분조건이지만 필요조건은 아니다.','필요조건이지만 충분조건은 아니다.','필요충분조건이다.','아무 조건도 아니다.'], a:1,

{ id:'M131', t:'mc', d:5, k:'C13', q:'다음 두 명제가 참이다.\n• 수학을 좋아하는 학생은 과학을 좋아한다.\n• 과학을 좋아하는 학생은 체육을 좋아하지 않는다.\n반드시 참인 것은?', o:['체육을 좋아하는 학생은 수학을 좋아하지 않는다.','과학을 좋아하는 학생은 수학을 좋아한다.','체육을 좋아하지 않는 학생은 수학을 좋아한다.','수학을 좋아하지 않는 학생은 체육을 좋아한다.'], a:0,

function migrate(d){

function sum(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(36);}

  TOTAL:239,

  target(subj){const st=MG.Save.st;return U.clamp(this.base(subj)+(st.adapt[subj]||0),1,5);},
  /* 출제 후보 선택: ① 아직 맞히지 못한 밑줄 ID ② 복습 기한이 된 오답 ③ 목표 난이도 근접 ④ 최근 출제 회피 */
  choose(pool,opt){opt=opt||{};const st=MG.Save.st,now=U.ts(),subj=pool[0]&&pool[0].subj,T=opt.target!=null?opt.target:this.target(subj||'h');

      const w=st.wrong[q.id];if(w&&!w.done&&w.due<=now)s+=8;
      s-=Math.abs(q.d-T)*2.4; if(L.last)s-=Math.max(0,6-(now-L.last)/60000)*1.5; if(L.c>0)s-=2;

  stagePool(sid){return MG.HQ.filter(q=>q.st===sid);},
  allPool(){return MG.HQ;},
  /* 정답 처리 → 기록·적응형 난이도·오답 노트·도감 갱신. 반환: {xp} */
  record(q,ok,meta){meta=meta||{};const st=MG.Save.st,now=U.ts();const L=st.qlog[q.id]||(st.qlog[q.id]={n:0,c:0,w:0,last:0,lastOk:0});

  conceptWrongCount(q){const st=MG.Save.st;let n=0;for(const id in st.qlog){const qq=MG.qMap[id];if(qq&&qq.k===q.k)n+=st.qlog[id].w||0;}return n;},

    const u=MG.uidMap[q.u[0]];return '이 문제는 「'+q.k+'」에 관한 거야. 교과서 '+q.p.join('·')+'쪽'+(u&&u.y?', '+u.y.split('/')[0].trim()+' 무렵':'')+'. 선지마다 "언제·누가·무엇을" 했는지 시기부터 따져 봐.';},

<script>/* 22_world.js */
/* ===== 게임 세계: 레벨·물리·전투·먹물·몬스터·보스·렌더링 ===== */
(function(){
const U=MG.U,X=MG.Pix,I=MG.Input,S=MG.S;
const GY=220;
/* 보스전·지옥 발판 높이: 점프 최고 상승(312²/(2·980)≈49.7px)보다 낮게 */
const PLAT_Y=40;
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000;};}
function hashStr(t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h;}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const W={canvas:null,ctx:null,buf:null,b:null,W:480,H:300,scale:1,mode:'none',paused:false,t:0,
  cam:{x:0,y:0,shake:0,lock:null},
  init(cv){this.canvas=cv;this.ctx=cv.getContext('2d');this.buf=X.mk(480,300);this.b=this.buf.getContext('2d');addEventListener('resize',()=>this.resize());this.resize();},
  resize(){const dpr=Math.min(window.devicePixelRatio||1,3),cw=innerWidth*dpr,ch=innerHeight*dpr;this.canvas.width=Math.round(cw);this.canvas.height=Math.round(ch);
    const sc=Math.max(1,Math.round(ch/(S.fx==='low'?200:240)));this.scale=sc;this.H=Math.ceil(ch/sc);this.W=Math.ceil(cw/sc);this.buf.width=this.W;this.buf.height=this.H;this.b=this.buf.getContext('2d');this.b.imageSmoothingEnabled=false;},
  clearAll(){this.solids=[];this.plats=[];this.holes=[];this.gates=[];this.recs=[];this.flags=[];this.en=[];this.proj=[];this.hz=[];this.fx=[];this.txt=[];this.decoy=null;this.boss=null;this.exitPortal=null;this.cameo=null;this.cameoDone=false;this.endX=1e9;this.arena=null;this.chests=[];this.ended=false;this.hell=null;this.cam.y=GY-(this.H-40);this.cam.lock=null;this.portal=0;this.lamps=[];this.sign=null;this.npcs=[];this.mj=null;this.ero=0;this.bstate='none';this.bossFx=0;this.rubble=[];this.hellIn=1;},

  /* ── 스테이지 생성 ── */
  load(stage,opt){opt=opt||{};this.clearAll();this.mode='stage';this.stage=stage;this.theme=stage.theme;this.ch=stage.ch||1;this.k=1+.13*Math.max(0,this.ch-1);
    const r=rng(hashStr(stage.id+'v1'));/* v1.9 진행 속도: 길이 65% · 기록의 문 1개 감소(최소 2) · 몬스터 70% */const len=stage.tutorial?stage.len:Math.round(stage.len*.65);this.len=len;const st=MG.Save.st;
    const nG=stage.tutorial?(stage.gates||0):Math.max(2,(stage.gates||0)-1),gp=[];for(let i=0;i<nG;i++)gp.push(Math.round(len*(i+1)/(nG+1)));
    const keep=(x,w)=>gp.every(g=>x+w<g-90||x>g+130)&&x>260&&x+w<len-140;
    // 지형: 구덩이·단·발판
    let x=300;const feats=[];
    while(x<len-200){const roll=r(),w=50+r()*80;
      if(roll<.22&&keep(x,70)&&!stage.tutorial){const gw=34+Math.round(r()*30);this.holes.push([x,x+gw]);if(gw>52)this.plats.push({x:x+gw/2-20,y:GY-34,w:40,h:6});feats.push([x,x+gw]);x+=gw+90;}
      else if(roll<.42&&keep(x,w)){const h=16+Math.round(r()*14);this.solids.push({x,y:GY-h,w:Math.round(w),h,step:1});feats.push([x,x+w]);x+=w+70;}
      else if(roll<.62&&keep(x,140)){for(let i=0;i<2;i++)this.plats.push({x:x+i*70,y:GY-42-i*20,w:46,h:6});feats.push([x,x+140]);x+=190;}
      else x+=80+r()*80;}
    if(stage.tutorial){this.solids.push({x:520,y:GY-20,w:60,h:20,step:1});this.holes.push([900,940]);}
    // 지면 조각
    const total=len+(stage.boss?700:0);let gx=-300;const hs=this.holes.slice().sort((a,b)=>a[0]-b[0]);
    for(const h of hs){this.solids.push({x:gx,y:GY,w:h[0]-gx,h:400,ground:1});gx=h[1];}
    this.solids.push({x:gx,y:GY,w:total+600-gx,h:400,ground:1});
    this.solids.push({x:-310,y:-400,w:10,h:900,wall:1});
    // 기록의 문·체크포인트
    gp.forEach((g,i)=>{const code=(stage.jihun==='wall'&&i===1);this.gates.push({x:g,y:GY-58,w:24,h:58,open:false,code,i,cool:0});this.flags.push({x:g+70,on:false});});
    // 기록 조각 (해당 스테이지의 확정 출제 요소)
    const uids=MG.SA.filter(u=>u.st===stage.id).map(u=>u.id);const nr=Math.min(uids.length,stage.tutorial?0:4);
    for(let i=0;i<nr;i++){let tx=0,tries=0;do{tx=300+r()*(len-500);tries++;}while(tries<40&&(this.inHole(tx,20)||gp.some(g=>Math.abs(g-tx)<80)));
      const onP=this.plats.find(p=>tx>p.x-10&&tx<p.x+p.w+10);this.recs.push({x:tx,y:(onP?onP.y:this.groundAt(tx))-16,uid:uids[Math.floor(i*uids.length/nr)],got:!!st.codex[uids[Math.floor(i*uids.length/nr)]]&&false,bob:r()*6});}
    if(!stage.tutorial&&!stage.respect)this.chests.push({x:Math.round(len*.55+r()*80),open:false});
    // 몬스터

    for(let i=0;i<n;i++){const type=pool[i%pool.length];let tx=0,tries=0;
      do{tx=380+r()*(len-560);tries++;}while(tries<60&&(this.inHole(tx,40)||gp.some(g=>Math.abs(g-tx)<150)||Math.abs(tx-(len*.5))<10));
      this.spawn(type,tx,r);}
    if(stage.tutorial){this.en=[];this.spawn('drone',700,r);this.spawn('drone',1300,r);this.spawn('drone',1800,r);}
    if(stage.elite){let tx=Math.round(len*.72);this.spawn(stage.elite,tx,r,true);}
    // 끝·보스 아레나
    this.endX=len-40;this.bstate=stage.boss&&!stage.tutorial?'explore':'none';
    {const th=MG.THEMES[stage.theme]||{};if(th.lamps)for(let lx=230;lx<len-120;lx+=420+Math.round(r()*120)){if(!this.inHole(lx,24)&&gp.every(g=>Math.abs(g-lx)>50))this.lamps.push(lx);}}
    this.sign={x:120,text:stage.tutorial?'기록 속으로':(stage.id+' '+stage.title)};
    this.ero=stage.respect?.6:stage.tutorial?.4:({1:1,2:1.6,3:2.2,4:2.8,5:3.4,6:4.2}[stage.ch]||1);
    if(this.ero>=1.5&&!stage.respect)for(let rx=420;rx<len-200;rx+=200+Math.round(r()*180)){if(!this.inHole(rx,30)&&gp.every(g=>Math.abs(g-rx)>60))this.rubble.push({x:rx,s:Math.floor(r()*1000)});}
    this.spawnX=opt.cpX!=null?opt.cpX:60;this.flags.forEach(f=>{if(f.x<=this.spawnX)f.on=true;});this.gates.forEach(g=>{if(g.x<this.spawnX)g.open=true;});
    this.makePlayer(this.spawnX);this.ink=this.makeInk();this.stats={t:0,hits:0,kills:0,ok:0,bad:0,recs:0,qok:0,qbad:0,combo:0,maxCombo:0,bossDmg:0,asked:[]};this.dyUsed={};this.dyCount=0;this.jhTriggered=false;this.en0=this.en.length;
    this.cam.x=this.p.x-this.W*.4;this.cam.lock=null;this.erodeOn=false;this.glitchT=0;this.hintBlock=false;},
  inHole(x,pad){pad=pad||0;return this.holes.some(h=>x>h[0]-pad&&x<h[1]+pad);},
  /* ── 이어하기: 월드 상태 스냅숏·복원·안전 위치 ── */
  snapWorld(){return{exitX:this.exitPortal?this.exitPortal.x:null,gates:this.gates.map(g=>g.open?1:0),recs:this.recs.map(r=>r.got?1:0),chests:this.chests.map(c=>c.open?1:0),flags:this.flags.map(f=>f.on?1:0),en:this.en.slice(0,this.en0||0).map(e=>e.dead?1:0),stats:this.stats,spawnX:this.spawnX,dyCount:this.dyCount};},
  restoreWorld(o){if(!o)return;const ap=(arr,v,k)=>{if(v)v.forEach((b,i)=>{if(arr[i]&&b)arr[i][k]=true;});};ap(this.gates,o.gates,'open');ap(this.recs,o.recs,'got');ap(this.chests,o.chests,'open');ap(this.flags,o.flags,'on');
    if(o.en)o.en.forEach((b,i)=>{if(b&&this.en[i])this.en[i].dead=true;});if(o.stats)this.stats=Object.assign(this.stats,o.stats);if(o.spawnX!=null)this.spawnX=o.spawnX;if(o.dyCount!=null)this.dyCount=o.dyCount;},
  /* 저장 위치가 구덩이·구조물 안·위험 지역이면 가장 가까운 안전 지점 */
  safeSpot(x,y){const lo=this.arena&&this.arena.started&&!this.arena.done?this.arena.x+20:-250,hi=this.arena&&this.arena.started&&!this.arena.done?this.arena.x+this.arena.w-20:(this.len||600);
    const bad=(xx)=>{if(xx<lo||xx>hi||this.inHole(xx,10))return true;for(const q of this.solids){if(q.wall&&xx>q.x-8&&xx<q.x+q.w+8)return true;}for(const g of this.gates){if(!g.open&&xx>g.x-10&&xx<g.x+g.w+10)return true;}for(const h of this.hz){if(xx>h.x-8&&xx<h.x+h.w+8)return true;}return false;};
    for(let d=0;d<600;d+=4){for(const sg of[1,-1]){const xx=x+sg*d;if(!bad(xx))return{x:xx,y:this.groundAt(xx)-.5};}}return{x:this.spawnX||60,y:GY-1};},
  groundAt(x){let y=GY;for(const s of this.solids)if(s.step&&x>=s.x&&x<=s.x+s.w)y=Math.min(y,s.y);return y;},

  /* 보스 단독 노드(전지훈·권군)·지옥 */

    this.len=60;this.ero=kind==='kwon'?5:kind==='jihun'?0:2;this.solids.push({x:-300,y:GY,w:1400,h:400,ground:1},{x:-310,y:-400,w:10,h:900,wall:1});
    this.arena={x:40,w:Math.max(600,this.W),boss:kind,started:false,done:false};this.endX=1e9;

    this.makePlayer(90);this.ink=this.makeInk();this.stats={t:0,hits:0,kills:0,ok:0,bad:0,recs:0,qok:0,qbad:0,combo:0,maxCombo:0,bossDmg:0,asked:[]};this.dyUsed={};this.dyCount=0;this.cam.x=0;this.spawnX=90;this.erodeOn=false;},

  /* ── 플레이어 ── */

      roll:0,rollCd:0,dash:0,dashCd:0,airDash:true,hurt:0,dead:false,en:30,sp:0,awaken:0,res:0,lastHit:0,safeX:x,anim:0,blessed:0,dyShield:0,dmgMul:1};},
  atkPower(){const st=MG.Save.st;return(1+.035*(st.lv-1))*(this.p.awaken>0?1.5:1)*(this.p.blessed>0?1.3:1);},
  makeInk(){const st=MG.Save.st;return{x:this.p.x-20,y:this.p.y-30,vis:true,mood:'normal',cd:{bullet:0,shield:0,clone:0,chain:0,absorb:0,regen:0,restore:0},flash:0};},
  has(a){return MG.Save.st.ink.ab.includes(a);},
  hurtPlayer(dmg,fromX,kind){const p=this.p;if(p.dead||p.inv>0||p.roll>0||p.dash>0&&kind!=='pit'||this.paused)return false;
    if(this.mode==='hell'){p.inv=1;p.hurt=.25;p.vx=(p.x<fromX?-1:1)*120;p.vy=-140;MG.Audio.sfx('hurt');this.shake(3);MG.Game.hellHit();return true;}
    const st=MG.Save.st;dmg=dmg*this.k*(this.boss&&this.boss.SP&&!this.boss.dead?.8:1)*([1,.65,.4][S.assist||0])*(st.equip==='helmet'?.9:1)*(p.blessed>0?.7:1);
    if(p.dyShield>0){this.pop(p.x,p.y-34,'가호','#ffd76a');return false;}
    if(this.has('shield')&&this.ink.cd.shield<=0&&p.hp/p.max<.4){this.ink.cd.shield=25*(st.equip==='candle'?.7:1);this.pop(p.x,p.y-34,'먹물 보호막','#c9b6ff');MG.Audio.sfx('ink');this.burst(p.x,p.y-14,'#1a1030',10);p.inv=.5;return false;}
    // 김대영: 천국의 보호 / 마지막 기회

  nearestEnemy(x,y,r){let b=null,bd=r;for(const e of this.en){if(e.dead||e.fake)continue;const d=Math.hypot(e.x-x,e.y-e.h/2-y);if(d<bd){bd=d;b=e;}}
    if(this.boss&&!this.boss.dead&&!this.boss.seal){const B=this.boss,d=Math.hypot(B.x-x,B.y-B.h/2-y);if(d<bd+40)b=B;}return b;},

  /* ── 몬스터 AI ── 모든 공격은 'tele'(빨간 점멸 + 경고음) 상태를 먼저 거친다 */
  updEnemies(dt){const p=this.p,T=this.target();
    for(const e of this.en){if(e.dead)continue;e.anim+=dt;e.hit-=dt;e.cd-=dt;e.t-=dt;if(e.root>0){e.root-=dt;continue;}
      if(e.kb){e.x+=e.kb*dt;e.kb*=Math.pow(.01,dt);if(Math.abs(e.kb)<5)e.kb=0;if(!e.fly&&this.inHole(e.x,0))e.x-=e.kb*dt*2;}
      const dx=T.x-e.x,adx=Math.abs(dx),dy=(T.y-14)-(e.y-e.h/2);if(e.st!=='dash'&&e.st!=='bash')e.face=dx>=0?1:-1;
      const tele=(dur)=>{e.st='tele';e.t=dur;MG.Audio.sfx('warn');};
      const onScreen=e.x>this.cam.x-40&&e.x<this.cam.x+this.W+40;
      if(e.fake){e.life-=dt;if(e.life<=0)e.dead=true;e.x+=Math.sign(dx)*30*dt;}
      else switch(e.type){
      case'drone':if(e.st==='idle'){e.x=e.hx+Math.sin(e.anim*.8)*60;e.y=e.hy+Math.sin(e.anim*2.2)*6;if(adx<135&&e.cd<=0&&onScreen){tele(.55);e.tx=T.x;e.ty=T.y-10;}}
        else if(e.st==='tele'){if(e.t<=0){e.st='dive';e.t=.75;const a=Math.atan2(e.ty-e.y,e.tx-e.x);e.vx=Math.cos(a)*210;e.vy2=Math.sin(a)*210;}}
        else if(e.st==='dive'){e.x+=e.vx*dt;e.y+=e.vy2*dt;if(e.y>GY-8)e.y=GY-8;if(e.t<=0){e.st='rec';e.t=.9;}}
        else if(e.st==='rec'){e.y+=(e.hy-e.y)*dt*2;e.hx=e.x;if(e.t<=0){e.st='idle';e.cd=1.7;e.anim=0;}}break;
      case'mobile':if(e.st==='idle'){e.x+=Math.sin(e.anim*.7)*28*dt;if(adx<150&&Math.abs(T.y-e.y)<40&&e.cd<=0&&onScreen)tele(.5);}
        else if(e.st==='tele'){if(e.t<=0){e.st='dash';e.t=.55;e.vx=e.face*235;}}
        else if(e.st==='dash'){const nx=e.x+e.vx*dt;if(!this.inHole(nx,6))e.x=nx;else e.t=0;if(e.t<=0){e.st='rec';e.t=.7;}}
        else if(e.st==='rec'&&e.t<=0){e.st='idle';e.cd=1.4;}break;
      case'shield':if(e.st==='idle'){if(adx<220&&adx>40){const nx=e.x+Math.sign(dx)*26*dt;if(!this.inHole(nx,8))e.x=nx;}if(adx<52&&e.cd<=0)tele(.6);}
        else if(e.st==='tele'){if(e.t<=0){e.st='bash';e.t=.22;e.bx=e.face;}}
        else if(e.st==='bash'){const nx=e.x+e.bx*240*dt;if(!this.inHole(nx,8))e.x=nx;if(e.t<=0){e.st='down';e.t=.95;}}
        else if(e.st==='down'&&e.t<=0){e.st='idle';e.cd=1.2;}break;
      case'heavy':if(e.st==='idle'){if(adx<260&&adx>30){const nx=e.x+Math.sign(dx)*18*dt;if(!this.inHole(nx,16))e.x=nx;}if(adx<125&&e.cd<=0)tele(.8);}
        else if(e.st==='tele'){if(e.t<=0){e.st='rec';e.t=1;this.shake(5);MG.Audio.sfx('hit');for(const d of[-1,1])this.hz.push({kind:'wave',x:e.x-6,y:GY-12,w:12,h:12,vx:d*150,dist:170,tele:0,act:1.2,dmg:16});
          this.hz.push({kind:'box',x:e.x-26,y:e.y-26,w:52,h:26,tele:0,act:.12,dmg:18});}}
        else if(e.st==='rec'&&e.t<=0){e.st='idle';e.cd=2.4;}break;
      case'turret':if(e.st==='idle'){if(adx<230&&e.cd<=0&&onScreen){tele(.75);e.ly=U.clamp(T.y-14,GY-90,GY-6);e.ld=e.face;}}
        else if(e.st==='tele'){if(e.t<=0){e.st='rec';e.t=.5;const x0=e.ld>0?e.x+8:e.x-208;this.hz.push({kind:'beam',x:x0,y:e.ly-3,w:200,h:6,tele:0,act:.35,dmg:14});MG.Audio.sfx('glitch');}}
        else if(e.st==='rec'&&e.t<=0){e.st='idle';e.cd=2.2;}break;
      case'jammer':if(e.st==='idle'){const gx=T.x-e.face*-90,gy=GY-90;e.x+=(T.x+90*Math.sin(e.anim*.5)-e.x)*dt*.6;e.y+=(gy+Math.sin(e.anim*2)*8-e.y)*dt;if(e.cd<=0&&onScreen)tele(.5);}
        else if(e.st==='tele'){if(e.t<=0){e.st='idle';e.cd=4;for(let i=-1;i<=1;i++){const a=Math.atan2((T.y-14)-e.y,T.x-e.x)+i*.25;this.eShot(e.x,e.y,Math.cos(a)*90,Math.sin(a)*90,9,'#d07aff');}if(!S.flash)this.glitchT=.35;MG.Audio.sfx('glitch');}}break;
      case'clone':if(e.st==='idle'){const want=dx>0?T.x-90:T.x+90;const nx=e.x+U.clamp(want-e.x,-30,30)*dt;if(!this.inHole(nx,6))e.x=nx;if(e.cd<=0&&onScreen&&adx<240)tele(.5);}
        else if(e.st==='tele'){if(e.t<=0){e.st='idle';e.cd=4.5;if(!e.spawned||e.spawned<2){for(const o of[-26,26]){const f=this.spawn('clone',e.x+o,null);f.fake=true;f.hp=1;f.max=1;f.life=6;}e.spawned=(e.spawned||0)+1;}
          const a=Math.atan2((T.y-14)-(e.y-12),T.x-e.x);this.eShot(e.x,e.y-12,Math.cos(a)*140,Math.sin(a)*140,10,'#5ef0ff');}}break;
      case'tank':this.patternEnemy(e,dt,['shell','charge','aimed'],T);break;
      case'executor':this.patternEnemy(e,dt,['tslash','beam2','ring'],T);break;
      case'shard':if(e.st==='idle'){e.x+=Math.sign(dx)*40*dt;if(e.cd<=0&&adx<200)tele(.6),e.tx=T.x-p.face*26;}
        else if(e.st==='tele'){if(e.t<=0){e.x=e.tx;e.st='rec';e.t=.6;this.hz.push({kind:'box',x:e.x-20,y:GY-30,w:40,h:30,tele:.18,act:.12,dmg:14});MG.Audio.sfx('glitch');if(Math.random()<.4)MG.Game.metaGlitch&&MG.Game.metaGlitch();}}
        else if(e.st==='rec'&&e.t<=0){e.st='idle';e.cd=2.3;}break;}
      // 몸 충돌
      if(!p.dead&&p.inv<=0&&p.roll<=0){const eb={x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h},pb={x:p.x-p.w/2,y:p.y-p.h,w:p.w,h:p.h};
        if(ov(eb,pb)){const d=(e.st==='dive'||e.st==='dash'||e.st==='bash')?14:(e.type==='heavy'||e.elite?9:6);this.hurtPlayer(d,e.x);}}
      if(this.decoy&&ov({x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h},{x:this.decoy.x-6,y:this.decoy.y-24,w:12,h:24})&&(e.st==='dive'||e.st==='dash'))this.decoy.t=Math.min(this.decoy.t,.2);
      if(!e.fly&&e.type!=='shard'){e.y=this.groundAt(e.x);if(this.inHole(e.x,0)){e.dead=true;this.burst(e.x,GY,'#888',8);}}}
    this.en=this.en.filter(e=>!e.dead||e.fx);},
  /* 엘리트·보스 공용 패턴 */
  patternEnemy(e,dt,pats,T){const p=this.p;
    if(e.st==='idle'){const dx=T.x-e.x;if(Math.abs(dx)>90){const nx=e.x+Math.sign(dx)*22*dt;if(!this.inHole(nx,30))e.x=nx;}
      if(e.cd<=0&&Math.abs(dx)<300){e.pat=pats[(e.pc=(e.pc||0)+1)%pats.length];e.st='tele';e.t=e.pat==='charge'?.85:.75;MG.Audio.sfx('warn');e.tx=T.x;
        if(e.pat==='shell'){for(let i=0;i<3;i++){const x=T.x+(i-1)*40+U.rand(-8,8);this.hz.push({kind:'blast',x:x-12,y:GY-30,w:24,h:30,tele:.9,act:.2,dmg:15});}}
        if(e.pat==='tslash'){e.tx=T.x+(Math.random()<.5?-30:30);}}}
    else if(e.st==='tele'){if(e.t<=0){
      if(e.pat==='charge'){e.st='dash';e.t=.9;e.vx=e.face*200;}
      else if(e.pat==='aimed'){for(let i=0;i<3;i++)setTimeout(()=>{if(e.dead||this.paused)return;const a=Math.atan2((p.y-14)-(e.y-20),p.x-e.x);this.eShot(e.x,e.y-20,Math.cos(a)*150,Math.sin(a)*150,11,'#ffb547');},i*180);e.st='rec';e.t=.9;}
      else if(e.pat==='tslash'){e.x=e.tx;this.hz.push({kind:'box',x:e.x-24,y:GY-34,w:48,h:34,tele:.15,act:.15,dmg:16});e.st='rec';e.t=.8;MG.Audio.sfx('slash');}
      else if(e.pat==='beam2'){for(const d of[-1,1])this.hz.push({kind:'beam',x:d>0?e.x:e.x-220,y:GY-16,w:220,h:8,tele:.35,act:.3,dmg:14});e.st='rec';e.t=1;}
      else if(e.pat==='ring'){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;this.eShot(e.x,e.y-20,Math.cos(a)*100,Math.sin(a)*100,10,'#ff3355');}e.st='rec';e.t=.9;}
      else{e.st='rec';e.t=.8;}}}
    else if(e.st==='dash'){const nx=e.x+e.vx*dt;if(!this.inHole(nx,30)&&(!this.arena||!this.arena.started||(nx>this.arena.x+20&&nx<this.arena.x+this.arena.w-20)))e.x=nx;else e.t=0;if(e.t<=0){e.st='rec';e.t=.8;}}
    else if(e.st==='rec'&&e.t<=0){e.st='idle';e.cd=1.6;}},
  eShot(x,y,vx,vy,dmg,col){this.proj.push({x,y,vx,vy,r:4,dmg,life:4,owner:'e',col});},
