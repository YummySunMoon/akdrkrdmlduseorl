    constructor() { this.name = 'map'; }
    enter(opts) {
      MG.State.setWorld('none');
      const d = MG.State.d;
      d.location = 'map';
      MG.State.markDirty();
      MG.R.setTheme(ARCHIVE_THEME);
      MG.Audio.music('title');
      this.t = 0;
      this.sel = opts.select || (d.earth.run ? d.earth.run.stageId : d.earth.currentStage);
      this._ui();
      if (!d.mapIntro) { d.mapIntro = true; setTimeout(() => MG.Dialog.bark('여기가 역사 지도야. 왼쪽부터 순서대로 기록을 복구해. 전부 끝내야 천국 문이 열린다고.', 'ink', 4.5), 600); }
    }
    exit() { if (this.ui) this.ui.remove(); }
    _status(s) { return MG.Game.stageStatus(s); }
    _hasRun(id) { const E = MG.State.d.earth; return (E.run && E.run.stageId === id && !E.run.bossRush) || !!(E.parked && E.parked[id]); }
    _ui() {
      if (this.ui) this.ui.remove();
      const d = MG.State.d;
      const stages = MG.Data.stages;
      const cleared = stages.filter((s) => d.earth.cleared[s.id]).length;
      const ui = this.ui = el('div', { class: 'map-ui' });
      const head = el('div', { class: 'map-head glass' },
        el('div', { class: 'mh-who' }, el('b', {}, MG.State.nick), el('span', {}, '「' + d.rewards.title + '」')),
        el('div', { class: 'mh-prog' }, el('span', {}, '기록 복구 ' + cleared + ' / ' + stages.length), el('div', { class: 'bar' }, el('i', { style: { width: (cleared / stages.length * 100) + '%' } })), el('span', {}, '천국 ' + d.heaven.tier + ' / 5')),
        el('div', { class: 'mh-btns' },
          el('button', { class: 'btn small', onclick: () => MG.UI.codex() }, '도감'),
          el('button', { class: 'btn small', onclick: () => MG.UI.wrongNotes() }, '오답 노트'),
          el('button', { class: 'btn small', onclick: () => MG.UI.wardrobe() }, '옷장'),
          el('button', { class: 'btn small', onclick: () => MG.UI.settings() }, '설정'),
          el('button', { class: 'btn small', onclick: () => MG.Save.manualSave() }, '저장'),
          el('button', { class: 'btn small ghost', onclick: () => MG.Game.toTitle() }, '타이틀')));
      const track = el('div', { class: 'map-track' });
      const scroller = el('div', { class: 'map-scroll' }, track);
      stages.forEach((s) => {
        const st = this._status(s), c = d.earth.cleared[s.id];
        const inRun = this._hasRun(s.id);
        const n = el('button', { class: 'map-node ' + st + (this.sel === s.id ? ' sel' : '') + (inRun ? ' run' : '') },
          el('div', { class: 'mn-no' }, String(s.no).padStart(2, '0')),
          el('div', { class: 'mn-title' }, s.title),
          el('div', { class: 'mn-era' }, s.era),
          el('div', { class: 'mn-badge' }, st === 'cleared' ? c.grade : st === 'locked' ? '잠김' : inRun ? '진행 중' : '도전'));
        n.onclick = () => { MG.Audio.sfx('select'); this.sel = s.id; this._ui(); };
        track.appendChild(n);
      });
      const hv = el('button', { class: 'map-node heaven ' + (MG.State.allStagesCleared ? 'open' : 'locked') + (this.sel === 'heaven' ? ' sel' : '') },
        el('div', { class: 'mn-no' }, '天'), el('div', { class: 'mn-title' }, '천국의 문'), el('div', { class: 'mn-era' }, '다섯 단계 승급'), el('div', { class: 'mn-badge' }, MG.State.allStagesCleared ? d.heaven.tier + '/5' : '잠김'));
      hv.onclick = () => { MG.Audio.sfx('select'); this.sel = 'heaven'; this._ui(); };
      track.appendChild(hv);
      ui.append(head, scroller, this._detail());
      document.getElementById('ui-root').appendChild(ui);
      requestAnimationFrame(() => { ui.classList.add('show'); const s = track.querySelector('.sel'); if (s) s.scrollIntoView({ inline: 'center', block: 'nearest' }); });
    }
    _detail() {
      const d = MG.State.d;
      if (this.sel === 'heaven') {
        const open = MG.State.allStagesCleared;
        const left = MG.Data.stages.filter((s) => !d.earth.cleared[s.id]).length;
        return el('div', { class: 'map-detail glass' },
          el('div', { class: 'md-title' }, '천국의 문 — 김대영의 다섯 심판'),
          el('div', { class: 'md-story' }, open ? '역사 기록을 모두 복구했다. 천국에서 다섯 번 승급하면 한국사 신이 된다. 난도는 한국사능력검정시험 이상이며, 근거는 모두 시험 범위 교과서다.' : '이승의 역사 스테이지를 모두 클리어해야 열린다. 남은 스테이지: ' + left + '개'),
          el('div', { class: 'md-stats' }, '현재 승급 단계 ' + d.heaven.tier + ' / 5' + (d.endingSeen ? ' · 엔딩 달성' : '')),
          el('div', { class: 'md-btns' },
            open && d.heaven.tier < 5 ? el('button', { class: 'btn primary big', onclick: () => MG.Game.startHeaven(d.heaven.tier) }, (d.heaven.tier + 1) + '단계 승급 시험') : null,
            open && d.heaven.tier >= 5 ? el('button', { class: 'btn primary big', onclick: () => MG.Game.startHeaven(4) }, '최종 심판 재전투') : null,
            d.endingSeen ? el('button', { class: 'btn big', onclick: () => MG.Game.ending(true) }, '엔딩 다시 보기') : null));
      }
      const s = MG.Data.stageMap[this.sel] || MG.Data.stages[0];
      const st = this._status(s), c = d.earth.cleared[s.id];
      const inRun = this._hasRun(s.id);
      // (v5) 다른 스테이지의 체크포인트는 지우지 않고 보관된다 (MG.Game.startStage)
      const play = (opts) => MG.Game.startStage(s.id, opts);
      return el('div', { class: 'map-detail glass' },
        el('div', { class: 'md-title' }, s.no + '. ' + s.title),
        el('div', { class: 'md-sub' }, s.story + ' · ' + s.era + ' · 교과서 p.' + s.pages.join(', ')),
        el('div', { class: 'md-story' }, s.summary),
        el('div', { class: 'md-stats' },
          '보스: ' + s.boss.name + '  ·  ' + (c ? '최고 ' + c.grade + ' (' + c.best + '점) · 최단 ' + U.fmtTime(c.time) + ' · 기록 ' + c.records + '/' + c.recordsTotal : '기록 조각 ' + (s.records || []).length + '개')),
        el('div', { class: 'md-btns' },
          st === 'locked' ? el('div', { class: 'md-lock' }, '이전 스테이지를 클리어하면 열립니다.') : null,
          st !== 'locked' && inRun ? el('button', { class: 'btn primary big', onclick: () => MG.Game.startStage(s.id, { fresh: false }) }, '체크포인트에서 이어하기') : null,
          st !== 'locked' && !inRun ? el('button', { class: 'btn primary big', onclick: () => play({}) }, st === 'cleared' ? '재도전' : '시작') : null,
          st === 'cleared' ? el('button', { class: 'btn big', onclick: () => play({ bossRush: true }) }, '보스 재전투') : null));
    }
    update(dt) { this.t += dt; MG.R.cam.tx = Math.sin(this.t * 0.08) * 300; MG.R.cam.ty = 300; }
    render(R, dt) { pagesBg(this, R, dt); }
  }

  /* ── 복습 모드: 오답 재도전 (목숨 감소 없음) ── */
  class ReviewScene {
    constructor() { this.name = 'review'; }
    async enter(opts) {
      MG.State.setWorld('review');
      MG.R.setTheme(ARCHIVE_THEME);
      MG.Audio.music('memorial');
      this.t = 0;
      let ok = 0;
      const list = opts.list || [];
      for (let i = 0; i < list.length; i++) {
        if (MG.Core.scene !== this) return;
        const r = await MG.Q.ask(list[i], { label: '복습 ' + (i + 1) + ' / ' + list.length, review: true, stage: list[i].stage });
        if (r.correct) ok++;
      }
      if (MG.Core.scene !== this) return;
      MG.State.markDirty(true);
      await MG.UI.alert('복습 완료', list.length + '문제 중 ' + ok + '문제를 맞혔습니다. 맞힌 문제는 복습 횟수가 줄어듭니다.');
      MG.Game.toMap();
    }
    exit() {}
    update(dt) { this.t += dt; }
    render(R, dt) { pagesBg(this, R, dt); }
  }

  MG.TitleScene = TitleScene;
  MG.MapScene = MapScene;
  MG.ReviewScene = ReviewScene;
})();

</script>
<script>/* js/main.js */
/* main — 부팅과 게임 흐름(프롤로그 → 튜토리얼 → 이승 → 지옥/빡지 → 천국 → 엔딩) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  const Game = {
    async boot() {
      const loading = document.getElementById('boot');
      try {
        MG.Settings.load();
        MG.R.init(document.getElementById('game'));
        MG.Perf.init();
        MG.Input.init();
        MG.Audio.init();
        MG.UI.init();
        MG.Save.init();
        await MG.Data.load((p) => { const b = loading && loading.querySelector('i'); if (b) b.style.width = Math.round(p * 100) + '%'; });
        MG.Save.load();
        MG.Core.start();
        if (loading) { loading.classList.add('hide'); setTimeout(() => loading.remove(), 600); }
        this.toTitle();
        // 디버그/자동 테스트용 훅
        window.MG_DEBUG = { MG, Game: this };
      } catch (e) {
        console.error(e);
        if (loading) loading.querySelector('.msg').textContent = '불러오기 실패: ' + e.message + (location.protocol === 'file:' ? ' — 파일을 직접 열면 데이터가 막힙니다. GitHub Pages 주소 또는 dist/index.html(단일 파일판)로 실행하세요.' : '');
      }
    },
    whereLabel(d) {
      if (d.location === 'hell' || (d.hell && d.hell.pending)) return '지옥';
      if (d.location === 'bbakji') return '빡지 감옥';
      if (d.location === 'heaven') return '천국 ' + (d.heaven.tier + 1) + '단계';
      const n = Object.keys(d.earth.cleared || {}).length;
      return '이승 ' + n + '/11 복구';
    },
    toTitle() { MG.Core.setScene(new MG.TitleScene()); },
    async newGame() {
      if (MG.Save.hasSave() && !(await MG.UI.confirm('새로 시작', '기존 진행 기록을 덮어씁니다. 기록을 남기려면 먼저 저장 데이터를 파일로 내보내세요.', '새로 시작', '취소'))) return;
      const nick = await MG.UI.prompt('주인공 이름', '스토리에서 불릴 닉네임을 입력하세요. (최대 12자)', '예: 이주영', 12);
      MG.State.reset(nick);
      MG.Save.autosave();
      if (MG.Core.scene && MG.Core.scene.ui) MG.Core.scene.ui.remove();
      await MG.Story.play('prologue', { music: 'title' });
      MG.State.d.prologueSeen = true;
      this.startTutorial();
    },
    continueGame() {
      if (!MG.Save.load()) return this.newGame();
      const d = MG.State.d;
      if (d.location === 'bbakji' || d.hell.bbakji.active) return this.goBbakji();
      if (d.location === 'hell' || d.hell.pending || (d.earth.lives <= 0)) return this.goHell();
      if (!d.tutorialDone) return this.startTutorial();
      if (d.location === 'heaven' && d.heaven.inTier) return this.startHeaven(d.heaven.tier);
      if (d.location === 'stage' && d.earth.run) return this.startStage(d.earth.run.stageId, { fresh: false });
      this.toMap();
    },
    /* opts.replay: 설정에서 '튜토리얼 다시 하기' — 끝나면 지도로 돌아감 */
    startTutorial(opts) { MG.Core.setScene(new MG.StageScene(), { tutorial: true, replay: !!(opts && opts.replay) }); },
    skipTutorial() {
      const sc = MG.Core.scene;
      if (sc && sc.tutorial && sc.tutReplay) { if (MG.Q.open || MG.Dialog.open) return; MG.UI.toast('튜토리얼을 마치고 지도로 돌아갑니다', 'info'); return this.toMap(); }
      MG.State.d.tutorialDone = true; MG.State.markDirty(true);
      if (MG.Q.open || MG.Dialog.open) return;
      MG.UI.toast('튜토리얼을 건너뜁니다. 지금부터 극상 난도입니다.', 'warn');
      this.startStage(MG.Data.stages[0].id);
    },
    /* 챕터 상태: cleared | open | locked (지도와 같은 규칙: 순서대로 열림) */
    stageStatus(s) {
      const d = MG.State.d;
      if (d.earth.cleared[s.id]) return 'cleared';
      if (s.index === 0 || d.earth.cleared[MG.Data.stages[s.index - 1].id]) return 'open';
      return 'locked';
    },
    /* 구간 이동 전 저장: 현재 스테이지의 마지막 체크포인트·목숨·HP·능력·학습 기록을 그대로 저장 */
    saveBeforeMove() {
      const d = MG.State.d;
      if (!d.nickname) return false;
      MG.State.markDirty();
      const ok = MG.Save.autosave();
      MG.UI.toast(ok ? '진행 상황을 저장했어요 (마지막 체크포인트)' : '저장하지 못했어요 — 저장 공간을 확인해 주세요', ok ? 'ok' : 'warn');
      return ok;
    },
    /* 처음 이야기(프롤로그)로: 타이틀이 아니라 미대 낙방 장면부터. 진행 기록은 지우지 않음 */
    async replayPrologue() {
      const d = MG.State.d;
      MG.Core.setScene(new MG.MapScene());
      if (MG.Core.scene.ui) MG.Core.scene.ui.remove();
      await MG.Story.play('prologue', { music: 'title' });
      if (MG.Core.scene && MG.Core.scene.name !== 'map') return; // 이야기 도중 다른 곳으로 이동한 경우
      d.prologueSeen = true; MG.State.markDirty(true);
      if (!d.tutorialDone) return this.startTutorial();   // 처음 흐름 그대로: 프롤로그 → 튜토리얼
      this.toMap();                                       // 이미 진행한 사람은 지도로 (진행 그대로)
    },
    /* 챕터 선택: 잠긴 챕터는 열지 않음. 다른 챕터의 체크포인트는 보관해 두었다가 돌아오면 이어서 */
    jumpToStage(id) {
      const d = MG.State.d, s = MG.Data.stageMap[id];
      if (!s || this.stageStatus(s) === 'locked') return false;
      const sc = MG.Core.scene;
      if (sc && sc.tutorial && !d.tutorialDone) d.tutorialDone = true; // 튜토리얼 도중 챕터로 = 건너뛰기와 같음
      const resume = (d.earth.run && d.earth.run.stageId === id && !d.earth.run.bossRush) || !!(d.earth.parked && d.earth.parked[id]);
      this.startStage(id, resume ? { fresh: false } : {});
      return true;
    },
    startStage(id, opts) {
      opts = opts || {};
      const d = MG.State.d, E = d.earth;
      E.parked = E.parked || {};
      // 다른 챕터로 옮길 때 진행 중 기록(체크포인트·목숨·HP)을 지우지 않고 보관
      if (E.run && (E.run.stageId !== id || opts.bossRush || E.run.bossRush)) { // 보스 재전투 기록은 보관하지 않음
        if (!E.run.bossRush) E.parked[E.run.stageId] = { run: E.run, lives: E.lives, hp: E.hp, at: Date.now() };
        E.run = null;
      }
      // 보관해 둔 기록이 있으면 그 체크포인트에서 이어서
      if (!opts.bossRush && !E.run && E.parked[id]) {
        const pk = E.parked[id]; delete E.parked[id];
        E.run = pk.run; E.lives = pk.lives; E.hp = pk.hp; opts.fresh = false;
      }
      if (opts.bossRush) { d.earth.run = null; }
      MG.Core.setScene(new MG.StageScene(), Object.assign({ stageId: id }, opts));
      if (opts.bossRush) {
        const sc = MG.Core.scene;
        sc.run.bossRush = true;
        if (sc.arena) { sc.run.checkpoint = { x: sc.arena.x0 + 120, y: sc.arena.groundY }; sc._respawn(); sc.mission.steps.forEach((s) => { if (s.id !== 'boss') s.done = true; }); MG.UI.hud.mission('보스 재전투'); }
      }
      if (opts.fromTutorial) setTimeout(() => { MG.Dialog.bark('여기부턴 진짜야. 맞으면 HP가 줄고, HP가 바닥나거나 문제를 틀리면 목숨이 하나 줄어.', 'ink', 5); MG.UI.hud.highlight('hp'); setTimeout(() => MG.UI.hud.highlight('lives'), 600); }, 1200);
    },
    toMap() { MG.Core.setScene(new MG.MapScene()); },
    goHell() { MG.Core.setScene(new MG.HellScene()); },
    goBbakji() { MG.Core.setScene(new MG.BbakjiScene()); },
    returnFromHell() {
      const d = MG.State.d;
      d.hell.pending = false;
      d.hell.bbakji.active = false;
      const sid = d.hell.returnStage || d.earth.currentStage;
      MG.State.setWorld('earth');
      MG.State.restoreEarth();       // 이승 복귀: 목숨 7개·HP 100%, 진행 기록(클리어·체크포인트)은 보존
      d.location = 'stage';
      MG.State.markDirty(true);
      MG.UI.toast('이승으로 돌아왔다 — 마지막 체크포인트에서 다시 시작', 'ok');
      this.startStage(sid, { fresh: false });
    },
    startHeaven(tier) {
      if (!MG.State.allStagesCleared) { MG.UI.alert('천국의 문', '이승의 모든 역사 스테이지를 클리어해야 들어갈 수 있습니다.'); return; }
      MG.Core.setScene(new MG.HeavenScene(), { tier });
    },
    async ending(replay) {
      const d = MG.State.d;
      MG.Core.setScene(new MG.MapScene());
      if (MG.Core.scene.ui) MG.Core.scene.ui.remove();
      await MG.Story.play('ending', { music: 'ending' });
      if (!replay) {
        d.endingSeen = true; d.heaven.cleared = true; d.endingAt = Date.now();
        ['skin:gold', 'trail:gold', 'trail:aurora', 'title:한국사 신', 'victory:spin'].forEach((x) => { const [k, v] = x.split(':'); MG.State.unlock(k, v); });
        d.rewards.title = '한국사 신';
        MG.State.markDirty(true);
      }
      await MG.UI.alert('한국사 신 — ' + MG.State.nick, '엔딩 기록이 저장되었습니다. 보상: 칭호 「한국사 신」, 스킨 「한국사 신」, 금빛·오로라 잔상, 회전 승리 동작. 지도에서 모든 스테이지 재도전, 보스 재전투, 최종 심판 재전투로 최고 기록을 갱신할 수 있습니다.');
      this.toMap();
    },
    review(list) { MG.Core.setScene(new MG.ReviewScene(), { list }); }
  };

  MG.Game = Game;
  window.addEventListener('DOMContentLoaded', () => Game.boot());
})();

</script>
