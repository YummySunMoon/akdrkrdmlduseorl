items":["황국 신민 서사 제정","국가 총동원법 제정","일본식 성명 강요 시작","국민학교령 제정","조선어 학회 사건"],"labels":["1937","1938","1940","1941","1942"],"explain":"1937 황국 신민 서사 → 1938 국가 총동원법 → 1940 일본식 성명 → 1941 국민학교령(p.54 연표) → 1942 조선어 학회 사건(p.48, 56)."},{"id":"s10-q01","stage":"s10","pages":[60],"story":"1930년대 무장 투쟁","concepts":["한국 독립군"],"importance":"A","marks":["네모 박스","형광펜","지도 체크"],"type":"mc","difficulty":4,"stem":"한국 독립군에 대한 설명으로 옳은 것은?","options":["남만주의 조선 혁명당이 편성하였다.","양세봉이 이끌며 영릉가 전투에서 승리하였다.","북만주에서 활약하던 한국 독립당이 결성하였고, 지청천이 이끌며 중국군과 연합하여 쌍성보·대전자령 등에서 일본군을 크게 물리쳤다.","중국 관내에서 결성된 최초의 한국인 무장 단체이다."],"answer":2,"why":["조선 혁명군이다.","조선 혁명군이다.","정답. (p.60).","조선 의용대(p.61)다."],"explain":"북만주: 한국 독립당 → 한국 독립군(지청천) — 쌍성보(1932)·대전자령(1933) / 남만주: 조선 혁명당 → 조선 혁명군(양세봉) — 영릉가(1932)·흥경성(1933)(p.60)."},{"id":"s10-q02","stage":"s10","pages":[60],"story":"1930년대 무장 투쟁","concepts":["조선 혁명군"],"importance":"A","marks":["네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"조선 혁명군에 대한 설명으로 옳은 것은?","options":["남만주에서 조선 혁명당이 편성하였고, 양세봉이 이끌며 중국군과 함께 영릉가·흥경성 일대에서 승리를 거두었다.","북만주의 한국 독립당이 결성하여 쌍성보에서 승리하였다.","중국 관내에서 결성된 최초의 한국인 무장 단체이다.","지청천이 이끌었으며 그는 이후 한국광복군 총사령관이 되었다."],"answer":0,"why":["정답. (p.60).","한국 독립군이다.","조선 의용대다.","지청천은 한국 독립군을 이끌었다."],"explain":"\"남만주에서는 조선 혁명당이 조선 혁명군을 편성하였다. 양세봉이 이끄는 조선 혁명군은 중국군과 함께 영릉가, 흥경성 일대에서 승리를 거두었다.\"(p.60)"},{"id":"s10-q03","stage":"s10","pages":[61],"story":"1930년대 무장 투쟁","concepts":["동북 항일 연군"],"importance":"B","marks":["네모 박스","손글씨 \"1936\""],"type":"mc","difficulty":4,"stem":"다음 전투에 대한 설명으로 옳은 것은?\n\"함경남도 보천보를 습격하여 우체국, 면사무소에 불을 지름.\" (「동아일보」, 1937)","options":["동북 항일 연군의 한국인 유격대가 조직한 조국 광복회가 국내에 들어와 일제의 행정 기관을 공격하였다.","한국 독립군이 중국군과 연합하여 일으켰다.","조선 의용대 화북 지대가 일으켰다.","한국광복군이 국내 진공 작전으로 벌였다."],"answer":0,"why":["정답.  보천보 전투(1937)(p.61).","한국 독립군은 북만주에서 쌍성보·대전자령 전투를 벌였다.","화북 지대는 호가장 전투 등을 벌였다.","국내 진공 작전은 무산되었다."],"explain":"중국 공산당의 반일 통일 전선 주장 → 동북 항일 연군 조직, 한국인 가담 → 한국인 유격대가 조국 광복회 조직 → 국내 진입, 일제 행정 기관 공격(보천보 전투, 1937)(p.61)."},{"id":"s10-q04","stage":"s10","pages":[61],"story":"1930년대 무장 투쟁","concepts":["조선 민족 혁명당"],"importance":"A","marks":["네모 박스","형광펜","손글씨 \"민족 유일당 운동\""],"type":"mc","difficulty":4,"stem":"조선 민족 혁명당에 대한 설명으로 옳은 것은?","options":["1935년 난징에서 결성된 중국 관내 최대 규모의 민족 통일 전선 정당으로, 민족주의 세력과 사회주의 세력 대부분을 통합하였다.","김구 등 임시 정부 세력이 주도하여 결성하였다.","중국 공산당 내에서 반일 통일 전선을 위해 조직되었다.","1938년 중국 국민당 정부의 지원으로 창설된 무장 부대이다."],"answer":0,"why":["정답. (p.61).","김구 등은 임시 정부 약화를 우려하여 참여하지 않았다.","동북 항일 연군이다.","조선 의용대다."],"explain":"\"독립운동 세력을 통합하여 난징에서 조선 민족 혁명당이 세워졌다(1935). 민족주의 세력과 사회주의 세력 대부분을 통합한 중국 관내 최대 규모의 민족 통일 전선 정당이었다.\"(p.61)"},{"id":"s10-q05","stage":"s10","pages":[61],"story":"1930년대 무장 투쟁","concepts":["조선 의용대"],"importance":"A","marks":["네모 박스","별표형 표시","손글씨 \"김원봉\""],"type":"mc","difficulty":4,"stem":"조선 의용대에 대한 설명으로 옳은 것은?","options":["1938년 조선 민족 전선 연맹 아래, 중국 국민당 정부의 지원을 받아 창설되었다.","1940년 충칭에서 임시 정부의 정규군으로 창설되었다.","보천보를 공격하여 일제 행정 기관을 파괴하였다.","중국 공산당의 지원으로 만주에서 결성되었다."],"answer":0,"why":["정답. (p.61).","한국광복군이다.","동북 항일 연군 한국인 유격대이다.","중국 관내(한커우)에서 국민당 정부 지원으로 창설되었다."],"explain":"\"중·일 전쟁이 일어나자 조선 민족 혁명당은 다른 단체들을 통합하여 조선 민족 전선 연맹을 결성하였다. 그리고 중국 국민당 정부의 지원을 받아 조선 민족 전선 연맹 아래에 조선 의용대를 창설하였다(1938).\"(p.61)"},{"id":"s10-q06","stage":"s10","pages":[61],"story":"1930년대 무장 투쟁","concepts":["조선 민족 혁명당"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"김구 등이 조선 민족 혁명당에 참여하지 않은 이유로 교과서에 서술된 것은?","options":["대한민국 임시 정부의 약화를 우려하였기 때문이다.","사회주의 세력이 참여하지 않았기 때문이다.","중국 국민당 정부가 반대하였기 때문이다.","만주에서 무장 투쟁을 계속하기 위해서였다."],"answer":0,"why":["정답. ","사회주의 세력 대부분이 통합되었다.","교과서에 없는 내용이다.","교과서에 없는 내용이다."],"explain":"\"김구 등은 대한민국 임시 정부의 약화를 우려하여 참여하지 않았다.\"(p.61)"},{"id":"s10-q07","stage":"s10","pages":[61,62],"story":"1930년대 무장 투쟁","concepts":["조선 의용대"],"importance":"D","marks":["형광펜","지도 캡션 형광펜"],"type":"mc","difficulty":4,"stem":"조선 의용대의 이후 활동으로 옳은 것은?","options":["일부는 화북으로 이동하여 조선 의용대 화북 지대를 결성하고 호가장 전투 등에서 큰 성과를 거두었다.","전원이 한국광복군에 편입되어 화북 지대는 존재하지 않았다.","남만주에서 영릉가 전투를 벌였다.","1935년 조선 민족 혁명당을 창당하였다."],"answer":0,"why":["정답. (p.61).","화북으로 이동하지 않은 \"일부\"만 1942년 한국광복군에 합류하였다(p.62).","조선 혁명군이다.","조선 민족 혁명당(1935)이 조선 의용대(1938)보다 먼저다."],"explain":"\"조선 의용대의 일부는 일제와 직접 맞서 싸우기 위해 화북으로 이동하여 조선 의용대 화북 지대를 결성하였다. 이후 조선 의용대 화북 지대는 호가장 전투 등에서 큰 성과를 거두었다.\"(p.61)"},{"id":"s10-q08","stage":"s10","pages":[60,61],"story":"1930년대 무장 투쟁","concepts":["한국 독립군","조선 혁명군","동북 항일 연군"],"importance":"A","marks":["네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"1930년대 만주 지역의 무장 투쟁에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?","options":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":2,"why":["ㄹ도 옳다.","ㄷ은 틀렸다.","정답. ","ㄷ은 틀렸다.","ㄷ은 틀렸다."],"explain":"ㄱ 1931 만주 침략, 이듬해 만주국 / ㄴ 지청천 / ㄷ 쌍성보·대전자령은 한국 독립군 / ㄹ 조국 광복회(p.60–61).","statements":["ㄱ. 1931년 일제는 만주를 침략하고 이듬해에 만주국을 세웠다.","ㄴ. 한국 독립군은 지청천이 이끌었다.","ㄷ. 조선 혁명군은 쌍성보·대전자령 전투에서 승리하였다.","ㄹ. 동북 항일 연군의 한국인 유격대는 조국 광복회를 조직하였다."],"shuffle":false},{"id":"s10-r01","stage":"s10","pages":[60,61],"story":"1930년대 무장 투쟁","concepts":["한국 독립군","조선 혁명군","조선 의용대"],"importance":"A","marks":["네모 박스","형광펜","지도 체크"],"type":"order","role":"riddle","difficulty":4,"stem":"기록의 문: 1930년대 무장 투쟁의 기록을 순서대로 배열하라.","items":["일제의 만주 침략","영릉가 전투","대전자령 전투","조선 민족 혁명당 결성","보천보 전투","조선 의용대 창설"],"labels":["1931","1932","1933","1935","1937","1938"],"explain":"1931 만주 사변 → 1932 영릉가 → 1933 대전자령 → 1935 조선 민족 혁명당 → 1937 보천보 → 1938 조선 의용대(p.60–61, 단원 연표·지도)."},{"id":"s10-r02","stage":"s10","pages":[60,61],"story":"1930년대 무장 투쟁","concepts":["한국 독립군","조선 혁명군","동북 항일 연군","조선 의용대"],"importance":"A","marks":["네모 박스","형광펜"],"type":"match","role":"riddle","difficulty":4,"stem":"기억의 미궁: 부대와 지휘·전투 기록을 정확히 연결하라.","pairs":[["한국 독립군","지청천 · 쌍성보·대전자령"],["조선 혁명군","양세봉 · 영릉가·흥경성"],["동북 항일 연군 한국인 유격대","조국 광복회 · 보천보 전투"],["조선 의용대","조선 민족 전선 연맹 · 화북 지대 호가장 전투"]],"explain":"교과서 p.60–61."},{"id":"s11-q01","stage":"s11","pages":[63],"story":"독립을 위한 노력","concepts":["삼균주의","대한민국 건국 강령"],"importance":"S","marks":["체크","네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"다음 사상에 대한 설명으로 옳은 것은?\n\"개인과 개인, 민족과 민족, 국가와 국가 간의 균등을 실현하기 위해 정치·경제·교육의 균등을 이루어 민족주의 계열 인사들은 1920년에 평양에서 조선 물산 장려회를 조직하고 토산품 애용 운동을 펼쳤다."},{"page":34,"topic":"물산 장려 운동","text":"일부 사회주의자를 중심으로 물산 장려 운동이 자본가의 이익만을 위한 것이라는 비판도 제기되었다."},{"page":35,"topic":"민립 대학 설립 운동","text":"일제는 보통 교육과 실업 교육을 주로 하였고 고등 교육의 기회는 거의 주지 않았다."},{"page":35,"topic":"민립 대학 설립 운동","text":"1922년에 이상재를 중심으로 서울에서 조선 민립 대학 기성회가 조직되었으며 전국적으로 모금 운동을 펼쳤다."},{"page":35,"topic":"민립 대학 설립 운동","text":"일제가 방해하고 잇따른 자연재해로 모금 운동이 어려워지면서 민립 대학 설립 운동은 실패하였다."},{"page":35,"topic":"민립 대학 설립 운동","text":"일제는 한국에 있는 일본인을 교육하고 한국인의 교육열을 무마하기 위해 1924년에 경성 제국 대학을 설립하였다."},{"page":35,"topic":"문맹 퇴치 운동","text":"조선일보는 1929년부터 아는 것이 힘, 배워야 산다라는 구호 아래 문자 보급 운동을 펼쳤다."},{"page":35,"topic":"문맹 퇴치 운동","text":"1930년대 초에는 동아일보가 배우자, 가르치자, 다 함께 브나로드라는 구호 아래 학생이 참여하는 브나로드 운동을 벌였다."},{"page":35,"topic":"문맹 퇴치 운동","text":"일제는 이들 운동이 민족주의적 성격을 보인다는 구실을 내세우며 1935년부터 모두 금지하였다."},{"page":36,"topic":"민족 운동의 분화","text":"1925년에는 사회주의 계열 조직들이 통합하여 조선 공산당을 결성하였고, 민족 운동의 노선은 민족주의 계열과 사회주의 계열로 나뉘었다."},{"page":36,"topic":"민족 유일당 운동","text":"분열된 독립운동 진영을 통합하자는 민족 유일당 운동이 나타났고, 국외에서는 3부 통합 운동이 전개되었다."},{"page":36,"topic":"민족 유일당 운동","text":"국내에서는 일부 민족주의자들이 일제와 타협하여 자치권을 얻을 것을 주장하였다(자치론)."},{"page":36,"topic":"민족 유일당 운동","text":"비타협적 민족주의자들은 자치론자를 비판하면서 사회주의 세력과 손을 잡으려는 움직임을 보였다."},{"page":36,"topic":"민족 유일당 운동","text":"1926년 7월에 비타협적 민족주의 세력과 일부 사회주의 세력이 연합하여 조선 민흥회를 만들었다."},{"page":36,"topic":"민족 유일당 운동","text":"그해 11월에는 사회주의 계열 단체인 정우회가 비타협적 민족주의 세력과 협력할 것을 주장하였다(정우회 선언)."},{"page":37,"topic":"신간회","text":"1927년 2월 비타협적 민족주의 세력과 사회주의 세력이 연합한 최대 규모의 합법적인 민족 협동 전선 단체인 신간회가 결성되었다."},{"page":37,"topic":"신간회","text":"신간회는 회장에 이상재, 부회장에 홍명희를 선출하였고, 서울에 본부를 두고 전국 각지와 만주, 일본 등에도 지회를 두었다."},{"page":37,"topic":"신간회","text":"1929년 광주 학생 항일 운동이 일어나자 신간회는 진상 조사단을 파견하였다."},{"page":37,"topic":"신간회","text":"1931년 5월 전체 대회에서 해소가 결정되었다. 해소는 조직의 해체가 아닌 다른 단체로의 전환이라는 의미이다."},{"page":38,"topic":"6·10 만세 운동","text":"사회주의 계열 단체와 천도교, 학생들은 순종의 장례일인 1926년 6월 10일에 대규모 만세 운동을 벌일 계획을 세웠다."},{"page":38,"topic":"6·10 만세 운동","text":"민족주의 계열과 사회주의 계열이 함께 만세 시위를 준비하면서 통일된 독립운동의 필요성을 절실히 느끼게 되었고, 이는 민족 유일당 운동에 영향을 주었다."},{"page":39,"topic":"광주 학생 항일 운동","text":"1929년 10월 광주에서 출발한 통학 열차가 나주에 도착하였을 때 일본인 남학생이 한국인 여학생을 희롱하는 사건이 일어났다."},{"page":39,"topic":"광주 학생 항일 운동","text":"광주에서 시작된 항일 학생 운동은 목포와 나주로 확산되었으며, 12월에는 서울 지역까지 확대되었다."},{"page":39,"topic":"광주 학생 항일 운동","text":"학생들은 식민지 교육 철폐, 일본 제국주의 타도, 민족 해방을 주장하였다."},{"page":40,"topic":"관동 대학살","text":"1923년 9월 1일 일본 관동 지방에서 대지진이 일어났고, 지진의 혼란 속에서 6천 명 이상의 한국인이 살해당하는 관동 대학살이 일어났다."},{"page":42,"topic":"도시와 농촌의 변화","text":"일제 강점기 한반도를 X자로 관통하는 철도망이 완성되었다."},{"page":43,"topic":"도시와 농촌의 변화","text":"일제는 농촌 경제가 피폐해지고 소작 쟁의가 확산되자, 농촌 사회를 통제하여 식민지 지배 체제를 안정시키기 위해 농촌 진흥 운동을 전개하였다(1932)."},{"page":43,"topic":"도시와 농촌의 변화","text":"일제는 농촌의 어려움이 농민들의 생활 태도 때문이라고 왜곡하면서 근면과 절약만 강조하였다."},{"page":43,"topic":"동양 척식 주식회사","text":"1908년 한국의 식산흥업을 지원한다는 명분으로 동양 척식 주식회사가 설립되어 일제의 한국 경제 침탈에 앞장섰으며, 일제 강점기 한국 최대의 지주가 되었다."},{"page":44,"topic":"농민 운동","text":"1923년 전라도 암태도 소작 쟁의에서는 소작인들이 지주와 일본 경찰의 탄압에 맞서 소작료를 낮추는 성과를 거두었다."},{"page":44,"topic":"농민 운동","text":"암태 소작인회와 지주가 소작료를 40%로 내리기로 합의하였다."},{"page":44,"topic":"농민 운동","text":"1927년에는 전국적인 농민 운동 단체인 조선 농민 총동맹이 결성되었다."},{"page":45,"topic":"노동 운동","text":"노동 운동은 1929년 원산 총파업으로 절정을 이루었다."},{"page":45,"topic":"노동 운동","text":"1928년 원산의 한 석유 회사에서 일본인 감독관이 한국인 노동자를 구타하면서 시작된 파업은 1929년 1월 원산 지역 노동자 총파업으로 이어졌다."},{"page":46,"topic":"여성 운동","text":"1927년 5월 신간회 결성에 자극을 받아 조선 여자의 공고한 단결과 지위 향상을 목표로 하는 근우회가 창립되었다."},{"page":46,"topic":"여성 운동","text":"근우회는 민족주의 계열 및 사회주의 계열 여성 운동을 망라한 일제 강점기 최대의 여성 단체였고, 기관지 근우를 발간하였다."},{"page":47,"topic":"소년 운동","text":"1921년 방정환 등이 천도교 소년회를 조직하였고, 어린이라는 용어를 만들었으며, 1922년 5월 1일을 어린이날로 정하고 기념식을 거행하였다."},{"page":47,"topic":"형평 운동","text":"1923년 경남 진주에서 조선 형평사가 조직되어 백정에 대한 사회적 차별을 없애고 저울처럼 평등한 사회를 만들겠다는 형평 운동을 전개하였다."},{"page":47,"topic":"형평 운동","text":"형평 운동에 반대하여 불매 운동을 벌이거나 백정이 다니는 학교에 자녀를 등교시키지 않는 사람도 있었다."},{"page":48,"topic":"국어 연구","text":"1921년 조선어 연구회가 조직되어 한글 잡지를 발행하고 가갸날(한글날)을 제정하였다."},{"page":48,"topic":"국어 연구","text":"1931년 조선어 연구회는 조선어 학회로 이름을 바꾸고 한글 맞춤법 통일안과 표준어를 제정하고 조선말 큰사전 편찬에 나섰다."},{"page":48,"topic":"국어 연구","text":"일제는 1942년 조선어 학회 사건을 조작하여 조선어 학회 회원들을 체포·투옥하고 강제로 해산하였다."},{"page":48,"topic":"역사 연구","text":"식민 사관에는 타율성론, 정체성론, 당파성론이 있다."},{"page":48,"topic":"역사 연구","text":"신채호는 고대사 연구에 집중하여 민족 중심의 자주적 역사관을 강조하였고, 박은식은 근대사 연구를 통하여 민족혼을 강조하였다."},{"page":48,"topic":"역사 연구","text":"백남운 등 사회경제 사학자들은 유물 사관의 입장에서 한국사가 세계사적 보편성에 따라 발전하였음을 주장하여 식민 사관의 정체성론을 반박하였다."},{"page":48,"topic":"역사 연구","text":"이병도, 손진태 등 실증주의 사학자들은 진단 학회를 창립하고 진단 학보를 발행하였다."},{"page":54,"topic":"병참 기지화 정책","text":"일제는 대공황 이후 일본과 만주, 한국을 블록으로 묶어 경제 위기에서 벗어나려 하였다."},{"page":54,"topic":"병참 기지화 정책","text":"일제는 만주를 농업과 원료 공급 지대로 삼았으며, 한국을 군수품 보급 기지로 삼으려 하였다."},{"page":54,"topic":"병참 기지화 정책","text":"중·일 전쟁 발발 이후 일제는 전쟁에 필요한 물자를 생산하기 위해 병참 기지화 정책을 본격적으로 실시하였다."},{"page":54,"topic":"전쟁 동원 체제","text":"1938년 일제는 국가 총동원법을 제정하여 본격적으로 침략 전쟁에 필요한 인력과 물자 수탈에 나섰다."},{"page":54,"topic":"전쟁 동원 체제","text":"국민정신 총동원 운동의 말단 기구인 애국반은 10개 집을 하나로 묶어 조직하였다."},{"page":55,"topic":"인력 수탈","text":"1938년에 지원병제를 실시하였고, 1943년에는 학도 지원병제를, 1944년에는 징병제를 실시하였다."},{"page":55,"topic":"인력 수탈","text":"1939년에 국민 징용령을 실시하였고, 1944년에는 여자 정신 근로령을 발표하여 여성의 노동력도 수탈하였다."},{"page":55,"topic":"인력 수탈","text":"일제는 한국을 비롯한 식민지와 점령지의 여성들을 일본군 위안부로 강제 동원하였다."},{"page":55,"topic":"물자 수탈","text":"일제는 산미 증식 계획을 다시 시행하고 식량 배급제를 실시하였으며, 공출이라는 이름으로 식량뿐만 아니라 농기구, 수저 등 각종 생활용품을 빼앗았다."},{"page":55,"topic":"물자 수탈","text":"친일 반민족 행위자들은 자발적으로 군수 물자를 바치는 등 일제의 침략 전쟁에 적극 협력하였다."},{"page":56,"topic":"민족 말살 정책","text":"일제는 내선일체와 일선동조론을 주장하는 등 한국인을 일본인으로 동화시키려고 하였다."},{"page":56,"topic":"민족 말살 정책","text":"일제는 어린 학생에게까지 황국 신민 서사를 외우게 하였고, 궁성요배와 신사 참배를 강요하였으며, 소학교를 국민학교로 바꾸었다."},{"page":56,"topic":"민족 말살 정책","text":"일제는 한국어 사용을 금지하고 조선어 과목을 사실상 폐지하였으며, 한글 신문을 폐간하고, 성과 이름을 일본식으로 바꿀 것을 강요하였다."},{"page":60,"topic":"1930년대 무장 투쟁","text":"지청천이 이끄는 한국 독립군은 중국군과 연합하여 쌍성보, 대전자령 등에서 일본군을 크게 물리쳤다."},{"page":60,"topic":"1930년대 무장 투쟁","text":"남만주에서는 조선 혁명당이 조선 혁명군을 편성하였고, 양세봉이 이끄는 조선 혁명군은 중국군과 함께 영릉가, 흥경성 일대에서 승리를 거두었다."},{"page":61,"topic":"1930년대 무장 투쟁","text":"동북 항일 연군의 한국인 유격대는 조국 광복회를 조직하였고, 국내에 들어와 일제의 행정 기관을 공격하였다(보천보 전투, 1937)."},{"page":61,"topic":"1930년대 무장 투쟁","text":"1935년 난징에서 조선 민족 혁명당이 세워졌고, 1938년 중국 국민당 정부의 지원을 받아 조선 민족 전선 연맹 아래에 조선 의용대가 창설되었다."},{"page":62,"topic":"독립을 위한 노력","text":"1940년 충칭에 정착한 대한민국 임시 정부는 지청천을 사령관으로 정규군인 한국광복군을 창설하였다."},{"page":63,"topic":"독립을 위한 노력","text":"1941년 대한민국 임시 정부는 조소앙의 삼균주의에 기초한 대한민국 건국 강령을 발표하였다."},{"page":63,"topic":"독립을 위한 노력","text":"한국광복군은 미국과 협약을 맺어 국내 진공 작전을 준비하였으나, 일제가 예상 밖으로 일찍 항복하면서 국내 진공 작전은 무산되었다."}]},"minjun":{"_note":"김민준 대사 데이터. 역사 설명은 모두 교과서 범위(HISTORY_SCOPE.md)와 기존 문항 해설(history_questions.json)에서 가져왔다. mj=김민준 표정(normal·smug·grin·surprised·serious·sweat·talk), ink=먹물 표정(normal·smug·worry·annoyed·surprised).","stageTalk":{"s01":{"joke":{"text":"오, 광고판 글씨 다 고쳤네? 역시 미대 지망생이라 글씨는 잘 쓴다.","mj":"smug"},"core":[{"text":"3·1 운동 이후 일부 지식인들은 '당장 독립은 어렵다'고 봤어. 그래서 먼저 실력을 키우자는 실력 양성 운동이 일어난 거고.","mj":"talk"},{"text":"산업은 물산 장려 운동, 교육은 민립 대학 설립 운동이랑 문맹 퇴치 운동. 이렇게 두 갈래로 묶어.","mj":"talk"}],"confuse":[{"text":"헷갈리는 데 하나. 물산 장려 운동은 1920년 평양에서 조만식 등이 시작했는데, 토산품 값이 오르니까 일부 사회주의자들이 '자본가 이익만 챙긴다'고 비판했어. 비판한 쪽이 사회주의자야.","mj":"smug"}],"detail":[{"text":"민립 대학은 1922년 이상재 중심의 조선 민립 대학 기성회가 전국 모금을 했는데, 일제 방해랑 잇따른 자연재해로 실패했어.","mj":"talk"},{"text":"일제는 한국인의 교육열을 무마하려고 1924년에 경성 제국 대학을 세웠고.","mj":"talk"},{"text":"문맹 퇴치는 「조선일보」 문자 보급 운동(1929년부터), 「동아일보」 브나로드 운동(1930년대 초). 둘 다 1935년부터 금지됐어.","mj":"talk"}],"outro":{"text":"오늘 수업 끝. 수강료는 외상으로 해 줄게.","mj":"grin"}},"s02":{"joke":{"text":"회관이 다시 하나가 됐네. 너랑 먹물도 이렇게 사이좋으면 좋을 텐데.","mj":"smug","ink":"annoyed"},"core":[{"text":"1925년 조선 공산당이 생기면서 민족 운동 노선이 민족주의 계열이랑 사회주의 계열로 갈라졌어. 다시 하나로 뭉치자는 게 민족 유일당 운동이야.","mj":"talk"},{"text":"그 결과 1927년 2월, 비타협적 민족주의 세력이랑 사회주의 세력이 손잡고 신간회를 만들었지. 최대 규모의 합법적인 민족 협동 전선 단체.","mj":"talk"}],"confuse":[{"text":"순서 함정! 조선 공산당(1925) → 조선 민흥회(1926. 7.) → 정우회 선언(1926. 11.) → 신간회(1927. 2.). 정우회 선언이 신간회보다 먼저야.","mj":"smug"}],"detail":[{"text":"그 무렵 이광수의 「민족적 경륜」(1924)처럼 일제와 타협해 자치권을 얻자는 자치론이 나왔거든. 그래서 신간회는 '비타협적' 민족주의 쪽이랑 손잡은 거야.","mj":"talk"},{"text":"회장 이상재, 부회장 홍명희. 1929년 광주 학생 항일 운동 때 진상 조사단을 보냈고, 1931년 5월에 해소됐어.","mj":"talk"}],"outro":{"text":"다음에 또 보자. 아, 내가 찾아갈 거니까 기다리진 마.","mj":"grin"}},"s03":{"joke":{"text":"통학 열차 타고 오느라 고생했어. 나는 포탈 타고 와서 하나도 안 막혔는데.","mj":"smug"},"core":[{"text":"6·10 만세 운동은 1926년, 순종의 장례일에 일어났어. 민족주의 계열이랑 사회주의 계열이 함께 준비했다는 게 포인트.","mj":"talk"},{"text":"광주 학생 항일 운동은 1929년 10월 통학 열차 사건에서 시작해서 목포·나주를 거쳐 12월엔 서울까지 번졌어.","mj":"talk"}],"confuse":[{"text":"신간회가 광주 학생 항일 운동 때 진상 조사단을 보냈다는 거, 단원 넘나들며 자주 나와. 그리고 같은 1929년이라도 원산 총파업은 1월, 광주 학생 항일 운동은 10월!","mj":"smug"}],"detail":[{"text":"6·10 만세 운동(1926), 광주 학생 항일 운동(1929), 문자 보급 운동(1929년부터). 이름이 섞여 나오니까 연도랑 같이 묶어 둬.","mj":"talk"},{"text":"…중간에 지나온 추모 공간은 1923년 관동 대지진 때 학살당한 한국인들을 기억하는 곳이야. 거기선 나도 장난 안 쳐.","mj":"serious"}],"outro":{"text":"추모 공간 조용히 지나가 줘서 고마워. 나 간다.","mj":"serious"}},"s04":{"joke":{"text":"골렘 장부 찢는 거 봤어. 회계 감사 제대로 하던데?","mj":"grin"},"core":[{"text":"1908년 '한국의 식산흥업 지원'을 명분으로 동양 척식 주식회사가 세워졌어. 일본인 이민, 토지 조사 사업, 산미 증식 계획에 앞장서서 결국 한국 최대의 지주가 됐지.","mj":"talk"},{"text":"동척은 그 땅을 소작시키고 높은 소작료를 거뒀어. 그래서 다음 스테이지에서 소작 쟁의가 나오는 거고.","mj":"talk"}],"confuse":[{"text":"농촌 진흥 운동은 1932년. 농촌이 피폐해지고 소작 쟁의가 퍼지니까 일제가 농촌을 통제하려고 벌인 거야. 농촌의 어려움을 농민 생활 태도 탓으로 돌렸다는 게 함정 포인트.","mj":"smug"}],"detail":[{"text":"동척 땅 그래프 기억나? 1908년 11천 정보에서 1915년 73천 정보로 확 늘었지. 그 구간이 토지 조사 사업 시기야.","mj":"talk"},{"text":"철도는 한반도를 X자로 가로지르게 완성됐어. 지도 문제로 나오면 X자 모양부터 떠올려.","mj":"talk"}],"outro":{"text":"장부는 내가 대신 태워… 아니다, 기록은 태우면 안 되지. 간다.","mj":"sweat"}},"s05":{"joke":{"text":"기울어진 저울 바로잡았네. 너 생각보다 정의로운 타입이다?","mj":"smug"},"core":[{"text":"1923년 암태도 소작 쟁의. 수확량의 70% 넘게 소작료로 내던 소작인들이 40%로 내리라고 맞섰고, 결국 40%로 합의했어.","mj":"talk"},{"text":"1927년엔 조선 농민 총동맹이 생겨서 농민 운동 규모가 커졌고, 노동 운동은 1929년 원산 총파업으로 절정을 찍었지.","mj":"talk"}],"confuse":[{"text":"원산 총파업 발단은 1928년, 석유 회사 일본인 감독관이 한국인 노동자를 때린 사건. 총파업은 1929년 1월. 발단 연도랑 총파업 연도를 바꿔서 내기 딱 좋아.","mj":"smug"}],"detail":[{"text":"원산 총파업은 국내외 노동 단체가 지지했는데도 일제가 경찰, 군대, 폭력배까지 동원해 탄압해서 실패했어.","mj":"talk"},{"text":"암태도는 '지주와 일본 경찰의 탄압에 맞서' 소작료를 낮췄다. 이 표현 그대로 기억해 둬.","mj":"talk"}],"outro":{"text":"70에서 40. 숫자 두 개만 챙겨 가. 나머지는 다음에.","mj":"grin"}},"s06":{"joke":{"text":"편견의 가면 벗기는 솜씨 좋더라. 내 가면도 벗겨 볼래? 농담이야. 나 가면 없어.","mj":"smug"},"core":[{"text":"1927년 5월, 신간회 결성에 자극받아 근우회가 생겼어. 목표는 '조선 여자의 공고한 단결과 지위 향상'. 민족주의·사회주의 계열 여성 운동을 다 아우른 일제 강점기 최대의 여성 단체야.","mj":"talk"},{"text":"조선 형평사는 1923년 경남 진주에서 생겼어. 백정 차별을 없애고 '저울처럼 평등한 사회'를 만들자는 형평 운동이지. 소년 운동은 1921년 방정환 등이 만든 천도교 소년회.","mj":"talk"}],"confuse":[{"text":"1927년 묶음: 신간회(2월), 근우회(5월), 조선 농민 총동맹. 형평사만 1923년으로 앞서 있어. 1922년 5월 1일은 어린이날 기념식.","mj":"smug"}],"detail":[{"text":"근우회는 기관지 「근우」를 내고 순회강연을 열었고, 노동·농민 운동 같은 다른 사회 운동도 도왔어.","mj":"talk"},{"text":"형평사가 생기자 반대하는 쪽은 불매 운동을 하고, 백정 자녀가 다니는 학교 등교를 거부하기도 했어. 차별이 그만큼 깊었다는 거지.","mj":"serious"}],"outro":{"text":"평등은 저울처럼. 오늘 명언 하나 건졌다. 간다.","mj":"grin"}},"s07":{"joke":{"text":"머리 셋 달린 식민 사관을 다 잘랐어? 나는 하나만 봐도 무서운데.","mj":"sweat"},"core":[{"text":"식민 사관은 세 개. 타율성론(남의 간섭으로만 움직였다), 정체성론(고대 단계에서 발전을 못 했다), 당파성론(늘 당파 싸움만 했다).","mj":"talk"},{"text":"여기 맞선 게 민족주의 사학이랑 사회경제 사학. 백남운은 유물 사관으로 한국사도 세계사의 보편성에 따라 발전했다고 해서 정체성론을 반박했어.","mj":"talk"}],"confuse":[{"text":"신채호는 「조선상고사」, 역사는 '아'와 '비아'의 투쟁. 박은식은 「한국통사」, '나라는 형체이고 역사는 정신'. 책이랑 말을 서로 바꿔서 내.","mj":"smug"}],"detail":[{"text":"말 쪽은 1921년 조선어 연구회가 「한글」을 내고 가갸날을 만들었고, 1931년 조선어 학회로 바꿔서 한글 맞춤법 통일안, 표준어 제정, 「조선말 큰사전」 편찬을 했어.","mj":"talk"},{"text":"1942년엔 일제가 조선어 학회 사건을 조작해서 회원들을 체포·투옥하고 강제로 해산시켰지.","mj":"serious"}],"outro":{"text":"책은 덮어도 기록은 남아. 나 간다.","mj":"normal"}},"s08":{"serious":true,"joke":{"text":"…여긴 좀 진지하게 갈게.","mj":"serious"},"core":[{"text":"대공황 이후 일제는 만주를 농업·원료 공급지로, 한국을 군수품 보급 기지로 삼았어. 중·일 전쟁 뒤엔 병참 기지화 정책이 본격화됐고, 북부는 광공업·중화학 공업, 남부는 경공업 중심이라 지역 격차가 깊어졌어.","mj":"serious"},{"text":"1938년 국가 총동원법으로 사람과 물자를 끌어갔어. 국민정신 총동원 운동의 말단 조직인 애국반은 10개 집을 하나로 묶어서 일상까지 통제했고.","mj":"serious"}],"confuse":[{"text":"병력 동원 순서: 1938 지원병제 → 1943 학도 지원병제 → 1944 징병제. 노동력은 1939 국민 징용령, 1944 여자 정신 근로령. 54~55쪽은 전부 시험 범위야.","mj":"serious"}],"detail":[{"text":"55쪽 강제 동원 현황 자료도 다시 봐. 숫자 하나하나가 끌려간 사람들이야.","mj":"serious"}],"outro":{"text":"이름까지 다 기억할 순 없어도, 무슨 일이 있었는지는 기억하자.","mj":"serious"}},"s09":{"serious":true,"joke":{"text":"아이들 이름 지켜 줬네. …잘했어. 진짜로.","mj":"serious"},"core":[{"text":"일제는 '내선일체', '일선동조론'을 내세워 한국인을 일본인으로 동화시키려 했어. 한국인을 침략 전쟁에 본격적으로 동원하려고 민족 말살 정책을 편 거야.","mj":"serious"},{"text":"1937년 황국 신민 서사를 어린 학생에게까지 외우게 했고, 1940년부터 일본식 성명을 강요했어(창씨개명). 1941년엔 소학교 이름을 '황국 신민 학교'라는 뜻의 국민학교로 바꿨고.","mj":"serious"}],"confuse":[{"text":"내선일체는 '일본(내)과 조선(선)이 하나', 일선동조론은 '조상이 같다'. 둘을 바꿔 묻는 문제 조심.","mj":"talk"}],"detail":[{"text":"연도 세트: 1937 황국 신민 서사, 1940 일본식 성명 강요 시작, 1941 국민학교령. 54쪽 연표에 다 있어.","mj":"talk"}],"outro":{"text":"이름은 지켜야 하는 거야. …갈게.","mj":"serious"}},"s10":{"joke":{"text":"밀정 그림자를 잡았다고? 나도 맨날 숨어 다니는데, 나는 착한 쪽이야. 아마도.","mj":"smug"},"core":[{"text":"1931년 만주 침략 뒤에 독립군이 중국군과 함께 싸웠어. 북만주는 지청천의 한국 독립군이 쌍성보·대전자령에서, 남만주는 양세봉의 조선 혁명군이 영릉가·흥경성에서 이겼지.","mj":"talk"},{"text":"중국 관내에선 1935년 난징에서 조선 민족 혁명당이 생겼어. 민족주의·사회주의 세력 대부분을 통합한 관내 최대의 민족 통일 전선 정당. 중·일 전쟁 뒤 1938년엔 조선 의용대를 만들었고.","mj":"talk"}],"confuse":[{"text":"북만주·한국 독립군·지청천 / 남만주·조선 혁명군·양세봉. 쌍성보·대전자령은 독립군, 영릉가·흥경성은 혁명군. 전투 이름을 서로 바꿔서 내.","mj":"smug"}],"detail":[{"text":"순서: 1931 만주 사변 → 1932 영릉가 → 1933 대전자령 → 1935 조선 민족 혁명당 → 1937 보천보 → 1938 조선 의용대.","mj":"talk"}],"outro":{"text":"그림자는 그림자끼리 알아보는 법이지. 농담. 간다.","mj":"grin"}},"s11":{"joke":{"text":"멈췄던 시계가 다시 돌아가네. 너 진짜 끝까지 왔다.","mj":"grin"},"core":[{"text":"1940년 충칭에 자리 잡은 대한민국 임시 정부가 지청천을 사령관으로 정규군인 한국광복군을 만들었어.","mj":"talk"},{"text":"1941년엔 조소앙의 삼균주의(정치·경제·교육의 균등)에 기초한 대한민국 건국 강령을 발표했지. 민주 공화정, 토지 개혁, 대기업 국유화, 무상 교육 같은 내용이 광복 뒤 정부 수립이랑 제헌 헌법에 영향을 줬어.","mj":"talk"}],"confuse":[{"text":"인물 바꿔치기 조심. 광복군 사령관은 지청천, 삼균주의는 조소앙, 1942년에 합류한 건 김원봉.","mj":"smug"}],"detail":[{"text":"순서: 1940 한국광복군 → 1941 건국 강령·대일 선전 성명서 → 1942 김원봉 등 합류 → 1945 국내 진공 작전 준비, 하지만 무산.","mj":"talk"}],"outro":{"text":"이승 기록은 여기까지. 이제 위에서 그 아저씨가 기다릴걸?","mj":"smug"}}},"replay":[{"text":"또 왔어? 이 스테이지 꽤 좋아하나 보네.","mj":"smug"},{"text":"기록 갱신하러 왔구나. 나도 갱신하러 왔어. 잔소리 기록.","mj":"grin"},{"text":"복습은 좋은 습관이지. 나는 안 하지만.","mj":"smug"}],"choice":{"prompt":"더 들을래?","more":"자세히 듣기","skip":"넘어가기","replayMore":"설명 다시 듣기"},"help":{"open":[{"text":"야, 이거 아까도 틀리지 않았냐? 잠깐만, 내가 쉽게 설명해 줄게.","mj":"smug"},{"text":"세 번 연속이면 운이 아니라 개념 문제야. 잠깐 정리하고 가자.","mj":"serious"},{"text":"어허, 같은 함정에 또 빠졌네. 이번엔 같이 보자.","mj":"sweat"}],"chosenPrefix":"네가 고른 건 「{opt}」 쪽이지? 그건 ","generic":{"order":"순서 문제는 원인 → 결과로 묶고, 연도 앞자리부터 나눠서 생각해.","match":"짝짓기는 확실한 것부터 연결하고, 남은 걸 지워 나가.","forgery":"위조 문서는 연도, 인물, 단체 이름 중 하나가 살짝 바뀌어 있어. 숫자부터 의심해 봐.","liar":"말하는 사람마다 연도랑 인물을 하나씩 확인해 봐. 거짓말은 꼭 한 군데가 어긋나.","mc":"보기에서 연도랑 인물 이름부터 하나씩 대조해 봐."},"retry":[{"text":"정답은 안 알려 줘. 이제 네가 다시 풀어 봐.","mj":"smug"},{"text":"힌트는 여기까지. 한 번 더!","mj":"grin"}]},"explore":{"opening":[{"text":"어, 지나가던 길이야. 진짜로.","mj":"smug"},{"text":"깜짝 놀랐지? 나도 여기 열릴 줄 몰랐어.","mj":"surprised"},{"text":"잠깐만, 이거 하나만 말하고 갈게.","mj":"talk"}],"memory":{"hell":{"text":"너 아래층 다녀왔다며? 안예닮 선생님 수학 문제, 대응 그림에 화살표 하나 숨겨 놓는 거 조심해.","mj":"smug"},"wrongMany":{"text":"아까 문 앞에서 좀 헤맨 거 봤다. 괜찮아, 틀린 문제는 오답 노트에 다 남아.","mj":"normal"},"combo":{"text":"콤보 여덟 번 찍는 거 봤어. 오, 좀 하는데?","mj":"surprised"},"clean":{"text":"여기까지 하나도 안 틀렸네? 수상한데. 혹시 나 몰래 예습했어?","mj":"smug"},"first":{"text":"처음 보는 얼굴이라고 하고 싶지만, 우리 구면이지?","mj":"grin"}},"ink":[[{"text":"먹물아, 너 요즘 살쪘냐?","mj":"smug","ink":"annoyed"},{"text":"…농담이야. 째려보지 마.","mj":"sweat","ink":"annoyed"}],[{"text":"먹물이 너 많이 걱정하더라. 말은 안 해도 표정에 다 써 있어.","mj":"normal","ink":"surprised"}],[{"text":"먹물아, 하이파이브. …손이 없구나. 미안.","mj":"sweat","ink":"smug"}]],"trivia":{"s01":{"text":"조선 물산 장려회 취지서엔 '조선 사람은 조선 사람이 지은 것을 사 쓰고'라는 말이 있어. 1923년 서울 쪽 취지서야.","mj":"talk"},"s02":{"text":"신간회 지회는 서울 본부 말고도 전국에, 만주랑 일본에도 있었어. 생각보다 컸지?","mj":"talk"},"s03":{"text":"광주에서 시작된 학생 운동이 목포·나주를 거쳐 12월엔 서울까지 갔어. 통학 열차가 역사를 실어 나른 셈이야.","mj":"talk"},"s04":{"text":"동척 땅이 1908년 11천 정보에서 1915년 73천 정보가 됐어. 일곱 배 가까이 늘었지.","mj":"talk"},"s05":{"text":"원산 총파업 때 국내외 노동 단체가 격려랑 지지를 보냈대. 혼자 싸운 게 아니었던 거지.","mj":"talk"},"s06":{"text":"'어린이'라는 말을 널리 쓰게 한 게 방정환 쪽 소년 운동이야. 1922년 5월 1일엔 어린이날 기념식도 열었고.","mj":"talk"},"s07":{"text":"가갸날은 조선어 연구회가 만든 날이야. 이름이 귀엽지? 그래도 시험엔 진지하게 나온다.","mj":"grin"},"s08":{"text":"애국반은 10개 집을 하나로 묶었어. 옆집까지 서로 감시하게 만든 거지.","mj":"serious"},"s09":{"text":"황국 신민 서사는 어린 학생에게까지 억지로 외우게 했어. 그게 '교육'이라고 불렸다는 게 무서운 거야.","mj":"serious"},"s10":{"text":"보천보 전투가 1937년이야. 만주 쪽 연표 끝자락에 있으니까 같이 챙겨.","mj":"talk"},"s11":{"text":"건국 강령 내용이 광복 뒤 제헌 헌법에도 영향을 줬어. 끝난 이야기가 아니라 이어진 이야기인 거지.","mj":"talk"}},"bye":[{"text":"그럼 이만. 바쁜 몸이라.","mj":"smug"},{"text":"볼일 끝. 간다!","mj":"grin"}]},"clues":[{"id":"c1","after":"s01","text":"포탈? 그냥 책장 넘기는 거랑 비슷해. 너도 언젠간… 아니다, 됐어.","mj":"smug"},{"id":"c2","after":"s02","text":"먹물 쟤, 원래는… 아, 이건 내가 말할 게 아니지.","mj":"sweat","ink":"surprised"},{"id":"c3","after":"s03","text":"나도 이 범위로 시험 본 적 있어. 언제였더라. 너무 오래돼서 기억이 안 나네.","mj":"normal"},{"id":"c4","after":"s04","text":"안예닮 선생님? 알지. 수학 문제 하나 틀리면 표정 하나 안 바뀌는 분.","mj":"sweat"},{"id":"c5","after":"s05","text":"김대영 아저씨는 승급 시험 마지막에 꼭 연표를 섞더라. 아, 어떻게 아냐고? 그냥 알아.","mj":"smug"},{"id":"c6","after":"s06","text":"내 이름은 어느 기록에도 없어. 그래서 이렇게 마음대로 돌아다니는 거고.","mj":"normal"},{"id":"c7","after":"s07","text":"포탈은 지워진 문장 자리에 열려. 망각이 뚫어 놓은 구멍을 내가 문으로 쓰는 거야.","mj":"serious"},{"id":"c8","after":"s08","text":"…나도 한 번 전부 잊어버린 적이 있어. 그다음부터 여기서 나갈 길을 잃었고.","mj":"serious"},{"id":"c9","after":"s09","text":"이름을 지키는 게 왜 중요한지, 나는 좀 알아. 그 얘긴 나중에.","mj":"serious"},{"id":"c10","after":"s10","text":"나는 시험을 끝까지 못 본 수험생이었어. 마지막 장을 못 넘기고 여기 남은 거지.","mj":"serious"},{"id":"c11","after":"s11","text":"그래서 너를 돕는 거야. 내가 못 넘긴 마지막 장을, 너는 넘기는 걸 보고 싶어서.","mj":"normal"}],"comic":{"forget":[{"text":"아, 맞다! 하나 깜빡했다.","mj":"sweat"},{"text":"…아니다, 까먹었어. 간다.","mj":"sweat"}],"wrongDir":[{"text":"어? 여기가 아닌데. 잠깐만.","mj":"surprised"}],"inkPoint":[{"text":"…알았어, 알았어. 말 길어진 거 인정. 갈게.","mj":"sweat","ink":"annoyed"}],"trip":[{"text":"으악! …방금 거 못 봤지?","mj":"sweat"}]},"ch1":{"rest":[{"who":"ink","text":"휴… 이겼다.","ink":"smug"}],"intro":[{"who":"minjun","text":"오, 진짜 이겼네? 생각보다 좀 하는데?","mj":"smug"},{"who":"me","text":"넌 또 어디서 나타난 거야?"},{"who":"minjun","text":"그건 중요하지 않고. 근데 너 아직도 먹물이 그냥 따라다니는 애인 줄 알아?","mj":"smug"},{"who":"me","text":"왜?"},{"who":"minjun","text":"아이고, 아는 게 없네. 잘 봐. 얘가 얼마나 대단한 녀석인데.","mj":"grin","ink":"smug"}],"afterDemo":[{"who":"me","text":"…방금 먹물이 쏜 거야?"},{"who":"minjun","text":"봤지? 근데 아무 데나 쏜다고 다 맞는 건 아니야. 사정거리라는 게 있거든.","mj":"talk"},{"who":"minjun","text":"공격 버튼을 길게 누르면 먹물이 조준하고, 떼면 쏴. 조준하다가 구르면 취소. 표적 세 개 다 맞혀 봐. 멀리 있는 건 가까이 가서!","mj":"talk"}],"outOfRange":[{"who":"minjun","text":"거긴 사정거리 밖이야. 표적 표시가 회색이면 안 닿아. 좀 더 다가가.","mj":"smug"}],"done":[{"who":"minjun","text":"이제 좀 쓸 만해졌네. 그래도 나 없으면 안 되는 거 알지?","mj":"smug","ink":"annoyed"},{"who":"minjun","text":"뭐야, 너까지 왜 그래?","mj":"surprised","ink":"annoyed"}],"training":"먹물 원거리 훈련 — 표적 {n}/3 · 공격 버튼 길게 누르기 → 떼면 발사"},"abilityLines":{"chain":{"text":"방금 붓 세 번 이어 치는 거 봤어. 세 번째에 힘을 실어 봐. 빠르게 이어 치면 마무리 일격이 나가.","mj":"talk"},"air":{"text":"공중에서 휘두르면 잠깐 떠오를 수 있게 됐을걸? 높이 떠 있는 것도 이제 벨 수 있어.","mj":"talk"},"counter":{"text":"공격이 닿는 순간에 딱 맞춰 구르면 시간이 느려져. 그때 바로 반격하면 두 배로 아프다.","mj":"talk"},"joint":{"text":"먹물 탄에 맞은 놈을 바로 붓으로 쳐 봐. 먹이 터진다. 둘이 같이 싸우라는 거야.","mj":"talk","ink":"smug"},"shieldPlus":{"text":"먹물 보호막이 더 빨리 차고, 막은 탄을 되받아친대. …나보다 낫네.","mj":"sweat","ink":"smug"},"charge":{"text":"조준을 1초 넘게 버텨 봐. 꿰뚫는 큰 탄이 나간다.","mj":"talk"},"shield2":{"text":"이제 보호막이 두 번까지 버틴대. 그래도 레이저는 피해야 해.","mj":"talk"}}},"companion":{"_note":"먹물(동료)·능력 해금 조정값. 거리·속도 단위는 월드 단위(주인공 키 약 86), 시간은 초. 적 HP: 먹방울 2, 두루마리 2, 봉인 수호병 3 / 붓 1회 피해 1(콤보 8 이상 2).","follow":{"back":62,"up":48,"stiffness":55,"damping":10.5,"idleOrbit":10},"ranged":{"holdTime":0.28,"range":560,"speed":980,"damage":1,"bossMul":0.6,"cooldown":1.2,"radius":12,"charge":{"time":1,"damage":2,"radius":18,"pierce":true,"bossMul":1.1}},"shield":{"cooldown":7,"cooldownPlus":4.5,"grace":0.4,"blockable":["proj:","enemy:","drop","boss:body"],"note":"보스의 충격파(wave)·레이저(beam)·곡선 빔(curve)·빛기둥(pillar)·돌진은 막지 못한다. 가시·추격 파도·낙사도 막지 못한다."},"weakRing":{"fromStage":1,"every":11,"height":360,"radius":28,"stun":2.2},"abilities":[{"id":"inkShot","stage":"s01","name":"먹물 원거리 공격","how":"공격 버튼을 길게 눌러 조준 → 떼면 발사. 조준 중 구르기를 누르면 취소.","button":"attack"},{"id":"chain","stage":"s02","name":"붓 연계 마무리","how":"붓 공격을 빠르게 세 번 이어 치면 세 번째가 넓고 강한 마무리 일격(피해 2배).","button":"attack"},{"id":"air","stage":"s03","name":"공중 붓 베기","how":"공중에서 공격하면 잠깐 떠오르며 위아래로 넓게 벤다. 점프 한 번에 두 번까지.","button":"jump"},{"id":"counter","stage":"s04","name":"완벽 회피 반격","how":"공격이 닿는 순간 구르기로 피하면 시간이 잠깐 느려지고, 1.5초 안의 다음 붓 공격 피해 2배.","button":"dodge"},{"id":"joint","stage":"s05","name":"먹·붓 합격","how":"먹물 탄에 맞은 적을 1.2초 안에 붓으로 치면 먹이 터지며 추가 피해.","button":"attack"},{"id":"shieldPlus","stage":"s06","name":"먹물 방어 강화","how":"보호막 재사용 시간이 7초 → 4.5초로 줄고, 막은 탄환을 되받아쳐 날린다.","button":null},{"id":"charge","stage":"s08","name":"먹물 관통탄","how":"조준을 1초 넘게 유지하면 적을 꿰뚫는 큰 탄(피해 2)을 쏜다.","button":"attack"},{"id":"shield2","stage":"s10","name":"이중 보호막","how":"보호막을 연속 두 번까지 펼칠 수 있다(각각 따로 재충전).","button":null}]},"tutorial":{"_note":"초보자 튜토리얼 대사·힌트. 모든 안내는 1~2문장, 기본 조작만 (스토리 비밀·미래 능력·보스 정보 없음). keys=키보드 안내, btn=강조할 터치 버튼(stick·jump·attack·dash·dodge).","intro":"처음이지? 걱정하지 마. 천천히 하나씩 알려 줄게.","steps":{"move":{"say":"왼쪽 조이스틱을 밀어서 오른쪽으로 걸어 봐.","say2":"좋아! 이번엔 왼쪽으로 걸어 봐.","keys":"← → 또는 A D","btn":"stick","hints":["조이스틱 동그라미를 손가락으로 누른 채 오른쪽으로 밀어 봐.","화면 왼쪽 아래 큰 동그라미가 조이스틱이야. 누른 채로 옆으로 밀면 걸어가."],"sayK":"방향키(← →)나 A·D 키로 오른쪽으로 걸어 봐.","hintsK":["→ 키(또는 D)를 꾹 누르고 있으면 걸어가.","손을 떼면 멈춰. → 키를 누른 채로 빛나는 기둥까지 가 봐."]},"jump":{"say":"앞에 장애물이 있네. 점프해서 넘어가 봐!","keys":"Space (또는 W, ↑)","btn":"jump","hints":["장애물 바로 앞에서 점프 버튼을 눌러.","오른쪽으로 걸으면서 점프 버튼을 누르면 쉽게 넘어가. 길게 누르면 더 높이 뛰어."]},"attack":{"say":"이번에는 붓을 사용해 보자. 허수아비 옆에서 공격 버튼을 눌러!","keys":"J (또는 Z)","btn":"attack","need":3,"hints":["허수아비 바로 옆까지 붙어서 공격 버튼을 눌러.","허수아비 쪽을 바라보고 있어야 맞아. 조이스틱을 허수아비 쪽으로 살짝 밀고 눌러 봐."]},"dash":{"say":"빠르게 움직여야 할 때도 있겠지? 출발선을 지나면 대시 버튼으로 깃발까지 가 봐.","keys":"Shift (또는 K)","btn":"dash","retry":"대시 버튼을 안 눌렀어. 다시 출발선에서 해 보자.","hints":["출발선을 넘자마자 대시 버튼을 한 번 눌러. 앞으로 휙 나가.","대시는 짧게 한 번만 눌러도 돼. 깃발 쪽을 바라보고 눌러 봐."]},"dodge":{"say":"모든 공격을 막을 수는 없어. 피하는 것도 중요하지.","keys":"L (또는 X, ↓)","btn":"dodge","jumped":"점프로 피해도 되지만, 이번엔 회피 버튼으로 피해 보자.","hints":["공이 몸에 닿기 직전에 회피 버튼을 눌러. 구르는 동안엔 안 맞아.","빨간 줄 끝(내 발 앞)에 공이 왔을 때 눌러. 조금 일찍 눌러도 괜찮아."]},"battle":{"say":"이제 직접 해 볼 차례야! 먹방울 괴물을 붓으로 물리쳐 봐.","keys":"이동 · Space · J · Shift · L","btn":"attack","hints":["괴물 쪽을 바라보고 가까이에서 공격 버튼을 눌러. 두 번 맞히면 이겨.","부딪힐 것 같으면 회피 버튼으로 빠져나온 뒤 다시 공격해. 여기선 맞아도 괜찮아."]},"done":{"say":"잘했어! 이제 혼자서도 할 수 있겠네."}},"nice":["좋아!","잘했어!","바로 그거야!","완벽해!"],"hitOk":"괜찮아, 여기선 안 다쳐.","_note2":"say·hints는 터치 기준, 키보드일 때는 sayK·hintsK가 있으면 그것을, 없으면 '버튼'을 '키'로 바꿔 보여 준다."}};</script>
<script>/* js/core/Util.js */
/* 망각의 연대기 — 공용 유틸리티 (네임스페이스 MG) */
(function (root) {
  'use strict';
  const MG = root.MG = root.MG || {};

  const U = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    invLerp: (a, b, v) => (b === a ? 0 : (v - a) / (b - a)),
    sign: (v) => (v > 0 ? 1 : v < 0 ? -1 : 0),
    approach(v, target, delta) {
      return v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
    },
    easeOutCubic: (t) => 1 - Math.pow(1 - t, 3),
    easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    easeOutBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    easeOutElastic(t) {
      if (t === 0 || t === 1) return t;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
    },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    aabb: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
    now: () => (root.performance ? performance.now() : Date.now()),

    /* 시드 고정 난수 (mulberry32) — 스테이지 레이아웃 재현용 */
    rng(seed) {
      let s = (typeof seed === 'string' ? U.hash(seed) : seed) >>> 0;
      const f = function () {
        s |= 0; s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      f.range = (a, b) => a + (b - a) * f();
      f.int = (a, b) => Math.floor(a + (b - a + 1) * f());
      f.pick = (arr) => arr[Math.floor(f() * arr.length)];
      return f;
    },
    hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    },
    shuffle(arr, rnd = Math.random) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    },
    uid: (() => { let n = 0; return (p = 'id') => p + '_' + (++n).toString(36) + '_' + Math.floor(Math.random() * 1e6).toString(36); })(),

    /* 스프링 (물리 기반 UI·스쿼시 애니메이션) */
    Spring: class {
      constructor(value = 0, stiffness = 180, damping = 14) {
        this.value = value; this.target = value; this.vel = 0; this.k = stiffness; this.d = damping;
      }
      update(dt) {
        const f = -this.k * (this.value - this.target) - this.d * this.vel;
        this.vel += f * dt; this.value += this.vel * dt; return this.value;
      }
      kick(v) { this.vel += v; }
      snap(v) { this.value = this.target = v; this.vel = 0; }
    },

    /* 간단한 이벤트 버스 */
    Emitter: class {
      constructor() { this._h = {}; }
      on(ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); return () => this.off(ev, fn); }
      off(ev, fn) { const l = this._h[ev]; if (l) this._h[ev] = l.filter((f) => f !== fn); }
      emit(ev, ...args) { const l = this._h[ev]; if (l) l.slice().forEach((f) => { try { f(...args); } catch (e) { console.error(e); } }); }
    },

    /* DOM 헬퍼 */
    el(tag, attrs, ...children) {
      const e = document.createElement(tag);
      if (attrs) {
        for (const k in attrs) {
          const v = attrs[k];
          if (v == null || v === false) continue;
          if (k === 'class') e.className = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
          else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
          else if (k === 'html') e.innerHTML = v;
          else if (k === 'text') e.textContent = v;
          else e.setAttribute(k, v === true ? '' : v);
        }
      }
      for (const c of children.flat()) {
        if (c == null || c === false) continue;
        e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      }
      return e;
    },
    esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },
    fmtTime(sec) {
      sec = Math.max(0, Math.floor(sec));
      const m = Math.floor(sec / 60), s = sec % 60;
      return m + ':' + String(s).padStart(2, '0');
    },
    /* 닉네임 치환 */
    fill(text, vars) {
      return String(text).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m));
    },
    /* 빡지 비교용 정규화: 공백·따옴표·낫표 차이는 무시, 가운뎃점 통일 */
    normalizeCopy(s) {
      return String(s)
        .replace(/[\s ]+/g, '')
        .replace(/[「」『』《》〈〉"“”'‘’`]/g, '')
        .replace(/[ㆍ・•‧∙]/g, '·')
        .replace(/[～〜]/g, '~')
        .replace(/[，]/g, ',')
        .replace(/[．。]/g, '.');
    },
    vibrate(ms) {
      try { if (MG.Settings && MG.Settings.get('vibration') && navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 무시 */ }
    },
    deepMerge(base, extra) {
      if (Array.isArray(base)) return Array.isArray(extra) ? extra.slice() : base.slice();
      if (typeof base !== 'object' || base === null) return extra === undefined ? base : extra;
      const out = {};
      const keys = new Set([...Object.keys(base), ...Object.keys(extra || {})]);
      keys.forEach((k) => {
        if (extra && k in extra) {
          const bv = base[k], ev = extra[k];
          out[k] = bv && typeof bv === 'object' && !Array.isArray(bv) && ev && typeof ev === 'object' && !Array.isArray(ev)
            ? U.deepMerge(bv, ev) : (ev === undefined ? bv : (typeof ev === 'object' && ev !== null ? JSON.parse(JSON.stringify(ev)) : ev));
        } else out[k] = base[k] && typeof base[k] === 'object' ? JSON.parse(JSON.stringify(base[k])) : base[k];
      });
      return out;
    }
  };

  MG.U = U;
  MG.bus = new U.Emitter();
  if (typeof module !== 'undefined' && module.exports) module.exports = U;
})(typeof window !== 'undefined' ? window : globalThis);
