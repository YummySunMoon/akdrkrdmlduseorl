<script>/* js/systems/SettingsManager.js */
/* SettingsManager — 그래픽·성능·조작·사운드·저장 설정 (단일 진실 공급원) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const KEY = 'mangak.settings.v1';

  /* 품질 프리셋: 저사양 모드에서도 게임 규칙은 동일, 렌더 부하만 다름 */
  const PRESETS = {
    low:      { renderScale: 0.6,  particles: 0.25, shadows: 'none',   motionBlur: false, bgEffects: false, animQuality: 'low',  parallaxLayers: 2, lighting: false },
    balanced: { renderScale: 0.85, particles: 0.6,  shadows: 'simple', motionBlur: true,  bgEffects: true,  animQuality: 'mid',  parallaxLayers: 3, lighting: true },
    high:     { renderScale: 1.0,  particles: 1.0,  shadows: 'soft',   motionBlur: true,  bgEffects: true,  animQuality: 'high', parallaxLayers: 4, lighting: true }
  };

  const DEFAULTS = {
    graphicsMode: 'auto',          // auto | low | balanced | high
    fpsCap: 60,                    // 30 | 60 | 120
    renderScale: 0.85,
    particles: 0.6,
    shadows: 'simple',
    motionBlur: true,
    screenShake: true,
    bgEffects: true,
    animQuality: 'mid',
    parallaxLayers: 3,
    lighting: true,
    reduceFlash: false,
    uiScale: 1.0,
    buttonSize: 1.0,
    buttonOpacity: 0.55,
    sensitivity: 1.0,
    autoRun: false,
    vibration: true,
    masterVolume: 0.8,
    sfxVolume: 0.9,
    bgmVolume: 0.55,
    autoSave: true,
    showFps: false,
    touchControls: 'auto',         // auto | on | off
    layout: null                   // 터치 버튼 위치 {id:{x,y}} (화면 비율 %)
  };

  const S = {
    data: JSON.parse(JSON.stringify(DEFAULTS)),
    PRESETS, DEFAULTS,
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) this.data = U.deepMerge(DEFAULTS, JSON.parse(raw));
      } catch (e) { console.warn('설정 불러오기 실패', e); }
      this.apply();
    },
    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { console.warn('설정 저장 실패', e); }
    },
    get(k) { return this.data[k]; },
    set(k, v, silent) {
      this.data[k] = v;
      if (k === 'graphicsMode' && v !== 'auto') this.applyPreset(v);
      this.apply();
      this.save();
      if (!silent) MG.bus.emit('settings:change', k, v);
    },
    applyPreset(name) {
      const p = PRESETS[name];
      if (!p) return;
      Object.assign(this.data, p);
    },
    /* 자동 모드에서 PerformanceManager가 호출 */
    autoTier(name) {
      if (this.data.graphicsMode !== 'auto') return;
      const p = PRESETS[name];
      if (!p) return;
      Object.assign(this.data, p);
      this.apply();
      MG.bus.emit('settings:change', 'autoTier', name);
    },
    reset(section) {
      const keep = this.data.layout;
      if (section === 'controls') {
        ['buttonSize', 'buttonOpacity', 'sensitivity', 'autoRun', 'vibration', 'touchControls'].forEach((k) => (this.data[k] = DEFAULTS[k]));
        this.data.layout = null;
      } else {
        this.data = JSON.parse(JSON.stringify(DEFAULTS));
        if (section === 'keepLayout') this.data.layout = keep;
      }
      this.apply(); this.save();
      MG.bus.emit('settings:change', 'reset');
    },
    apply() {
      const r = document.documentElement;
      r.style.setProperty('--ui', String(U.clamp(this.data.uiScale, 0.7, 1.5)));
      r.style.setProperty('--btn', String(U.clamp(this.data.buttonSize, 0.6, 1.6)));
      r.style.setProperty('--btn-op', String(U.clamp(this.data.buttonOpacity, 0.15, 1)));
      document.body.classList.toggle('lowfx', !this.data.bgEffects || this.data.animQuality === 'low');
      document.body.classList.toggle('reduce-flash', !!this.data.reduceFlash);
    }
  };

  MG.Settings = S;
})();

</script>
<script>/* js/core/GameState.js */
/* GameState — 중앙 게임 상태
 * 액션 체력(HP)과 스테이지 목숨(Lives)은 별도 변수로 관리하고, 모든 증감은 이 모듈만 수행한다.
 *  - HP: 적·장애물·보스 공격으로 감소. 0이 되면 목숨 1개 소모 → 체크포인트 부활 → HP 최대치.
 *  - Lives: 문제 오답 또는 HP 소진으로 감소(원인 구분 기록). 같은 실패 ID는 한 번만 차감.
 *  - 스테이지 클리어: HP·목숨 모두 최대치로 회복.
 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const SAVE_VERSION = 4;

  const EARTH_LIVES = 7;      // 이승 기본 목숨: 정확히 7개
  const HELL_SOULS = 3;       // 지옥 영혼 불꽃
  const HEAVEN_CANDLES = 3;   // 천국 자격의 촛불
  const MAX_HP = 100;

  function defaultSave() {
    return {
      version: SAVE_VERSION,
      nickname: '',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      prologueSeen: false,
      tutorialDone: false,
      location: 'title',            // title | map | stage | hell | bbakji | heaven | ending
      earth: {
        lives: EARTH_LIVES, hp: MAX_HP,
        currentStage: 's01',
        cleared: {},                // stageId → {grade, score, best, time, records, clears}
        run: null,                  // 진행 중 스테이지 {stageId, checkpoint, records:[], solved:[], usedQ:[], stats}
        parked: {}                  // v5: 구간 이동으로 잠시 떠난 챕터의 진행 {stageId → {run, lives, hp, at}}
      },
      hell: { souls: HELL_SOULS, hp: MAX_HP, visits: 0, escapes: 0, pending: false, returnStage: null,
              bbakji: { active: false, chunk: 0, typed: '', completed: 0, startedAt: 0 } },
      heaven: { tier: 0, candles: HEAVEN_CANDLES, hp: MAX_HP, best: 0, inTier: false, cleared: false },
      rewards: {
        skins: ['default'], skin: 'default',
        trails: ['default'], trail: 'default',
        titles: ['낙방한 화가 지망생'], title: '낙방한 화가 지망생',
        victories: ['pose'], victory: 'pose',
        effects: ['none'], effect: 'none',
        records: []                 // 획득한 기록 조각 id
      },
      stats: { playTime: 0, correct: 0, wrong: 0, maxCombo: 0, deaths: 0, hpDeaths: 0, quizLifeLoss: 0, hellFalls: 0, bossKills: 0 },
      wrongLog: {},                 // qid → {count, lastAt, stage, fixed}
      seenQ: {},                    // qid → 횟수
      codex: {},                    // 개념 → {stage, at}
      endingSeen: false,
      newGamePlus: 0,
      // v4: 동료 먹물·능력 해금·김민준 이벤트
      companion: { ranged: false, shieldLv: 1, shieldHinted: false },
      abilities: [],                // 해금한 능력 id (누적)
      minjun: { events: {}, talks: {}, clues: [], helps: 0, met: 0, explores: 0, lastExploreStage: null, comicUsed: [], saidHell: false }
    };
  }

  const State = {
    d: defaultSave(),
    world: 'title',                 // 현재 규칙 적용 월드: tutorial | earth | hell | heaven | review | none
    combo: 0,
    invulnT: 0,
    dying: false,
    _failures: new Set(),
    _deathSeq: 0,
    dirty: false,

    SAVE_VERSION, EARTH_LIVES, HELL_SOULS, HEAVEN_CANDLES, MAX_HP,
    defaultSave,

    reset(nickname) {
      const keepSettings = null;
      this.d = defaultSave();
      if (nickname) this.d.nickname = nickname;
      this.combo = 0; this._failures.clear(); this.dying = false; this.invulnT = 0;
      this.markDirty(true);
      return keepSettings;
    },
    get nick() { return this.d.nickname || '이름 없는 화가'; },

    /* ── 체력 슬롯: 월드별로 다른 저장 위치를 같은 인터페이스로 노출 ── */
    _slot() {
      switch (this.world) {
        case 'earth': return { o: this.d.earth, lk: 'lives', max: EARTH_LIVES };
        case 'hell': return { o: this.d.hell, lk: 'souls', max: HELL_SOULS };
        case 'heaven': return { o: this.d.heaven, lk: 'candles', max: HEAVEN_CANDLES };
        default:
          this._tut = this._tut || { lives: EARTH_LIVES, hp: MAX_HP };
          return { o: this._tut, lk: 'lives', max: EARTH_LIVES, practice: true };
      }
    },
    get hp() { return this._slot().o.hp; },
    get maxHp() { return MAX_HP; },
    get lives() { const s = this._slot(); return s.o[s.lk]; },
    get maxLives() { return this._slot().max; },
    get practice() { return !!this._slot().practice; },

    setWorld(w) {
      this.world = w;
      this._failures.clear();
      this.dying = false;
      this.invulnT = 0;
      if (w === 'tutorial' || w === 'review') this._tut = { lives: EARTH_LIVES, hp: MAX_HP };
      MG.bus.emit('state:hud');
    },

    tick(dt) {
      if (this.invulnT > 0) this.invulnT = Math.max(0, this.invulnT - dt);
      if (this.world !== 'title' && this.world !== 'none') this.d.stats.playTime += dt;
    },
    get invulnerable() { return this.invulnT > 0 || this.dying; },
    setInvuln(t) { this.invulnT = Math.max(this.invulnT, t); },

    /* 액션 피해 → HP 감소. HP 0이면 목숨 1개(원인: hp) 소모 후 부활 이벤트 */
    damage(amount, source) {
      if (this.invulnerable || amount <= 0) return { hit: false };
      const s = this._slot();
      if (this.world === 'tutorial') {
        // 초보자 튜토리얼: 맞아도 HP가 줄지 않는다 (실패 부담 0). 피격 연출만 짧게.
        this.setInvuln(0.6);
        MG.bus.emit('player:damaged', 0, source);
        return { hit: true, died: false, tutorial: true };
      }
      s.o.hp = Math.max(0, Math.round(s.o.hp - amount));
      this.setInvuln(0.9);
      MG.bus.emit('player:damaged', amount, source);
      MG.bus.emit('state:hud');
      if (s.o.hp <= 0) {
        this.dying = true;
        this._deathSeq++;
        if (s.practice) {
          // 튜토리얼·복습: 실제 목숨은 잃지 않음
          MG.bus.emit('player:hpDepleted', { practice: true });
        } else {
          this.d.stats.hpDeaths++;
          this.loseLife('hp', 'hp#' + this._deathSeq);
          MG.bus.emit('player:hpDepleted', { practice: false });
        }
        return { hit: true, died: true };
      }
      this.markDirty();
      return { hit: true, died: false };
    },
    /* 부활: 체크포인트 이동은 월드가 처리, HP는 최대치 */
    respawn() {
      const s = this._slot();
      s.o.hp = MAX_HP;
      this.dying = false;
      this.setInvuln(1.6);
      MG.bus.emit('state:hud');
      this.markDirty();
    },
    heal(n) {
      const s = this._slot();
      s.o.hp = Math.min(MAX_HP, s.o.hp + n);
      MG.bus.emit('state:hud');
    },

    /* 목숨 감소 — failureId가 같으면 중복 차감하지 않는다 */
    loseLife(reason, failureId) {
      const s = this._slot();
      if (s.practice) { MG.bus.emit('lives:practiceLoss', reason); return false; }
      const id = failureId || (reason + '#' + U.uid('f'));
      if (this._failures.has(id)) return false;
      this._failures.add(id);
      if (s.o[s.lk] <= 0) return false;
      s.o[s.lk] -= 1;
      this.d.stats.deaths++;
      if (reason === 'quiz') this.d.stats.quizLifeLoss++;
      MG.bus.emit('lives:change', { reason, lives: s.o[s.lk], world: this.world });
      MG.bus.emit('state:hud');
      this.markDirty();
      if (s.o[s.lk] <= 0) {
        MG.bus.emit('world:livesDepleted', { world: this.world, reason });
      }
      return true;
    },

    /* 스테이지 클리어/진입 시 전체 회복 */
    restoreEarth() {
      this.d.earth.lives = EARTH_LIVES;
      this.d.earth.hp = MAX_HP;
      this.dying = false;
      MG.bus.emit('state:hud');
      this.markDirty();
    },
    restoreHell() { this.d.hell.souls = HELL_SOULS; this.d.hell.hp = MAX_HP; this.dying = false; },
    restoreHeaven() { this.d.heaven.candles = HEAVEN_CANDLES; this.d.heaven.hp = MAX_HP; this.dying = false; },

    /* ── 문제 결과 기록 ── */
    recordAnswer(q, correct, ctx) {
      const st = this.d.stats;
      if (!q) return;
      this.d.seenQ[q.id] = (this.d.seenQ[q.id] || 0) + 1;
      if (correct) {
        this.combo++;
        if (this.combo > st.maxCombo) st.maxCombo = this.combo;
        if (this.world !== 'tutorial') st.correct++;
        (q.concepts || []).forEach((c) => { if (!this.d.codex[c]) this.d.codex[c] = { stage: q.stage || ctx && ctx.stage || '', at: Date.now() }; });
        const w = this.d.wrongLog[q.id];
        if (w && ctx && ctx.review) { w.count = Math.max(0, w.count - 1); w.fixed = w.count === 0; }
      } else {
        this.combo = 0;
        if (this.world !== 'tutorial') st.wrong++;
        if (this.world !== 'tutorial' && !q.noLog) {
          const w = this.d.wrongLog[q.id] || (this.d.wrongLog[q.id] = { count: 0, total: 0, stage: q.stage || '', lastAt: 0 });
          w.count++; w.total = (w.total || 0) + 1; w.lastAt = Date.now(); w.fixed = false;
        }
      }
      MG.bus.emit('combo:change', this.combo);
      this.markDirty();
    },
    /* 복습 우선순위: 교과서 중요도 + 반복 오답 횟수 */
    reviewPriority(q) {
      const base = { S: 5, A: 4, P: 4, B: 3, C: 2, D: 2 }[q.importance] || 1;
      const w = this.d.wrongLog[q.id];
      return base + (w ? w.count * 2 + (w.total || 0) * 0.5 : 0);
    },

    unlock(kind, id) {
      const r = this.d.rewards;
      const list = { skin: r.skins, trail: r.trails, title: r.titles, victory: r.victories, effect: r.effects }[kind];
      if (!list || list.includes(id)) return false;
      list.push(id);
      MG.bus.emit('reward:unlock', kind, id);
      this.markDirty();
      return true;
    },

    get allStagesCleared() {
      const stages = MG.Data && MG.Data.stages ? MG.Data.stages : [];
      return stages.length > 0 && stages.every((s) => this.d.earth.cleared[s.id]);
    },

    markDirty(force) {
      this.dirty = true;
      this.d.updatedAt = Date.now();
      MG.bus.emit('state:dirty', !!force);
    }
  };

  MG.State = State;
})();

</script>
<script>/* js/systems/SaveManager.js */
/* SaveManager — 브라우저 로컬 저장소 기반 자동/수동 저장, 버전 관리, 내보내기/가져오기 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const KEY_AUTO = 'mangak.save.auto';
  const KEY_MANUAL = 'mangak.save.manual';
  const KEY_BACKUP = 'mangak.save.backup';

  /* 구버전 저장 데이터를 최신 구조로 올린다 (필드 추가 시 여기서만 처리) */
  function migrate(data) {
    if (!data || typeof data !== 'object') return null;
    const base = MG.State.defaultSave();
    let v = data.version || 1;
    if (v < 2) { data.rewards = data.rewards || {}; v = 2; }
    if (v < 3) { if (data.hell && !data.hell.bbakji) data.hell.bbakji = base.hell.bbakji; v = 3; }
    let grant = null;
    if (v < 4) {
      // 이미 클리어한 스테이지의 능력은 그대로 지급 (다시 해금시키지 않음), 챕터 1 이벤트는 본 것으로 처리
      const cleared = (data.earth && data.earth.cleared) || {};
      grant = ((MG.Data.companion && MG.Data.companion.abilities) || []).filter((a) => cleared[a.stage]).map((a) => a.id);
      v = 4;
    }
    const merged = U.deepMerge(base, data);
    if (grant) {
      merged.abilities = Array.from(new Set((merged.abilities || []).concat(grant)));
      if (merged.abilities.includes('inkShot')) { merged.companion.ranged = true; merged.minjun.events.ch1 = 'migrated'; }
      if (merged.abilities.includes('shieldPlus')) merged.companion.shieldLv = Math.max(merged.companion.shieldLv, 2);
      if (merged.abilities.includes('shield2')) merged.companion.shieldLv = Math.max(merged.companion.shieldLv, 3);
    }
    if (!Array.isArray(merged.abilities)) merged.abilities = [];
    if (!Array.isArray(merged.minjun.clues)) merged.minjun.clues = [];
    merged.version = MG.State.SAVE_VERSION;
    // 범위 보정
    merged.earth.lives = U.clamp(merged.earth.lives | 0, 0, MG.State.EARTH_LIVES);
    merged.earth.hp = U.clamp(merged.earth.hp | 0, 0, MG.State.MAX_HP);
    if (merged.earth.lives === 0 && merged.location !== 'hell' && merged.location !== 'bbakji') merged.hell.pending = true;
    return merged;
  }

  const Save = {
    lastSavedAt: 0,
    _timer: null,
    init() {
      MG.bus.on('state:dirty', (force) => {
        if (!MG.Settings.get('autoSave')) return;
        if (force) return this.autosave();
        clearTimeout(this._timer);
        this._timer = setTimeout(() => this.autosave(), 1200);
      });
      window.addEventListener('beforeunload', (e) => {
        if (MG.Settings.get('autoSave')) { this.autosave(); return; }
        if (MG.State.dirty && MG.State.d.nickname) {
          e.preventDefault(); e.returnValue = '저장하지 않은 진행 상황이 있습니다.'; return e.returnValue;
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && MG.Settings.get('autoSave')) this.autosave();
      });
    },
    _write(key, data) {
      try {
        const payload = JSON.stringify({ app: 'mangak-chronicle', savedAt: Date.now(), data });
        localStorage.setItem(key, payload);
        return true;
      } catch (e) {
        console.warn('저장 실패', e);
        MG.UI && MG.UI.toast('저장 공간이 부족해 저장하지 못했습니다.', 'warn');
        return false;
      }
    },
    _read(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const p = JSON.parse(raw);
        return p && p.data ? { savedAt: p.savedAt, data: migrate(p.data) } : null;
      } catch (e) { console.warn('저장 데이터 손상', e); return null; }
    },
    autosave() {
      if (!MG.State.d.nickname) return false;
      const ok = this._write(KEY_AUTO, MG.State.d);
      if (ok) { MG.State.dirty = false; this.lastSavedAt = Date.now(); MG.bus.emit('save:done', 'auto'); }
      return ok;
    },
    manualSave() {
      if (!MG.State.d.nickname) return false;
      const ok = this._write(KEY_MANUAL, MG.State.d) && this._write(KEY_AUTO, MG.State.d);
      if (ok) { MG.State.dirty = false; this.lastSavedAt = Date.now(); MG.bus.emit('save:done', 'manual'); }
      return ok;
    },
    /* 가장 최근 저장본(자동/수동 중 최신) */
    latest() {
      const a = this._read(KEY_AUTO), m = this._read(KEY_MANUAL);
      if (a && m) return a.savedAt >= m.savedAt ? a : m;
      return a || m;
    },
    hasSave() { return !!this.latest(); },
    load() {
      const s = this.latest();
      if (!s) return false;
      MG.State.d = s.data;
      MG.State.dirty = false;
      return true;
    },
    deleteAll() {
      try {
        const cur = localStorage.getItem(KEY_AUTO);
        if (cur) localStorage.setItem(KEY_BACKUP, cur);
        localStorage.removeItem(KEY_AUTO); localStorage.removeItem(KEY_MANUAL);
      } catch (e) { console.warn('저장 데이터 삭제 실패', e); }
    },
    exportFile() {
      const blob = new Blob([JSON.stringify({ app: 'mangak-chronicle', exportedAt: new Date().toISOString(), data: MG.State.d }, null, 1)], { type: 'application/json' });
      const a = U.el('a', { href: URL.createObjectURL(blob), download: 'mangak-save-' + (MG.State.d.nickname || 'player') + '.json' });
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
    importText(text) {
      const p = JSON.parse(text);
      const data = migrate(p && p.data ? p.data : p);
      if (!data || !data.earth) throw new Error('올바른 저장 파일이 아닙니다.');
      MG.State.d = data;
      this._write(KEY_AUTO, data);
      this._write(KEY_MANUAL, data);
      MG.State.dirty = false;
      return true;
    },
    migrate
  };
  MG.Save = Save;
})();

</script>
<script>/* js/systems/AudioManager.js */
/* AudioManager — WebAudio 합성 효과음과 절차적 배경음악 (외부 음원 미사용, 라이선스 문제 없음)
 * 브라우저 자동재생 제한 때문에 첫 터치/키 입력 후 활성화한다. */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  const MOODS = {
    title:    { bpm: 72,  root: 50, scale: [0, 3, 5, 7, 10], chords: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -2, 2]], lead: 0.18, drums: 0, pad: 0.12, wave: 'triangle' },
    tutorial: { bpm: 104, root: 55, scale: [0, 2, 4, 7, 9], chords: [[0, 4, 7], [5, 9, 12], [-3, 0, 4], [7, 11, 14]], lead: 0.16, drums: 0.5, pad: 0.08, wave: 'square' },
    earth:    { bpm: 112, root: 50, scale: [0, 3, 5, 7, 10], chords: [[0, 3, 7], [-4, 0, 3], [-7, -3, 0], [-2, 2, 5]], lead: 0.15, drums: 0.7, pad: 0.09, wave: 'triangle' },
    chase:    { bpm: 148, root: 52, scale: [0, 1, 5, 7, 8], chords: [[0, 3, 7], [1, 5, 8], [-2, 1, 5], [0, 3, 7]], lead: 0.17, drums: 1, pad: 0.06, wave: 'sawtooth' },
    boss:     { bpm: 138, root: 45, scale: [0, 1, 3, 7, 8], chords: [[0, 3, 7], [1, 4, 8], [-4, 0, 3], [-5, -1, 2]], lead: 0.18, drums: 1, pad: 0.1, wave: 'sawtooth' },
    memorial: { bpm: 60,  root: 48, scale: [0, 3, 7, 10], chords: [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [0, 3, 7]], lead: 0.07, drums: 0, pad: 0.14, wave: 'sine' },
    hell:     { bpm: 92,  root: 38, scale: [0, 1, 6, 7, 10], chords: [[0, 1, 6], [-1, 3, 6], [0, 6, 11], [-2, 1, 4]], lead: 0.14, drums: 0.8, pad: 0.13, wave: 'sawtooth' },
    heaven:   { bpm: 84,  root: 57, scale: [0, 2, 4, 7, 9, 11], chords: [[0, 4, 7], [5, 9, 12], [9, 12, 16], [7, 11, 14]], lead: 0.12, drums: 0.3, pad: 0.15, wave: 'sine' },
    judge:    { bpm: 128, root: 52, scale: [0, 2, 3, 7, 8, 11], chords: [[0, 3, 7], [8, 12, 15], [5, 8, 12], [7, 11, 14]], lead: 0.16, drums: 1, pad: 0.12, wave: 'square' },
    ending:   { bpm: 76,  root: 53, scale: [0, 2, 4, 7, 9], chords: [[0, 4, 7], [-3, 0, 4], [5, 9, 12], [7, 11, 14]], lead: 0.14, drums: 0.2, pad: 0.16, wave: 'triangle' }
  };

  const A = {
    ctx: null, master: null, sfxBus: null, bgmBus: null, unlocked: false,
    mood: null, _nextT: 0, _step: 0, _timer: null, _seed: 1,
    init() {
      const unlock = () => {
        this.unlock();
        window.removeEventListener('pointerdown', unlock, true);
        window.removeEventListener('keydown', unlock, true);
      };
      window.addEventListener('pointerdown', unlock, true);
      window.addEventListener('keydown', unlock, true);
      MG.bus.on('settings:change', () => this.applyVolume());
      document.addEventListener('visibilitychange', () => {
        if (!this.ctx) return;
        if (document.visibilityState === 'hidden') this.ctx.suspend(); else this.ctx.resume();
      });
    },
    unlock() {
      if (this.unlocked) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.sfxBus = this.ctx.createGain();
        this.bgmBus = this.ctx.createGain();
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4;
        this.sfxBus.connect(this.master); this.bgmBus.connect(this.master);
        this.master.connect(comp); comp.connect(this.ctx.destination);
        this.unlocked = true;
        this.applyVolume();
        if (this._pendingMood) { const m = this._pendingMood; this._pendingMood = null; this.music(m); }
      } catch (e) { console.warn('오디오 초기화 실패', e); }
    },
    applyVolume() {
      if (!this.ctx) return;
      const S = MG.Settings;
      this.master.gain.value = S.get('masterVolume');
      this.sfxBus.gain.value = S.get('sfxVolume');
      this.bgmBus.gain.value = S.get('bgmVolume') * 0.7;
    },
    _tone(freq, dur, opt = {}) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + (opt.delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = opt.type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * opt.slide), t + dur);
      const v = opt.vol == null ? 0.25 : opt.vol;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (opt.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(opt.bus || this.sfxBus);
      o.start(t); o.stop(t + dur + 0.02);
    },
    _noise(dur, opt = {}) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + (opt.delay || 0);
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = opt.filter || 'lowpass'; f.frequency.value = opt.freq || 2000;
      const g = this.ctx.createGain(); g.gain.value = opt.vol == null ? 0.2 : opt.vol;
      src.connect(f); f.connect(g); g.connect(opt.bus || this.sfxBus);
      src.start(t);
    },
    sfx(name) {
      if (!this.ctx) return;
      switch (name) {
        case 'step': this._noise(0.04, { freq: 900, vol: 0.05 }); break;
        case 'jump': this._tone(330, 0.14, { type: 'square', slide: 1.9, vol: 0.12 }); break;
        case 'land': this._noise(0.08, { freq: 500, vol: 0.14 }); break;
        case 'dash': this._noise(0.18, { freq: 3200, filter: 'bandpass', vol: 0.22 }); this._tone(180, 0.15, { type: 'sawtooth', slide: 2.5, vol: 0.06 }); break;
        case 'dodge': this._noise(0.22, { freq: 1500, filter: 'bandpass', vol: 0.16 }); break;
        case 'attack': this._noise(0.12, { freq: 2400, filter: 'highpass', vol: 0.15 }); this._tone(520, 0.09, { type: 'triangle', slide: 0.6, vol: 0.08 }); break;
        case 'hit': this._tone(140, 0.12, { type: 'square', slide: 0.5, vol: 0.2 }); this._noise(0.1, { freq: 1200, vol: 0.18 }); break;
        case 'hurt': this._tone(220, 0.25, { type: 'sawtooth', slide: 0.4, vol: 0.2 }); break;
        case 'lifeLost': [440, 330, 220].forEach((f, i) => this._tone(f, 0.22, { type: 'triangle', delay: i * 0.12, vol: 0.18 })); break;
        case 'correct': [660, 880, 1320].forEach((f, i) => this._tone(f, 0.16, { type: 'triangle', delay: i * 0.06, vol: 0.16 })); break;
        case 'wrong': this._tone(196, 0.32, { type: 'sawtooth', slide: 0.7, vol: 0.18 }); this._tone(185, 0.32, { type: 'square', slide: 0.7, vol: 0.08 }); break;
        case 'combo': this._tone(880 + Math.min(10, MG.State.combo) * 60, 0.12, { type: 'square', vol: 0.1 }); break;
        case 'pickup': [988, 1318].forEach((f, i) => this._tone(f, 0.1, { type: 'sine', delay: i * 0.05, vol: 0.16 })); break;
        case 'door': this._noise(0.6, { freq: 300, vol: 0.25 }); this._tone(110, 0.6, { type: 'sine', slide: 2, vol: 0.12 }); break;
        case 'select': this._tone(740, 0.05, { type: 'sine', vol: 0.1 }); break;
        case 'confirm': this._tone(523, 0.08, { type: 'triangle', vol: 0.12 }); this._tone(784, 0.1, { type: 'triangle', delay: 0.05, vol: 0.12 }); break;
        case 'ui': this._tone(600, 0.04, { type: 'sine', vol: 0.07 }); break;
        case 'warn': this._tone(880, 0.08, { type: 'square', vol: 0.08 }); this._tone(880, 0.08, { type: 'square', delay: 0.12, vol: 0.08 }); break;
        case 'boss': this._tone(55, 1.4, { type: 'sawtooth', slide: 1.5, vol: 0.3, attack: 0.2 }); this._noise(1.2, { freq: 200, vol: 0.3 }); break;
        case 'shield': [1200, 900, 600, 300].forEach((f, i) => this._tone(f, 0.12, { type: 'square', delay: i * 0.04, vol: 0.12 })); this._noise(0.4, { freq: 4000, filter: 'highpass', vol: 0.2 }); break;
        case 'bossHit': this._tone(90, 0.3, { type: 'square', slide: 0.5, vol: 0.25 }); this._noise(0.25, { freq: 800, vol: 0.25 }); break;
        case 'victory': [523, 659, 784, 1046].forEach((f, i) => this._tone(f, 0.4, { type: 'triangle', delay: i * 0.12, vol: 0.16 })); break;
        case 'defeat': [392, 349, 311, 262].forEach((f, i) => this._tone(f, 0.5, { type: 'sine', delay: i * 0.2, vol: 0.16 })); break;
        case 'portal': this._tone(200, 1.2, { type: 'sine', slide: 4, vol: 0.18, attack: 0.3 }); this._noise(1.1, { freq: 2500, filter: 'bandpass', vol: 0.12 }); break;
        case 'type': this._tone(1200 + Math.random() * 300, 0.03, { type: 'sine', vol: 0.03 }); break;
        case 'awaken': [262, 392, 523, 784, 1046].forEach((f, i) => this._tone(f, 0.6, { type: 'sawtooth', delay: i * 0.05, vol: 0.07 })); break;
        default: break;
      }
    },
    /* 절차적 배경음악: 룩어헤드 스케줄러 */
    music(mood) {
      if (!this.ctx) { this._pendingMood = mood; return; }
      if (this.mood === mood) return;
      this.mood = mood;
      this._step = 0;
      this._nextT = this.ctx.currentTime + 0.1;
      if (!this._timer) this._timer = setInterval(() => this._schedule(), 60);
    },
    stopMusic() { this.mood = null; },
    _midi(n) { return 440 * Math.pow(2, (n - 69) / 12); },
    _schedule() {
      if (!this.ctx || !this.mood) return;
      const m = MOODS[this.mood];
      if (!m) return;
      const spb = 60 / m.bpm / 2; // 8분음표
      while (this._nextT < this.ctx.currentTime + 0.25) {
        const t = this._nextT, i = this._step;
        const bar = Math.floor(i / 8) % m.chords.length, beat = i % 8;
        const chord = m.chords[bar];
        const delay = Math.max(0, t - this.ctx.currentTime);
        if (beat === 0 && m.pad > 0) chord.forEach((c) => this._tone(this._midi(m.root + 12 + c), spb * 8 * 0.95, { type: 'sine', vol: m.pad * 0.5, attack: 0.25, bus: this.bgmBus, delay }));
        if (beat % 4 === 0) this._tone(this._midi(m.root - 12 + chord[0]), spb * 3.6, { type: 'triangle', vol: 0.16, bus: this.bgmBus, delay });
        this._seed = (this._seed * 1103515245 + 12345) & 0x7fffffff;
        const r = this._seed / 0x7fffffff;
        if (m.lead > 0 && (beat % 2 === 0 || r > 0.6)) {
          const deg = m.scale[Math.floor(r * m.scale.length)];
          const oct = r > 0.8 ? 24 : 12;
          this._tone(this._midi(m.root + oct + deg + (chord[0] > 4 ? 0 : 0)), spb * 0.9, { type: m.wave, vol: m.lead * 0.45, bus: this.bgmBus, delay });
        }
        if (m.drums > 0) {
          if (beat === 0 || beat === 4) this._tone(60, 0.18, { type: 'sine', slide: 0.4, vol: 0.35 * m.drums, bus: this.bgmBus, delay });
          if (beat === 2 || beat === 6) this._noise(0.12, { freq: 1800, filter: 'bandpass', vol: 0.12 * m.drums, bus: this.bgmBus, delay });
          this._noise(0.03, { freq: 7000, filter: 'highpass', vol: 0.04 * m.drums, bus: this.bgmBus, delay });
        }
        this._nextT += spb;
        this._step++;
      }
    }
  };
  MG.Audio = A;
})();

</script>
<script>/* js/systems/PerformanceManager.js */
/* PerformanceManager — FPS 측정, 화면 주사율 추정, 자동 품질 단계 조절 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  const P = {
    fps: 60, frameMs: 16.7, refreshHz: 60, _samples: [], _hzSamples: [],
    tier: 'balanced', _badT: 0, _goodT: 0, _cool: 0,
    init() {
      // 첫 자동 단계: 기기 정보로 추정 (저사양 탐지)
      const cores = navigator.hardwareConcurrency || 4;
      const mem = navigator.deviceMemory || 4;
      const small = Math.min(screen.width, screen.height) < 500;
      this.tier = cores <= 4 || mem <= 3 ? 'low' : (small ? 'balanced' : 'high');
      if (MG.Settings.get('graphicsMode') === 'auto') MG.Settings.autoTier(this.tier);
    },
    /* 제한 없는 rAF 간격으로 화면 주사율 추정 */
    raf(ms) {
      if (this._hzSamples.length < 90 && ms > 2 && ms < 50) {
        this._hzSamples.push(ms);
        if (this._hzSamples.length === 90) {
          const s = this._hzSamples.slice().sort((a, b) => a - b);
          const med = s[45];
          this.refreshHz = med < 7.5 ? 144 : med < 9.5 ? 120 : med < 12 ? 90 : 60;
          MG.bus.emit('perf:hz', this.refreshHz);
        }
      }
    },
    /* 실제 그린 프레임 간격(ms)과 작업 시간으로 FPS·부하 계산 */
    sample(rawMs, workMs) {
      this._samples.push(rawMs);
      if (this._samples.length > 60) this._samples.shift();
      const avg = this._samples.reduce((a, b) => a + b, 0) / this._samples.length;
      this.frameMs = avg; this.fps = 1000 / avg;
      this.workMs = workMs;
      this._autoAdjust(rawMs / 1000, workMs);
    },
    _autoAdjust(dt, workMs) {
      if (MG.Settings.get('graphicsMode') !== 'auto') return;
      if (this._cool > 0) { this._cool -= dt; return; }
      const cap = MG.Settings.get('fpsCap');
      const budget = 1000 / Math.min(cap, this.refreshHz);
      // 실제 작업 시간이 예산의 85%를 넘으면 단계 하향, 40% 미만이면 상향
      if (workMs > budget * 0.85 || this.fps < Math.min(cap, this.refreshHz) * 0.8) { this._badT += dt; this._goodT = 0; }
      else if (workMs < budget * 0.4) { this._goodT += dt; this._badT = 0; }
      const order = ['low', 'balanced', 'high'];
      let i = order.indexOf(this.tier);
      if (this._badT > 2 && i > 0) { i--; this._badT = 0; this._cool = 4; this._ceil = i; }
      else if (this._goodT > 12 && i < (this._ceil == null ? 2 : this._ceil)) { i++; this._goodT = 0; this._cool = 6; }
      if (order[i] !== this.tier) {
        this.tier = order[i];
        MG.Settings.autoTier(this.tier);
      }
    },
    /* 120FPS 지원 여부 안내 */
    supports(fps) { return this.refreshHz >= fps - 5; }
  };
  MG.Perf = P;
})();

</script>
<script>/* js/core/Input.js */
/* Input — 키보드 + 터치 (드래그로 위치 편집 가능한 가상 조작부) */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
    ShiftLeft: 'dash', ShiftRight: 'dash', KeyK: 'dash',
    KeyJ: 'attack', KeyZ: 'attack',
    KeyL: 'dodge', KeyX: 'dodge', KeyC: 'dodge', ArrowDown: 'dodge', KeyS: 'dodge',
    KeyE: 'interact', Enter: 'interact', KeyF: 'interact',
    Escape: 'pause', KeyP: 'pause'
  };

  const DEFAULT_LAYOUT = {
    stick:    { x: 13, y: 76 },
    jump:     { x: 90, y: 78 },
    attack:   { x: 79, y: 86 },
    dash:     { x: 90, y: 58 },
    dodge:    { x: 79, y: 66 },
    interact: { x: 66, y: 80 }
  };
  const LABELS = { jump: '점프', attack: '붓', dash: '대시', dodge: '회피', interact: '조사' };

  const I = {
    held: {}, _pressed: {}, axis: 0, _keyAxis: 0, _stickAxis: 0,
    touchEnabled: false, touchVisible: false, editMode: false, root: null, els: {},
    init() {
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        const a = KEYMAP[e.code];
        if (!a) return;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        if (!e.repeat) this._pressed[a] = true;
        this.held[a] = true;
        this._calcKeyAxis();
      });
      window.addEventListener('keyup', (e) => {
        const a = KEYMAP[e.code];
        if (!a) return;
        this.held[a] = false;
        this._calcKeyAxis();
      });
      window.addEventListener('blur', () => { this.held = {}; this._keyAxis = 0; this._stickAxis = 0; this._updateAxis(); });
      this.touchEnabled = this._detectTouch();
      this.build();
      MG.bus.on('settings:change', (k) => { if (k === 'touchControls' || k === 'reset' || k === 'layout') { this.touchEnabled = this._detectTouch(); this.applyLayout(); this._syncVisible(); } });
      window.addEventListener('resize', () => this.applyLayout());
    },
    _detectTouch() {
      const mode = MG.Settings.get('touchControls');
      if (mode === 'on') return true;
      if (mode === 'off') return false;
      return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    },
    _calcKeyAxis() {
      this._keyAxis = (this.held.right ? 1 : 0) - (this.held.left ? 1 : 0);
      this._updateAxis();
    },
    _updateAxis() {
      this.axis = this._keyAxis !== 0 ? this._keyAxis : this._stickAxis;
    },
    down(a) { return !!this.held[a] || (a === 'left' && this.axis < -0.3) || (a === 'right' && this.axis > 0.3); },
    pressed(a) { return !!this._pressed[a]; },
    consume(a) { const v = !!this._pressed[a]; this._pressed[a] = false; return v; },
    flush() { this._pressed = {}; },
    /* 먹물 조준 취소 (공격 버튼에서 손가락을 버튼 밖으로 크게 밀어낸 경우) */
    consumeCancel() { const v = !!this._aimCancel; this._aimCancel = false; return v; },
    press(a) { this._pressed[a] = true; },

    /* ── 터치 조작부 ── */
    build() {
      const root = this.root = U.el('div', { id: 'touch', class: 'touch-layer' });
      const stick = U.el('div', { class: 'tc tc-stick', 'data-id': 'stick' }, U.el('div', { class: 'tc-knob' }));
      root.appendChild(stick); this.els.stick = stick;
      ['jump', 'attack', 'dash', 'dodge', 'interact'].forEach((id) => {
        const b = U.el('div', { class: 'tc tc-btn tc-' + id, 'data-id': id }, U.el('span', { class: 'tc-label', text: LABELS[id] }));
        root.appendChild(b); this.els[id] = b;
      });
      this.editBar = U.el('div', { class: 'tc-editbar glass' },
        U.el('span', { text: '버튼을 끌어서 위치를 바꾸세요' }),
        U.el('button', { class: 'btn small', onclick: () => { MG.Settings.data.layout = null; MG.Settings.save(); this.applyLayout(); } }, '기본값'),
        U.el('button', { class: 'btn small primary', onclick: () => this.setEdit(false) }, '완료'));
      root.appendChild(this.editBar);
      document.getElementById('app').appendChild(root);
      this._bindStick(stick);
      ['jump', 'attack', 'dash', 'dodge', 'interact'].forEach((id) => this._bindBtn(this.els[id], id));
      this.applyLayout();
      this._syncVisible();
    },
    layout() {
      const l = MG.Settings.get('layout') || {};
      const out = {};
      for (const k in DEFAULT_LAYOUT) out[k] = l[k] || DEFAULT_LAYOUT[k];
      return out;
    },
    applyLayout() {
      const L = this.layout();
      for (const id in this.els) {
        const p = L[id]; if (!p) continue;
        const e = this.els[id];
        e.style.left = p.x + '%'; e.style.top = p.y + '%';
      }
    },
    _bindBtn(b, id) {
      const start = (e) => {
        e.preventDefault();
        if (this.editMode) return this._dragStart(e, b, id);
        b.classList.add('on');
        this.held[id] = true; this._pressed[id] = true;
        U.vibrate(8);
        b.setPointerCapture && b.setPointerCapture(e.pointerId);
      };
      const end = (e) => { if (this.editMode) return; b.classList.remove('on'); this.held[id] = false; };
      if (id === 'attack') {
        // 길게 누른 채 손가락을 버튼 밖으로 크게 밀면 조준 취소 (떼도 발사하지 않음)
        b.addEventListener('pointermove', (e) => {
          if (this.editMode || !this.held.attack) return;
          const r = b.getBoundingClientRect(), m = r.width * 0.9;
          if (e.clientX < r.left - m || e.clientX > r.right + m || e.clientY < r.top - m || e.clientY > r.bottom + m) { this._aimCancel = true; }
        });
      }
      b.addEventListener('pointerdown', start);
      b.addEventListener('pointerup', end);
      b.addEventListener('pointercancel', end);
      b.addEventListener('lostpointercapture', end);
    },
    _bindStick(st) {
      const knob = st.firstChild;
      let pid = null, ox = 0, oy = 0;
      const move = (e) => {
        if (pid !== e.pointerId) return;
        const dx = e.clientX - ox, dy = e.clientY - oy;
        const r = st.offsetWidth * 0.42;
        const cl = Math.min(1, Math.hypot(dx, dy) / r);
        const ang = Math.atan2(dy, dx);
        knob.style.transform = `translate(${Math.cos(ang) * cl * r}px, ${Math.sin(ang) * cl * r}px)`;
        const dead = 0.22 / U.clamp(MG.Settings.get('sensitivity'), 0.5, 2);
        let ax = U.clamp(dx / r, -1, 1);
        if (Math.abs(ax) < dead) ax = 0;
        this._stickAxis = ax === 0 ? 0 : U.sign(ax) * U.clamp((Math.abs(ax) - dead) / (1 - dead) * 1.25, 0, 1);
        // 위로 크게 밀면 점프 (선택적 보조)
        this._updateAxis();
      };
      const end = (e) => {
        if (pid !== e.pointerId) return;
        pid = null; this._stickAxis = 0; this._updateAxis();
        knob.style.transform = ''; st.classList.remove('on');
      };
      st.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (this.editMode) return this._dragStart(e, st, 'stick');
        pid = e.pointerId; const r = st.getBoundingClientRect();
        ox = r.left + r.width / 2; oy = r.top + r.height / 2;
        st.classList.add('on');
        st.setPointerCapture && st.setPointerCapture(e.pointerId);
        move(e);
      });
      st.addEventListener('pointermove', move);
      st.addEventListener('pointerup', end);
      st.addEventListener('pointercancel', end);
    },
    _dragStart(e, elem, id) {
      const W = window.innerWidth, H = window.innerHeight;
      const mv = (ev) => {
        const x = U.clamp(ev.clientX / W * 100, 5, 95), y = U.clamp(ev.clientY / H * 100, 12, 94);
        elem.style.left = x + '%'; elem.style.top = y + '%';
        const l = Object.assign({}, MG.Settings.get('layout') || {});
        l[id] = { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
        MG.Settings.data.layout = l;
      };
      const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); MG.Settings.save(); };
      window.addEventListener('pointermove', mv);
      window.addEventListener('pointerup', up);
    },
    setEdit(on) {
      this.editMode = on;
      this.root.classList.toggle('editing', on);
      if (on) { this._prevVisible = this.touchVisible; this.root.classList.add('show'); }
      else this._syncVisible();
    },
    setTouchVisible(v) { this.touchVisible = v; this._syncVisible(); },
    _syncVisible() {
      if (!this.root) return;
      this.root.classList.toggle('show', (this.touchEnabled && this.touchVisible) || this.editMode);
    },
    setInteract(label) {
      const b = this.els.interact;
      if (!b) return;
      b.classList.toggle('avail', !!label);
      if (label) b.firstChild.textContent = label;
    },
    releaseAll() { this.held = {}; this._pressed = {}; this._stickAxis = 0; this._keyAxis = 0; this._updateAxis(); }
  };
  MG.Input = I;
})();

</script>
<script>/* js/core/Renderer.js */
/* Renderer — Canvas 2.5D 렌더러
 * 다층 패럴랙스, 원근이 있는 블록(윗면·옆면), 부드러운 그림자, 조명, 파티클, 카메라(추적·줌·흔들림), 비네트·플래시·레터박스 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const VIEW_H = 720;        // 줌 1에서 화면 세로에 보이는 월드 단위
  const DEPTH = 26;          // 블록 윗면 깊이
  const PERSP = 0.035;       // 소실점 쪽으로 기우는 정도

  const FONT = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';

  /* ── 카메라 ── */
  class Camera {
    constructor() {
      this.x = 0; this.y = 0; this.zoom = 1; this.tx = 0; this.ty = 0; this.tzoom = 1;
      this.shakeT = 0; this.shakeMag = 0; this.sx = 0; this.sy = 0;
      this.bounds = null; this.lead = 0; this.follow = 7; this.zoomSpeed = 3;
    }
    snap(x, y) { this.x = this.tx = x; this.y = this.ty = y; }
    shake(mag, t) {
      if (!MG.Settings.get('screenShake')) return;
      this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t);
    }
    update(dt, viewW) {
      const k = 1 - Math.exp(-this.follow * dt);
      let tx = this.tx, ty = this.ty;
      if (this.bounds) {
        const halfW = viewW / 2 / this.zoom, halfH = VIEW_H / 2 / this.zoom;
        const b = this.bounds;
        tx = b.x1 - b.x0 < halfW * 2 ? (b.x0 + b.x1) / 2 : U.clamp(tx, b.x0 + halfW, b.x1 - halfW);
        if (b.y0 != null) ty = U.clamp(ty, b.y0 + halfH, b.y1 - halfH);
      }
      this.x += (tx - this.x) * k;
      this.y += (ty - this.y) * k;
      this.zoom += (this.tzoom - this.zoom) * (1 - Math.exp(-this.zoomSpeed * dt));
      if (this.shakeT > 0) {
        this.shakeT -= dt;
        const m = this.shakeMag * U.clamp(this.shakeT * 3, 0, 1);
        this.sx = (Math.random() * 2 - 1) * m; this.sy = (Math.random() * 2 - 1) * m;
        if (this.shakeT <= 0) { this.shakeMag = 0; this.sx = this.sy = 0; }
      }
    }
  }

  /* ── 파티클 (오브젝트 풀) ── */
  class Particles {
    constructor(max) { this.pool = []; this.live = []; this.max = max; }
    spawn(o) {
      const lim = Math.floor(this.max * MG.Settings.get('particles'));
      if (this.live.length >= lim) return null;
      const p = this.pool.pop() || {};
      p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.life = p.max = o.life || 0.6;
      p.size = o.size || 4; p.size2 = o.size2 == null ? 0 : o.size2; p.color = o.color || '#fff';
      p.grav = o.grav || 0; p.drag = o.drag == null ? 1.5 : o.drag; p.shape = o.shape || 'dot';
      p.glow = !!o.glow; p.rot = o.rot || 0; p.vr = o.vr || 0; p.text = o.text || '';
      this.live.push(p); return p;
    }
    burst(x, y, n, opt) {
      for (let i = 0; i < n; i++) {
        const a = (opt.angle != null ? opt.angle : 0) + (Math.random() - 0.5) * (opt.spread != null ? opt.spread : Math.PI * 2);
        const sp = U.lerp(opt.speedMin || 80, opt.speedMax || 320, Math.random());
        this.spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: U.lerp(opt.lifeMin || 0.3, opt.lifeMax || 0.8, Math.random()),
          size: U.lerp(opt.sizeMin || 2, opt.sizeMax || 6, Math.random()), size2: opt.size2, color: Array.isArray(opt.color) ? opt.color[i % opt.color.length] : opt.color,
          grav: opt.grav, drag: opt.drag, shape: opt.shape, glow: opt.glow, vr: (Math.random() - 0.5) * 10 });
      }
    }
    update(dt) {
      const L = this.live;
      for (let i = L.length - 1; i >= 0; i--) {
        const p = L[i];
        p.life -= dt;
        if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
        const d = Math.exp(-p.drag * dt);
        p.vx *= d; p.vy = p.vy * d + p.grav * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      }
    }
    draw(ctx, view) {
      const L = this.live;
      for (let i = 0; i < L.length; i++) {
        const p = L[i];
        if (p.x < view.x0 - 50 || p.x > view.x1 + 50 || p.y < view.y0 - 50 || p.y > view.y1 + 50) continue;
        const t = p.life / p.max;
        const s = U.lerp(p.size2, p.size, t);
        ctx.globalAlpha = Math.min(1, t * 1.6);
        if (p.glow && MG.Settings.get('lighting')) ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
        if (p.shape === 'line') {
          ctx.lineWidth = Math.max(1, s * 0.5);
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
        } else if (p.shape === 'square') {
          const P = MG.Pixel.PX, z = Math.max(P, Math.round(s / P) * P);
          ctx.fillRect(Math.round(p.x / P) * P - z / 2, Math.round(p.y / P) * P - z / 2, z, z);
        } else if (p.shape === 'text') {
          ctx.font = '700 ' + Math.round(s) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y);
        } else if (p.shape === 'ring') {
          ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, (1 - t) * p.size * 6 + 2), 0, Math.PI * 2); ctx.stroke();
        } else {
          // 원형 입자도 아트 픽셀 격자의 사각 도트로
          const P = MG.Pixel.PX, z = Math.max(P, Math.round(s * 2 / P) * P);
          ctx.fillRect(Math.round(p.x / P) * P - z / 2, Math.round(p.y / P) * P - z / 2, z, z);
        }
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalAlpha = 1;
    }
    clear() { while (this.live.length) this.pool.push(this.live.pop()); }
  }

  /* ── 패럴랙스 레이어 생성기 (절차적 실루엣) ── */
  function silhouette(g, type, W, H, base, rnd, col, accent) {
    g.fillStyle = col;
    const ridge = (amp, step, rough) => {
      g.beginPath(); g.moveTo(0, H);
      let y = base - amp * 0.5;
      for (let x = 0; x <= W + step; x += step) { y = U.clamp(y + (rnd() - 0.5) * rough, base - amp, base - amp * 0.15); g.lineTo(x, y); }
      g.lineTo(W, H); g.closePath(); g.fill();
    };
    switch (type) {
      case 'mountains': {
        g.beginPath(); g.moveTo(0, H);
        let x = 0;
        while (x < W) { const w = 180 + rnd() * 260, h = 120 + rnd() * 200; g.lineTo(x + w * 0.5, base - h); g.lineTo(x + w, base - h * 0.2 * rnd()); x += w * 0.85; }
        g.lineTo(W, base); g.lineTo(W, H); g.closePath(); g.fill(); break;
      }
      case 'hills': ridge(110, 40, 40); break;
      case 'hanok': {
        let x = 0;
        while (x < W) {
          const w = 150 + rnd() * 120, h = 60 + rnd() * 40, y = base - h;
          g.fillRect(x + 12, y, w - 24, h + 4);
          g.beginPath(); // 곡선 지붕
          g.moveTo(x - 10, y + 6); g.quadraticCurveTo(x + w * 0.5, y - 48, x + w + 10, y + 6);
          g.quadraticCurveTo(x + w * 0.5, y - 26, x - 10, y + 6); g.fill();
          g.fillRect(x + w * 0.3, y - 30, w * 0.4, 14);
          if (accent && rnd() > 0.4) { g.fillStyle = accent; g.fillRect(x + w * 0.45, y + h * 0.35, 14, 18); g.fillStyle = col; }
          x += w + rnd() * 40;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'brick': case 'city': {
        let x = 0;
        while (x < W) {
          const w = 70 + rnd() * 110, h = (type === 'city' ? 120 : 80) + rnd() * 180;
          g.fillRect(x, base - h, w, h + 2);
          if (rnd() > 0.6) { g.fillRect(x + w * 0.4, base - h - 30, w * 0.2, 30); }
          if (accent) {
            g.fillStyle = accent;
            for (let wy = base - h + 16; wy < base - 20; wy += 26) for (let wx = x + 10; wx < x + w - 14; wx += 22) if (rnd() > 0.45) g.fillRect(wx, wy, 9, 12);
            g.fillStyle = col;
          }
          x += w + 6 + rnd() * 20;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'factory': {
        let x = 0;
        while (x < W) {
          const w = 160 + rnd() * 120, h = 70 + rnd() * 70;
          g.fillRect(x, base - h, w, h + 2);
          for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(x + i * w / 4, base - h); g.lineTo(x + (i + 1) * w / 4, base - h - 26); g.lineTo(x + (i + 1) * w / 4, base - h); g.fill(); }
          const cx = x + w * (0.2 + rnd() * 0.6);
          g.fillRect(cx, base - h - 120 - rnd() * 60, 16, 140);
          x += w + 30 + rnd() * 60;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'school': {
        let x = 20;
        while (x < W) {
          const w = 320 + rnd() * 120, h = 120;
          g.fillRect(x, base - h, w, h + 2);
          g.fillRect(x + w * 0.45, base - h - 50, w * 0.1, 50);
          g.beginPath(); g.moveTo(x + w * 0.42, base - h - 50); g.lineTo(x + w * 0.5, base - h - 80); g.lineTo(x + w * 0.58, base - h - 50); g.fill();
          if (accent) { g.fillStyle = accent; for (let wx = x + 16; wx < x + w - 20; wx += 30) { g.fillRect(wx, base - h + 20, 16, 22); g.fillRect(wx, base - h + 66, 16, 22); } g.fillStyle = col; }
          x += w + 120 + rnd() * 100;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'fields': {
        ridge(40, 60, 20);
        g.strokeStyle = accent || col; g.lineWidth = 3; g.globalAlpha = 0.5;
        for (let y = base - 20; y < H; y += 14) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + 6); g.stroke(); }
        g.globalAlpha = 1; break;
      }
      case 'trees': {
        let x = 0;
        while (x < W) {
          const h = 80 + rnd() * 120, r = 30 + rnd() * 30;
          g.fillRect(x - 4, base - h * 0.5, 8, h * 0.5);
          g.beginPath(); g.arc(x, base - h * 0.55, r, 0, Math.PI * 2); g.arc(x - r * 0.6, base - h * 0.45, r * 0.7, 0, Math.PI * 2); g.arc(x + r * 0.6, base - h * 0.45, r * 0.7, 0, Math.PI * 2); g.fill();
          x += 60 + rnd() * 110;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'shelves': { // 기록 보관소 서가
        let x = 0;
        while (x < W) {
          const w = 120, h = 260 + rnd() * 120;
          g.fillRect(x, base - h, w, h);
          if (accent) { g.fillStyle = accent; for (let y = base - h + 10; y < base - 10; y += 22) for (let bx = x + 6; bx < x + w - 8; bx += 7 + rnd() * 6) if (rnd() > 0.2) g.fillRect(bx, y, 5, 16); g.fillStyle = col; }
          x += w + 40;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'camp': {
        let x = 0;
        while (x < W) {
          const w = 120 + rnd() * 80, h = 60 + rnd() * 30;
          g.beginPath(); g.moveTo(x, base); g.lineTo(x + w / 2, base - h); g.lineTo(x + w, base); g.fill();
          if (rnd() > 0.5) { g.fillRect(x + w + 20, base - 110, 4, 110); if (accent) { g.fillStyle = accent; g.fillRect(x + w + 24, base - 110, 34, 20); g.fillStyle = col; } }
          x += w + 60 + rnd() * 100;
        }
        g.fillRect(0, base, W, H - base); break;
      }
      case 'hellspires': {
        let x = 0;

  /* 도트 조명: 4단계로 끊긴 원형 빛 (매 프레임 그라디언트를 만들지 않고 캐시한 작은 그림을 확대) */
  function lightSprite(col) {
    return cached('light|' + col, () => {
      const s = 24, c = mk(s, s), g = c.getContext('2d');
      g.fillStyle = col;
      [[12, 0.25], [9, 0.45], [6, 0.7], [3.5, 1]].forEach(([r, a]) => { g.globalAlpha = a; disc(g, 12, 12, r, col); });
      g.globalAlpha = 1; return c;
    });
  }

  /* 김민준 포탈: 보라·파랑 고리 + 안쪽 별빛 + 공간 왜곡 물결 (월드 좌표, 아트 픽셀 격자) */
  function drawPortal(ctx, x, y, s, t, opt) {
    if (s <= 0.02) return;
    opt = opt || {};
    const sn = (v) => snap(v), Q = PX;
    const rx = 34 * s, ry = 64 * s;
    // 공간 왜곡: 밖으로 퍼지는 옅은 물결 2겹
    for (let k = 0; k < 2; k++) {
      const f = (t * 0.7 + k * 0.5) % 1, m = 1 + f * 0.6;
      ctx.globalAlpha = (1 - f) * 0.35 * s; ctx.fillStyle = '#b9a6ff';
      const n = 28;
      for (let i = 0; i < n; i++) { if (i % 2) continue; const a = i / n * Math.PI * 2 + t * 0.3; ctx.fillRect(sn(x + Math.cos(a) * rx * m) - Q / 2, sn(y + Math.sin(a) * ry * m) - Q / 2, Q, Q); }
    }
    ctx.globalAlpha = 1;
    // 안쪽: 깊은 보라 → 가장자리 밝은 보라 (줄 단위 도트 타원)
    for (let yy = -ry; yy <= ry; yy += Q) {
      const hw = rx * Math.sqrt(Math.max(0, 1 - (yy / ry) ** 2));
      if (hw < Q / 2) continue;
      ctx.fillStyle = '#2a1a5c'; ctx.fillRect(sn(x - hw), sn(y + yy), sn(hw * 2) || Q, Q);
      const iw = hw - Q * 2;
      if (iw > Q / 2) { ctx.fillStyle = '#140a2e'; ctx.fillRect(sn(x - iw), sn(y + yy), sn(iw * 2) || Q, Q); }
    }
    // 안으로 빨려 드는 별빛
    for (let i = 0; i < 12; i++) {
      const seed = (i * 0.618) % 1, f = 1 - ((t * 0.45 + seed) % 1);
      const a = seed * 6.283 + t * 1.6 + f * 2.2;
      ctx.fillStyle = i % 3 ? '#cfe6ff' : '#ffffff'; ctx.globalAlpha = 0.4 + 0.6 * f;
      ctx.fillRect(sn(x + Math.cos(a) * rx * 0.8 * f) - Q / 2, sn(y + Math.sin(a) * ry * 0.8 * f) - Q / 2, Q, Q);
    }
    ctx.globalAlpha = 1;
    // 회전하는 고리 띠
    const cols = ['#9b6bff', '#5aa8ff', '#d9c8ff', '#7d5cf0'], n = 40, rot = Math.floor(t * 10);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      ctx.fillStyle = cols[(i + rot) % cols.length];
      ctx.fillRect(sn(x + Math.cos(a) * rx) - Q, sn(y + Math.sin(a) * ry) - Q, Q * 2, Q * 2);
      if (i % 2 === 0) { ctx.fillStyle = '#6a4bd6'; ctx.fillRect(sn(x + Math.cos(a) * (rx - Q * 2)) - Q / 2, sn(y + Math.sin(a) * (ry - Q * 2)) - Q / 2, Q, Q); }
    }
  }
  function targetSprite(lit) {
    return cached('target|' + lit, () => {
      const c = mk(16, 30), g = c.getContext('2d');
      rect(g, 7, 14, 2, 16, '#6b4f2a'); rect(g, 7, 14, 1, 16, '#8a6a40'); rect(g, 4, 28, 8, 2, '#4a3520');
      disc(g, 8, 8, 7.5, lit ? '#f4ead2' : '#8a8a92'); disc(g, 8, 8, 5.3, lit ? '#b3261e' : '#5a5a62'); disc(g, 8, 8, 3.2, lit ? '#f4ead2' : '#8a8a92'); disc(g, 8, 8, 1.4, lit ? '#b3261e' : '#5a5a62');
      outline(c, OUT); return c;
    });
  }
  function weakRingSprite(frame) {
    return cached('weak|' + frame, () => {
      const c = mk(22, 22), g = c.getContext('2d');
      disc(g, 11, 11, 10, '#ffd76a'); disc(g, 11, 11, 7.5, '#7a1f1f'); disc(g, 11, 11, 5, '#ffe9a8');
      rect(g, 9, 7, 4, 1, '#7a1f1f'); rect(g, 10, 7, 2, 8, '#7a1f1f'); rect(g, 8, 11, 6, 1, '#7a1f1f');
      const a = frame * Math.PI / 2; P(g, 11 + Math.round(Math.cos(a) * 9), 11 + Math.round(Math.sin(a) * 9), '#ffffff');
      outline(c, '#3a1a08'); return c;
    });
  }

  /* 튜토리얼: 연습용 허수아비 (짚+천) */
  function dummySprite() {
    return cached('dummy', () => {
      const c = mk(16, 32), g = c.getContext('2d');
      rect(g, 7, 12, 2, 20, '#6b4f2a'); rect(g, 7, 12, 1, 20, '#8a6a40'); rect(g, 4, 30, 8, 2, '#4a3520');
      rect(g, 1, 13, 14, 2, '#7a5a30'); rect(g, 1, 13, 14, 1, '#9a7a48');
      rect(g, 4, 14, 8, 10, '#c9a35a'); rect(g, 4, 14, 8, 2, '#e1bf74'); rect(g, 5, 18, 6, 1, '#a07c3c'); rect(g, 5, 21, 6, 1, '#a07c3c');
      rect(g, 3, 24, 2, 2, '#c9a35a'); rect(g, 11, 24, 2, 2, '#c9a35a'); rect(g, 6, 24, 4, 3, '#b08a48');
      disc(g, 8, 7, 5, '#e8d6a8'); rect(g, 4, 3, 8, 2, '#b3261e'); rect(g, 3, 4, 10, 1, '#8c1d17');
      P(g, 6, 7, '#3a2a18'); P(g, 10, 7, '#3a2a18'); rect(g, 6, 10, 4, 1, '#3a2a18');
      outline(c, OUT); return c;
    });
  }
  /* 튜토리얼: 느린 먹구슬 발사대 (기와 받침 + 포구). charging=포구가 빛남 */
  function turretSprite(charging) {
    return cached('turret|' + charging, () => {
      const c = mk(18, 24), g = c.getContext('2d');
      rect(g, 2, 18, 14, 6, '#3a3a48'); rect(g, 2, 18, 14, 1, '#5a5a6e'); rect(g, 4, 21, 10, 1, '#2a2a34');
      rect(g, 4, 8, 10, 10, '#4a4a5c'); rect(g, 4, 8, 10, 2, '#6a6a80'); rect(g, 12, 9, 2, 8, '#33333f');
      rect(g, 0, 11, 6, 4, '#2a2a34'); rect(g, 0, 11, 6, 1, '#4a4a5c');
      rect(g, 0, 12, 2, 2, charging ? '#ffd76a' : '#15151c');
      rect(g, 6, 3, 6, 5, '#b3261e'); rect(g, 6, 3, 6, 1, '#d84a3a'); P(g, 8, 5, '#ffe9a8'); P(g, 9, 5, '#ffe9a8');
      outline(c, OUT); return c;
    });
  }

  /* 도트 그림자 (계단식 타원) */
  function shadowPix(ctx, x, y, w, a) {
    const rows = 3;
    ctx.fillStyle = 'rgba(0,0,0,' + a + ')';
    for (let k = -rows + 1; k < rows; k++) {
      const hw = snap(w * Math.sqrt(1 - (k / rows) ** 2));
      ctx.fillRect(snap(x) - hw, snap(y) + k * PX - PX / 2, hw * 2, PX);
    }
  }

  MG.Pixel = {
    PX, BOSS_PX, OUT, parse, shade, mix, bayer, mk, P, rect, line, disc, outline, mono, rotate, cached, draw, snap,
    human, humanSprite, heroSpec, npcSpec, HUMAN_ANCHOR: [AX, AY], HIP,
    inkSprite, blobSprite, scrollSprite, guardianSprite, spikeTile, orbSprite, polySprite, dropSprite, recordSprite, crystalSprite, flagSprite, lampSprite,
    blockTiles, pixelizeLayer, lightSprite, drawPortal, targetSprite, weakRingSprite, dummySprite, turretSprite, skyImage, orbImage, pixelated, shadowPix,
    clearCache() { cache.clear(); }
  };
})();

<script>/* js/core/GameCore.js */
/* GameCore — 메인 루프(고정 시간 간격 물리 + 가변 렌더), FPS 제한, 씬 전환, 일시정지/슬로모션 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const STEP = 1 / 120;

  const Core = {
    scene: null, overlay: null, timeScale: 1, _slowT: 0, _slowTo: 1, freeze: 0, menuPaused: false,
    _last: 0, _acc: 0, _lastDraw: 0, running: false, frame: 0, _hitstop: 0,
    start() {
      if (this.running) return;
      this.running = true;
      this._last = U.now();
      requestAnimationFrame((t) => this._loop(t));
    },
    setScene(scene, opts) {
      const prev = this.scene;
      if (prev && prev.exit) { try { prev.exit(); } catch (e) { console.error(e); } }
      this.freeze = 0; this.menuPaused = false; this.timeScale = 1; this._slowT = 0; this._hitstop = 0;
      MG.R.particles.clear();
      MG.R.cam.bounds = null; MG.R.cam.tzoom = 1; MG.R.letterboxT = 0;
      MG.Input.releaseAll();
      this.scene = scene;
      if (scene && scene.enter) scene.enter(opts || {});
      MG.bus.emit('scene:change', scene && scene.name);
    },
    pushFreeze() { this.freeze++; MG.Input.releaseAll(); },
    popFreeze() { this.freeze = Math.max(0, this.freeze - 1); MG.Input.flush(); },
    slowmo(scale, dur) { this.timeScale = scale; this._slowT = dur; },
    hitstop(t) { this._hitstop = Math.max(this._hitstop, t); },
    get frozen() { return this.freeze > 0 || this.menuPaused; },
    _loop(t) {
      requestAnimationFrame((tt) => this._loop(tt));
      if (this._rafPrev) MG.Perf.raf(t - this._rafPrev);
      this._rafPrev = t;
      const raw = t - this._last;
      const cap = MG.Settings.get('fpsCap');
      const minGap = 1000 / cap - 1.5;
      if (t - this._lastDraw < minGap) return;      // FPS 제한
      const workStart = U.now();
      const dtRaw = Math.min(0.1, (t - (this._lastDraw || t)) / 1000);
      this._lastDraw = t; this._last = t;
      this.frame++;
      // 슬로모션 복원
      if (this._slowT > 0) { this._slowT -= dtRaw; if (this._slowT <= 0) this.timeScale = 1; }
      let dt = dtRaw * this.timeScale;
      if (this._hitstop > 0) { this._hitstop -= dtRaw; dt = 0; }
      const sc = this.scene;
      if (!this.frozen && sc) {
        this._acc += dt;
        let n = 0;
        while (this._acc >= STEP && n < 10) {
          if (sc.update) sc.update(STEP);
          MG.State.tick(STEP);
          MG.Input.flush();
          this._acc -= STEP; n++;
        }
        if (n >= 10) this._acc = 0;
        MG.R.update(dt);
      } else {
        this._acc = 0;
        MG.R.update(0);
        if (sc && sc.updateFrozen) sc.updateFrozen(dtRaw);
        // 페이드/레터박스는 멈춤 중에도 진행
        MG.R.fadeA = MG.R.fadeTo != null ? U.approach(MG.R.fadeA, MG.R.fadeTo, (MG.R.fadeSpeed || 1) * dtRaw) : MG.R.fadeA;
        if (MG.R.fadeTo === MG.R.fadeA) MG.R.fadeTo = null;
      }
      const ov = this.overlay;
      if (ov) { try { ov.update(dtRaw); } catch (e) { console.error(e); } }
      if (sc && sc.render && !(ov && ov.full)) {
        try { sc.render(MG.R, dtRaw); } catch (e) { console.error(e); }
      }
      if (!(ov && ov.full)) MG.R.drawPost();
      if (sc && sc.renderOverlay) sc.renderOverlay(MG.R);
      if (ov) { try { ov.render(MG.R); } catch (e) { console.error(e); } }
      MG.Perf.sample(raw > 0 ? raw : 16.7, U.now() - workStart);
      if (MG.UI) MG.UI.frame(dtRaw);
    }
  };
  MG.Core = Core;
})();

<script>/* js/systems/PhysicsSystem.js */
/* PhysicsSystem — AABB 충돌, 바닥 판정, 일방향 발판, 움직이는 발판, 공간 분할 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const CELL = 256;

  class PhysicsWorld {
    constructor() { this.statics = []; this.dynamics = []; this.grid = new Map(); this.gravity = 2600; }
    clear() { this.statics.length = 0; this.dynamics.length = 0; this.grid.clear(); }
    add(s) {
      s.oneway = !!s.oneway;
      if (s.move) { s.ox = s.x; s.oy = s.y; s.t = s.move.phase || 0; s.dx = 0; s.dy = 0; this.dynamics.push(s); return s; }
      this.statics.push(s);
      const a = Math.floor(s.x / CELL), b = Math.floor((s.x + s.w) / CELL);
      for (let i = a; i <= b; i++) { if (!this.grid.has(i)) this.grid.set(i, []); this.grid.get(i).push(s); }
      return s;
    }
    remove(s) {
      s.dead = true;
      const rm = (arr) => { const i = arr.indexOf(s); if (i >= 0) arr.splice(i, 1); };
      rm(this.statics); rm(this.dynamics);
      this.grid.forEach((arr) => rm(arr));
    }
    query(x0, x1) {
      const out = [];
      const a = Math.floor(x0 / CELL), b = Math.floor(x1 / CELL);
      const seen = new Set();
      for (let i = a; i <= b; i++) {
        const arr = this.grid.get(i);
        if (arr) for (const s of arr) if (!seen.has(s) && !s.disabled) { seen.add(s); out.push(s); }
      }
      for (const s of this.dynamics) if (!s.disabled) out.push(s);
      return out;
    }
    updateMovers(dt) {
      for (const s of this.dynamics) {
        const m = s.move;
        s.t += dt * (m.speed || 1);
        const nx = s.ox + Math.sin(s.t) * (m.dx || 0), ny = s.oy + Math.sin(s.t) * (m.dy || 0);
        s.dx = nx - s.x; s.dy = ny - s.y; s.x = nx; s.y = ny;
      }
    }
    /* body: {x,y,w,h,vx,vy,onGround,ground,dropThrough} */
    step(b, dt, opts) {
      const grav = opts && opts.gravity != null ? opts.gravity : this.gravity;
      // 움직이는 발판 위라면 함께 이동
      if (b.onGround && b.ground && b.ground.move) { b.x += b.ground.dx; b.y += b.ground.dy; }
      if (!(opts && opts.noGravity)) b.vy = Math.min(b.vy + grav * dt, opts && opts.maxFall || 1700);
      const cand = this.query(b.x - 64 + Math.min(0, b.vx * dt), b.x + b.w + 64 + Math.max(0, b.vx * dt));
      // X축
      b.x += b.vx * dt;
      b.hitWall = 0;
      for (const s of cand) {
        if (s.oneway || s.noWall) continue;
        if (U.aabb(b, s)) {
          if (b.vx > 0 || (b.x + b.w / 2 < s.x + s.w / 2)) { b.x = s.x - b.w; b.hitWall = 1; }
          else { b.x = s.x + s.w; b.hitWall = -1; }
          b.vx = 0;
        }
      }
      // Y축
      const prevBottom = b.y + b.h;
      b.y += b.vy * dt;
      const wasGround = b.onGround;
      b.onGround = false; b.ground = null; b.hitCeil = false;
      for (const s of cand) {
        if (!U.aabb(b, s)) continue;
        if (s.oneway) {
          if (b.vy >= 0 && prevBottom <= s.y + 6 + (s.dy > 0 ? s.dy : 0) && !b.dropThrough) { b.y = s.y - b.h; b.vy = 0; b.onGround = true; b.ground = s; }
          continue;
        }
        if (b.vy >= 0 && prevBottom <= s.y + 12 + Math.abs(s.dy || 0)) { b.y = s.y - b.h; b.vy = 0; b.onGround = true; b.ground = s; }
        else if (b.vy < 0) { b.y = s.y + s.h; b.vy = 0; b.hitCeil = true; }
        else {
          // 끼임 방지: 가장 가까운 쪽으로 밀어냄
          const up = b.y + b.h - s.y, down = s.y + s.h - b.y;
          if (up < down) { b.y = s.y - b.h; b.onGround = true; b.ground = s; b.vy = 0; } else b.y = s.y + s.h;
        }
      }
      b.justLanded = !wasGround && b.onGround;
      return b;
    }
    /* 그림자/낙하 예측용: x 위치에서 y 아래 가장 가까운 지면 */
    groundBelow(x, y, maxD) {
      maxD = maxD || 600;
      let best = null;
      for (const s of this.query(x - 2, x + 2)) {
        if (x < s.x || x > s.x + s.w) continue;
        if (s.y >= y - 2 && s.y - y < maxD && (!best || s.y < best.y)) best = s;
      }
      return best;
    }
    solidAt(x, y) {
      for (const s of this.query(x - 1, x + 1)) if (!s.oneway && x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) return s;
      return null;
    }
  }
  MG.PhysicsWorld = PhysicsWorld;
})();

</script>

(function () {

})();

<script>/* js/systems/CombatSystem.js */
/* CombatSystem — 적, 투사체(풀링), 함정, 피격/무적 처리, 공격 판정 */
(function () {

    /* ── 플레이어 피해: 반드시 이 함수를 거쳐 중앙 상태로 전달 ── */
    hurtPlayer(dmg, srcX, tag, proj) {

          MG.R.particles.spawn({ x: p.cx, y: p.y - 20, vy: -60, life: 0.9, size: 20, size2: 18, color: '#e9ddff', shape: 'text', text: '완벽 회피!' });
        }

        return false;
      }
      // 먹물 자동 보호막: 막으면 피해 처리 자체를 하지 않는다 (HP 그대로)
      const comp = this.w.companion;
      if (comp && comp.tryBlock(tag || '', srcX, proj)) return true;

      if (!r.hit) return false;
      if (r.tutorial) {
        // 튜토리얼: 살짝 밀려나기만, 빨간 화면·큰 흔들림 없음

        MG.Audio.sfx('hit'); MG.R.cam.shake(4, 0.15);
        if (this.w.onPlayerHitTut) this.w.onPlayerHitTut(tag || '');
        return true;
      }
      p.knockback(srcX != null ? U.sign(p.cx - srcX) || -p.facing : -p.facing);
      MG.Audio.sfx('hurt'); U.vibrate(30);
      MG.R.cam.shake(10, 0.25);
      MG.R.flash('#ff3b3b', 0.18);
      MG.Core.hitstop(0.05);
      MG.R.particles.burst(p.cx, p.cy, 12, { color: ['#ff6b6b', '#fff'], speedMin: 120, speedMax: 380, lifeMax: 0.5 });
      return true;
    }

    spawnEnemy(type, x, y, o) {
      const e = Object.assign({ type, x, y, vx: 0, vy: 0, hp: 2, maxHp: 2, w: 54, h: 46, dir: -1, t: Math.random() * 6, lastHit: -1, flash: 0, dead: false, onGround: false, cd: 1 + Math.random() }, o || {});
      if (type === 'scroll') { e.w = 52; e.h = 40; e.hp = e.maxHp = 2; e.baseY = y; e.fly = true; }
      if (type === 'guardian') { e.w = 70; e.h = 120; e.hp = e.maxHp = 3; e.shield = true; e.solid = this.w.phys.add({ x, y, w: e.w, h: e.h }); }

    shoot(x, y, vx, vy, o) {

      p.grav = (o && o.grav) || 0; p.color = (o && o.color) || '#15151c'; p.kind = (o && o.kind) || 'ink'; p.dead = false; p.spin = 0;
      p.glow = o && o.glow; p.shape = (o && o.shape) || 'orb'; p.label = o && o.label;

    }
    addHazard(h) { this.hazards.push(h); return h; }

    damageEnemy(e, dmg, kx, src) {

        e.flash = 0.18; e.wob = 0.35; e.hits = (e.hits || 0) + 1;
        MG.Audio.sfx('hit'); MG.Core.hitstop(0.04); MG.R.cam.shake(3, 0.1);
        MG.R.particles.burst(e.x + e.w / 2, e.y + e.h * 0.4, 12, { color: ['#e8c77a', '#fff', '#8a6a3a'], speedMin: 100, speedMax: 320, lifeMax: 0.45, grav: 600 });

      }
      if (e.inkOnly && src !== 'ink') { MG.Audio.sfx('hit'); MG.R.particles.burst(e.x + e.w / 2, e.y + e.h / 2, 4, { color: '#bbb', speedMin: 40, speedMax: 120, lifeMax: 0.25 }); if (this.w.onInkOnlyHit) this.w.onInkOnlyHit(e); return; }
      if (e.shield) { MG.Audio.sfx('hit'); MG.R.particles.burst(e.x + e.w / 2, e.y + e.h / 2, 6, { color: '#9ad0ff', speedMin: 80, speedMax: 200, lifeMax: 0.3 }); return; }
      e.hp -= dmg; e.flash = 0.15; e.vx = kx * 260; if (!e.fly) e.vy = -260;
      MG.Audio.sfx('hit'); MG.Core.hitstop(0.035);
      MG.R.particles.burst(e.x + e.w / 2, e.y + e.h / 2, 10, { color: ['#111', '#333', '#fff'], speedMin: 100, speedMax: 340, lifeMax: 0.5, grav: 600 });
      if (e.hp <= 0) this.killEnemy(e);
    }
    killEnemy(e) {
      e.dead = true; this.kills++;
      if (e.solid) this.w.phys.remove(e.solid);
      MG.R.cam.shake(6, 0.15);
      MG.R.particles.burst(e.x + e.w / 2, e.y + e.h / 2, 22, { color: ['#0d0d12', '#2a2a35', '#d9d9e0'], speedMin: 120, speedMax: 460, lifeMax: 0.8, grav: 900, sizeMin: 3, sizeMax: 8 });

    update(dt) {
      const p = this.w.player, phys = this.w.phys;
      const hb = p ? p.hitbox() : null;
      for (const e of this.enemies) {

        e.t += dt; if (e.flash > 0) e.flash -= dt;
        if (Math.abs(e.x - p.x) > 1600 && e.type !== 'guardian') continue; // 화면 밖 처리 최소화
        if (e.type === 'blob') {
          e.vx = U.approach(e.vx, e.dir * (e.speed || 120), 600 * dt);
          phys.step(e, dt);

        } else if (e.type === 'scroll') {
          e.x += Math.cos(e.t * 0.9) * 50 * dt; e.y = e.baseY + Math.sin(e.t * 2) * 30;
          e.dir = p.cx < e.x ? -1 : 1;
          e.cd -= dt;
          if (e.cd <= 0 && Math.abs(p.cx - e.x) < 760) {
            e.cd = 2.6;

            this.shoot(e.x + 26, e.y + 20, Math.cos(a) * 380, Math.sin(a) * 380, { dmg: 12, r: 9 });
            MG.R.particles.burst(e.x + 26, e.y + 20, 5, { color: '#222', speedMin: 40, speedMax: 120, lifeMax: 0.3 });
          }
        } else if (e.type === 'guardian') {

          // 먹·붓 합격 (챕터 5 해금): 먹물 탄에 맞은 적을 바로 붓으로 치면 먹이 터지며 추가 피해
          if (e.inkMarkT > 0 && MG.Abilities && MG.Abilities.has('joint')) {
            dmg += 1; e.inkMarkT = 0;
            MG.R.particles.burst(e.x + e.w / 2, e.y + e.h / 2, 22, { color: ['#1a1030', '#a98bff', '#ffffff'], speedMin: 120, speedMax: 420, lifeMax: 0.55, shape: 'square', sizeMin: 4, sizeMax: 9 });
            MG.R.particles.spawn({ x: e.x + e.w / 2, y: e.y - 10, vy: -70, life: 0.8, size: 18, size2: 16, color: '#e9ddff', shape: 'text', text: '합격!' });

      this.enemies = this.enemies.filter((e) => !e.dead);

      for (const q of this.proj) {

        if (q.kind !== 'pass' && phys.solidAt(q.x, q.y)) { q.dead = true; MG.R.particles.burst(q.x, q.y, 5, { color: q.color, speedMin: 40, speedMax: 160, lifeMax: 0.3 }); continue; }

        if (d.y >= d.gy) { d.dead = true; MG.R.particles.burst(d.x, d.gy, 8, { angle: -Math.PI / 2, spread: 2.4, color: '#111', speedMin: 80, speedMax: 240, grav: 900, lifeMax: 0.4 }); }

    draw(R) {

      for (const h of this.hazards) {
        if (h.type === 'spikes' && R.visible(h.x, h.y, h.w, h.h)) {

          ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '700 22px ' + R.FONT; ctx.textAlign = 'center';

      }

        if (d.warn > 0) { ctx.fillStyle = 'rgba(255,60,60,' + (0.3 + 0.3 * Math.sin(R.time * 30)) + ')'; ctx.beginPath(); ctx.ellipse(d.x, d.gy, 24, 7, 0, 0, Math.PI * 2); ctx.fill(); }

        const cx = e.x + e.w / 2;

        if (e.type === 'blob') {

          let img = PXL.blobSprite(Math.floor(e.t * 8) % 4); if (fl) img = PXL.mono(img, '#ffffff');
          PXL.draw(ctx, img, cx, e.y + e.h, 12, 20, e.dir < 0 ? -1 : 1);
        } else if (e.type === 'scroll') {
          let img = PXL.scrollSprite(Math.floor(e.t * 3) % 2); if (fl) img = PXL.mono(img, '#ffffff');
          PXL.draw(ctx, img, cx, e.y + e.h / 2 + Math.round(Math.sin(e.t * 2) * 2) * PXL.PX, 11, 8, e.dir < 0 ? -1 : 1);

        } else if (e.type === 'weak') {
          R.light(cx, e.y + e.h / 2, 90, 'rgba(255,215,106,0.9)', 0.4 + 0.15 * Math.sin(R.time * 5));
          let img = PXL.weakRingSprite(Math.floor(R.time * 8) % 4); if (fl) img = PXL.mono(img, '#ffffff');
          PXL.draw(ctx, img, cx, e.y + e.h / 2 + Math.round(Math.sin(R.time * 3) * 2) * PXL.PX, 11, 11, 1);
        } else if (e.type === 'dummy') {
          R.shadow(cx, e.y + e.h, 26, 0.35);
          let img = PXL.dummySprite(); if (fl) img = PXL.mono(img, '#ffffff');
          const wob = e.wob > 0 ? Math.round(Math.sin(e.wob * 40) * 2) * PXL.PX : 0;
          PXL.draw(ctx, img, cx + wob, e.y + e.h, img.width / 2, img.height, 1);
        } else if (e.type === 'turret') {
          R.shadow(cx, e.y + e.h, 30, 0.4);
          let img = PXL.turretSprite(!!e.charging && Math.floor(R.time * 10) % 2 === 0); if (fl) img = PXL.mono(img, '#ffffff');
          PXL.draw(ctx, img, cx, e.y + e.h, img.width / 2, img.height, e.dir < 0 ? 1 : -1);
        } else if (e.type === 'guardian') {
          R.shadow(cx, e.y + e.h, 50, 0.45);

          if (e.shield) {
            // 도트 방어막 고리
            const P = PXL.PX, n = 40, on = Math.floor(R.time * 8);
            ctx.fillStyle = 'rgba(154,208,255,' + (0.55 + 0.25 * Math.sin(R.time * 4)) + ')';
            for (let k = 0; k < n; k++) { if ((k + on) % 5 === 0) continue; const a = k / n * Math.PI * 2; ctx.fillRect(PXL.snap(cx + Math.cos(a) * 60) - P, PXL.snap(e.y + e.h / 2 + Math.sin(a) * 76) - P, P * 2, P * 2); }

          const img = MG.Pixel.orbSprite(col0, q.r);

        } else {
          const z = Math.max(MG.Pixel.PX, MG.Pixel.snap(q.r * 2)); ctx.fillRect(MG.Pixel.snap(q.x) - z / 2, MG.Pixel.snap(q.y) - z / 2, z, z);

      }
    }
  }
  MG.Combat = Combat;
})();

/* BossArt — 보스·마스코트·NPC의 절차적 외형 (원점: 발밑 중앙) */

      ctx.fillStyle = '#ffdf8a'; ctx.beginPath(); ctx.arc(-w * 0.3, -h * 0.3, 14, 0, Math.PI * 2); ctx.arc(w * 0.3, -h * 0.3, 14, 0, Math.PI * 2); ctx.fill();

      [-1, 1].forEach((s) => {
        ctx.strokeStyle = '#3b3328'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(s * w * 0.44, 0); ctx.lineTo(s * w * 0.44 - 30, 70); ctx.moveTo(s * w * 0.44, 0); ctx.lineTo(s * w * 0.44 + 30, 70); ctx.stroke();

    },
    mask(ctx, R, b) { // 편견의 가면
      const w = b.w_, h = b.h_;

      ctx.fillStyle = '#ece6d6'; ctx.beginPath(); ctx.ellipse(0, 0, w * 0.42, h * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a1f1f'; ctx.beginPath(); ctx.ellipse(0, 0, w * 0.42, h * 0.42, 0, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(-w * 0.16, -h * 0.08, 18, 10, -0.3, 0, Math.PI * 2); ctx.ellipse(w * 0.16, -h * 0.08, 18, 10, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, h * 0.18, 30, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();

    },
    hydra(ctx, R, b) { // 식민 사관 삼두사
      const w = b.w_, h = b.h_;
      ctx.fillStyle = '#20232b'; ctx.beginPath(); ctx.ellipse(0, -h * 0.18, w * 0.4, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      const names = ['타율성론', '정체성론', '당파성론'];
      [-1, 0, 1].forEach((s, i) => {
        const hx = s * w * 0.36 + Math.sin(b.t * 2 + i) * 10, hy = -h * 0.72 - (s === 0 ? 40 : 0) + Math.cos(b.t * 2.4 + i) * 10;
        ctx.strokeStyle = '#20232b'; ctx.lineWidth = 26; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(s * w * 0.15, -h * 0.25); ctx.quadraticCurveTo(s * w * 0.5, -h * 0.45, hx, hy); ctx.stroke();
        ctx.fillStyle = '#2c303a'; ctx.beginPath(); ctx.ellipse(hx, hy, 36, 26, s * 0.3, 0, Math.PI * 2); ctx.fill();
        eye(ctx, hx + 10 * (s || 1), hy - 6, 7, '#e2453a', b.t + i);

    },
    machine(ctx, R, b) { // 총동원 기계
      const w = b.w_, h = b.h_;
      ctx.fillStyle = '#2e2f35'; ctx.fillRect(-w * 0.45, -h * 0.7, w * 0.9, h * 0.7);
      ctx.fillStyle = '#3d3f47'; ctx.fillRect(w * 0.15, -h, 34, h * 0.35);
      ctx.fillStyle = 'rgba(120,120,130,0.5)'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(w * 0.15 + 17, -h - 20 - ((b.t * 50 + i * 40) % 120), 16 + i * 4, 0, Math.PI * 2); ctx.fill(); }
      [[-0.2, -0.45, 46], [0.12, -0.3, 32]].forEach((g, i) => {
        ctx.save(); ctx.translate(g[0] * w, g[1] * h); ctx.rotate(b.t * (i ? -2 : 1.5));
        ctx.fillStyle = '#6a6c78';
        for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-6, -g[2] - 8, 12, 14); }
        ctx.beginPath(); ctx.arc(0, 0, g[2], 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#2e2f35'; ctx.beginPath(); ctx.arc(0, 0, g[2] * 0.35, 0, Math.PI * 2); ctx.fill();

      });
      ctx.fillStyle = '#c9b27a'; ctx.font = '800 20px ' + R.FONT; ctx.textAlign = 'center'; ctx.fillText('總動員', 0, -h * 0.1);

    },
    eraser(ctx, R, b) { // 말살의 지우개
      const w = b.w_, h = b.h_;
      ctx.save(); ctx.translate(0, -h * 0.5); ctx.rotate(Math.sin(b.t * 1.6) * 0.12);
      ctx.fillStyle = '#e9e4da'; R.roundRect(-w * 0.45, -h * 0.4, w * 0.9, h * 0.8, 18); ctx.fill();
      ctx.fillStyle = '#5c2b2b'; ctx.fillRect(-w * 0.45, -h * 0.05, w * 0.9, h * 0.45);
      ctx.fillStyle = '#e9e4da'; ctx.font = '800 22px ' + R.FONT; ctx.textAlign = 'center'; ctx.fillText('抹 殺', 0, h * 0.2);
      eye(ctx, -w * 0.15, -h * 0.2, 11, '#222', b.t); eye(ctx, w * 0.15, -h * 0.2, 11, '#222', b.t);

    shadow(ctx, R, b) { // 밀정의 그림자
      const w = b.w_, h = b.h_;

      ctx.beginPath(); ctx.moveTo(-w * 0.45, 0);

      ctx.lineTo(w * 0.3, -h * 0.75); ctx.quadraticCurveTo(0, -h * 1.08, -w * 0.3, -h * 0.75); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8e3d0'; ctx.beginPath(); ctx.ellipse(-12, -h * 0.72, 8, 4, 0, 0, Math.PI * 2); ctx.ellipse(12, -h * 0.72, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c9b27a'; ctx.font = '700 16px ' + R.FONT; ctx.textAlign = 'center'; ctx.fillText('密 偵', 0, -h * 0.4);
    },
    clock(ctx, R, b) { // 무산의 시계
      const w = b.w_, h = b.h_, r = Math.min(w, h) * 0.42;
      ctx.save(); ctx.translate(0, -h * 0.55);
      ctx.fillStyle = '#e8dfc8'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4a3a22'; ctx.lineWidth = 10; ctx.stroke();
      ctx.fillStyle = '#3a2f1e'; ctx.font = '700 15px ' + R.FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ['1940', '1941', '1942', '1943', '1944', '1945'].forEach((y, i) => { const a = -Math.PI / 2 + i / 6 * Math.PI * 2; ctx.fillText(y, Math.cos(a) * r * 0.72, Math.sin(a) * r * 0.72); });
      ctx.strokeStyle = '#2a2016'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(b.t * 0.7) * r * 0.55, Math.sin(b.t * 0.7) * r * 0.55); ctx.stroke();
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(-b.t * 3) * r * 0.8, Math.sin(-b.t * 3) * r * 0.8); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#4a3a22'; ctx.fillRect(-12, -h * 0.2, 24, h * 0.2);
    },
    yedam(ctx, R, b) { // 지옥의 지배자 안예닮 (허구의 캐릭터)
      const w = b.w_, h = b.h_;
      ctx.save(); ctx.translate(0, -h * 0.6);
      // 기하학 후광
      ctx.strokeStyle = 'rgba(255,60,90,0.7)'; ctx.lineWidth = 3;
      ctx.save(); ctx.rotate(b.t * 0.4); ctx.beginPath(); for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; ctx.lineTo(Math.cos(a) * 110, Math.sin(a) * 110); } ctx.closePath(); ctx.stroke(); ctx.restore();

      ctx.restore();
