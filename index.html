<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="망각의 연대기 — 한국사 기말고사 범위로 만든 2.5D 시네마틱 액션 어드벤처">
<title>망각의 연대기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080f'/%3E%3Cpath d='M32 12c9 0 15 8 15 18 0 14-10 22-15 22S17 44 17 30c0-10 6-18 15-18z' fill='%23111'/%3E%3Ccircle cx='26' cy='30' r='4' fill='%23fff'/%3E%3Ccircle cx='38' cy='30' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* 망각의 연대기 — 시네마틱 미니멀 UI (절제된 색, 정교한 타이포, 필요한 곳에만 유리 효과) */
:root {
  --ui: 1; --btn: 1; --btn-op: .55; --btn-fit: 1;
  --fs: calc(clamp(13px, 1.05vw + 8px, 19px) * var(--ui));
  --bg: #07080f; --ink: #f5f3ee; --sub: rgba(245,243,238,.62); --line: rgba(255,255,255,.12);
  --glass: rgba(18,19,28,.62); --glass-solid: rgba(18,19,28,.94);
  --accent: #6c8cff; --gold: #ffd76a; --ok: #41d1a5; --bad: #ff5a6e; --warn: #ffb547;
  --r: 18px; --r-s: 12px;
  --spring: cubic-bezier(.2,1.3,.35,1); --ease: cubic-bezier(.2,.8,.2,1);
  --font: "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs); overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; touch-action: none; }
#app { position: fixed; inset: 0; }
#game { position: absolute; inset: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
#ui-root { position: absolute; inset: 0; pointer-events: none; }
#ui-root > * { pointer-events: auto; }
button { font: inherit; color: inherit; }

/* 부팅 화면 */
#boot { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; background: #07080f; text-align: center; transition: opacity .6s; z-index: 50; }
#boot.hide { opacity: 0; pointer-events: none; }
.boot-logo { font-size: 2.2em; font-weight: 800; letter-spacing: .12em; }
.boot-bar { width: 220px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 0 auto; }
.boot-bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s; }
#boot .msg { color: var(--sub); font-size: .85em; max-width: 520px; padding: 0 20px; }

/* 유리 패널 (필요한 곳에만) */
.glass { background: var(--glass); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.lowfx .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--glass-solid); }

/* 버튼 */
.btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--ink); padding: .72em 1.15em; border-radius: 999px; font-weight: 650; letter-spacing: -.01em; cursor: pointer; transition: transform .25s var(--spring), background .2s, opacity .2s; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .5em; }
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--ink); color: #0b0c12; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255,90,110,.16); border-color: rgba(255,90,110,.4); color: #ffb3bd; }
.btn.small { padding: .45em .9em; font-size: .86em; min-height: 36px; }
.btn.big { padding: .9em 1.6em; font-size: 1.05em; min-height: 52px; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn small { display: block; font-weight: 500; opacity: .6; font-size: .72em; }

.chip { display: inline-flex; align-items: center; padding: .25em .7em; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--line); font-size: .74em; font-weight: 600; color: var(--sub); white-space: nowrap; }
.chip.ctx { background: rgba(108,140,255,.18); color: #c8d4ff; border-color: rgba(108,140,255,.35); }
.chip.imp-S { background: rgba(255,90,110,.2); color: #ffc2ca; border-color: rgba(255,90,110,.4); }
.chip.imp-A, .chip.imp-P { background: rgba(255,181,71,.18); color: #ffdca6; border-color: rgba(255,181,71,.35); }
.chip.gold { background: rgba(255,215,106,.18); color: var(--gold); border-color: rgba(255,215,106,.4); }

/* ── HUD ── */
.hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
.hud.show { opacity: 1; }
/* 컷신 중에는 HUD·말풍선을 숨겨 건너뛰기 버튼과 겹치지 않게 */
body.in-story .hud, body.in-story .bark, body.in-story .toasts { opacity: 0 !important; pointer-events: none !important; }
.hud > * { pointer-events: auto; }
.hud-left { position: absolute; left: calc(14px + var(--safe-l)); top: calc(12px + var(--safe-t)); padding: 10px 14px; border-radius: var(--r); display: grid; gap: 6px; min-width: calc(220px * var(--ui)); }
.hud-left.practice::after { content: '연습 — 목숨이 줄지 않음'; font-size: .66em; color: var(--ok); }
.hl-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; border-radius: 10px; transition: box-shadow .3s, background .3s; padding: 2px 4px; }
.hl-row.glow { background: rgba(255,215,106,.14); box-shadow: 0 0 0 2px rgba(255,215,106,.6); }
.hl-label { font-size: .68em; color: var(--sub); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.hearts { display: flex; gap: 4px; grid-column: 2 / 4; }
.heart { width: calc(17px * var(--ui)); height: calc(15px * var(--ui)); background: #ff4d63; clip-path: path('M8.5 15 L1.6 8.2 C-0.6 6 -.4 2.5 2 1 C4 -.3 6.6 .3 8.5 2.6 C10.4 .3 13 -.3 15 1 C17.4 2.5 17.6 6 15.4 8.2 Z'); transition: transform .3s var(--spring), background .3s; }
.w-hell .heart { background: #ff7a3d; clip-path: ellipse(45% 50% at 50% 55%); }
.w-heaven .heart { background: var(--gold); clip-path: polygon(50% 0, 70% 40%, 62% 100%, 38% 100%, 30% 40%); }
.heart.empty { background: rgba(255,255,255,.14); }
.heart.pop { animation: pop .7s var(--ease); }
@keyframes pop { 0% { transform: scale(1.8); background: #fff; } 100% { transform: scale(1); } }
.hpbar { position: relative; height: 10px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; min-width: calc(110px * var(--ui)); }
.hpbar i, .hpbar em { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.hpbar em { background: rgba(255,255,255,.45); transition: none; }
.hpbar i { background: linear-gradient(90deg, #41d1a5, #8ff0c9); z-index: 1; transition: width .12s; }
.hpbar.low i { background: linear-gradient(90deg, #ff5a6e, #ff9aa6); }
.hptext { font-size: .7em; font-variant-numeric: tabular-nums; color: var(--sub); min-width: 4.6em; text-align: right; }
.hud-center { position: absolute; left: 50%; top: calc(14px + var(--safe-t)); transform: translateX(-50%); text-align: center; max-width: min(46vw, 640px); }
.hc-title { font-size: .72em; color: var(--sub); font-weight: 600; letter-spacing: .04em; }
.hc-mission { margin-top: 4px; font-size: .9em; font-weight: 650; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.hud-combo { position: absolute; right: calc(86px + var(--safe-r)); top: calc(16px + var(--safe-t)); display: flex; align-items: baseline; gap: 6px; opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; pointer-events: none; }
.hud-combo.show { opacity: 1; transform: none; }
.hud-combo b { font-size: 2em; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-combo span { font-size: .75em; color: var(--sub); }
.hud-combo.hot b { color: var(--gold); text-shadow: 0 0 18px rgba(255,215,106,.6); }
.hud-combo.bump { animation: bump .35s var(--spring); }
@keyframes bump { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
.hud-pause { position: absolute; right: calc(14px + var(--safe-r)); top: calc(12px + var(--safe-t)); width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
.hud-pause i { width: 4px; height: 16px; border-radius: 2px; background: var(--ink); display: block; }
.hud-skip { position: absolute; right: calc(80px + var(--safe-r)); top: calc(18px + var(--safe-t)); }
.save-dot { position: absolute; right: calc(16px + var(--safe-r)); top: calc(72px + var(--safe-t)); font-size: .66em; color: var(--sub); opacity: 0; transition: opacity .3s; pointer-events: none; }
.save-dot.show { opacity: 1; }
.bossbar { position: absolute; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translate(-50%, 20px); width: min(62vw, 760px); opacity: 0; transition: opacity .4s, transform .5s var(--spring); pointer-events: none; text-align: center; }
.bossbar.show { opacity: 1; transform: translate(-50%, 0); }
.bb-name { font-size: .8em; font-weight: 700; letter-spacing: .06em; margin-bottom: 6px; text-shadow: 0 2px 8px #000; }
.bb-track { position: relative; height: 10px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.bb-track i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff5a6e, #ffb547); transition: width .2s; }
.bb-track em { position: absolute; inset: 0; border: 2px solid rgba(160,210,255,.85); border-radius: 6px; transition: opacity .3s; }
.bb-info { margin-top: 5px; font-size: .7em; color: var(--sub); }
.fps { position: absolute; left: calc(14px + var(--safe-l)); bottom: calc(8px + var(--safe-b)); font: 600 11px ui-monospace, monospace; color: #9f9; display: none; pointer-events: none; }

/* ── 터치 조작부 ── */
.touch-layer { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
.touch-layer.show { opacity: 1; }
.touch-layer.show .tc { pointer-events: auto; }
.tc { position: absolute; transform: translate(-50%, -50%); touch-action: none; pointer-events: none; }
.tc-stick { width: calc(150px * var(--btn) * var(--btn-fit)); height: calc(150px * var(--btn) * var(--btn-fit)); border-radius: 50%; background: rgba(255,255,255,calc(var(--btn-op) * .14)); border: 1.5px solid rgba(255,255,255,calc(var(--btn-op) * .5)); }
.tc-knob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%; background: rgba(255,255,255,calc(var(--btn-op) * .9)); box-shadow: 0 4px 16px rgba(0,0,0,.4); transition: transform .08s; }
.tc-stick.on .tc-knob { transition: none; }
.tc-btn { width: calc(78px * var(--btn) * var(--btn-fit)); height: calc(78px * var(--btn) * var(--btn-fit)); border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,calc(var(--btn-op) * .2)); border: 1.5px solid rgba(255,255,255,calc(var(--btn-op) * .6)); transition: transform .15s var(--spring), background .15s; }
.tc-btn.on { transform: translate(-50%, -50%) scale(.88); background: rgba(255,255,255,calc(var(--btn-op) * .55)); }
.tc-jump { width: calc(96px * var(--btn) * var(--btn-fit)); height: calc(96px * var(--btn) * var(--btn-fit)); }
/* 가로로 눕힌 스마트폰처럼 세로가 짧은 화면: 버튼끼리 겹치지 않게 자동 축소 */
@media (max-height: 520px) { :root { --btn-fit: .78; } }
@media (max-height: 380px) { :root { --btn-fit: .66; } }
.tc-label { font-size: calc(14px * var(--btn) * var(--btn-fit)); font-weight: 700; opacity: calc(.4 + var(--btn-op) * .6); }
.tc-interact { opacity: 0; transform: translate(-50%, -50%) scale(.6); transition: opacity .2s, transform .3s var(--spring); }
.touch-layer.show .tc-interact:not(.avail) { pointer-events: none; }
.tc-interact.avail { opacity: 1; transform: translate(-50%, -50%) scale(1); background: rgba(255,215,106,.35); border-color: rgba(255,215,106,.9); }
.touch-layer.editing { background: rgba(0,0,0,.35); pointer-events: auto; }
.touch-layer.editing .tc { pointer-events: auto; outline: 2px dashed rgba(255,215,106,.8); outline-offset: 4px; }
.touch-layer.editing .tc-interact { opacity: 1; transform: translate(-50%, -50%); }
.tc-editbar { position: absolute; left: 50%; top: calc(16px + var(--safe-t)); transform: translateX(-50%); display: none; gap: 10px; align-items: center; padding: 8px 10px 8px 16px; border-radius: 999px; pointer-events: auto; }
.touch-layer.editing .tc-editbar { display: flex; }

/* ── 토스트·카드 ── */
.toasts { position: absolute; left: 50%; top: calc(156px + var(--safe-t)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; z-index: 30; }
.toast { padding: .6em 1.1em; border-radius: 999px; font-size: .85em; font-weight: 600; opacity: 0; transform: translateY(-8px) scale(.96); transition: opacity .3s, transform .4s var(--spring); max-width: 86vw; text-align: center; }
.toast.show { opacity: 1; transform: none; }
.toast.danger { border-color: rgba(255,90,110,.5); color: #ffc2ca; }
.toast.ok { border-color: rgba(65,209,165,.5); color: #b7f5df; }
.toast.gold { border-color: rgba(255,215,106,.6); color: var(--gold); }
.toast.warn { border-color: rgba(255,181,71,.5); color: #ffdca6; }
.record-card { position: absolute; right: calc(16px + var(--safe-r)); top: 30%; display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: var(--r); max-width: min(420px, 80vw); transform: translateX(120%); transition: transform .6s var(--spring); pointer-events: none; z-index: 20; }
.record-card.show { transform: none; }
.rc-year { font-size: 1.4em; font-weight: 800; color: var(--gold); min-width: 3em; text-align: center; }
.rc-title { font-size: .72em; color: var(--sub); font-weight: 600; }
.rc-text { font-size: .9em; margin-top: 3px; line-height: 1.45; }
.rc-page { font-size: .66em; color: var(--sub); margin-top: 4px; }
.boss-card { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; transform: scale(1.1); transition: opacity .5s, transform .9s var(--ease); z-index: 20; }
.boss-card.show { opacity: 1; transform: none; }
.bc-title { font-size: .85em; letter-spacing: .3em; color: var(--sub); }
.bc-name { font-size: 3.2em; font-weight: 900; letter-spacing: .08em; text-shadow: 0 6px 40px rgba(0,0,0,.8); }

/* ── 대화창·말풍선 ── */
.dialog { position: absolute; left: 50%; bottom: calc(20px + var(--safe-b)); transform: translate(-50%, 20px); width: min(860px, 92vw); padding: 18px 22px 20px; border-radius: var(--r); opacity: 0; transition: opacity .25s, transform .4s var(--spring); cursor: pointer; z-index: 25; }
.dialog.show { opacity: 1; transform: translate(-50%, 0); }
.dname { font-size: .78em; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.dialog[data-who=ink] .dname { color: #cfd3dc; }
.dialog[data-who=me] .dname { color: var(--gold); }
.dtext { font-size: 1.02em; line-height: 1.6; min-height: 3.2em; white-space: pre-wrap; }
.dnext { position: absolute; right: 18px; bottom: 12px; font-size: .7em; color: var(--sub); animation: blink 1s infinite; }
.dskip { position: absolute; right: 12px; top: 10px; }
@keyframes blink { 50% { opacity: .2; } }
.bark { position: absolute; left: 50%; top: calc(92px + var(--safe-t)); transform: translate(-50%, -10px); padding: .7em 1.1em; border-radius: 16px; max-width: min(620px, 86vw); font-size: .92em; line-height: 1.5; opacity: 0; transition: opacity .25s, transform .4s var(--spring); pointer-events: none; z-index: 18; }
.bark.show { opacity: 1; transform: translate(-50%, 0); }
.bark b { display: block; font-size: .72em; color: var(--sub); margin-bottom: 2px; }
.bark[data-who=boss] { border-color: rgba(255,90,110,.5); }

/* ── 시네마틱 자막 ── */
.story-ui { position: absolute; inset: 0; z-index: 40; opacity: 0; transition: opacity .4s; }
.story-ui.show { opacity: 1; }
.subtitle { position: absolute; left: 50%; bottom: calc(12% + var(--safe-b)); transform: translateX(-50%); width: min(900px, 90vw); padding: 16px 24px; border-radius: var(--r); transition: opacity .3s; }
.subtitle.empty { opacity: 0; }
.subtitle .sname { font-size: .78em; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
.subtitle[data-who=ink] .sname { color: #cfd3dc; }
.subtitle .stext { font-size: 1.12em; line-height: 1.65; min-height: 1.6em; }
.story-skip { position: absolute; right: calc(16px + var(--safe-r)); top: calc(14px + var(--safe-t)); }
.tap-hint { position: absolute; right: calc(20px + var(--safe-r)); bottom: calc(4% + var(--safe-b)); font-size: .7em; color: var(--sub); animation: blink 2.4s infinite; }

/* ── 모달 ── */
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,5,10,.55); opacity: 0; transition: opacity .25s; z-index: 35; padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); }
.modal.show { opacity: 1; }
.mcard { position: relative; width: min(560px, 94vw); max-height: 92vh; overflow: auto; border-radius: 24px; padding: 24px; transform: scale(.94); transition: transform .45s var(--spring); -webkit-user-select: text; user-select: text; }
.modal.show .mcard { transform: none; }
.modal.wide .mcard { width: min(920px, 96vw); }
.mtitle { font-size: 1.25em; font-weight: 800; margin-bottom: 12px; letter-spacing: -.02em; }
.mtext { color: var(--sub); line-height: 1.6; margin: 0 0 16px; }
.mrow { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.mclose { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); cursor: pointer; font-size: 1em; }
.merr { color: var(--bad); font-size: .8em; min-height: 1.2em; margin-top: 6px; }
.tinput { width: 100%; font: inherit; font-size: 1.1em; padding: .8em 1em; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); outline: none; -webkit-user-select: text; user-select: text; }
.tinput:focus { border-color: var(--accent); }
.menu-list { display: grid; gap: 10px; }
.menu-list .btn { width: 100%; }

/* ── 문제 카드 ── */
.qmodal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,5,10,.62); opacity: 0; transition: opacity .25s; z-index: 36; padding: calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b)); }
.qmodal.show { opacity: 1; }
.qcard { width: min(980px, 97vw); max-height: 96vh; overflow: auto; border-radius: 24px; padding: clamp(16px, 2.4vw, 28px); transform: translateY(16px) scale(.97); transition: transform .5s var(--spring), box-shadow .3s; -webkit-user-select: text; user-select: text; }
.qmodal.show .qcard { transform: none; }
.qcard.is-correct { box-shadow: 0 0 0 2px rgba(65,209,165,.6), 0 20px 60px rgba(0,0,0,.4); }
.qcard.is-wrong { box-shadow: 0 0 0 2px rgba(255,90,110,.6), 0 20px 60px rgba(0,0,0,.4); }
.q-head { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.q-story { font-size: .74em; color: var(--sub); margin-bottom: 4px; }
.q-stem { font-size: 1.08em; font-weight: 650; line-height: 1.6; margin-bottom: 12px; letter-spacing: -.01em; }
.q-source { background: rgba(255,248,230,.06); border-left: 3px solid var(--gold); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; line-height: 1.65; font-size: .95em; }
.q-source b { display: block; font-size: .78em; color: var(--gold); margin-bottom: 4px; }
.q-source .cite { font-size: .76em; color: var(--sub); margin-top: 6px; text-align: right; }
.q-statements { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; line-height: 1.75; font-size: .95em; }
.q-figure { display: flex; justify-content: center; margin: 4px 0 12px; }
.q-figure svg, .ofig svg { max-width: 100%; height: auto; }
.q-options { display: grid; gap: 8px; }
.q-options.figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.opt:active { transform: scale(.985); }
.opt .num { font-weight: 800; color: var(--sub); min-width: 1.2em; }
.opt.sel { border-color: var(--accent); background: rgba(108,140,255,.14); }

.opt.wrong { border-color: var(--bad); background: rgba(255,90,110,.14); }

.q-seq { display: grid; gap: 6px; margin-bottom: 12px; }

.mitem { padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: rgba(255,255,255,.04); text-align: left; line-height: 1.45; cursor: pointer; box-shadow: inset 5px 0 0 var(--mc, transparent); }
.mitem.cur { border-color: var(--accent); }
.mitem.linked { border-color: var(--mc); }
.mitem.right { border-color: var(--ok); } .mitem.wrong { border-color: var(--bad); }
.q-result { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }

.q-verdict .note { display: block; font-size: .5em; font-weight: 600; color: var(--sub); margin-top: 2px; }

.q-marks { font-size: .74em; color: var(--sub); }

/* ── 타이틀 ── */
.title-ui { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto auto; align-items: center; justify-items: center; padding: calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b)); opacity: 0; transition: opacity .8s; }
.title-ui.show { opacity: 1; }
.logo { text-align: center; }
.logo h1 { font-size: clamp(42px, 7vw, 108px); margin: .1em 0; font-weight: 900; letter-spacing: .08em; background: linear-gradient(180deg, #fff, #c9b98f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 8px 40px rgba(0,0,0,.6)); }
.logo-sub { font-size: .7em; letter-spacing: .4em; color: var(--sub); }
.logo-tag { color: var(--sub); font-size: 1em; }
.title-btns { display: grid; gap: 12px; width: min(380px, 86vw); }
.title-btns .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.title-foot { font-size: .68em; color: var(--sub); text-align: center; margin-top: 18px; }

/* ── 지도 ── */
.map-ui { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l)); opacity: 0; transition: opacity .5s; }

.map-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; padding: 12px 16px; border-radius: var(--r); }
.mh-who b { font-size: 1.1em; margin-right: 8px; }
.mh-who span { color: var(--gold); font-size: .82em; }
.mh-prog { display: flex; align-items: center; gap: 10px; font-size: .8em; color: var(--sub); flex: 1; min-width: 220px; }
.mh-prog .bar { flex: 1; height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.mh-prog .bar i { display: block; height: 100%; background: var(--gold); }
.mh-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.map-scroll { overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.map-track { display: flex; gap: 14px; padding: 10px 30px; position: relative; }
.map-track::before { content: ''; position: absolute; left: 30px; right: 30px; top: 50%; height: 2px; background: linear-gradient(90deg, rgba(255,215,106,.5), rgba(255,255,255,.1)); z-index: -1; }
.map-node { scroll-snap-align: center; flex: 0 0 auto; width: calc(150px * var(--ui)); min-height: calc(176px * var(--ui)); border-radius: 20px; border: 1.5px solid var(--line); background: rgba(16,17,26,.82); padding: 14px; text-align: left; cursor: pointer; display: grid; align-content: space-between; gap: 6px; transition: transform .35s var(--spring), border-color .2s; }
.map-node:active { transform: scale(.96); }
.map-node.sel { border-color: var(--ink); transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.map-node.locked { opacity: .45; }
.map-node.cleared { border-color: rgba(255,215,106,.45); }
.map-node.run .mn-badge { color: var(--accent); }
.mn-no { font-size: 1.6em; font-weight: 900; color: var(--sub); }
.mn-title { font-weight: 750; line-height: 1.3; }
.mn-era { font-size: .72em; color: var(--sub); }
.mn-badge { font-weight: 800; font-size: .9em; color: var(--gold); }
.map-node.heaven { background: linear-gradient(160deg, rgba(255,232,170,.22), rgba(16,17,26,.85)); }
.map-detail { border-radius: var(--r); padding: 16px 20px; display: grid; gap: 6px; }
.md-title { font-size: 1.2em; font-weight: 800; }
.md-sub { font-size: .78em; color: var(--sub); }
.md-story { line-height: 1.6; font-size: .92em; }
.md-stats { font-size: .8em; color: var(--gold); }
.md-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.md-lock { color: var(--sub); font-size: .85em; }

/* ── 결과 ── */
.result .rtop { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; }
.grade { font-size: 3.4em; font-weight: 900; min-width: 2.2em; text-align: center; animation: gradeIn .9s var(--spring); }
.g-SSS, .g-SS, .g-S { color: var(--gold); text-shadow: 0 0 30px rgba(255,215,106,.5); }
.g-A { color: #9ad0ff; } .g-B { color: #b7f5df; } .g-C { color: var(--sub); }
@keyframes gradeIn { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
.rstage { font-weight: 800; font-size: 1.1em; } .rsub { color: var(--sub); font-size: .8em; } .rscore { font-size: 1.3em; font-weight: 800; margin-top: 4px; }
.rgrid { display: grid; gap: 7px; }
.rrow { display: grid; grid-template-columns: 8em 1fr 5.5em; gap: 10px; align-items: center; font-size: .82em; }
.rbar { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; } .rbar i { display: block; height: 100%; background: var(--ink); }
.rrow b { text-align: right; font-variant-numeric: tabular-nums; }
.rstats, .rnote { font-size: .76em; color: var(--sub); margin-top: 10px; } .rnote.ok { color: var(--ok); }
.runlock { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ── 설정 ── */
.settings .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.settings .tabs button { border: 0; background: rgba(255,255,255,.06); padding: .55em 1.1em; border-radius: 999px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.settings .tabs button.on { background: var(--ink); color: #0b0c12; }
.pane { display: grid; gap: 4px; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,.06); flex-wrap: wrap; }
.sl { font-weight: 600; font-size: .92em; }
.snote { font-size: .76em; color: var(--sub); line-height: 1.55; padding: 6px 2px; }
.snote.warn { color: #ffdca6; }
.seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg.wrap { border-radius: 16px; }
.seg button { border: 0; background: transparent; padding: .45em .9em; border-radius: 999px; cursor: pointer; font-size: .86em; font-weight: 600; min-height: 36px; }
.seg button.on { background: var(--ink); color: #0b0c12; }
.switch { width: 52px; height: 32px; border-radius: 999px; border: 0; background: rgba(255,255,255,.16); position: relative; cursor: pointer; transition: background .25s; flex: 0 0 auto; }
.switch i { position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .35s var(--spring); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.switch.on { background: var(--ok); } .switch.on i { transform: translateX(20px); }
.rngwrap { display: flex; align-items: center; gap: 10px; min-width: 220px; flex: 1; justify-content: flex-end; }
.rngwrap input { flex: 1; max-width: 260px; accent-color: var(--ink); }
.rngwrap b { min-width: 3.4em; text-align: right; font-size: .84em; font-variant-numeric: tabular-nums; }

/* ── 도감·오답 ── */
.cx-head { font-weight: 750; margin: 16px 0 8px; font-size: .92em; color: var(--gold); }
.cx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.cx-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; font-size: .84em; line-height: 1.5; }
.cx-item b { font-size: 1.02em; } .cx-item span { color: var(--sub); } .cx-item em { font-style: normal; font-size: .8em; color: var(--sub); }
.cx-item.locked { opacity: .45; }
.wn-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.wn-meta { font-size: .72em; color: var(--sub); } .wn-stem { margin-top: 4px; line-height: 1.5; font-size: .9em; }

/* ── 빡지 감옥 ── */
.bbakji { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto auto 1fr auto auto auto; gap: 10px; padding: calc(16px + var(--safe-t)) clamp(14px, 4vw, 60px) calc(14px + var(--safe-b)); background: linear-gradient(180deg, rgba(20,2,6,.6), rgba(10,0,2,.85)); }
.bb-title { font-size: 1.6em; font-weight: 900; color: #ff6b7d; letter-spacing: .1em; }
.bb-sub { color: var(--sub); font-size: .86em; }
.bb-prog { display: flex; align-items: center; gap: 12px; }
.bb-prog .bar { flex: 1; height: 8px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; }
.bb-prog .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a6e, #ffb547); transition: width .2s; }
.bb-prog .pct { font-size: .8em; font-variant-numeric: tabular-nums; color: var(--sub); white-space: nowrap; }
.bb-meta { font-size: .78em; color: var(--sub); }
.bb-src { background: #f3ecdb; color: #2a2418; border-radius: 14px; padding: 16px 18px; font-size: 1.15em; line-height: 1.9; overflow: auto; -webkit-user-select: none; user-select: none; }
.bb-src span.ok { color: #1f7a4d; } .bb-src span.ok.soft { color: #1f7a4d; }
.bb-src span.cur { background: rgba(108,140,255,.3); border-radius: 3px; }
.bb-src span.bad { background: rgba(255,90,110,.45); color: #6a0010; border-radius: 3px; }
.bb-input { width: 100%; font: inherit; font-size: 1.1em; line-height: 1.6; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); resize: none; outline: none; -webkit-user-select: text; user-select: text; }
.bb-input:focus { border-color: #ff6b7d; }
.bb-status { font-size: .8em; color: var(--sub); min-height: 1.3em; } .bb-status.bad { color: #ff8a99; }
.bb-btns { display: flex; gap: 10px; justify-content: flex-end; }

/* 작은 화면 (스마트폰 가로·세로) */
@media (max-height: 520px) {
  :root { --fs: calc(clamp(12px, 1.6vh + 5px, 15px) * var(--ui)); }
  .hud-center { top: calc(8px + var(--safe-t)); }
  .hc-mission { font-size: .82em; }
  .map-node { min-height: calc(132px * var(--ui)); width: calc(132px * var(--ui)); padding: 10px; }
  .qcard { padding: 14px; }
  .opt { padding: 10px 12px; min-height: 44px; }
}
@media (max-width: 640px) {
  .hud-center { top: calc(84px + var(--safe-t)); max-width: 90vw; }
  .hud-combo { right: calc(74px + var(--safe-r)); }
  .q-options.figs { grid-template-columns: 1fr; }
  .q-match { grid-template-columns: 1fr; }
  .rrow { grid-template-columns: 6.5em 1fr 4.8em; }
}
.reduce-flash .boss-card { transition: none; }

.save-text { width: 100%; min-height: 140px; max-height: 40vh; margin: 8px 0; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.35); color: inherit; font: 12px/1.4 ui-monospace, monospace; resize: vertical; }

/* 세로 화면 안내 (게임은 가로 기준) — 막지는 않고 아래에 작게 안내만 */
#rotate-hint { display: none; position: absolute; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%); z-index: 50; padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; pointer-events: none; white-space: nowrap; }
@media (orientation: portrait) and (max-width: 900px) { #rotate-hint { display: block; } }

/* 김민준 대화 · 선택지 */
.dialog[data-who=minjun] .dname { color: #c9b6ff; }
.dialog[data-who=minjun] { border-color: rgba(155,107,255,.45); }
.bark[data-who=minjun] { border-color: rgba(155,107,255,.55); }
.bark[data-who=minjun] b { color: #c9b6ff; }
.dialog.choice { cursor: default; }
.dchoices { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.dchoices .btn { min-width: 9em; min-height: 44px; }
/* 공격 버튼: 먹물 원거리 해금 표시(작은 먹 점) · 조준 중 · 재충전 */
.tc-attack.ink-ready::after { content: ''; position: absolute; right: 14%; top: 14%; width: 22%; height: 22%; border-radius: 30%; background: #1a1030; box-shadow: 0 0 0 2px rgba(201,182,255,.85); }
.tc-attack.ink-ready.ink-cd::after { background: rgba(26,16,48,.4); box-shadow: 0 0 0 2px rgba(201,182,255,.3); }
.tc-attack.aiming { background: rgba(169,139,255,calc(var(--btn-op) * .55)); border-color: rgba(233,221,255,.95); transform: translate(-50%, -50%) scale(.92); }
.tc.new-skill { animation: newSkill 1.2s ease-in-out 4; }
@keyframes newSkill { 0%,100% { box-shadow: 0 0 0 0 rgba(201,182,255,0); } 50% { box-shadow: 0 0 0 10px rgba(201,182,255,.35); } }
.codex .mj-note { padding: 10px 12px; border-radius: 12px; background: rgba(155,107,255,.10); border: 1px solid rgba(155,107,255,.25); margin: 6px 0; font-size: .9em; line-height: 1.5; }
.codex .ab-item.locked { opacity: .45; }

/* ── v4 초보자 튜토리얼 ── */
.hud-left.practice.tutmode::after { content: '연습 — 맞아도 HP가 줄지 않음'; }
/* 안내 상자: 화면 아래 가운데(조작 버튼 사이)에 작게 — 캐릭터·지형을 가리지 않음 */
.tut-tip { position: absolute; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translate(-50%, 12px); max-width: min(440px, 46vw); padding: .55em 1em .6em; border-radius: 14px; text-align: center; opacity: 0; transition: opacity .25s, transform .35s var(--spring); pointer-events: none; z-index: 17; font-size: calc(15px * var(--ui)); line-height: 1.4; }
.tut-tip.show { opacity: 1; transform: translate(-50%, 0); }
.tut-tip .tt-row { display: flex; align-items: center; justify-content: center; gap: .55em; }
.tut-tip .tt-step { font-size: .72em; color: var(--sub); font-variant-numeric: tabular-nums; }
.tut-tip .tt-main { font-weight: 800; }
.tut-tip .tt-ok { color: var(--ok); font-weight: 900; opacity: 0; transform: scale(.4); }
.tut-tip.ok .tt-ok { animation: ttok .7s var(--spring); }
@keyframes ttok { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; transform: scale(1.35); } 100% { opacity: 0; transform: scale(1); } }
.tut-tip .tt-keys { font-size: .78em; color: #ffe39a; margin-top: 2px; }
.tut-tip.pulse .tt-keys { animation: ttkey .9s ease-in-out infinite; }
@keyframes ttkey { 50% { color: #fff; text-shadow: 0 0 10px rgba(255,215,106,.9); } }
.tut-tip .tt-hint { display: none; font-size: .76em; color: var(--sub); margin-top: 3px; }
.tut-tip.has-hint .tt-hint { display: block; }
/* 안내 중인 버튼: 은은한 빛 */
.tc.tut-glow { box-shadow: 0 0 0 3px rgba(255,215,106,.55), 0 0 26px 6px rgba(255,215,106,.45); animation: tutglow 1.6s ease-in-out infinite; }
.tc-stick.tut-glow { border-color: rgba(255,215,106,.9); }
@keyframes tutglow { 50% { box-shadow: 0 0 0 5px rgba(255,215,106,.75), 0 0 40px 10px rgba(255,215,106,.55); } }
/* 손가락 시연 (도트 손) */
.tut-finger { position: absolute; width: 40px; height: 60px; margin-left: -12px; opacity: 0; pointer-events: none; z-index: 19; image-rendering: pixelated; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.tut-finger.show { opacity: .95; }
.tut-finger.press { animation: tfpress 1s ease-in-out infinite; }
.tut-finger.swipe-r { animation: tfswr 1.3s ease-in-out infinite; }
.tut-finger.swipe-l { animation: tfswl 1.3s ease-in-out infinite; }
@keyframes tfpress { 0%, 100% { transform: translateY(14px) scale(1); } 45% { transform: translateY(0) scale(.9); } 55% { transform: translateY(0) scale(.9); } }
@keyframes tfswr { 0% { transform: translate(-10px, 4px); } 60%, 100% { transform: translate(46px, 4px); } }
@keyframes tfswl { 0% { transform: translate(10px, 4px); } 60%, 100% { transform: translate(-46px, 4px); } }
/* 완료 배너 (화면 중앙) */
.tut-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.8); text-align: center; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .35s, transform .5s var(--spring); }
.tut-banner b { display: block; font-size: calc(46px * var(--ui)); font-weight: 900; letter-spacing: .06em; color: #fff4c2; text-shadow: 0 3px 0 #6a4bd6, 0 0 28px rgba(255,215,106,.65); }
.tut-banner span { display: block; margin-top: 6px; font-size: calc(16px * var(--ui)); color: var(--sub); }
.tut-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
body.in-story .tut-tip, body.in-story .tut-finger { opacity: 0 !important; }

/* ── v5 일시정지: 구간 이동 하위 메뉴 (같은 카드·같은 버튼 모양) ── */
.pause-modal .mcard { max-height: calc(100dvh - 32px - var(--safe-t) - var(--safe-b)); transition: transform .45s var(--spring), width .3s; }
.pause-modal.chap-open .mcard { width: min(760px, 96vw); }
.menu-list .btn small { margin-top: 2px; }
.menu-list.sub .btn { flex-direction: column; gap: 0; line-height: 1.25; }
.menu-list .snote { font-size: .82em; color: var(--sub); text-align: center; }
.menu-list.chap-list { grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); }
.menu-list.chap-list .btn { justify-content: center; text-align: center; padding-top: .55em; padding-bottom: .55em; }
.menu-list.chap-list .btn.cur { border-color: rgba(255,215,106,.55); }
.menu-list.chap-list .btn.cleared small { color: var(--gold); opacity: .85; }
.menu-list.chap-list .btn.locked { opacity: .38; }
.menu-list.chap-list .btn.back, .menu-list.chap-list .snote { grid-column: 1 / -1; }
/* 낮은 화면(가로 폰): 버튼을 두 줄로 나눠 잘리지 않게 — 계속하기·타이틀로는 한 줄 전체 */
@media (max-height: 520px) {
  .pause-modal .mcard { padding: 14px 18px; width: min(720px, 94vw); }
  .pause-modal .mtitle { font-size: 1.05em; margin-bottom: 8px; }
  .pause-modal .menu-list { grid-template-columns: 1fr 1fr; gap: 7px; }
  .pause-modal .menu-list .btn { min-height: 40px; padding: .5em .9em; }
  .pause-modal .menu-list .btn.primary, .pause-modal .menu-list .btn.ghost, .pause-modal .menu-list .btn.wide, .pause-modal .menu-list .snote { grid-column: 1 / -1; }
  .pause-modal .menu-list.sub:not(.chap-list) { grid-template-columns: 1fr; }
  .pause-modal .menu-list.chap-list { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .pause-modal .menu-list .btn small { font-size: .7em; }
}
@media (max-height: 360px) { .pause-modal .menu-list .btn { min-height: 36px; padding: .4em .8em; } }

들이 평양에서 조직. 토산품 애용 운동."},"조만식":{"stage":"s01","page":34,"text":"1920년 평양에서 조선 물산 장려회를 조직하는 데 앞장선 민족주의 계열 인사."},"회사령 폐지":{"stage":"s01","page":34,"text":"1920년 회사령 폐지를 전후해 경성 방직 주식회사, 평양 메리야스 공장 등 한국인 회사 설립이 활발해졌다."},"민립 대학 설립 운동":{"stage":"s01","page":35,"text":"고등 교육 기회를 거의 주지 않는 일제에 맞서 한국인의 힘으로 대학을 세우자는 운동. 일제 방해와 자연재해로 실패."},"조선 민립 대학 기성회":{"stage":"s01","page":35,"text":"1922년 이상재를 중심으로 서울에서 조직, 전국적 모금 운동."},"경성 제국 대학":{"stage":"s01","page":35,"text":"1924년 일제가 한국 내 일본인 교육과 한국인의 교육열 무마를 위해 설립."},"문맹 퇴치 운동":{"stage":"s01","page":35,"text":"한글 보급으로 민중을 깨우치려는 운동. 일제가 \"민족주의적 성격\" 구실로 1935년부터 모두 금지."},"문자 보급 운동":{"stage":"s01","page":35,"text":"「조선일보」, 1929년부터 \"아는 것이 힘, 배워야 산다\"."},"브나로드 운동":{"stage":"s01","page":35,"text":"1930년대 초 「동아일보」, \"배우자, 가르치자, 다 함께 브나로드\" — 학생이 참여한 농촌 계몽 운동."},"이상재":{"stage":"s01","page":35,"text":"조선 민립 대학 기성회의 중심 인물(1922), 신간회 초대 회장."},"조선 공산당":{"stage":"s02","page":36,"text":"1925년 사회주의 계열 조직들이 통합하여 결성."},"민족 유일당 운동":{"stage":"s02","page":36,"text":"코민테른의 협력 방침과 제1차 국·공 합작을 배경으로 분열된 진영을 통합하자는 운동. 국외 3부 통합 운동."},"자치론":{"stage":"s02","page":36,"text":"일부 민족주의자가 일제와 타협하여 자치권을 얻자고 한 주장(이광수 「민족적 경륜」, 1924)."},"비타협적 민족주의":{"stage":"s02","page":36,"text":"자치론을 비판하며 사회주의 세력과 손잡으려 한 민족주의 세력."},"조선 민흥회":{"stage":"s02","page":36,"text":"1926년 7월 비타협적 민족주의 세력과 일부 사회주의 세력이 연합해 만든 단체."},"정우회 선언":{"stage":"s02","page":36,"text":"1926년 11월 사회주의 계열 정우회가 비타협적 민족주의 세력과의 협력을 주장(신간회의 배경)."},"신간회":{"stage":"s02","page":37,"text":"1927년 2월 결성된 최대 규모의 합법적 민족 협동 전선 단체. 회장 이상재·부회장 홍명희, 1931년 5월 해소."},"신간회 해소":{"stage":"s02","page":37,"text":"1931년 5월 전체 대회에서 결정. \"해소\"는 조직 해체가 아닌 다른 단체로의 전환이라는 의미."},"6·10 만세 운동":{"stage":"s03","page":38,"text":"순종의 장례일에 사회주의 계열 단체·천도교·학생들이 계획한 만세 운동(1926). 민족 유일당 운동에 영향."},"광주 학생 항일 운동":{"stage":"s03","page":39,"text":"1929년 통학 열차 사건으로 시작. 목포·나주 → 12월 서울, 신간회 진상 조사단 파견."},"관동 대학살":{"stage":"s03","page":40,"text":"1923년 9월 1일 관동 대지진의 혼란 속에서 6천 명 이상의 한국인이 살해당한 사건."},"X자 철도망":{"stage":"s04","page":42,"text":"일제 강점기 한반도를 X자로 관통하는 철도망이 완성되었다."},"동양 척식 주식회사":{"stage":"s04","page":43,"text":"1908년 식산흥업 지원 명분으로 설립. 한국 경제 침탈에 앞장, 최대 지주, 소작료로 침략 전쟁 지원."},"농촌 진흥 운동":{"stage":"s04","page":43,"text":"1932년 일제가 농촌 통제·식민 지배 안정을 위해 전개. 농민 생활 태도 탓으로 왜곡, 근면·절약 강조."},"암태도 소작 쟁의":{"stage":"s05","page":44,"text":"1923년 전라도 암태도. 지주와 일본 경찰에 맞서 소작료 인하 성과(40% 합의)."},"조선 농민 총동맹":{"stage":"s05","page":44,"text":"1927년 결성된 전국적인 농민 운동 단체."},"원산 총파업":{"stage":"s05","page":45,"text":"1928년 일본인 감독관의 한국인 노동자 구타 → 1929년 1월 원산 지역 노동자 총파업. 1920년대 노동 운동의 절정."},"근우회":{"stage":"s06","page":46,"text":"1927년 5월 신간회 결성에 자극받아 창립. 민족주의·사회주의 계열 여성 운동을 망라한 최대 여성 단체, 기관지 「근우」."},"천도교 소년회":{"stage":"s06","page":47,"text":"1921년 방정환 등이 조직. \"어린이\" 용어, 1922년 5월 1일 어린이날, 잡지 「어린이」."},"조선 형평사":{"stage":"s06","page":47,"text":"1923년 경남 진주. 백정 차별 철폐, \"저울처럼 평등한 사회\". 반대 측의 불매 운동·등교 거부."},"조선어 연구회":{"stage":"s07","page":48,"text":"1921년 조직. 「한글」 잡지 발행, 가갸날(한글날) 제정."},"조선어 학회":{"stage":"s07","page":48,"text":"1931년 개칭. 한글 맞춤법 통일안·표준어 제정, 「조선말 큰사전」 편찬. 1942년 조선어 학회 사건."},"식민 사관":{"stage":"s07","page":48,"text":"타율성론·정체성론·당파성론으로 식민 통치를 정당화한 역사관."},"민족주의 사학":{"stage":"s07","page":48,"text":"신채호(고대사·자주적 역사관·「조선상고사」)·박은식(근대사·민족혼·「한국통사」) — 민족정신 강조."},"사회경제 사학":{"stage":"s07","page":48,"text":"백남운 등. 유물 사관, 세계사적 보편성에 따른 발전 → 정체성론 반박. 「조선사회경제사」."},"실증 사학":{"stage":"s07","page":48,"text":"개별 역사 사실을 객관적으로 밝히려는 연구. 이병도·손진태, 진단 학회, 「진단 학보」."},"병참 기지화 정책":{"stage":"s08","page":54,"text":"대공황 이후 블록 경제 속에서 한국을 군수품 보급 기지로 삼은 정책. 중·일 전쟁 이후 본격 실시."},"국가 총동원법":{"stage":"s08","page":54,"text":"1938년 제정. 침략 전쟁에 필요한 인력·물자 수탈. 제4조 칙령에 의한 징용."},"국민정신 총동원 운동":{"stage":"s08","page":54,"text":"일본에서 실시한 운동을 한국에서도 실시. 기존 행정 구역 바탕, 말단은 애국반."},"애국반":{"stage":"s08","page":54,"text":"10개 집을 하나로 묶은 말단 조직. 반상회, 정책 선전, 일상 통제, 식량 배급표 확인."},"강제 동원":{"stage":"s08","page":55,"text":"지원병제(1938)·학도 지원병제(1943)·징병제(1944), 국민 징용령(1939)·여자 정신 근로령(1944)."},"일본군 위안부":{"stage":"s08","page":55,"text":"일제가 한국을 비롯한 식민지와 점령지의 여성들을 강제 동원. 구타·고문·성폭력 등 끔찍한 삶을 강요."},"물자 수탈":{"stage":"s08","page":55,"text":"산미 증식 계획 재시행, 식량 배급제, 공출(식량·농기구·수저 등), 송진 채취, 위문 금품·국방헌금."},"민족 말살 정책":{"stage":"s09","page":56,"text":"침략 전쟁 동원을 위해 한국인을 일본인으로 동화시키려 한 정책."},"내선일체":{"stage":"s09","page":56,"text":"\"일본(내)과 조선(선)이 하나\"라는 주장."},"일선동조론":{"stage":"s09","page":56,"text":"\"일본인과 한국인의 조상은 같다\"는 주장."},"황국 신민 서사":{"stage":"s09","page":56,"text":"일왕에 대한 충성 맹세문. 어린 학생까지 외우게 함(1937 제정)."},"궁성요배":{"stage":"s09","page":56,"text":"매일 아침 일본 궁성을 향해 허리 숙여 절하게 한 것."},"국민학교":{"stage":"s09","page":56,"text":"\"황국 신민 학교\"라는 뜻. 소학교 명칭 변경(1941 국민학교령)."},"창씨개명":{"stage":"s09","page":56,"text":"성과 이름을 일본식으로 바꾸도록 강요(1940 시작)."},"한국 독립군":{"stage":"s10","page":60,"text":"북만주 한국 독립당이 결성. 지청천, 중국군과 연합해 쌍성보·대전자령 승리."},"조선 혁명군":{"stage":"s10","page":60,"text":"남만주 조선 혁명당이 편성. 양세봉, 중국군과 함께 영릉가·흥경성 승리."},"동북 항일 연군":{"stage":"s10","page":61,"text":"중국 공산당의 반일 통일 전선 주장으로 조직, 한국인 가담. 조국 광복회, 보천보 전투(1937)."},"조선 민족 혁명당":{"stage":"s10","page":61,"text":"1935년 난징. 중국 관내 최대 규모의 민족 통일 전선 정당. 김구 등은 불참."},"조선 의용대":{"stage":"s10","page":61,"text":"1938년 조선 민족 전선 연맹 아래 창설(중국 국민당 정부 지원). 일부는 화북 지대, 호가장 전투."},"대한민국 임시 정부":{"stage":"s11","page":62,"text":"윤봉길 의거 후 이동, 1940년 충칭 정착. 주석 중심 체제, 김구 주석."},"한국광복군":{"stage":"s11","page":62,"text":"1940년 지청천을 사령관으로 창설한 정규군. 인도·미얀마 전선, 국내 진공 작전 준비."},"대한민국 건국 강령":{"stage":"s11","page":63,"text":"1941년 발표. 조소앙의 삼균주의에 기초, 민주 공화정·토지 개혁·대기업 국유화·무상 교육."},"삼균주의":{"stage":"s11","page":63,"text":"조소앙. 개인·민족·국가 간 균등을 위해 정치·경제·교육의 균등을 이루어야 한다는 사상."},"대일 선전 성명서":{"stage":"s11","page":63,"text":"1941년 아시아·태평양 전쟁 발발 후 임시 정부가 일제에 선전 포고."},"국내 진공 작전":{"stage":"s11","page":63,"text":"미국과 협약, 독수리 작전 준비 → 일제의 예상 밖 이른 항복으로 무산."}}},"history":{"meta":{"source":"교과서 사진 18장 분석(HISTORY_SCOPE.md)","note":"importance: S/A/B/C/D=필기 표시 등급, P=54~55쪽 전체 중요, T=튜토리얼. role: q=일반(문·보스), riddle=제단 수수께끼."},"questions":[{"id":"s01-q01","stage":"s01","pages":[34],"story":"실력 양성 운동","concepts":["실력 양성 운동"],"importance":"A","marks":["네모 박스","형광펜"],"type":"mc","difficulty":3,"stem":"1920년대 실력 양성 운동이 등장한 배경으로 가장 적절한 것은?","options":["사회주의 사상이 확산되면서 계급 해방을 목표로 농민과 노동자를 단결시키려 하였다.","3·1 운동 이후 일부 지식인들이 일제로부터 당장 독립하는 것은 현실적으로 어렵다고 판단하였다.","순종의 장례일을 앞두고 민족주의 계열과 사회주의 계열이 함께 시위를 준비하였다.","코민테른이 민족주의자들과의 협력을 중시하면서 분열된 진영을 통합하려 하였다."],"answer":1,"why":["조선 공산당 등 사회주의 계열의 목표(p.36)이다.","정답. 이에 실력을 키워 독립을 준비하자는 실력 양성 운동이 일어났다(p.34).","6·10 만세 운동(1926)의 준비 과정이다(p.38).","민족 유일당 운동의 배경이다(p.36)."],"explain":"3·1 운동 이후 일부 지식인들은 당장 독립이 어렵다고 보고 실력을 키워 독립을 준비하자는 실력 양성 운동을 일으켰다. 산업 분야는 물산 장려 운동, 교육 분야는 민립 대학 설립 운동·문맹 퇴치 운동(p.34)."},{"id":"s01-q02","stage":"s01","pages":[34],"story":"물산 장려 운동","concepts":["물산 장려 운동","조선 물산 장려회","회사령 폐지"],"importance":"A","marks":["형광펜","번호 ①②","네모 박스(소단원)"],"type":"mc","difficulty":4,"stem":"물산 장려 운동에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?","options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"answer":3,"why":["ㄹ도 옳다.","ㄷ은 틀렸다(상품 가격이 크게 올랐다).","ㄱ도 옳다.","정답. ㄱ·ㄴ·ㄹ이 교과서 서술과 일치한다.","ㄷ이 틀렸고 ㄱ이 빠졌다."],"explain":"ㄱ 회사령 폐지(1920) 전후 한국인 회사 설립 활발 / ㄴ 조만식 등이 1920년 평양에서 조선 물산 장려회 조직 / ㄷ 토산품 소비가 늘었으나 생산량이 수요를 따르지 못해 가격이 크게 올랐다 / ㄹ 일부 사회주의자들의 \"자본가의 이익만을 위한 것\" 비판(p.34).","statements":["ㄱ. 1920년 회사령 폐지를 전후하여 한국인의 회사 설립이 활발해졌다.","ㄴ. 조만식 등 민족주의 계열 인사들은 1920년 평양에서 조선 물산 장려회를 조직하였다.","ㄷ. 토산품 소비가 늘었지만 생산량이 수요를 따라가 상품 가격은 안정되었다.","ㄹ. 일부 사회주의자들은 이 운동이 자본가의 이익만을 위한 것이라고 비판하였다."],"shuffle":false},{"id":"s01-q03","stage":"s01","pages":[35,34],"story":"물산 장려 운동","concepts":["물산 장려 운동"],"importance":"A","marks":["형광펜(자료 제목·본문)","번호 ④"],"type":"mc","difficulty":4,"stem":"다음 취지서를 발표한 단체가 벌인 운동에 대한 설명으로 옳은 것은?","options":["「조선일보」가 \"아는 것이 힘, 배워야 산다\"라는 구호를 내걸었다.","일제의 방해와 잇따른 자연재해로 모금 운동이 어려워져 실패하였다.","일부 사회주의자들로부터 자본가의 이익만을 위한 것이라는 비판을 받았다.","학생이 참여하는 농촌 계몽 운동으로 전개되었다."],"answer":2,"why":["문자 보급 운동(1929)이다.","민립 대학 설립 운동의 실패 원인이다.","정답. 물산 장려 운동은 사회주의자의 비판을 받았다(p.34).","「동아일보」의 브나로드 운동이다."],"explain":"자료는 조선 물산 장려회 취지서(서울, 1923)로, 조선 사람이 만든 물건을 사 쓰고 스스로 제작·공급하자는 물산 장려 운동이다. 생산량 부족으로 가격이 오르자 일부 사회주의자가 자본가의 이익만 위한다고 비판했다(p.34–35).","source":{"title":"조선 물산 장려회 취지서(서울)","text":"우리 조선 사람의 물산을 장려하기 위하여 조선 사람은 조선 사람이 지은 것을 사 쓰고, 조선 사람은 단결하여 그 쓰는 물건을 스스로 제작하여 공급하는 것을 목적으로 한다.","cite":"「산업계」, 1923. 11."}},{"id":"s01-q04","stage":"s01","pages":[35],"story":"민립 대학 설립 운동","concepts":["민립 대학 설립 운동","조선 민립 대학 기성회","이상재"],"importance":"A","marks":["형광펜","번호 ①~④","네모 박스(소단원)"],"type":"mc","difficulty":4,"stem":"민립 대학 설립 운동에 대한 설명으로 옳은 것은?","options":["1920년 평양에서 조만식을 중심으로 기성회가 조직되었다.","1922년 이상재를 중심으로 서울에서 조선 민립 대학 기성회가 조직되었다.","일제가 운동을 받아들여 1924년 경성 제국 대학을 민립 대학으로 인가하였다.","민족주의적 성격을 보인다는 구실로 1935년부터 금지되었다."],"answer":1,"why":["조선 물산 장려회(1920, 평양)와 혼동한 것이다.","정답. 1922년 이상재 중심, 서울에서 조직(p.35).","경성 제국 대학은 일제가 교육열 무마를 위해 따로 세웠다.","문자 보급·브나로드 등 문맹 퇴치 운동이 1935년부터 금지되었다."],"explain":"일제가 고등 교육 기회를 거의 주지 않자 1922년 이상재를 중심으로 조선 민립 대학 기성회가 조직되어 전국적 모금 운동을 펼쳤으나, 일제의 방해와 잇따른 자연재해로 실패하였다(p.35)."},{"id":"s01-q05","stage":"s01","pages":[35],"story":"민립 대학 설립 운동","concepts":["경성 제국 대학"],"importance":"A","marks":["형광펜","번호 ⑤"],"type":"mc","difficulty":3,"stem":"일제가 1924년 경성 제국 대학을 설립한 목적으로 교과서에 서술된 것은?","options":["한국인에게 고등 교육의 기회를 넓혀 주기 위해","한국에 있는 일본인을 교육하고 한국인의 교육열을 무마하기 위해","조선 민립 대학 기성회의 모금액을 관리하기 위해","식민 사관에 맞서는 민족주의 사학을 육성하기 위해"],"answer":1,"why":["일제는 오히려 고등 교육 기회를 거의 주지 않았다.","정답. ","기성회와 무관하다.","식민 사관은 일제의 역사 왜곡 논리다."],"explain":"\"일제는 한국에 있는 일본인을 교육하고 한국인의 교육열을 무마하기 위해 1924년에 경성 제국 대학을 설립하였다.\"(p.35)"},{"id":"s01-q06","stage":"s01","pages":[35],"story":"문맹 퇴치 운동","concepts":["문자 보급 운동","브나로드 운동","문맹 퇴치 운동"],"importance":"A","marks":["체크(소단원)","형광펜","네모 박스","번호 ①②"],"type":"mc","difficulty":4,"stem":"(가), (나) 구호를 내건 운동에 대한 설명으로 옳은 것은?\n(가) \"아는 것이 힘, 배워야 산다\"\n(나) \"배우자, 가르치자, 다 함께 브나로드\"","options":["(가)는 「동아일보」가 1930년대 초에 시작하였다.","(나)는 학생이 참여하는 농촌 계몽 운동이었다.","(가)는 1930년대 초에, (나)는 1929년부터 전개되었다.","(가)와 (나)는 일제의 장려 속에 1935년 이후 더욱 확대되었다."],"answer":1,"why":["(가)는 「조선일보」의 문자 보급 운동(1929~)이다.","정답. 브나로드 운동은 학생이 참여한 농촌 계몽 운동이다.","시기가 서로 바뀌었다.","일제는 1935년부터 모두 금지하였다."],"explain":"(가) 「조선일보」 문자 보급 운동(1929년부터) / (나) 「동아일보」 브나로드 운동(1930년대 초, 학생 참여 농촌 계몽). 일제는 \"민족주의적 성격\" 구실로 1935년부터 모두 금지(p.35)."},{"id":"s01-q07","stage":"s01","pages":[35],"story":"문맹 퇴치 운동","concepts":["문맹 퇴치 운동"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"일제가 문자 보급 운동, 브나로드 운동 등을 금지한 시기와 구실을 바르게 짝지은 것은?","options":["1929년 — 사회주의 사상을 퍼뜨린다는 구실","1935년부터 — 민족주의적 성격을 보인다는 구실","1931년 — 신간회와 연계했다는 구실","1924년 — 경성 제국 대학 설립을 방해한다는 구실"],"answer":1,"why":["1929년은 문자 보급 운동이 시작된 해다.","정답. ","신간회 해소(1931)와 혼동한 것이다.","1924년은 경성 제국 대학 설립 연도다."],"explain":"\"일제는 이들 운동이 민족주의적 성격을 보인다는 구실을 내세우며 1935년부터 모두 금지하였다.\"(p.35)"},{"id":"s01-q08","stage":"s01","pages":[35,34],"story":"물산 장려 운동","concepts":["물산 장려 운동"],"importance":"A","marks":["형광펜(자료2)","손글씨 \"사회주의자\"","번호 ④"],"type":"mc","difficulty":4,"stem":"다음 비판을 제기한 세력과 비판 대상이 된 운동을 바르게 짝지은 것은?","options":["자치론자 — 민립 대학 설립 운동","사회주의자 — 물산 장려 운동","민족주의 사학자 — 문자 보급 운동","비타협적 민족주의자 — 브나로드 운동"],"answer":1,"why":["자치론자는 일제와 타협해 자치권을 얻자고 한 세력이다.","정답. ","역사학 연구와 무관하다.","브나로드 운동은 이런 비판을 받았다고 서술되지 않았다."],"explain":"물산 장려 운동으로 토산품 가격이 크게 오르자 일부 사회주의자들은 이 운동이 자본가의 이익만을 위한 것이라고 비판하였다(p.34, 자료2 「동아일보」 1923).","source":{"title":"물산 장려 운동 비판","text":"무산자가 고가의 물건을 사게 하여 중산 및 유산 계급이 그 이윤 전부를 얻으니 물질상으로 막대한 손실이 된다.","cite":"「동아일보」, 1923. 4. 27."}},{"id":"s01-q09","stage":"s01","pages":[34],"story":"물산 장려 운동","concepts":["회사령 폐지","물산 장려 운동"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"1920년대 초 한국인 기업과 관련된 상황으로 옳은 것은?","options":["회사령이 제정되어 한국인의 회사 설립이 거의 불가능해졌다.","회사령 폐지를 전후하여 경성 방직 주식회사, 평양 메리야스 공장 등이 세워졌다.","동양 척식 주식회사가 한국인 기업에 자본을 지원하였다.","국가 총동원법에 따라 한국인 기업이 군수 공장으로 바뀌었다."],"answer":1,"why":["1920년에는 회사령이 \"폐지\"되었다.","정답. ","동척은 일제의 경제 침탈에 앞장섰다(p.43).","국가 총동원법은 1938년이다."],"explain":"\"1920년 회사령 폐지를 전후하여 한국인의 회사 설립이 활발해졌다. 이에 따라 경성 방직 주식회사, 평양 메리야스 공장 등이 세워졌다.\"(p.34)"},{"id":"s01-q10","stage":"s01","pages":[34],"story":"실력 양성 운동","concepts":["실력 양성 운동","물산 장려 운동","민립 대학 설립 운동","문맹 퇴치 운동"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"실력 양성 운동의 분야와 운동이 바르게 연결된 것은?","options":["산업 — 민립 대학 설립 운동 / 교육 — 물산 장려 운동","산업 — 물산 장려 운동 / 교육 — 민립 대학 설립 운동·문맹 퇴치 운동","산업 — 문맹 퇴치 운동 / 교육 — 물산 장려 운동","산업 — 문자 보급 운동 / 교육 — 형평 운동"],"answer":1,"why":["분야가 바뀌었다.","정답. ","문맹 퇴치는 교육 분야다.","형평 운동은 실력 양성 운동이 아니다(p.47)."],"explain":"\"산업 분야에서는 물산 장려 운동, 교육 분야에서는 민립 대학 설립 운동, 문맹 퇴치 운동 등이 전개되었다.\"(p.34)"},{"id":"s01-r01","stage":"s01","pages":[34,35],"story":"실력 양성 운동","concepts":["실력 양성 운동"],"importance":"A","marks":["형광펜","번호","단원 연표"],"type":"order","role":"riddle","difficulty":4,"stem":"기록의 문: 실력 양성 운동의 사건을 일어난 순서대로 배열하라. 성공하면 끊어진 길에 발판이 생긴다.","items":["조선 물산 장려회 조직(평양)","조선 민립 대학 기성회 조직","경성 제국 대학 설립","「조선일보」 문자 보급 운동 시작","「동아일보」 브나로드 운동","일제가 문맹 퇴치 운동 금지 시작"],"labels":["1920 물산 장려회","1922 민립 대학 기성회","1924 경성 제국 대학","1929 문자 보급","1930년대 초 브나로드","1935 금지"],"explain":"연표 근거: 1920 조선 물산 장려회 발족, 1922 조선 민립 대학 기성회, 1924 경성 제국 대학, 1929 문자 보급 운동, 1930년대 초(1931) 브나로드 운동, 1935년부터 금지(p.34–35)."},{"id":"s01-r02","stage":"s01","pages":[34,35],"story":"실력 양성 운동","concepts":["문자 보급 운동"],"importance":"A","marks":["형광펜","네모 박스"],"type":"liar","role":"riddle","difficulty":4,"stem":"거짓말하는 NPC: 장터 사람들 중 한 명이 잘못된 기록을 말하고 있다. 누구인가?","speakers":[{"name":"장터 상인","says":"조만식 선생 등이 1920년 평양에서 조선 물산 장려회를 만들었지."},{"name":"대학생","says":"1922년 이상재 선생을 중심으로 조선 민립 대학 기성회가 꾸려졌어."},{"name":"기자","says":"우리 「동아일보」는 1929년부터 \"아는 것이 힘, 배워야 산다\"를 외쳤소!"},{"name":"야학 교사","says":"일제가 1924년에 경성 제국 대학을 세운 건 한국인의 교육열을 무마하려는 것이었어."}],"options":["조만식 선생 등이 1920년 평양에서 조선 물산 장려회를 만들었지.","1922년 이상재 선생을 중심으로 조선 민립 대학 기성회가 꾸려졌어.","우리 「동아일보」는 1929년부터 \"아는 것이 힘, 배워야 산다\"를 외쳤소!","일제가 1924년에 경성 제국 대학을 세운 건 한국인의 교육열을 무마하려는 것이었어."],"answer":2,"why":["사실이다(p.34).","사실이다(p.35).","거짓 — 이 구호는 「조선일보」 문자 보급 운동이다. 「동아일보」는 브나로드 운동.","사실이다(p.35)."],"explain":"「조선일보」 = 문자 보급 운동(1929, \"아는 것이 힘, 배워야 산다\"), 「동아일보」 = 브나로드 운동(1930년대 초)."},{"id":"s02-q01","stage":"s02","pages":[37],"story":"민족 유일당 운동과 신간회","concepts":["신간회"],"importance":"S","marks":["형광펜(밑줄급)","네모 박스","×형 체크"],"type":"mc","difficulty":4,"stem":"다음 중 신간회에 대한 설명으로 옳은 것은?","options":["일부 민족주의자가 일제와 타협하여 자치권을 얻자며 결성한 단체이다.","비타협적 민족주의 세력과 사회주의 세력이 연합한 최대 규모의 합법적인 민족 협동 전선 단체이다.","사회주의 계열 조직들이 통합하여 결성한 단체이다.","1926년 7월 비타협적 민족주의 세력과 일부 사회주의 세력이 만든 단체이다."],"answer":1,"why":["자치론(타협적 민족주의)에 대한 설명이다.","정답. 1927년 2월 결성(p.37).","1925년 조선 공산당이다.","조선 민흥회(1926. 7.)다."],"explain":"국내 민족 유일당 운동의 결과 1927년 2월 비타협적 민족주의 세력과 사회주의 세력이 연합한 최대 규모의 합법적인 민족 협동 전선 단체인 신간회가 결성되었다(p.37)."},{"id":"s02-q02","stage":"s02","pages":[36,37],"story":"민족 유일당 운동과 신간회","concepts":["조선 공산당","조선 민흥회","정우회 선언","신간회"],"importance":"A","marks":["형광펜","네모 박스"],"type":"mc","difficulty":4,"stem":"다음 사건을 일어난 순서대로 바르게 나열한 것은?\n(가) 조선 공산당 결성  (나) 정우회 선언  (다) 신간회 결성  (라) 조선 민흥회 결성","options":["(가) - (나) - (라) - (다)","(가) - (라) - (나) - (다)","(라) - (가) - (나) - (다)","(가) - (라) - (다) - (나)"],"answer":1,"why":["정우회 선언(1926.11)이 조선 민흥회(1926.7)보다 늦다.","정답. ","조선 공산당(1925)이 가장 먼저다.","신간회(1927.2)는 정우회 선언 뒤다."],"explain":"1925 조선 공산당 → 1926. 7. 조선 민흥회 → 1926. 11. 정우회 선언 → 1927. 2. 신간회(p.36–37).","shuffle":false},{"id":"s02-q03","stage":"s02","pages":[37],"story":"민족 유일당 운동과 신간회","concepts":["신간회","광주 학생 항일 운동"],"importance":"A","marks":["형광펜","번호 ②③④","네모 박스"],"type":"mc","difficulty":4,"stem":"신간회의 활동으로 옳은 것은?","options":["1929년 광주 학생 항일 운동이 일어나자 진상 조사단을 파견하였다.","서울에 본부만 두고 지회는 두지 않았다.","창립 대회에서 회장에 홍명희, 부회장에 이상재를 선출하였다.","국외에서 3부 통합 운동을 주도하여 만주에 본부를 두었다."],"answer":0,"why":["정답. (p.37 ④).","전국 각지와 만주·일본에도 지회를 두었다.","회장 이상재, 부회장 홍명희다.","3부 통합 운동은 국외 민족 유일당 운동이며, 신간회 본부는 서울이다."],"explain":"신간회: 회장 이상재·부회장 홍명희, 서울 본부와 전국·만주·일본의 지회, 1929년 광주 학생 항일 운동 진상 조사단 파견(p.37)."},{"id":"s02-q04","stage":"s02","pages":[36],"story":"민족 유일당 운동과 신간회","concepts":["정우회 선언"],"importance":"A","marks":["형광펜","네모 박스","손글씨 \"신간회 배경\""],"type":"mc","difficulty":4,"stem":"사회주의 계열 단체가 비타협적 민족주의 세력과 협력할 것을 주장한 선언과 그 시기를 바르게 짝지은 것은?","options":["정우회 — 1926년 7월","정우회 — 1926년 11월","조선 민흥회 — 1926년 11월","조선 공산당 — 1925년"],"answer":1,"why":["1926년 7월은 조선 민흥회 결성 시기다.","정답. ","조선 민흥회는 1926년 7월에 결성된 단체이며 선언 주체가 아니다.","조선 공산당 결성은 1925년이지만 협력 선언과는 다르다."],"explain":"\"그해 11월에는 사회주의 계열 단체인 정우회가 비타협적 민족주의 세력과 협력할 것을 주장하였다(정우회 선언).\" 이는 신간회의 배경이 되었다(p.36).","shuffle":false},{"id":"s02-q05","stage":"s02","pages":[36,41],"story":"민족 유일당 운동과 신간회","concepts":["자치론"],"importance":"D","marks":["형광펜(본문·자료 탐구2)","손글씨 \"타협적 민족주의 ex) 이광수, 최린, 최남선\""],"type":"mc","difficulty":4,"stem":"다음 주장이 담긴 글이 발표된 이후의 상황으로 옳은 것은?","options":["일부 민족주의자의 자치 운동이 본격화되었고, 일제도 민족 운동을 분열시키려 이를 지원하였다.","비타협적 민족주의자들이 이 주장을 받아들여 조선 민흥회를 해체하였다.","일제는 이 주장을 탄압하기 위해 치안 유지법을 폐지하였다.","사회주의 세력은 이 주장을 지지하며 정우회 선언을 철회하였다."],"answer":0,"why":["정답. (p.36, 41).","비타협적 민족주의자들은 자치론자를 비판하였다.","일제는 자치론자를 지원하였다.","사회주의 세력은 비타협적 민족주의 세력과 연합하려 하였다."],"explain":"이광수의 「민족적 경륜」(1924)은 자치론을 담고 있다. 이후 일부 민족주의자의 자치 운동이 본격화되었고 일제도 민족 운동을 분열시키기 위해 자치 운동을 지원하였다(p.41). 비타협적 민족주의자는 자치론을 비판하며 사회주의 세력과 손잡으려 했다(p.36).","source":{"title":"「민족적 경륜」 (1924)","text":"조선 내에서 허가된 범위 내에서 일대 정치적 결사를 조직하여야 한다는 것이 우리의 주장이다.","cite":"이광수, 「민족적 경륜」"}},{"id":"s02-q06","stage":"s02","pages":[37],"story":"민족 유일당 운동과 신간회","concepts":["신간회 해소"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":4,"stem":"신간회 해소에 대한 설명으로 옳은 것은?","options":["1931년 5월 전체 대회에서 해소가 결정되었으며, \"해소\"는 조직 해체가 아닌 다른 단체로의 전환이라는 의미로 쓰였다.","1929년 광주 학생 항일 운동 직후 일제가 강제로 해산시킨 것을 \"해소\"라 한다.","\"해소\"는 조직을 완전히 없앤다는 뜻으로, 회원들은 모두 자치 운동에 참여하였다.","비타협적 민족주의자들만의 결정으로 해소가 이루어졌다."],"answer":0,"why":["정답. ","해소는 1931년 5월 전체 대회 결정이다.","해소는 다른 단체로의 전환이라는 의미였다.","일부 사회주의자들을 중심으로 해소 주장이 제기되었다(p.37)."],"explain":"\"1931년 5월 전체 대회에서 해소가 결정되었다.\" 해소: 조직의 해체가 아닌 다른 단체로의 전환이라는 의미로 해소라는 용어를 사용함(p.37)."},{"id":"s02-q07","stage":"s02","pages":[36],"story":"민족 유일당 운동과 신간회","concepts":["조선 공산당"],"importance":"A","marks":["형광펜","펜 밑줄","손글씨 \"1925년 조선 공산당 — 민족주의 계열/사회주의 계열\""],"type":"mc","difficulty":4,"stem":"1925년 조선 공산당 결성을 전후한 민족 운동의 변화로 옳은 것은?","options":["사회주의 계열 조직들이 통합하였고, 민족 운동의 노선이 민족주의 계열과 사회주의 계열로 나뉘었다.","민족주의 계열과 사회주의 계열이 신간회로 통합되었다.","사회주의 세력이 자치론을 주장하며 일제와 타협하였다.","코민테른이 민족주의자와의 협력을 금지하였다."],"answer":0,"why":["정답. (p.36).","신간회는 1927년이다.","자치론은 일부 민족주의자의 주장이다.","코민테른은 1920년대 민족주의자와의 협력을 \"중시\"하였다."],"explain":"\"1925년에는 사회주의 계열 조직들이 통합하여 조선 공산당을 결성하였다 … 이 과정에서 민족 운동의 노선은 민족주의 계열과 사회주의 계열로 나뉘었다.\"(p.36)"},{"id":"s02-q08","stage":"s02","pages":[36],"story":"민족 유일당 운동과 신간회","concepts":["민족 유일당 운동"],"importance":"B","marks":["네모 박스","형광펜(3부 통합 운동)"],"type":"mc","difficulty":4,"stem":"민족 유일당 운동에 대한 설명으로 옳지 않은 것은?","options":["국외에서는 3부 통합 운동이 전개되었다.","국내에서는 비타협적 민족주의 세력과 사회주의 세력의 연대 움직임으로 나타났다.","일부 민족주의자들의 자치론은 이 운동의 목표를 그대로 계승한 것이었다.","분열된 독립운동 진영을 통합하자는 움직임이었다."],"answer":2,"why":["옳다(p.36).","옳다(p.36).","옳지 않다 — 자치론은 일제와의 타협이며 비타협적 민족주의자들의 비판을 받았다.","옳다."],"explain":"중국의 제1차 국·공 합작 등을 배경으로 분열된 독립운동 진영을 통합하자는 민족 유일당 운동이 나타났다. 국외 3부 통합 운동, 국내는 조선 민흥회·정우회 선언을 거쳐 신간회로 이어짐(p.36)."},{"id":"s02-r01","stage":"s02","pages":[36,37,41],"story":"민족 유일당 운동과 신간회","concepts":["민족 유일당 운동","신간회"],"importance":"A","marks":["형광펜","네모 박스"],"type":"order","role":"riddle","difficulty":4,"stem":"기록의 문: 회관 명부의 날짜를 바로잡아라. 일어난 순서대로 배열하면 발판이 생긴다.","items":["이광수, 「민족적 경륜」 발표","조선 공산당 결성","조선 민흥회 결성","정우회 선언","신간회 결성","신간회, 광주 학생 항일 운동 진상 조사단 파견","신간회 해소 결정"],"labels":["1924 민족적 경륜","1925 조선 공산당","1926.7 조선 민흥회","1926.11 정우회 선언","1927.2 신간회","1929 진상 조사단","1931.5 해소"],"explain":"1924 「민족적 경륜」(p.41) → 1925 조선 공산당 → 1926. 7. 조선 민흥회 → 1926. 11. 정우회 선언(p.36) → 1927. 2. 신간회 → 1929 진상 조사단 → 1931. 5. 해소(p.37)."},{"id":"s02-r02","stage":"s02","pages":[37],"story":"민족 유일당 운동과 신간회","concepts":["신간회"],"importance":"S","marks":["형광펜","네모 박스","번호"],"type":"forgery","role":"riddle","difficulty":4,"stem":"위조된 문서: 회관에 걸린 보고서에 거짓 문장이 숨어 있다. 모두 찾아내면 함정이 해제된다.","doc":{"title":"신간회 창립 보고서(위조본)","segments":[{"t":"1927년 2월, 비타협적 민족주의 세력과 사회주의 세력이 연합하여 신간회를 결성하였다.","wrong":false},{"t":"창립 대회에서 회장에 홍명희, 부회장에 이상재를 선출하였다.","wrong":true,"fix":"회장은 이상재, 부회장은 홍명희이다(p.37)."},{"t":"서울에 본부를 두고 전국 각지와 만주, 일본에도 지회를 두었다.","wrong":false},{"t":"1929년 광주 학생 항일 운동이 일어나자 진상 조사단을 파견하였다.","wrong":false},{"t":"1931년 5월의 \"해소\" 결정은 일제에 의한 강제 해체를 뜻한다.","wrong":true,"fix":"해소는 1931년 5월 전체 대회의 결정이며, 조직의 해체가 아닌 다른 단체로의 전환이라는 의미였다(p.37)."}]},"explain":"신간회: 1927. 2. 결성, 회장 이상재·부회장 홍명희, 서울 본부·지회, 1929 진상 조사단, 1931. 5. 해소(전환의 의미)."},{"id":"s03-q01","stage":"s03","pages":[38],"story":"6·10 만세 운동","concepts":["6·10 만세 운동"],"importance":"B","marks":["네모 박스","손글씨 \"1926\"","형광펜"],"type":"mc","difficulty":4,"stem":"6·10 만세 운동에 대한 설명으로 옳은 것은?","options":["광주에서 출발한 통학 열차 안의 사건이 발단이 되었다.","사회주의 계열 단체, 천도교, 학생들이 순종의 장례일에 맞추어 대규모 만세 운동을 계획하였다.","신간회가 진상 조사단을 파견하여 전국으로 확산되었다.","\"식민지 교육 철폐\", \"일본 제국주의 타도\"를 주장하며 1930년 3월까지 이어졌다."],"answer":1,"why":["광주 학생 항일 운동(1929)의 발단이다.","정답. (p.38).","광주 학생 항일 운동 때의 일이다.","광주 학생 항일 운동의 주장이다."],"explain":"대한 제국의 마지막 황제 순종이 세상을 떠나자, 사회주의 계열 단체와 천도교, 학생들은 순종의 장례일(1926. 6. 10.)에 대규모 만세 운동을 벌일 계획을 세웠다(p.38)."},{"id":"s03-q02","stage":"s03","pages":[38],"story":"6·10 만세 운동","concepts":["6·10 만세 운동","민족 유일당 운동"],"importance":"D","marks":["형광펜","손글씨 \"신간회 배경\""],"type":"mc","difficulty":4,"stem":"6·10 만세 운동이 이후 민족 운동에 끼친 영향으로 옳은 것은?","options":["민족주의 계열과 사회주의 계열이 함께 준비하면서 통일된 독립운동의 필요성을 절실히 느껴, 민족 유일당 운동을 추진하는 데 영향을 주었다.","신간회가 해소되는 직접적인 계기가 되었다.","3·1 운동 이후 실력 양성 운동이 시작되는 계기가 되었다.","일부 민족주의자들이 자치론을 주장하는 계기가 되었다."],"answer":0,"why":["정답. (p.38, 필기 \"신간회 배경\").","신간회 해소는 1931년의 일이다.","실력 양성 운동은 1920년대 전반에 시작되었다.","자치론과는 연결되지 않는다."],"explain":"\"민족주의 계열과 사회주의 계열이 함께 만세 시위를 준비하면서 통일된 독립운동의 필요성을 절실히 느끼게 되었다. 이는 이후 민족 유일당 운동을 추진하는 데 영향을 주었다.\"(p.38)"},{"id":"s03-q03","stage":"s03","pages":[39,38],"story":"광주 학생 항일 운동","concepts":["광주 학생 항일 운동"],"importance":"A","marks":["네모 박스","별표","형광펜","손글씨 \"1929\", \"신간회 지원\""],"type":"mc","difficulty":4,"stem":"광주 학생 항일 운동에 대한 설명으로 옳지 않은 것은?","options":["1929년 10월 통학 열차에서 일본인 남학생이 한국인 여학생을 희롱한 사건이 발단이 되었다.","목포·나주로 확산되었고 12월에는 서울 지역까지 확대되었다.","신간회가 진상 조사단을 파견하였다.","사회주의 계열 단체와 천도교, 학생들이 순종의 장례일에 맞추어 계획하였다."],"answer":3,"why":["옳다(p.39).","옳다(p.39).","옳다(p.37).","옳지 않다 — 6·10 만세 운동(1926)에 대한 설명이다."],"explain":"광주 학생 항일 운동: 1929년 10월 통학 열차 사건 → 목포·나주 → 12월 서울. 신간회 진상 조사단 파견(p.37, 39)."},{"id":"s03-q04","stage":"s03","pages":[39,35],"story":"광주 학생 항일 운동","concepts":["광주 학생 항일 운동","문자 보급 운동"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"광주 학생 항일 운동 당시 학생들이 내건 주장으로 교과서에 제시되지 않은 것은?","options":["\"식민지 교육 철폐\"","\"일본 제국주의 타도\"","\"민족 해방\"","\"배우자, 가르치자, 다 함께 브나로드\""],"answer":3,"why":["교과서에 제시된 주장이다.","교과서에 제시된 주장이다.","교과서에 제시된 주장이다.","정답(제시되지 않음) — 「동아일보」 브나로드 운동의 구호다(p.35)."],"explain":"\"학생들은 '식민지 교육 철폐', '일본 제국주의 타도', '민족 해방'을 주장하였다.\"(p.39)","shuffle":false},{"id":"s03-q05","stage":"s03","pages":[40],"story":"관동 대학살","concepts":["관동 대학살"],"importance":"D","marks":["형광펜(도입문)"],"type":"mc","difficulty":3,"stem":"1923년 일본 관동 지방에서 일어난 일에 대한 설명으로 옳은 것은?","options":["9월 1일 대지진이 일어났고, 지진의 혼란 속에서 6천 명 이상의 한국인이 살해당하는 관동 대학살이 일어났다.","1929년 관동 대지진 직후 광주에서 학생 시위가 시작되었다.","일본 정부와 언론은 \"한국인 방화\" 유언비어를 바로잡아 학살을 막았다.","희생된 한국인은 수십 명에 그쳤다."],"answer":0,"why":["정답. (p.40).","관동 대지진은 1923년이며 광주 학생 항일 운동과 무관하다.","일본 정부와 언론은 유언비어를 묵인하고 확산시켰다(p.40).","6천 명 이상이 살해당했다(독립신문 조사 6,661명)."],"explain":"\"1923년 9월 1일 일본 관동 지방에서 대지진이 일어났다. 지진의 혼란 속에서 6천 명 이상의 한국인이 살해당하는 관동 대학살이 일어났다.\"(p.40)"},{"id":"s03-q06","stage":"s03","pages":[39],"story":"광주 학생 항일 운동","concepts":["광주 학생 항일 운동"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"광주 학생 항일 운동의 전개를 순서대로 바르게 나열한 것은?\n(가) 통학 열차에서 일본인 남학생이 한국인 여학생을 희롱함\n(나) 12월 서울 지역까지 확대됨\n(다) 목포와 나주로 확산됨","options":["(가) - (나) - (다)","(가) - (다) - (나)","(다) - (가) - (나)","(나) - (다) - (가)"],"answer":1,"why":["서울 확대는 목포·나주 확산 뒤다.","정답. ","발단은 (가)다.","순서가 거꾸로다."],"explain":"\"광주에서 시작된 항일 학생 운동은 목포와 나주로 확산되었으며, 12월에는 서울 지역까지 확대되었다.\"(p.39)","shuffle":false},{"id":"s03-q07","stage":"s03","pages":[38,39],"story":"1920년대 학생 운동","concepts":["6·10 만세 운동","광주 학생 항일 운동"],"importance":"B","marks":["네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"6·10 만세 운동과 광주 학생 항일 운동을 비교한 내용으로 옳은 것은?","options":["6·10 만세 운동은 순종의 장례일, 광주 학생 항일 운동은 통학 열차 사건이 계기가 되었다.","두 운동 모두 신간회가 진상 조사단을 파견하였다.","6·10 만세 운동은 1929년, 광주 학생 항일 운동은 1926년에 일어났다.","광주 학생 항일 운동이 먼저 일어나 6·10 만세 운동의 배경이 되었다."],"answer":0,"why":["정답. ","신간회(1927 결성)는 1926년의 6·10 만세 운동 때 존재하지 않았다.","연도가 바뀌었다(6·10은 1926, 광주는 1929).","6·10 만세 운동이 먼저다."],"explain":"6·10 만세 운동(1926, 순종 장례일) → 신간회(1927) → 광주 학생 항일 운동(1929, 통학 열차 사건, 신간회 진상 조사단)."},{"id":"s03-r01","stage":"s03","pages":[38,39,40,37],"story":"1920년대 학생 운동","concepts":["6·10 만세 운동","광주 학생 항일 운동","관동 대학살"],"importance":"B","marks":["네모 박스","형광펜"],"type":"order","role":"riddle","difficulty":4,"stem":"기록의 문: 1920년대의 사건을 일어난 순서대로 배열하라.","items":["관동 대지진과 한국인 학살","6·10 만세 운동","신간회 결성","광주 학생 항일 운동"],"labels":["1923 관동 대학살","1926 6·10 만세 운동","1927 신간회","1929 광주 학생 항일 운동"],"explain":"1923. 9. 1. 관동 대지진(p.40) → 1926 6·10 만세 운동(p.38) → 1927 신간회(p.37) → 1929 광주 학생 항일 운동(p.39)."},{"id":"s03-r02","stage":"s03","pages":[39,35],"story":"1920년대 학생 운동","concepts":["광주 학생 항일 운동"],"importance":"A","marks":["네모 박스","별표","형광펜"],"type":"forgery","role":"riddle","difficulty":4,"stem":"위조된 문서: 학생 신문 호외에서 사실과 다른 문장을 모두 찾아라.","doc":{"title":"학생 신문 호외(위조본)","segments":[{"t":"1929년 10월, 광주에서 출발한 통학 열차가 나주에 도착하였을 때 일본인 남학생이 한국인 여학생을 희롱하는 사건이 일어났다.","wrong":false},{"t":"이 사건은 순종의 장례일에 일어나 곧바로 전국적인 만세 시위로 번졌다.","wrong":true,"fix":"순종의 장례일(1926. 6. 10.)은 6·10 만세 운동과 관련된다(p.38)."},{"t":"항일 학생 운동은 목포와 나주로 확산되었으며, 12월에는 서울 지역까지 확대되었다.","wrong":false},{"t":"학생들은 \"아는 것이 힘, 배워야 산다\"를 외치며 시위하였다.","wrong":true,"fix":"학생들은 \"식민지 교육 철폐\", \"일본 제국주의 타도\", \"민족 해방\"을 주장하였다. 위 구호는 「조선일보」 문자 보급 운동의 구호(p.35)."},{"t":"신간회는 진상 조사단을 파견하였다.","wrong":false}]},"explain":"광주 학생 항일 운동(p.39)과 6·10 만세 운동(p.38), 문자 보급 운동(p.35)을 구별해야 한다."},{"id":"s04-q01","stage":"s04","pages":[43],"story":"도시와 농촌의 변화","concepts":["농촌 진흥 운동"],"importance":"A","marks":["형광펜","네모 박스"],"type":"mc","difficulty":4,"stem":"1932년에 전개된 농촌 진흥 운동에 대한 설명으로 옳은 것은?","options":["소작인 조합을 중심으로 농민들이 자발적으로 전개하였다.","농촌 경제가 피폐해지고 소작 쟁의가 확산되자, 일제가 농촌 사회를 통제하고 식민지 지배 체제를 안정시키려고 전개하였다.","「동아일보」가 학생들을 모아 농촌 계몽을 위해 전개하였다.","구조적 개혁을 추진하여 소작 문제를 근본적으로 해결하였다."],"answer":1,"why":["농촌 진흥 운동은 일제가 전개하였다.","정답. (p.43).","브나로드 운동(p.35)이다.","구조적 개혁을 외면하여 별다른 성과를 거두지 못했다."],"explain":"\"일제는 농촌 경제가 피폐해지고 소작 쟁의가 확산되자, 농촌 사회를 통제하여 식민지 지배 체제를 안정시키기 위해 농촌 진흥 운동을 전개하였다(1932).\"(p.43)"},{"id":"s04-q02","stage":"s04","pages":[43],"story":"도시와 농촌의 변화","concepts":["농촌 진흥 운동"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"농촌 진흥 운동이 별다른 성과를 거두지 못한 이유로 교과서의 설명과 가장 가까운 것은?","options":["농촌의 어려움을 일제의 정책이 아닌 농민의 생활 태도 때문이라고 왜곡하며 근면과 절약만 강조하고 구조적 개혁은 외면하였다.","소작인 조합이 운동을 주도하여 일제와 충돌하였다.","동양 척식 주식회사가 토지를 농민에게 돌려주어 지주들이 반발하였다.","철도가 부족하여 농산물을 운반하지 못하였다."],"answer":0,"why":["정답. ","농민 단체가 주도한 운동이 아니다.","동척은 최대의 지주가 되었다.","교과서에 그런 서술은 없다(철도망은 X자로 완성)."],"explain":"\"농촌의 어려움이 일제의 정책 때문이 아닌 농민들의 생활 태도 때문이라고 왜곡하면서 근면과 절약 등만 강조하였다. 그리고 구조적 개혁은 외면하여 별다른 성과를 거두지 못하였다.\"(p.43)"},{"id":"s04-q03","stage":"s04","pages":[43],"story":"도시와 농촌의 변화","concepts":["동양 척식 주식회사"],"importance":"A","marks":["네모 박스(사료 제목)","체크형 표시","형광펜"],"type":"mc","difficulty":4,"stem":"동양 척식 주식회사에 대한 설명으로 옳은 것은?","options":["1908년 한국의 식산흥업을 지원한다는 명분으로 설립되어 일제 강점기 한국 최대의 지주가 되었다.","1932년 농촌 진흥 운동을 위해 설립되었다.","소유한 토지를 한국인 농민에게 무상으로 나누어 주었다.","한국인 자본가들이 민족 경제 자립을 위해 세운 회사이다."],"answer":0,"why":["정답. ","설립은 1908년이다.","토지를 소작시키고 고율의 소작료를 거두었다.","일제의 한국 경제 침탈에 앞장선 회사다."],"explain":"\"1908년 한국의 식산흥업을 지원한다는 명분으로 동양 척식 주식회사가 설립되었다 … 일제의 한국 경제 침탈에 앞장섰으며, 일제 강점기 한국 최대의 지주가 되었다.\"(p.43)"},{"id":"s04-q04","stage":"s04","pages":[43],"story":"도시와 농촌의 변화","concepts":["동양 척식 주식회사"],"importance":"A","marks":["네모 박스","손글씨 \"토지 조사 사업\"(1908~1915 구간 표시)"],"type":"mc","difficulty":4,"stem":"동양 척식 주식회사 소유 토지는 1908년 약 1만 1천 정보에서 1915년 약 7만 3천 정보로 급증하였다. 이 시기 동양 척식 주식회사가 앞장선 일제의 정책으로 가장 적절한 것은?","options":["토지 조사 사업","농촌 진흥 운동","국가 총동원법","병참 기지화 정책"],"answer":0,"why":["정답.  동척은 토지 조사 사업 등 일제의 경제 침탈에 앞장섰다.","1932년 정책이다.","1938년 제정이다.","1930년대 이후 정책이다."],"explain":"그래프(동척 소유 토지 변화): 1908년 11 → 1915년 73(천 정보). 교과서는 동척이 \"일본인의 한국 이민, 토지 조사 사업, 산미 증식 계획 등 일제의 한국 경제 침탈에 앞장섰다\"고 서술하며, 필기에도 이 구간이 \"토지 조사 사업\"으로 표시되어 있다(p.43). 나머지 보기는 모두 1930년대 이후의 정책이다.","shuffle":false},{"id":"s04-q05","stage":"s04","pages":[42,43],"story":"도시와 농촌의 변화","concepts":["X자 철도망","동양 척식 주식회사","농촌 진흥 운동"],"importance":"A","marks":["형광펜","네모 박스"],"type":"mc","difficulty":4,"stem":"일제 강점기 도시와 농촌의 변화에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?","options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"answer":3,"why":["ㄹ도 옳다.","ㄷ은 틀렸다.","ㄷ은 틀렸다.","정답. ","ㄷ은 틀렸다."],"explain":"ㄱ X자 철도망 완성(p.42) / ㄴ 동척은 최대 지주(p.43) / ㄷ 동척은 토지를 소작시키고 고율의 소작료를 거두었다 / ㄹ 농촌 진흥 운동의 배경(p.43).","statements":["ㄱ. 일제 강점기 한반도를 X자로 관통하는 철도망이 완성되었다.","ㄴ. 동양 척식 주식회사는 일제 강점기 한국 최대의 지주가 되었다.","ㄷ. 동양 척식 주식회사는 소작료를 걷지 않고 한국인 농민에게 토지를 무상으로 빌려주었다.","ㄹ. 농촌 진흥 운동은 소작 쟁의 확산과 농촌 경제 피폐 속에서 농촌 사회를 통제하려고 전개되었다."],"shuffle":false},{"id":"s04-q06","stage":"s04","pages":[43],"story":"도시와 농촌의 변화","concepts":["동양 척식 주식회사"],"importance":"C","marks":["펜 괄호 표시(척도 외 — 밑줄급 잠정)"],"type":"mc","difficulty":3,"stem":"토지 조사 사업, 산미 증식 계획 등이 실시되면서 농촌에서 나타난 변화로 옳은 것은?","options":["소수의 지주에게 토지가 집중되었고, 일본인과 일본 기업이 지주가 되었으며 일부 한국인도 일제 정책에 호응하여 토지 소유를 늘려 갔다.","소작농이 줄어들고 자작농이 크게 늘었다.","한국인 지주는 모두 토지를 잃었다.","일본 상품이 농촌에 들어오는 것이 금지되었다."],"answer":0,"why":["정답. (p.43 첫 문단).","토지를 잃고 몰락한 농민이 늘었다.","일부 한국인은 토지 소유를 늘려 갔다.","일본 상품이 농촌에 들어오는 통로가 되었다."],"explain":"\"토지 조사 사업, 산미 증식 계획 등이 실시되면서 소수의 지주에게 토지가 집중되는 현상이 심화되었다 … 일부 한국인도 일제의 정책에 적극적으로 호응하면서 토지 소유를 늘려 갔다.\"(p.43)"},{"id":"s04-q07","stage":"s04","pages":[43],"story":"도시와 농촌의 변화","concepts":["동양 척식 주식회사"],"importance":"D","marks":["형광펜"],"type":"mc","difficulty":3,"stem":"동양 척식 주식회사가 일제의 침략 전쟁과 연결된 방식으로 교과서에 서술된 것은?","options":["소유한 토지를 한국인 농민에게 소작시키고 거둔 소작료로 일제의 침략 전쟁을 지원하였다.","국가 총동원법 제정을 주도하였다.","애국반을 조직하여 반상회를 열었다.","학도 지원병을 모집하였다."],"answer":0,"why":["정답. ","국가 총동원법은 일제(정부)가 제정하였다.","애국반은 국민정신 총동원 운동의 말단 조직이다.","학도 지원병제는 일제가 시행한 제도다."],"explain":"\"소유한 토지를 한국인 농민에게 소작시키고 거둔 소작료로 일제의 침략 전쟁을 지원하기도 하였다.\"(p.43)"},{"id":"s04-r01","stage":"s04","pages":[42,43],"story":"도시와 농촌의 변화","concepts":["동양 척식 주식회사","농촌 진흥 운동","X자 철도망"],"impo lain":"\"1942년 조선어 학회 사건을 조작하여 조선어 학회 회원들을 체포·투옥하고 강제로 해산하였다.\"(p.48)"},{"id":"s07-q07","stage":"s07","pages":[48],"story":"역사 연구","concepts":["실증 사학"],"importance":"A","marks":["네모 박스","형광펜"],"type":"mc","difficulty":3,"stem":"실증 사학에 대한 설명으로 옳은 것은?","options":["개별 역사 사실을 객관적으로 밝히려 하였으며, 이병도·손진태 등이 진단 학회를 창립하고 「진단 학보」를 발행하였다.","유물 사관의 입장에서 한국사를 연구하였다.","고대사 연구로 민족 중심의 자주적 역사관을 강조하였다.","일제의 식민 통치를 정당화하기 위해 역사를 왜곡하였다."],"answer":0,"why":["정답. (p.48).","사회경제 사학이다.","신채호의 민족주의 사학이다.","식민 사관이다."],"explain":"\"개별 역사 사실을 객관적으로 밝히려는 실증 사학도 발달하였다. 이병도, 손진태 등 실증주의 사학자들은 진단 학회를 창립하고 「진단 학보」를 발행하였다.\"(p.48)"},{"id":"s07-q08","stage":"s07","pages":[48],"story":"역사 연구","concepts":["민족주의 사학","사회경제 사학","실증 사학"],"importance":"A","marks":["네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"일제 강점기 역사 연구에 대한 설명으로 옳은 것만을 있는 대로 고른 것은?","options":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"answer":3,"why":["ㄷ도 옳다.","ㄹ은 틀렸다.","ㄱ도 옳다.","정답. ","ㄹ은 틀렸다."],"explain":"ㄱ 민족주의 사학자(신채호·박은식)는 민족정신 강조 / ㄴ 사회경제 사학은 유물 사관 / ㄷ 실증 사학자는 진단 학회 창립 / ㄹ 근대사 연구로 민족혼을 강조한 것은 박은식(p.48).","statements":["ㄱ. 민족주의 사학자들은 민족정신을 강조하였다.","ㄴ. 사회경제 사학자들은 유물 사관의 입장에서 한국사를 연구하였다.","ㄷ. 실증주의 사학자들은 진단 학회를 창립하였다.","ㄹ. 신채호는 근대사 연구를 통하여 민족혼을 강조하였다."],"shuffle":false},{"id":"s07-q09","stage":"s07","pages":[48,56],"story":"역사 연구","concepts":["식민 사관"],"importance":"S","marks":["체크","네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"식민 사관 및 일제의 주장과 그 내용의 연결로 옳지 않은 것은?","options":["타율성론 — 한국사는 대륙(중국)과 해양 세력(일본)의 간섭을 받아 이루어졌다.","정체성론 — 한국은 중세 봉건 사회로 발전하지 못하고 고대 단계에 머물러 있다.","당파성론 — 한국인은 항상 분열하여 당파를 만들고 서로 싸운다.","일선동조론 — 한국사는 세계사적 보편성에 따라 발전하였다."],"answer":3,"why":["옳다.","옳다.","옳다.","옳지 않다 — 일선동조론은 \"일본인과 한국인의 조상은 같다\"는 주장(p.56). 세계사적 보편성은 백남운의 반박 논리(p.48)."],"explain":"식민 사관 3종(p.48)과 일선동조론(p.56)을 구별하라.","shuffle":false},{"id":"s07-r01","stage":"s07","pages":[48,35],"story":"우리말과 역사 연구","concepts":["조선어 연구회","조선어 학회"],"importance":"A","marks":["체크","네모 박스","형광펜"],"type":"order","role":"riddle","difficulty":4,"stem":"기록의 문: 우리말을 지킨 기록과 같은 대공황 이후 블록 경제 → 만주(농업·원료 공급지), 한국(군수품 보급 기지) → 1930년대 일본 독점 자본의 중화학 공업·광업 진출(북부) → 중·일 전쟁 이후 병참 기지화 정책 본격 실시(p.54)."},{"id":"s08-q02","stage":"s08","pages":[54],"story":"병참 기지화 정책과 전쟁 동원","concepts":["병참 기지화 정책"],"importance":"P","marks":["54~55쪽 전체 중요"],"type":"mc","difficulty":3,"stem":"다음은 교과서의 \"한반도 남북부 공업 생산 비율(%)\" 자료이다. 바르게 해석한 것은?\n· 경공업 — 남부 76.8 / 북부 23.2\n· 광공업 — 북부 72.0 / 남부 28.0\n· 중화학 공업 — 북부 83.1 / 남부 16.9","options":["경공업 생산 비율은 북부가 남부보다 높았다.","중화학 공업 생산의 80% 이상이 북부에 집중되었다.","광공업은 남부의 비율이 70% 이상이었다.","남부 지방은 중화학 공업 중심으로 발달하였다.","남북부 사이의 공업 격차는 나타나지 않았다."],"answer":1,"why":["경공업은 남부 76.8%.","정답.  북부 83.1%.","광공업은 북부 72.0%.","남부는 경공업 중심이었다.","지역에 따른 공업 격차가 깊어졌다."],"explain":"그래프 설명: \"북부 지방은 광공업과 중화학 공업, 남부 지방은 경공업 중심으로 지역에 따른 공업 격차가 깊어졌다.\"(p.54)"},{"id":"s08-q03","stage":"s08","pages":[54],"story":"병참 기지화 정책과 전쟁 동원","concepts":["국가 총동원법"],"importance":"P","marks":["54~55쪽 전체 중요","네모 박스","형광펜"],"type":"mc","difficulty":4,"stem":"다음 조항이 들어 있는 법령에 대한 설명으로 옳은 것은?","options":["1938년 제정되어 침략 전쟁에 필요한 인력과 물자 수탈의 근거가 되었다.","1944년 제정되어 여성의 노동력을 동원하였다.","1941년 제정되어 소학교의 명칭을 바꾸었다.","1932년 농촌 사회를 통제하기 위해 제정되었다."],"answer":0,"why":["정답.  국가 총동원법.","여자 정신 근로령(1944)이다.","국민학교령(1941)이다.","농촌 진흥 운동(1932)이다."],"explain":"\"1938년 일제는 국가 총동원법을 제정하여 본격적으로 침략 전쟁에 필요한 인력과 물자 수탈에 나섰다.\"(p.54) 사료: 제4조 징용 규정.","source":{"title":"국가 총동원법","text":"제4조 정부는 전시에 국가 총동원상 필요할 때는 칙령이 정하는 바에 따라 제국 신민을 징용하여 총동원 업무에 종사하게 할 수 있다.","cite":"「조선 총독부 관보」"}},{"id":"s08-q04","stage":"s08","pages":[54],"story":"병참 기지화 정책과 전쟁 동원","concepts":["국민정신 총동원 운동","애국반"],"importance":"P","marks":["54~55쪽 전체 중요","형광펜"],"type":"mc","difficulty":4,"stem":"국민정신 총동원 운동에 대한 설명으로 옳은 것은?","options":["한국에서 처음 시작되어 일본으로 퍼져 나갔다.","기존 행정 구역을 바탕으로 조직되었고, 말단 기구인 애국반은 10개 집을 하나로 묶어 조직하였다.","애국반은 100개 집을 하나로 묶어 조직하였다.","애국반은 독립운동가들이 일제의 감시를 피하려고 만든 조직이다."],"answer":1,"why":["일본에서 실시한 운동을 한국에서도 실시하였다.","정답. (p.54).","10개 집이다.","애국반은 일제가 정책 선전과 일상 통제에 이용한 조직이다."],"explain":"\"국민정신 총동원 운동은 기존 행정 구역을 바탕으로 조직되었으며, 말단 기구인 애국반은  ㄷ 송진 채취 / ㄹ 각종 세금을 만들고 위문 금품과 국방헌금을 강요하였다(p.55).","statements":["ㄱ. 산미 증식 계획을 다시 시행하고 식량 배급제를 실시하였다.","ㄴ. 공출이라는 이름으로 식량뿐 아니라 농기구, 수저 등 생활용품까지 빼앗았다.","ㄷ. 부족한 연료를 보충하기 위해 소나무에서 송진까지 채취하도록 하였다.","ㄹ. 전쟁 비용을 충당하려고 세금을 없애고 자발적인 기부만 받았다."],"shuffle":false},{"id":"s08-q09","stage":"s08","pages":[55],"story":"병참 기지화 정책과 전쟁 동원","concepts":["물자 수탈"],"importance":"P","marks":["54~55쪽 전체 중요"],"type":"mc","difficulty":3,"stem":"공주 갑사 동종에 대한 설명으로 옳은 것은?","options":["\"헌납\"이라는 명분으로 일제에 공출되었으나, 녹이기 전에 일제가 패망하여 다시 돌아올 수 있었다.","국민정신 총동원 운동을 기념하여 일제가 새로 만들었다.","공출되어 군수 물자로 녹여졌다.","애국반 반상회의 신호용 종이었다."],"answer":0,"why":["정답. (p.55 사진 설명).","교과서에 없는 내용이다.","녹이기 전에 일제가 패망하였다.","교과서에 없는 내용이다."],"explain":"\"헌납이란 명분으로 일제에 공출되었다. 녹여지기 전에 일제가 패망하여 다시 돌아올 수 있었다.\"(p.55)"},{"id":"s08-q10","stage":"s08","pages":[54],"story":"병참 기지화 정책과 전쟁 동원","concepts":["병참 기지화 정책"],"importance":"P","marks":["54~55쪽 전체 중요"],"type":"mc","difficulty":4,"stem":"제주 모슬포의 알뜨르 비행장에 대한 교과서 서술로 옳은 것은?","options":["중국 대륙 폭격을 위한 일제 전투기의 급유지이자 가미카제(자살 특공대)의 훈련이 이루어진 기지였다.","한국광복군이 국내 진공 작전을 위해 만든 비행장이다.","\"알뜨르\"는 \"아래 들\"이라는 뜻의 일본어이다.","주민의 동원 없이 일본군만으로 건설되었다."],"answer":0,"why":["정답. (p.54 도입).","일제가 만든 군사 기지다.","\"알뜨르\"는 \"아래 들\"이라는 뜻의 제주 말이다.","모슬포 주민들의 손으로 만들어졌다."],"explain":"\"알뜨르 비행장. 제주 말로 '아래 들'이라는 뜻을 가진 이곳은 일제 강점기에 모슬포 주민들의 손으로 만들어진 비행장이다 … 중국 대륙에 폭격을 하기 위한 일제 전투기의 급유지이자 '가미카제' 일본군 자살 특공대의 훈련이 이뤄졌던 살육의 전초 기지였다.\"(p.54, 경향신문 2017)"},{"id":"s08-q11","stage":"s08","pages":[54,55],"story":"병참 기지화 정책과 전쟁 동원","concepts":["국가 총동원법","강제 동원"],"importance":"P","marks":["54~55쪽 전체 중요"],"type":"mc","difficulty":4,"stem":"1938년에 있었던 일로만 짝지은 것은?","options":["국가 총동원법 제정, 지원병제 실시","국민 징용령 실시, 일본식 성명 강요 시작","황국 신민 서사 제정, 국민학교령 제정","학도 지원병제 시행, 징병제 실시"],"answer":0,"why":["정답. ","1939년, 1940년이다.","1937년, 1941년이다.","1943년, 1944년이다."],"explain":"단원 연표(p.54): 1937 중·일 전쟁·황국 신민 서사 / 1938 국가 총동원법 / 1940 일본식 성명 강요 / 1941 국민학교령·아시아·태평양 전쟁. 본문(p.55): 1938 지원병제, 1939 국민 징용령, 1943 학도 지원병제, 1944 징병제.","shuffle":false},{"id":"s08-q12","stage"
