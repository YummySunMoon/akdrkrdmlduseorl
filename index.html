<script>/* js/systems/Minjun.js */
/* Minjun — 신출귀몰한 방랑자 김민준: 포탈 등장·퇴장, 스테이지 클리어 보충 설명, 오답 누적 도움, 탐험 중 깜짝 등장, 코믹 연출, 정체 단서
 * 등장은 반드시 포탈로: 열림 → 걸어 나옴 → 닫힘 / 퇴장: 열림 → 걸어 들어감 → 닫힘. 포탈 위치는 실제 지형(같은 높이의 바닥, 벽 없음, 화면 안)을 확인한다. */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;

  const SPEC = { top: '#2c4a5a', topD: '#1b2f3a', pants: '#26222e', hair: '#2a211c', skin: '#f2cba8', accent: '#c9b6ff', brush: '#6e4a2a', robe: true, scarf: '#7b5cd6', bigHead: true };
  const D = () => MG.Data.minjun;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ── 장면 속 김민준 + 포탈 ── */
  class Actor {
    constructor(scene) {
      this.s = scene; this.state = 'hidden'; this.x = 0; this.y = 0; this.dir = -1; this.expr = 'normal';
      this.portal = null; this.portals = []; this.walk = 0; this.scale = 1; this.alpha = 1; this.rot = 0; this.talking = false;
      this.tasks = [];
    }
    /* 시간 기반 단계 실행: 게임 시간(정지 중엔 멈춤)으로 진행 */
    run(dur, fn) { return new Promise((res) => this.tasks.push({ t: 0, dur, fn, res })); }
    update(dt) {
      for (const pt of this.portals) pt.t += dt;
      const k = this.tasks[0];
      if (k) { k.t += dt; const f = Math.min(1, k.t / k.dur); k.fn && k.fn(f, dt); if (f >= 1) { this.tasks.shift(); k.res(); } }
      this.portals = this.portals.filter((p) => !(p.closing && p.s <= 0.02));
    }
    draw(R) {
      const ctx = R.ctx, PXL = MG.Pixel;
      for (const pt of this.portals) {
        if (pt.s <= 0.02) continue;
        R.light(pt.x, pt.y, 150 * pt.s, 'rgba(150,110,255,0.95)', 0.35 * pt.s);
        R.light(pt.x, pt.y, 80 * pt.s, 'rgba(110,170,255,0.9)', 0.25 * pt.s);
        PXL.drawPortal(ctx, pt.x, pt.y, pt.s, pt.t);
      }
      if (this.state === 'hidden') return;
      const walking = this.walk > 0;
      const T = performance.now() / 1000;
      const ph = walking ? Math.floor(T * 9 * 8 / (Math.PI * 2)) * (Math.PI * 2) / 8 : 0;
      const lt = walking ? Math.sin(ph) * 0.5 : 0.05;
      const talkF = this.talking ? Math.floor(T * 8) % 2 : 0;
      const breathe = Math.floor(T * 1.6) % 2;
      const gesture = this.talking ? (Math.floor(T * 2.5) % 3 === 0 ? -1.4 : -0.6) : 0.2;
      const pose = {
        lt: Math.round(lt * 20) / 20, rt: Math.round(-lt * 20) / 20, lk: walking ? Math.round(Math.max(0, -Math.sin(ph)) * 0.6 * 20) / 20 : 0, rk: walking ? Math.round(Math.max(0, Math.sin(ph)) * 0.6 * 20) / 20 : 0,
        la: walking ? Math.round(-lt * 0.8 * 20) / 20 : 0.15, lf: 0.3, ra: walking ? Math.round(lt * 0.8 * 20) / 20 : gesture, rf: this.talking ? -0.9 : 0.4,
        lean: 0, expr: this.expr, talkF, scarfF: Math.floor(T * 4) % 2, eye: 'o'
      };
      const img = PXL.humanSprite(SPEC, pose, this.rot);
      const [ax, ay] = PXL.HUMAN_ANCHOR;
      const px = PXL.PX * this.scale;
      ctx.globalAlpha = this.alpha;
      if (this.scale > 0.98) R.shadow(this.x, this.y, 20, 0.35);
      PXL.draw(ctx, img, this.x, this.y - (walking || this.talking ? 0 : breathe) * PXL.PX, ax, ay, this.dir, px);
      ctx.globalAlpha = 1;
      if (this.state === 'shown' && !this.s.minjunTalking) R.text('김민준', this.x, this.y - 128, 14, 'rgba(214,200,255,0.9)', 'center', 700);
    }
    portalAt(x, y) { const pt = { x, y, s: 0, t: Math.random() * 3, closing: false }; this.portals.push(pt); return pt; }
  }

  /* 지형을 확인해 포탈 자리 찾기: 주인공과 같은 높이의 바닥, 벽·장애물 없음, 화면 안 */
  function findSpot(scene, prefer) {
    const p = scene.player, phys = scene.phys, v = MG.R.view;
    const f = p.facing || 1;
    const cands = (prefer || [170, -170, 230, -230, 130, -130, 290, -290]).map((d) => p.cx + d * f);
    for (const x of cands) {
      if (x < v.x0 + 70 || x > v.x1 - 70) continue;
      if (scene.L && (x < -300 || x > scene.L.endX - 40)) continue;
      const g = phys.groundBelow(x, p.y + 10, 260);
      if (!g || Math.abs(g.y - p.bottom) > 70) continue;
      if (phys.groundBelow(x - 30, g.y - 2, 10) !== g || phys.groundBelow(x + 30, g.y - 2, 10) !== g) continue; // 발판 끝 피하기
      if (phys.solidAt(x, g.y - 40) || phys.solidAt(x, g.y - 110) || phys.solidAt(x - 30, g.y - 70) || phys.solidAt(x + 30, g.y - 70)) continue;
      return { x, y: g.y };
    }
    return { x: p.cx + f * 150, y: p.bottom };
  }

  const Minjun = {
    SPEC,
    attach(scene) { scene.minjun = new Actor(scene); return scene.minjun; },
    update(scene, dt) { if (scene.minjun) scene.minjun.update(dt); },
    draw(scene, R) { if (scene.minjun) scene.minjun.draw(R); },

    /* 포탈로 등장 (약 1.3초). opts.comic = 'wrongDir'이면 먼저 엉뚱한 곳에 열렸다 닫힘 */
    async enter(scene, opts) {
      opts = opts || {};
      const A = scene.minjun || this.attach(scene);
      const p = scene.player;
      if (opts.comic === 'wrongDir') {
        const wx = p.cx - p.facing * 220, wy = p.y - 170;
        const wpt = A.portalAt(wx, wy);
        MG.Audio.sfx('door');
        await A.run(0.35, (f) => { wpt.s = U.easeOutBack(f) * 0.7; });
        A.state = 'hidden';
        MG.Dialog.bark(D().comic.wrongDir[0].text, 'minjun', 1.8);
        await A.run(0.5, () => {});
        wpt.closing = true;
        await A.run(0.3, (f) => { wpt.s = 0.7 * (1 - f); });
      }
      const spot = findSpot(scene, opts.prefer);
      const toward = U.sign(p.cx - spot.x) || -1;
      const pt = A.portalAt(spot.x, spot.y - 64);
      A.dir = toward; A.x = spot.x; A.y = spot.y; A.scale = 0.2; A.alpha = 0; A.rot = 0; A.expr = opts.serious ? 'serious' : 'smug';
      MG.Audio.sfx('door');
      await A.run(opts.serious ? 0.8 : 0.45, (f) => { pt.s = U.easeOutBack(f); });
      A.state = 'out'; A.walk = 1;
      const x0 = spot.x, x1 = spot.x + toward * 48;
      await A.run(0.55, (f) => { A.x = U.lerp(x0, x1, f); A.scale = U.lerp(0.55, 1, Math.min(1, f * 1.6)); A.alpha = Math.min(1, f * 2.5); });
      A.walk = 0; A.scale = 1; A.alpha = 1;
      pt.closing = true;
      await A.run(0.35, (f) => { pt.s = 1 - U.easeInOutCubic(f); });
      A.state = 'shown';
      MG.State.d.minjun.met = (MG.State.d.minjun.met || 0) + 1;
    },
    /* 포탈로 퇴장. opts.trip: 발을 헛디딤 / opts.forget: 들어갔다가 할 말이 생각나 다시 나옴 */
    async leave(scene, opts) {
      opts = opts || {};
      const A = scene.minjun; if (!A || A.state === 'hidden') return;
      const back = -A.dir;
      const pt = A.portalAt(A.x + back * 50, A.y - 64);
      MG.Audio.sfx('door');
      await A.run(0.4, (f) => { pt.s = U.easeOutBack(f); });
      A.dir = back;
      if (opts.trip) {
        A.state = 'out'; A.walk = 1; const x0 = A.x;
        await A.run(0.25, (f) => { A.x = x0 + back * 20 * f; });
        A.walk = 0; A.expr = 'sweat';
        await A.run(0.3, (f) => { A.rot = -back * Math.round(f * 2) / 2 * (Math.PI / 4); });
        MG.Dialog.bark(D().comic.trip[0].text, 'minjun', 1.6);
        await A.run(0.5, () => {});
        A.rot = 0;
      }
      A.state = 'out'; A.walk = 1;
      const x0 = A.x, x1 = pt.x;
      await A.run(0.45, (f) => { A.x = U.lerp(x0, x1, f); A.scale = U.lerp(1, 0.3, f); A.alpha = 1 - f * 0.9; });
      A.state = 'hidden'; A.walk = 0;
      pt.closing = true;
      await A.run(0.35, (f) => { pt.s = 1 - U.easeInOutCubic(f); });
      if (opts.forget) {
        await A.run(0.3, () => {});
        const pt2 = A.portalAt(pt.x, pt.y);
        await A.run(0.3, (f) => { pt2.s = U.easeOutBack(f); });
        A.state = 'shown'; A.x = pt.x - back * 40; A.dir = -back; A.scale = 1; A.alpha = 1; A.expr = 'sweat';
        pt2.closing = true;
        await A.run(0.25, (f) => { pt2.s = 1 - f; });
        await this.say(scene, D().comic.forget);
        await this.leave(scene, {});
      }
    },
    /* 대화: 표정(mj)·먹물 표정(ink)을 줄마다 바꾼다 */
    async say(scene, lines) {
      const A = scene.minjun;
      const ink = scene.ink;
      scene.minjunTalking = true;
      const L = lines.filter(Boolean).map((l) => Object.assign({ who: 'minjun' }, l, { name: l.who === 'me' ? undefined : (l.who === 'ink' ? '먹물' : '김민준') }));
      await MG.Dialog.talk(L, {
        onLine: (l) => {
          if (A) { A.talking = l.who === 'minjun' || !l.who; if (l.mj) A.expr = l.mj; else if (l.who === 'me') A.expr = A.expr === 'talk' ? 'normal' : A.expr; if (A.state === 'shown' && scene.player) A.dir = U.sign(scene.player.cx - A.x) || A.dir; }
          if (ink && l.ink) ink.mood = l.ink;
        }
      });
      if (A) A.talking = false;
      scene.minjunTalking = false;
      if (ink) ink.mood = 'normal';
    },

    /* 코믹 연출: 낮은 확률, 최근에 쓴 것은 피함, 진지한 스테이지·중요 장면에서는 없음 */
    pickComic(serious) {
      if (serious) return null;
      const mj = MG.State.d.minjun;
      if (Math.random() > 0.24) return null;
      const all = ['forget', 'wrongDir', 'inkPoint', 'trip'];
      const used = mj.comicUsed || [];
      const fresh = all.filter((c) => !used.slice(-2).includes(c));
      const c = pick(fresh.length ? fresh : all);
      mj.comicUsed = used.concat(c).slice(-6);
      return c;
    },

    /* ── 스테이지 클리어 보충 설명 (모든 클리어마다) ── */
    async stageClear(scene, extra) {
      const st = scene.stage, T = D().stageTalk[st.id];
      if (!T) return;
      const d = MG.State.d, mj = d.minjun;
      const first = !mj.talks[st.id];
      const comic = this.pickComic(T.serious);
      await this.enter(scene, { comic, serious: T.serious });
      const lines = [];
      if (first) lines.push(extra && extra.afterCh1 ? { text: '또 나야. 아까는 먹물 자랑만 하고 수업을 안 했더라고.', mj: 'sweat' } : T.joke, ...T.core, ...T.confuse);
      else lines.push(pick(D().replay));
      if (extra && extra.ability && D().abilityLines[extra.ability]) lines.push(D().abilityLines[extra.ability]);
      await this.say(scene, lines);
      // 자세히 듣기 / 넘어가기 (억지로 끝까지 듣게 하지 않음)
      const C = D().choice;
      const more = await MG.Dialog.choice(first ? C.prompt : '이 스테이지 설명 다시 들을래?', [first ? C.more : C.replayMore, C.skip]);
      if (more === 0) {
        await this.say(scene, first ? T.detail : [...T.core, ...T.confuse, ...T.detail]);
        if (comic === 'inkPoint') {
          scene.minjunInkTarget = { x: scene.minjun.x - scene.minjun.dir * 60, y: scene.minjun.y - 120 };
          if (scene.ink) scene.ink.mood = 'annoyed';
          await wait(700);
          await this.say(scene, D().comic.inkPoint);
          scene.minjunInkTarget = null;
        }
      }
      // 정체 단서 (스테이지당 한 번)
      const clue = D().clues.find((c) => c.after === st.id);
      if (first && clue && !mj.clues.includes(clue.id)) { await this.say(scene, [clue]); mj.clues.push(clue.id); }
      await this.say(scene, [T.outro]);
      mj.talks[st.id] = (mj.talks[st.id] || 0) + 1;
      MG.State.markDirty();
      await this.leave(scene, { trip: comic === 'trip', forget: comic === 'forget' });
    },

    /* ── 오답 누적 도움: 정답은 말하지 않고, 고른 보기가 왜 틀렸는지 + 개념 힌트 → 다시 스스로 풀기 ── */
    async help(scene, q, r) {
      const H = D().help;
      await this.enter(scene, {});
      const lines = [H.open[(MG.State.d.minjun.helps || 0) % H.open.length]];
      if ((q.type === 'mc' || q.type === 'liar') && r && r.chosen != null && q.why && q.why[r.chosen] && r.chosen !== q.answer) {
        const raw = q.type === 'liar' ? (q.speakers[r.chosen].name + '의 말') : q.options[r.chosen];
        const opt = raw.length > 22 ? raw.slice(0, 21) + '…' : raw;
        lines.push({ text: H.chosenPrefix.replace('{opt}', opt) + q.why[r.chosen], mj: 'talk' });
      }
      lines.push(this.tipFor(scene.stage.id, q) || { text: H.generic[q.type] || H.generic.mc, mj: 'talk' });
      lines.push(pick(H.retry));
      await this.say(scene, lines);
      MG.State.d.minjun.helps = (MG.State.d.minjun.helps || 0) + 1;
      MG.State.markDirty();
      await this.leave(scene, {});
    },
    /* 문항 내용과 가장 많이 겹치는 그 스테이지의 설명 문장을 힌트로 */
    tipFor(stageId, q) {
      const T = D().stageTalk[stageId]; if (!T) return null;
      const pool = [...T.core, ...T.confuse, ...T.detail];
      const src = (q.stem + ' ' + (q.concepts || []).join(' ') + ' ' + (q.story || '')).replace(/[^가-힣0-9a-zA-Z ]/g, ' ');
      const words = src.split(/\s+/).filter((w) => w.length >= 2 && !['다음', '것은', '옳은', '대한', '설명', '으로', '가장', '적절한', '관련', '자료', '고른', '있는', '대로'].includes(w));
      let best = null, bs = 0;
      for (const l of pool) { let sc = 0; for (const w of words) if (l.text.indexOf(w.slice(0, Math.min(4, w.length))) >= 0) sc++; if (sc > bs) { bs = sc; best = l; } }
      return bs >= 1 ? { text: '핵심만 다시 짚자. ' + best.text, mj: 'talk' } : null;
    },

    /* ── 탐험 중 깜짝 등장 (가끔, 보스전·전투 중 아님) ── */
    async explore(scene) {
      const X = D().explore, d = MG.State.d, run = scene.run;
      const comic = this.pickComic(D().stageTalk[scene.stage.id] && D().stageTalk[scene.stage.id].serious);
      await this.enter(scene, { comic: comic === 'wrongDir' ? 'wrongDir' : null });
      const lines = [pick(X.opening)];
      // 주인공의 이전 행동 언급
      const mem = d.hell.visits > 0 && !d.minjun.saidHell ? (d.minjun.saidHell = true, X.memory.hell)
        : run.stats.maxCombo >= 8 ? X.memory.combo
        : run.stats.wrong >= 2 ? X.memory.wrongMany
        : run.stats.answered >= 2 && run.stats.wrong === 0 ? X.memory.clean
        : (d.minjun.met || 0) >= 3 ? X.memory.first : null;
      if (mem) lines.push(mem);
      const roll = Math.random();
      if (roll < 0.5 && X.trivia[scene.stage.id]) lines.push(X.trivia[scene.stage.id]);
      else lines.push(...pick(X.ink));
      lines.push(pick(X.bye));
      await this.say(scene, lines);
      d.minjun.explores = (d.minjun.explores || 0) + 1; d.minjun.lastExploreStage = scene.stage.id;
      MG.State.markDirty();
      await this.leave(scene, { trip: comic === 'trip', forget: comic === 'forget' });
    }
  };

  MG.Minjun = Minjun;
})();

</script>
<script>/* js/systems/Tutorial.js */
/* Tutorial — 초보자 친화형 튜토리얼 감독 (STEP 1~7)
   원칙: 설명보다 체험 · 한 번에 하나 · 성공해야 다음 · 실패해도 HP 감소/게임오버 없음 · 시간 제한 없음 · 스포일러 없음
   구간·장애물은 LevelBuilder(tut* 구간)가 만들고, 이 파일은 진행·안내·피드백만 담당한다. */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const ORDER = ['move', 'jump', 'attack', 'dash', 'dodge', 'battle'];
  const IDLE_SHOW = 10;           // 입력이 없으면 10초 뒤 조작 애니메이션
  const FINGER_FIRST = 3.2;       // 단계 시작 시 손가락 시연 시간

  class Director {
    constructor(scene, opts) {
      this.s = scene; this.D = MG.Data.tutorial; this.Z = scene.L.tut || {};
      this.replay = !!(opts && opts.replay);
      this.step = null; this.idx = -1; this.phase = ''; this.fails = 0; this.hintLv = 0;
      this.idle = 0; this.stepT = 0; this.finished = false; this.started = false;
      this.count = 0; this.ball = null; this.turretCd = 1.2; this.charge = 0;
      this.dash = { armed: true, running: false, dashed: false, resetT: 0 };
      this.jump = { pushT: 0 };
      this.okPulse = 0; this.curtains = [];
      for (const k in this.Z) if (this.Z[k].barrier) this.curtains.push({ z: this.Z[k], fade: 1 });
      this.stats = { t0: 0, fails: {}, hints: {} };
      this._buildDom();
    }

    /* ── DOM: 안내 상자(화면 아래 가운데, 게임 화면을 가리지 않는 작은 크기)·손가락·완료 배너 ── */
    _buildDom() {
      const root = document.getElementById('ui-root');
      this.tip = U.el('div', { class: 'tut-tip glass', 'aria-live': 'polite' },
        U.el('div', { class: 'tt-row' }, U.el('span', { class: 'tt-step' }), U.el('span', { class: 'tt-main' }), U.el('span', { class: 'tt-ok' }, '✓')),
        U.el('div', { class: 'tt-keys' }), U.el('div', { class: 'tt-hint' }));
      this.finger = U.el('div', { class: 'tut-finger' });
      // 도트 손가락 (SVG 사각형으로 픽셀 스타일 유지)
      const px = [[3,0,2,6],[2,5,1,3],[5,5,1,3],[1,7,6,4],[0,8,1,2],[7,8,1,2],[2,11,4,1]];
      this.finger.innerHTML = '<svg viewBox="0 0 8 12" width="40" height="60" shape-rendering="crispEdges">'
        + px.map(([x, y, w, h]) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#fff4dc"/>').join('')
        + '<rect x="3" y="0" width="2" height="1" fill="#ffd9a8"/><rect x="1" y="10" width="6" height="1" fill="#e6c79a"/>'
        + '<path d="M3 0h2v1h1v5h1v2h1v3h-1v1h-6v-1h-1v-3h1v-2h1v-5h1z" fill="none" stroke="#2a1d14" stroke-width="0.35"/></svg>';
      this.banner = U.el('div', { class: 'tut-banner' }, U.el('b', {}, '튜토리얼 완료'), U.el('span', {}, '이제 첫 번째 기록 속으로'));
      root.append(this.tip, this.finger, this.banner);
      document.body.classList.add('tut-on');
    }
    destroy() {
      this._glow(null); this._fingerOff();
      [this.tip, this.finger, this.banner].forEach((e) => e && e.remove());
      document.body.classList.remove('tut-on');
    }

    get touch() { return MG.Input.touchEnabled && MG.Input.touchVisible; }
    _cfg(k) { return this.D.steps[k || this.step]; }
    /* 터치/키보드에 맞는 문장: 키보드면 sayK·hintsK 우선, 없으면 '버튼'→'키' */
    _txt(c, key, i) {
      const K = !this.touch;
      let v = K && c[key + 'K'] ? c[key + 'K'] : c[key];
      if (i != null) v = v && v[Math.min(i, v.length - 1)];
      if (typeof v !== 'string') return v;
      return K ? v.replace(/ 버튼/g, ' 키') : v;
    }

    /* ── 시작: 김민준이 포탈로 등장해 첫 마디 ── */
    async begin() {
      if (this.started) return; this.started = true;
      const sc = this.s;
      this._setTip('', '', '');
      await this._wait(0.7);
      if (this._dead()) return;
      try { await MG.Minjun.enter(sc, { prefer: [200, 250, 160, 300] }); } catch (e) { console.error(e); }
      if (this._dead()) return;
      if (sc.minjun) sc.minjun.expr = 'smug';
      this._say(this.D.intro, 3.4);
      await this._wait(2.6);
      if (this._dead()) return;
      this._go(0);
    }
    _dead() { return MG.Core.scene !== this.s || this.s.leaving; }
    _wait(sec) { const A = this.s.minjun; return A ? A.run(sec, () => {}) : new Promise((r) => setTimeout(r, sec * 1000)); }
    _say(text, dur) { MG.Dialog.bark(text, 'minjun', dur || Math.max(3, Math.min(6, text.length * 0.11))); const A = this.s.minjun; if (A) { A.talking = true; clearTimeout(this._tk); this._tk = setTimeout(() => { A.talking = false; }, 1400); } }

    _go(i) {
      this.idx = i; this.step = ORDER[i]; this.phase = 'a';
      this.fails = 0; this.hintLv = 0; this.idle = 0; this.stepT = 0; this.count = 0;
      const c = this._cfg();
      this._say(this._txt(c, 'say'));
      this._glow(c.btn);
      this._updateTip();
      this._fingerOn(FINGER_FIRST);
      // 카메라가 이번 목표 쪽을 살짝 보여 줌 (장면 전환)
      const z = this.Z[this.step];
      const focus = { move: null, jump: z && z.block ? z.block.x : null, attack: z && z.dummy ? z.dummy.x : null, dash: z && z.goal, dodge: z && z.turret ? z.turret.x : null, battle: z && z.spawnX }[this.step];
      if (focus != null) this.s.camPeek = { x: focus, t: 1.3 };
      if (this.step === 'dash') { this.dash = { armed: true, running: false, dashed: false, resetT: 0 }; }
      if (this.step === 'dodge') { this.turretCd = 1.6; this.charge = 0; this.ball = null; }
      if (this.step === 'battle') this._spawnFoe();
    }

    _updateTip() {
      const c = this._cfg(); if (!c) return;
      const n = this.idx + 1;
      const main = {
        move: this.phase === 'a' ? '오른쪽으로 걷기 →' : '← 왼쪽으로 걷기',
        jump: '점프로 장애물 넘기',
        attack: '허수아비 치기 ' + Math.min(this.count, c.need || 3) + ' / ' + (c.need || 3),
        dash: '출발선 → 대시 → 깃발',
        dodge: '공이 오면 회피',
        battle: '먹방울 괴물 물리치기'
      }[this.step];
      const keys = this.touch ? ({ stick: '왼쪽 아래 조이스틱', jump: '「점프」 버튼', attack: '「붓」 버튼', dash: '「대시」 버튼', dodge: '「회피」 버튼' }[c.btn] || '') : '키보드: ' + c.keys;
      this._setTip(n + ' / ' + ORDER.length, main, keys);
    }
    _setTip(step, main, keys) {
      if (!this.tip) return;
      this.tip.querySelector('.tt-step').textContent = step;
      this.tip.querySelector('.tt-main').textContent = main;
      this.tip.querySelector('.tt-keys').textContent = keys;
      this.tip.classList.toggle('show', !!main);
    }
    _hintText(t) { const h = this.tip && this.tip.querySelector('.tt-hint'); if (h) { h.textContent = t || ''; this.tip.classList.toggle('has-hint', !!t); } }

    /* ── 버튼 은은한 빛 ── */
    _glow(btn) {
      const els = MG.Input.els || {};
      for (const k in els) els[k].classList.remove('tut-glow');
      if (btn && els[btn]) els[btn].classList.add('tut-glow');
    }
    /* ── 손가락 시연 (터치) / 키캡 깜빡임 (키보드) ── */
    _fingerOn(dur) {
      const c = this._cfg(); if (!c) return;
      this._fingerT = dur || 3;
      if (this.tip) this.tip.classList.add('pulse');
      if (!this.touch) return;
      const el = MG.Input.els[c.btn]; if (!el) return;
      const r = el.getBoundingClientRect(), root = document.getElementById('ui-root').getBoundingClientRect();
      if (!r.width) return;
      const f = this.finger;
      f.style.left = (r.left - root.left + r.width * 0.5) + 'px';
      f.style.top = (r.top - root.top + r.height * 0.55) + 'px';
      f.className = 'tut-finger show ' + (c.btn === 'stick' ? (this.step === 'move' && this.phase === 'b' ? 'swipe-l' : 'swipe-r') : 'press');
    }
    _fingerOff() { this._fingerT = 0; if (this.finger) this.finger.className = 'tut-finger'; if (this.tip) this.tip.classList.remove('pulse'); }

    /* ── 실패 → 점점 더 구체적인 힌트 (손가락 시연 함께) ── */
    _fail(kind, msg) {
      this.fails++;
      this.stats.fails[this.step] = (this.stats.fails[this.step] || 0) + 1;
      const c = this._cfg(), hints = (!this.touch && c.hintsK) || c.hints || [];
      if (msg) this._say(this.touch ? msg : msg.replace(/ 버튼/g, ' 키'), 3.2);
      // 처음 한 번은 짧은 말만, 두 번째부터 힌트 단계 상승
      const lv = Math.min(hints.length, Math.max(0, this.fails - (msg ? 1 : 0)));
      if (lv > this.hintLv) {
        this.hintLv = lv;
        this.stats.hints[this.step] = lv;
        const h = this._txt(c, 'hints', lv - 1);
        if (!msg) this._say(h, 4);
        this._hintText(h);
        this._fingerOn(3);
      }
    }
    _nice(big) {
      const p = this.s.player, list = this.D.nice;
      const t = list[Math.floor(Math.random() * list.length)];
      MG.R.particles.spawn({ x: p.cx, y: p.y - 30, vy: -70, life: 0.9, size: big ? 24 : 18, size2: big ? 20 : 16, color: '#fff4c2', shape: 'text', text: t });
      MG.R.particles.burst(p.cx, p.cy - 10, big ? 26 : 12, { color: ['#ffd76a', '#ffffff', '#c9b6ff'], speedMin: 80, speedMax: big ? 420 : 260, lifeMax: 0.6, shape: 'square', sizeMin: 3, sizeMax: 6 });
      MG.Audio.sfx(big ? 'correct' : 'pickup');
      if (this.tip) { this.tip.classList.remove('ok'); void this.tip.offsetWidth; this.tip.classList.add('ok'); }
    }

    /* ── 단계 성공: 빛의 장막이 열리고 다음 단계 ── */
    _pass() {
      const z = this.Z[this.step];
      this._nice(true);
      this._hintText('');
      this._fingerOff();
      if (z && z.barrier) { z.barrier.disabled = true; z.open = true; MG.Audio.sfx('door'); }
      // 회피 연습이 끝나면 발사대는 먹물로 흩어져 길을 비켜 준다
      if (this.step === 'dodge' && z && z.turret && !z.turret.dead) { z.turret.charging = false; this.s.combat.killEnemy(z.turret); if (this.ball) { this.ball.dead = true; this.ball = null; } }
      const next = this.idx + 1;
      this.phase = 'done';
      if (next >= ORDER.length) { this._complete(); return; }
      this._glow(null);
      this._setTip('', '', '');
      setTimeout(() => { if (!this._dead() && !this.finished) this._go(next); }, 900);
    }

    /* ── STEP 7: 완료 ── */
    async _complete() {
      if (this.finished) return; this.finished = true;
      const sc = this.s;
      this._glow(null); this._setTip('', '', '');
      MG.State.d.tutorialDone = true; MG.State.markDirty(true);
      this.stats.time = sc.t;
      await this._wait(0.6);
      if (this._dead()) return;
      if (sc.minjun) sc.minjun.expr = 'smug';
      this._say(this.D.steps.done.say, 3.6);
      await this._wait(1.4);
      if (this._dead()) return;
      this.banner.classList.add('show');
      MG.Audio.sfx('victory');
      MG.R.particles.burst(sc.player.cx, sc.player.cy - 40, 40, { color: ['#ffd76a', '#fff', '#c9b6ff'], speedMin: 120, speedMax: 520, lifeMax: 1.1, shape: 'square', sizeMin: 3, sizeMax: 7, grav: 300 });
      // 카메라가 출구 쪽으로 천천히 이동
      if (sc.L.exit) sc.camPeek = { x: sc.L.exit.x, t: 2.4 };
      await this._wait(2.2);
      if (this._dead()) return;
      try { await MG.Minjun.leave(sc, {}); } catch (e) { console.error(e); }
      this.banner.classList.remove('show');
      if (this._dead()) return;
      sc._clear();
    }

    _spawnFoe() {
      const z = this.Z.battle, GY = this.s.L.GY;
      MG.R.particles.burst(z.spawnX + 27, GY - 30, 18, { color: ['#111', '#333', '#c9b6ff'], speedMin: 60, speedMax: 240, lifeMax: 0.6 });
      this.foe = this.s.combat.spawnEnemy('blob', z.spawnX, GY - 46, { hp: 2, maxHp: 2, speed: 70, minX: z.spawnX - 220, maxX: z.spawnX + 160, tutFoe: true, dir: -1 });
    }

    /* ── 이벤트 (Combat·EarthWorld에서 전달) ── */
    onDummyHit(e) {
      if (this.step !== 'attack' || this.phase !== 'a' || e !== (this.Z.attack && this.Z.attack.dummy)) return;
      this.count++;
      const need = this._cfg().need || 3;
      MG.R.particles.spawn({ x: e.x + e.w / 2, y: e.y - 16, vy: -80, life: 0.7, size: 22, size2: 18, color: '#ffe9a8', shape: 'text', text: this.count + '!' });
      this._updateTip();
      if (this.count >= need) this._pass(); else this._nice(false);
    }
    onPlayerDodged(tag) {
      if (this.step !== 'dodge' || this.phase !== 'a' || tag !== 'proj:tut') return;
      if (this.ball) { this.ball.dodged = true; }
      this.phase = 'ok';
      this._pass();
    }
    onPlayerHit(tag) {
      if (this.finished) return;
      if (this.step === 'dodge' && tag === 'proj:tut' && this.phase === 'a') { this._fail('hit', this.fails === 0 ? this.D.hitOk : null); if (this.ball) this.ball.hit = true; }
      else if (this.step === 'battle' && this.phase === 'a') { this._battleHits = (this._battleHits || 0) + 1; if (this._battleHits % 2 === 1) this._fail('hit', this._battleHits === 1 ? this.D.hitOk : null); }
    }
    onEnemyKilled(e) {
      if (e && e.tutFoe && this.step === 'battle' && this.phase === 'a') this._pass();
    }

    /* ── 매 프레임 ── */
    update(dt) {
      const sc = this.s, p = sc.player, In = MG.Input;
      this._follow(dt);
      if (!this.started) return;
      for (const c of this.curtains) if (c.z.open) c.fade = Math.max(0, c.fade - dt * 1.6);
      if (this._fingerT > 0) { this._fingerT -= dt; if (this._fingerT <= 0) this._fingerOff(); }
      if (!this.step || this.phase === 'done' || this.finished) return;
      this.stepT += dt;
      // 무입력 감지 → 10초마다 조작 시연 (시간 제한은 없음, 안내만)
      const active = In.axis !== 0 || ['jump', 'attack', 'dash', 'dodge'].some((k) => In.held[k] || In.pressed(k));
      if (active) this.idle = 0; else this.idle += dt;
      if (this.idle >= IDLE_SHOW) {
        this.idle = 0;
        this._fingerOn(3.5);
        const c = this._cfg(), h0 = this._txt(c, 'hints', 0);
        if (!this.hintLv && h0) { this.hintLv = 1; this._hintText(h0); this._say(h0, 4); }
      }
      const z = this.Z[this.step];
      switch (this.step) {
        case 'move': {
          const start = sc.L.startX;
          if (this.phase === 'a' && p.cx > start + 260) { this.phase = 'b'; this._nice(false); this._say(this._txt(this._cfg(), 'say2'), 3); this._updateTip(); this._fingerOn(2.6); this.idle = 0; }
          else if (this.phase === 'b' && p.cx < start - 60) this._pass();
          break;
        }
        case 'jump': {
          const b = z.block;
          if (p.cx > b.x + b.w + 24 && p.onGround) { this._pass(); break; }
          // 장애물에 막혀 밀고만 있으면 실패로 보고 힌트
          const pushing = p.onGround && Math.abs(p.x + p.w - b.x) < 6 && In.axis > 0.3;
          if (pushing) { this.jump.pushT += dt; if (this.jump.pushT > 0.9) { this.jump.pushT = -1.5; this._fail('push'); } }
          else if (this.jump.pushT > 0) this.jump.pushT = 0;
          else if (this.jump.pushT < 0) this.jump.pushT = Math.min(0, this.jump.pushT + dt);
          break;
        }
        case 'attack': {
          // 허공에 휘두른 횟수를 세어 두 번마다 더 자세한 힌트
          if (In.pressed('attack')) {
            const d = z.dummy, dx = (d.x + d.w / 2) - p.cx;
            const near = Math.abs(dx) < 130 && Math.sign(dx) === p.facing;
            if (!near) { this._miss = (this._miss || 0) + 1; if (this._miss % 2 === 0) this._fail('miss'); }
          }
          break;
        }
        case 'dash': {
          const D = this.dash;
          if (D.resetT > 0) { D.resetT -= dt; if (D.resetT <= 0) { p.x = z.start - 120 - p.w / 2; p.vx = 0; MG.R.flash('#c9b6ff', 0.12); D.armed = true; D.running = false; } break; }
          if (p.cx < z.start - 8) { D.armed = true; D.running = false; D.dashed = false; }
          if (D.armed && !D.running && p.cx >= z.start) { D.running = true; D.dashed = p.dashT > 0; }
          if (D.running) {
            if (p.dashT > 0) D.dashed = true;
            if (p.cx >= z.goal) {
              if (D.dashed) { this._pass(); }
              else { D.running = false; D.armed = false; D.resetT = 0.7; this._fail('walk', this.fails === 0 ? this._cfg().retry : null); }
            }
          }
          break;
        }
        case 'dodge': {
          const t = z.turret;
          if (p.cx < z.x0 + 60) break;           // 구간에 들어오기 전엔 쏘지 않음
          if (this.ball) {
            const q = this.ball;
            if (q.dead || q.x < p.cx - 90) {
              if (!q.dodged && !q.hit && q.x < p.cx - 90) this._fail('jumped', this.fails === 0 ? this._cfg().jumped : null);
              q.dead = true; this.ball = null; this.turretCd = 1.4;
            }
          } else if (this.charge > 0) {
            this.charge -= dt; t.charging = true;
            if (this.charge <= 0) {
              t.charging = false;
              const y = sc.L.GY - 44;
              this.ball = sc.combat.shoot(t.x - 6, y, -250, 0, { dmg: 10, r: 14, life: 6, kind: 'tut', color: '#3a2a6a', glow: true });
              this.ball.ty = y;
              MG.Audio.sfx('dash');
            }
          } else {
            this.turretCd -= dt;
            if (this.turretCd <= 0) { this.charge = 1.2; MG.Audio.sfx('warn'); }
          }
          break;
        }
        case 'battle': {
          if (this.foe && this.foe.dead && this.phase === 'a') { this.foe = null; }
          if (!this.foe && this.phase === 'a') this._spawnFoe();
          if (In.pressed('attack') && this.foe) {
            const dx = (this.foe.x + this.foe.w / 2) - p.cx;
            if (!(Math.abs(dx) < 140 && Math.sign(dx) === p.facing)) { this._miss = (this._miss || 0) + 1; if (this._miss % 3 === 0) this._fail('miss'); }
          }
          break;
        }
      }
    }

    /* 김민준: 주인공 곁을 따라 걸어다니되 앞길·목표물을 막지 않는 자리에 선다 */
    _follow(dt) {
      const A = this.s.minjun, p = this.s.player;
      if (!A || A.state !== 'shown' || A.tasks.length) return;
      const behind = this.step === 'dodge' || this.step === 'battle' || this.step === 'attack';
      let tx = p.cx + (behind ? -150 : 160);
      const z = this.Z[this.step];
      if (z && z.barrier && !z.open) tx = Math.min(tx, z.bx - 60);
      if (this.step === 'jump' && z && z.block && !z.open) tx = Math.min(tx, z.block.x - 40);
      tx = Math.max(tx, -320);
      const d = tx - A.x;
      if (Math.abs(d) > 46) { A.walk = 1; A.dir = U.sign(d); A.x += U.sign(d) * Math.min(Math.abs(d), (Math.abs(d) > 300 ? 520 : 300) * dt); }
      else { A.walk = 0; if (!A.talking) A.dir = U.sign(p.cx - A.x) || A.dir; }
      A.y = this.s.L.GY;
    }

    /* ── 월드 안 표시: 빛의 장막, 목표 표시, 출발선·깃발, 공격 방향 예고 ── */
    draw(R) {
      const ctx = R.ctx, PXL = MG.Pixel, P = PXL.PX, GY = this.s.L.GY, T = R.time;
      for (const c of this.curtains) {
        if (c.fade <= 0) continue;
        const x = c.z.bx + 15;
        ctx.globalAlpha = 0.55 * c.fade;
        R.light(x, GY - 120, 140, 'rgba(160,130,255,0.9)', 0.35 * c.fade);
        for (let y = GY - 420; y < GY; y += P * 2) {
          const on = (Math.floor(y / (P * 2)) + Math.floor(T * 10)) % 6;
          ctx.fillStyle = on < 2 ? '#e9ddff' : on < 4 ? '#a98bff' : '#6a4bd6';
          ctx.fillRect(PXL.snap(x + Math.sin(y * 0.05 + T * 3) * 4) - P, PXL.snap(y), P * 2, P * 2);
        }
        ctx.globalAlpha = 1;
      }
      if (!this.step || this.finished) return;
      const z = this.Z[this.step], p = this.s.player;
      // 도트 화살표: dir=±1 가로, dir=0 아래쪽
      const arrow = (x, y, dir, col) => {
        const b = Math.round(Math.sin(T * 5) * 2) * P;
        ctx.fillStyle = col || '#ffd76a';
        for (let k = 0; k < 5; k++) {
          const hh = (2 * (4 - k) + 1) * P;
          if (dir) ctx.fillRect(PXL.snap(x + dir * (b + k * P)), PXL.snap(y) - hh / 2, P, hh);
          else ctx.fillRect(PXL.snap(x) - hh / 2, PXL.snap(y + b + k * P), hh, P);
        }
      };
      if (this.step === 'move' && this.phase !== 'done') {
        const tx = this.phase === 'a' ? this.s.L.startX + 260 : this.s.L.startX - 60;
        R.light(tx, GY - 30, 70, 'rgba(255,215,106,0.9)', 0.35 + 0.1 * Math.sin(T * 4));
        ctx.fillStyle = 'rgba(255,215,106,0.55)'; ctx.fillRect(PXL.snap(tx) - P, GY - 90, P * 2, 90);
        arrow(tx + (this.phase === 'a' ? -40 : 40), GY - 120, this.phase === 'a' ? 1 : -1);
      } else if (this.step === 'dash' && z) {
        // 출발선 (흰 점선) · 목표 깃발
        for (let y = GY - 100; y < GY; y += P * 4) { ctx.fillStyle = '#ffffff'; ctx.fillRect(PXL.snap(z.start) - P, PXL.snap(y), P * 2, P * 2); }
        R.text('출발', z.start, GY - 112, 13, 'rgba(255,255,255,0.85)', 'center', 700);
        const fl = PXL.flagSprite(true, Math.floor(T * 4) % 2);
        PXL.draw(ctx, fl, z.goal, GY, 2, fl.height, 1);
        R.light(z.goal, GY - 60, 90, 'rgba(255,215,106,0.9)', 0.35);
        if (this.dash.running) {
          ctx.fillStyle = this.dash.dashed ? 'rgba(201,182,255,0.35)' : 'rgba(255,255,255,0.12)';
          ctx.fillRect(z.start, GY - 6, Math.max(0, Math.min(p.cx, z.goal) - z.start), 6);
        }
      } else if (this.step === 'dodge' && z) {
        // 공이 날아올 길을 빨간 점선으로 예고 (충전 중 깜빡)
        const t = z.turret;
        if (this.charge > 0) {
          const y = GY - 44, blink = Math.floor(T * 10) % 2;
          ctx.fillStyle = blink ? 'rgba(255,80,80,0.85)' : 'rgba(255,80,80,0.4)';
          for (let x = t.x - 10; x > Math.max(z.x0, p.cx - 120); x -= P * 5) ctx.fillRect(PXL.snap(x) - P * 2, PXL.snap(y) - P / 2, P * 3, P);
          arrow(t.x - 30, y - 4, -1, '#ff6060');
        }
        if (this.ball && !this.ball.dead) R.light(this.ball.x, this.ball.y, 60, 'rgba(160,120,255,0.9)', 0.4);
      } else if (this.step === 'attack' && z && z.dummy) {
        const d = z.dummy;
        if (this.phase === 'a') arrow(d.x + d.w / 2, d.y - 40, 0, '#ffd76a');
      }
    }
  }

  MG.Tutorial = {
    Director,
    start(scene, opts) {
      const d = new Director(scene, opts);
      scene.tut = d;
      d.begin().catch((e) => console.error(e));
      return d;
    }
  };
})();

</script>
<script>/* js/systems/StorySystem.js */
/* StorySystem — 시네마틱 컷신 (카메라 이동·연속 전환·자막). 오른쪽 터치/스와이프/Enter로 진행 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const VW = 1280, VH = 720;
  const PIXF = { letter: 1.5, book: 2 }; // 컷신 도트 격자 (가상 단위 / 픽셀). 기본 3 = 게임 화면과 같은 도트 크기

  /* 배경 그리기 (가상 1280×720 좌표) */
  const BG = {
    void(c, t) { c.fillStyle = '#050507'; c.fillRect(-200, -200, VW + 400, VH + 400); },
    letter(c, t, R, sh) {
      BG.void(c, t);
      const g = c.createRadialGradient(640, 360, 50, 640, 360, 600); g.addColorStop(0, 'rgba(80,90,120,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(0, 0, VW, VH);
      c.save(); c.translate(640, 370); c.rotate(-0.04 + Math.sin(t * 0.6) * 0.01);
      c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 40; c.shadowOffsetY = 18;
      c.fillStyle = '#f3efe6'; c.fillRect(-260, -300, 520, 600); c.shadowBlur = 0; c.shadowOffsetY = 0;
      c.fillStyle = '#20202a'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '800 30px ' + MG.R.FONT; c.fillText('새벽예술대학교', 0, -230);
      c.font = '600 18px ' + MG.R.FONT; c.fillStyle = '#555'; c.fillText('신입생 실기 전형 결과 통지', 0, -192);
      c.fillStyle = '#222'; c.font = '500 20px ' + MG.R.FONT;
      c.fillText(MG.State.nick + ' 님,', 0, -120);
      c.fillText('귀하는 본교 서양화과 실기 전형에', 0, -70);
      c.font = '900 64px ' + MG.R.FONT; c.fillStyle = '#b3261e';
      const a = sh.stamp ? U.clamp((sh.t - 0.4) * 3, 0, 1) : 1;
      c.save(); c.globalAlpha = a; c.translate(0, 30); c.scale(1 + (1 - a) * 1.5, 1 + (1 - a) * 1.5); c.rotate(-0.08);
      c.strokeStyle = '#b3261e'; c.lineWidth = 6; c.strokeRect(-170, -52, 340, 104);
      c.fillText(sh.godStamp ? '역사의 신' : '불 합 격', 0, 4); c.restore();
      c.font = '500 18px ' + MG.R.FONT; c.fillStyle = '#444'; c.fillText(sh.godStamp ? '그러나 역사는 당신을 기억합니다.' : '하였음을 알려 드립니다.', 0, 140);
      c.restore();
    },
    room(c, t) {
      const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#141826'); g.addColorStop(1, '#0a0b10'); c.fillStyle = g; c.fillRect(-200, -200, VW + 400, VH + 400);
      // 창문과 달빛
      c.fillStyle = '#1c2540'; c.fillRect(820, 90, 300, 240);
      c.fillStyle = '#dfe8ff'; c.beginPath(); c.arc(1040, 150, 26, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#2d3550'; c.lineWidth = 10; c.strokeRect(820, 90, 300, 240); c.beginPath(); c.moveTo(970, 90); c.lineTo(970, 330); c.stroke();
      c.fillStyle = 'rgba(200,215,255,0.06)'; c.beginPath(); c.moveTo(820, 330); c.lineTo(1120, 330); c.lineTo(900, 720); c.lineTo(500, 720); c.fill();
      // 책상과 이젤
      c.fillStyle = '#3a2c22'; c.fillRect(140, 470, 640, 26); c.fillRect(170, 496, 18, 224); c.fillRect(730, 496, 18, 224);
      c.fillStyle = '#e9e3d5'; c.fillRect(250, 300, 170, 170); c.fillStyle = '#c55'; c.beginPath(); c.arc(330, 380, 40, 0, Math.PI * 2); c.fill(); c.fillStyle = '#58a'; c.fillRect(280, 410, 90, 30);
      c.strokeStyle = '#3a2c22'; c.lineWidth = 8; c.beginPath(); c.moveTo(335, 300); c.lineTo(300, 470); c.moveTo(335, 300); c.lineTo(370, 470); c.stroke();
      // 책장과 빛나는 교과서
      c.fillStyle = '#2a2018'; c.fillRect(40, 120, 120, 350);
      for (let i = 0; i < 4; i++) { c.fillStyle = ['#5a3a3a', '#3a4a5a', '#5a5a3a', '#3a5a4a'][i]; c.fillRect(52 + i * 24, 150, 20, 80); }
      const glow = 0.4 + 0.3 * Math.sin(t * 3);
      c.fillStyle = 'rgba(255,215,120,' + glow + ')'; c.fillRect(52, 260, 96, 70);
      c.fillStyle = '#7a2a22'; c.fillRect(60, 268, 80, 54); c.fillStyle = '#e8d48a'; c.font = '700 14px ' + MG.R.FONT; c.textAlign = 'center'; c.fillText('한국사', 100, 298);
      // 주인공 실루엣
      MG.BossArt.npc(c, MG.R, 560, 470, { coat: '#ece8df', pants: '#2b2f3a', hair: '#1d1b22' }, t, false);
    },
    book(c, t, R, sh) {
      BG.void(c, t);
      c.save(); c.translate(640, 380);
      c.fillStyle = '#e9e1cc'; c.beginPath(); c.moveTo(-520, -250); c.quadraticCurveTo(-260, -280, 0, -240); c.lineTo(0, 260); c.quadraticCurveTo(-260, 230, -520, 260); c.fill();
      c.beginPath(); c.moveTo(520, -250); c.quadraticCurveTo(260, -280, 0, -240); c.lineTo(0, 260); c.quadraticCurveTo(260, 230, 520, 260); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.2)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -240); c.lineTo(0, 260); c.stroke();
      const lines = ['1920 조선 물산 장려회', '1922 조선 민립 대학 기성회', '1927 신간회 결성', '1929 광주 학생 항일 운동', '1938 국가 총동원법', '1940 한국광복군 창설', '1941 대한민국 건국 강령'];
      const glitch = sh.glitch ? U.clamp(sh.t * 0.8, 0, 1) : 0;
      c.font = '700 24px ' + MG.R.FONT; c.textAlign = 'left';
      lines.forEach((L, i) => {
        const side = i % 2 ? 1 : -1, x = side < 0 ? -470 : 50, y = -180 + Math.floor(i / 1) * 58;
        let s = L, bad = false;
        if (glitch > 0) {
          const r = U.rng(i * 31 + Math.floor(t * 12));
          if (r() < glitch * 0.8) s = s.split('').map((ch) => (r() < glitch * 0.35 ? '▓░▒?╳'[Math.floor(r() * 5)] : ch)).join('');
          // 연도를 바꿔 보여 줄 때는 반드시 '오염된 글자'로 보이게 (틀린 연도를 사실처럼 외우지 않도록)
          if (r() < glitch * 0.5) { s = '?' + String(1900 + Math.floor(r() * 60)).slice(1) + s.slice(4); bad = true; }
        }
        c.globalAlpha = sh.vanish ? U.clamp(1 - sh.t * 0.6 + i * 0.05, 0, 1) : 1;
        const gx = x + (glitch ? Math.sin(t * 40 + i) * glitch * 6 : 0);
        c.fillStyle = bad ? '#b3261e' : '#2a2a33';
        c.fillText(s, gx, y);
        if (bad) { const w = c.measureText(s.slice(0, 4)).width; c.strokeStyle = '#b3261e'; c.lineWidth = 3; c.beginPath(); c.moveTo(gx - 4, y - 8); c.lineTo(gx + w + 4, y - 8); c.stroke(); }
      });
      c.globalAlpha = 1;
      c.restore();
      if (sh.vanish && MG.Settings.get('bgEffects')) {
        const r = U.rng(Math.floor(t * 20));
        for (let i = 0; i < 40; i++) { c.fillStyle = 'rgba(30,30,40,' + r() + ')'; c.fillRect(140 + r() * 1000, 180 + r() * 400 - sh.t * 60 * r(), 4, 4); }
      }
    },
    inkmeet(c, t, R, sh) {
      BG.book(c, t, R, { glitch: true, t: 2, vanish: true });
      c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(-200, -200, VW + 400, VH + 400);
      const s = U.clamp(sh.t * 1.5, 0, 1);
      c.save(); c.translate(640, 330); c.scale(3 * U.easeOutBack(s), 3 * U.easeOutBack(s));
      MG.BossArt.mascot(c, R, 0, 0, t, sh.mood || 'normal');
      c.restore();
    },
    vortex(c, t, R, sh) {
      BG.void(c, t);
      c.save(); c.translate(640, 360);
      for (let i = 0; i < 26; i++) {
        c.rotate(0.24 + t * 0.06);
        c.strokeStyle = 'hsla(' + (220 + i * 4) + ',60%,' + (30 + i * 2) + '%,' + (0.15 + i * 0.02) + ')';
        c.lineWidth = 8 + i; c.beginPath(); c.arc(0, 0, 40 + i * 22 + Math.sin(t * 3 + i) * 10, 0, Math.PI * 1.2); c.stroke();
      }
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 18 + Math.sin(t * 8) * 4, 0, Math.PI * 2); c.fill();
      c.font = '700 20px ' + MG.R.FONT; c.fillStyle = 'rgba(255,255,255,0.6)';
      ['1927', '1938', '1941', '신간회', '광복군', '물산 장려'].forEach((w, i) => { const a = t * 1.5 + i; const r = 300 - ((t * 80 + i * 60) % 300); c.fillText(w, Math.cos(a) * r, Math.sin(a) * r); });
      c.restore();
    },
    archive(c, t) {
      const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#0c1630'); g.addColorStop(1, '#1c1424'); c.fillStyle = g; c.fillRect(-200, -200, VW + 400, VH + 400);
      for (let i = 0; i < 12; i++) {
        const x = i * 120 - 40, h = 380 + (i % 3) * 60;
        c.fillStyle = '#141b33'; c.fillRect(x, 720 - h, 90, h);
        for (let y = 720 - h + 14; y < 700; y += 26) { c.fillStyle = 'rgba(255,215,140,' + (0.15 + 0.15 * Math.sin(t * 2 + i + y)) + ')'; c.fillRect(x + 8, y, 74, 16); }
      }
      c.fillStyle = 'rgba(255,230,170,0.08)'; c.beginPath(); c.moveTo(560, 0); c.lineTo(720, 0); c.lineTo(900, 720); c.lineTo(380, 720); c.fill();
    },
    hell(c, t) {
      const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#1a0306'); g.addColorStop(1, '#3a0a0c'); c.fillStyle = g; c.fillRect(-200, -200, VW + 400, VH + 400);
      c.font = '800 40px ' + MG.R.FONT; c.fillStyle = 'rgba(255,60,80,0.25)'; c.textAlign = 'center';
      ['f(x)', 'g∘f', 'f⁻¹', '√x', 'y=k/x', '∴', 'p→q'].forEach((s, i) => c.fillText(s, 120 + i * 170, 140 + Math.sin(t + i) * 30 + (i % 2) * 120));
      c.fillStyle = '#120204'; for (let i = 0; i < 9; i++) { c.beginPath(); c.moveTo(i * 160, 720); c.lineTo(i * 160 + 70, 300 + (i % 3) * 80); c.lineTo(i * 160 + 140, 720); c.fill(); }
    },
    yedam(c, t, R, sh) {
      BG.hell(c, t);
      c.save(); c.translate(640, 640); c.scale(1.6, 1.6);
      MG.BossArt.draw(c, R, 'yedam', { w_: 180, h_: 300, t, tier: 0 }, {});
      c.restore();
    },
    heaven(c, t) {
      const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#fff3cf'); g.addColorStop(1, '#c79a4a'); c.fillStyle = g; c.fillRect(-200, -200, VW + 400, VH + 400);
      c.fillStyle = 'rgba(255,255,255,0.5)'; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(100 + i * 230, 600 + Math.sin(t + i) * 10, 120, 0, Math.PI * 2); c.fill(); }
      c.fillStyle = '#e7cf8f'; for (let i = 0; i < 8; i++) { c.fillRect(120 + i * 140, 160, 40, 420); c.fillRect(110 + i * 140, 150, 60, 14); }
      c.fillRect(80, 120, 1120, 34);
      for (let i = 0; i < 10; i++) { c.fillStyle = 'rgba(160,120,50,' + (0.2 + i * 0.05) + ')'; c.fillRect(440 - i * 20, 580 + i * 14, 400 + i * 40, 14); }
    },
    daeyoung(c, t, R, sh) {
      BG.heaven(c, t);
      c.save(); c.translate(640, 600); c.scale(1.5, 1.5);
      MG.BossArt.draw(c, R, 'daeyoung', { w_: 220, h_: 320, t, tier: sh.tier || 0 }, {});
      c.restore();
    },
    god(c, t, R, sh) {
      BG.heaven(c, t);
      c.fillStyle = 'rgba(255,255,255,0.4)'; c.fillRect(-200, -200, VW + 400, VH + 400);
      const g = c.createRadialGradient(640, 380, 10, 640, 380, 420); g.addColorStop(0, 'rgba(255,240,190,1)'); g.addColorStop(1, 'rgba(255,240,190,0)'); c.fillStyle = g; c.fillRect(0, 0, VW, VH);
      const p = new MG.Player(0, 0); p.animT = t;
      c.save(); c.translate(640, 520); c.scale(2, 2);
      const prev = MG.State.d.rewards.skin; MG.State.d.rewards.skin = 'gold';
      p._figure(c, 0, 0, 1, MG.Player.SKINS.gold, 'awaken', t, null);
      MG.State.d.rewards.skin = prev;
      c.restore();
    },
    seal(c, t, R, sh) {
      BG.archive(c, t);
      c.save(); c.translate(640, 330); c.rotate(Math.sin(t) * 0.05);
      c.fillStyle = '#d9b45a'; R.roundRect(-90, -90, 180, 180, 20); c.fill();
      c.strokeStyle = '#7a5a1e'; c.lineWidth = 8; c.strokeRect(-64, -64, 128, 128);
      c.fillStyle = '#7a5a1e'; c.font = '900 48px ' + MG.R.FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('金印', 0, 4);
      c.restore();
    }
  };

  const Story = {
    playing: false,
    play(sceneId, opts) {
      opts = opts || {};
      const shots = (MG.Data.story.scenes[sceneId] || []).map((s) => Object.assign({}, s));
      if (!shots.length) return Promise.resolve();
      // 이미 재생 중인 컷신이 있으면 먼저 정상 종료 (컷신이 겹쳐 쌓이지 않도록)
      if (this.playing && this._finish) this._finish(true); // 이전 흐름은 버림(이어지는 장면 전환 방지)
      return new Promise((resolve) => {
        this.playing = true;
        const S = {
          name: 'story', full: true, i: 0, line: 0, t: 0, prev: null, prevA: 0, camK: 0, lb: 0, fadeIn: 1,
          update(dt) { S.t += dt; S.lb = Math.min(1, S.lb + dt * 2.5); S.fadeIn = Math.max(0, S.fadeIn - dt * 2); if (S.prevA > 0) S.prevA = Math.max(0, S.prevA - dt * 1.6); S.camK = Math.min(1, S.camK + dt / (shots[S.i].camDur || 3.2)); shots[S.i].t = (shots[S.i].t || 0) + dt; },
          render(R) {
            const c = R.ctx;
            c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, R.W, R.H);
            const drawShot = (sh, a, k) => {
              const s = Math.min(R.W / VW, R.H / VH) * 1.0;
              const from = sh.cam ? sh.cam[0] : [640, 360, 1], to = sh.cam ? sh.cam[1] : from;
              const e = U.easeInOutCubic(k);
              const cx = U.lerp(from[0], to[0], e), cy = U.lerp(from[1], to[1], e), z = U.lerp(from[2], to[2], e);
              // 장면을 저해상도 캔버스에 그린 뒤 최근접 확대 → 도트 컷신 (글자가 많은 장면은 격자를 조금 촘촘히)
              const upx = PIXF[sh.bg] || 3, pk = s * z * upx;
              const w = Math.ceil(R.W / pk) + 1, h = Math.ceil(R.H / pk) + 1;
              if (!S._off) S._off = MG.Pixel.mk(w, h);
              const off = S._off; if (off.width !== w || off.height !== h) { off.width = w; off.height = h; }
              const g = off.getContext('2d');
              g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, w, h);
              g.setTransform(1 / upx, 0, 0, 1 / upx, R.W / 2 / pk - cx / upx, R.H / 2 / pk - cy / upx);
              const prevCtx = R.ctx; R.ctx = g;
              try { (BG[sh.bg] || BG.void)(g, S.t, R, sh); } catch (err) { console.error(err); }
              R.ctx = prevCtx;
              c.save();
              c.setTransform(1, 0, 0, 1, 0, 0);
              c.globalAlpha = a; c.imageSmoothingEnabled = false;
              c.drawImage(off, 0, 0, w * pk, h * pk);
              c.restore();
            };
            if (S.prev && S.prevA > 0) drawShot(S.prev, 1, 1);
            drawShot(shots[S.i], S.prev ? 1 - S.prevA : 1, S.camK);
            c.setTransform(1, 0, 0, 1, 0, 0);
            const lb = R.H * 0.1 * U.easeInOutCubic(S.lb);
            c.fillStyle = '#000'; c.fillRect(0, 0, R.W, lb); c.fillRect(0, R.H - lb, R.W, lb);
            if (S.fadeIn > 0) { c.globalAlpha = S.fadeIn; c.fillRect(0, 0, R.W, R.H); c.globalAlpha = 1; }
            if (R.flashA > 0) { c.globalAlpha = R.flashA; c.fillStyle = R.flashCol; c.fillRect(0, 0, R.W, R.H); c.globalAlpha = 1; R.flashA = Math.max(0, R.flashA - 0.03); }
          }
        };
        MG.Core.pushFreeze();
        MG.Core.overlay = S;
        MG.Input.setTouchVisible(false);
        document.body.classList.add('in-story');
        if (opts.music) MG.Audio.music(opts.music);
        const ui = U.el('div', { class: 'story-ui' });
        const sub = U.el('div', { class: 'subtitle glass' }, U.el('div', { class: 'sname' }), U.el('div', { class: 'stext' }));
        const skip = U.el('button', { class: 'btn small ghost story-skip' }, '건너뛰기 ›');
        const tapHint = U.el('div', { class: 'tap-hint' }, '오른쪽을 탭하거나 왼쪽으로 밀어 계속');
        ui.append(sub, skip, tapHint);
        document.getElementById('ui-root').appendChild(ui);
        requestAnimationFrame(() => ui.classList.add('show'));
        const setLine = () => {
          const sh = shots[S.i];
          const L = (sh.lines || [])[S.line];
          if (!L) { sub.classList.add('empty'); return; }
          sub.classList.remove('empty');
          sub.dataset.who = L.who || 'nar';
          sub.querySelector('.sname').textContent = L.who === 'ink' ? '먹물' : L.who === 'me' ? MG.State.nick : L.who === 'nar' || !L.who ? '' : L.name || L.who;
          const txt = U.fill(L.text, { nick: MG.State.nick });
          const st = sub.querySelector('.stext'); st.textContent = '';
          let k = 0; clearInterval(S._typ);
          S._typ = setInterval(() => { k += 2; st.textContent = txt.slice(0, k); if (k >= txt.length) { clearInterval(S._typ); S._typ = null; } }, 24);
          S._full = txt;
          if (L.sfx) MG.Audio.sfx(L.sfx);
          if (L.flash) MG.R.flash(L.flash, 0.5);
        };
        const finish = (abandon) => {
          if (S.done) return; S.done = true;
          if (this._finish === finish) this._finish = null;
          clearInterval(S._typ);
          ui.style.pointerEvents = 'none';
          ui.classList.remove('show'); setTimeout(() => ui.remove(), 300);
          window.removeEventListener('keydown', key); ui.removeEventListener('pointerdown', down); ui.removeEventListener('pointerup', up);
          MG.Core.overlay = null;
          document.body.classList.remove('in-story');
          MG.Core.popFreeze();
          this.playing = false;
          if (abandon !== true) resolve();
        };
        this._finish = finish;
        const advance = () => {
          if (S._typ) { clearInterval(S._typ); S._typ = null; sub.querySelector('.stext').textContent = S._full; return; }
          const sh = shots[S.i];
          MG.Audio.sfx('ui');
          if (sh.lines && S.line < sh.lines.length - 1) { S.line++; setLine(); return; }
          if (S.i < shots.length - 1) {
            S.prev = shots[S.i]; S.prevA = 1; S.i++; S.line = 0; S.camK = 0; shots[S.i].t = 0;
            if (shots[S.i].sfx) MG.Audio.sfx(shots[S.i].sfx);
            if (shots[S.i].music) MG.Audio.music(shots[S.i].music);
            setLine();
          } else finish();
        };
        let sx = 0, sy = 0, st0 = 0;
        const down = (e) => { sx = e.clientX; sy = e.clientY; st0 = U.now(); };
        const up = (e) => {
          if (e.target === skip) return;
          const dx = e.clientX - sx;
          if (dx < -50 && Math.abs(e.clientY - sy) < 80) return advance();         // 왼쪽으로 스와이프
          if (Math.abs(dx) < 12 && e.clientX > window.innerWidth * 0.42) advance(); // 오른쪽 탭
        };
        const key = (e) => { if (['Enter', 'Space', 'ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); advance(); } };
        ui.addEventListener('pointerdown', down); ui.addEventListener('pointerup', up);
        window.addEventListener('keydown', key);
        skip.addEventListener('click', () => { MG.Audio.sfx('ui'); finish(); });
        if (shots[0].sfx) MG.Audio.sfx(shots[0].sfx);
        setLine();
      });
    }
  };
  MG.Story = Story;
})();

</script>
<script>/* js/systems/UIManager.js */
/* UIManager — HUD(하트 7개 + 별도 HP 게이지), 토스트, 결과 화면, 메뉴, 지도, 도감, 오답 노트, 설정, 저장 */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const el = U.el;
  const root = () => document.getElementById('ui-root');

  const UI = {
    init() {
      this.hud = HUD; HUD.build();
      this.toastBox = el('div', { class: 'toasts' });
      root().appendChild(this.toastBox);
      this.fpsEl = el('div', { class: 'fps' });
      root().appendChild(this.fpsEl);
      MG.bus.on('save:done', (kind) => { if (kind === 'manual') this.toast('저장 완료', 'ok'); HUD.saved(); });
      MG.bus.on('reward:unlock', (k, id) => this.toast('해금: ' + rewardName(k, id), 'gold'));
    },
    frame(dt) {
      HUD.frame(dt);
      if (MG.Settings.get('showFps')) { this.fpsEl.style.display = 'block'; this.fpsEl.textContent = Math.round(MG.Perf.fps) + ' FPS · ' + MG.Perf.tier + ' · ' + MG.Perf.refreshHz + 'Hz'; }
      else this.fpsEl.style.display = 'none';
    },
    toast(msg, type) {
      const t = el('div', { class: 'toast glass ' + (type || '') }, msg);
      this.toastBox.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
      while (this.toastBox.children.length > 3) this.toastBox.firstChild.remove();
    },
    recordCard(def) {
      const c = el('div', { class: 'record-card glass' }, el('div', { class: 'rc-year' }, def.year || '記'), el('div', {}, el('div', { class: 'rc-title' }, '기록 조각 · ' + def.title), el('div', { class: 'rc-text' }, def.text), def.page ? el('div', { class: 'rc-page' }, '교과서 p.' + def.page) : null));
      root().appendChild(c);
      requestAnimationFrame(() => c.classList.add('show'));
      setTimeout(() => { c.classList.remove('show'); setTimeout(() => c.remove(), 400); }, 4200);
    },
    bossCard(name, title) {
      const c = el('div', { class: 'boss-card' }, el('div', { class: 'bc-title' }, title || ''), el('div', { class: 'bc-name' }, name));
      root().appendChild(c);
      requestAnimationFrame(() => c.classList.add('show'));
      setTimeout(() => { c.classList.remove('show'); setTimeout(() => c.remove(), 600); }, 2400);
    },
    /* 모달 공통 */
    modal(content, opts) {
      opts = opts || {};
      const wrap = el('div', { class: 'modal ' + (opts.cls || '') });
      const card = el('div', { class: 'mcard glass' });
      if (opts.title) card.appendChild(el('div', { class: 'mtitle' }, opts.title));
      card.appendChild(content);
      wrap.appendChild(card);
      root().appendChild(wrap);
      requestAnimationFrame(() => wrap.classList.add('show'));
      if (opts.freeze !== false) MG.Core.pushFreeze();
      MG.Input.setTouchVisible(false);
      const close = () => {
        wrap.classList.remove('show'); setTimeout(() => wrap.remove(), 260);
        if (opts.freeze !== false) MG.Core.popFreeze();
        if (HUD.visible) MG.Input.setTouchVisible(true);
      };

      if (MG.Q.open || MG.Dialog.open || MG.Story.playing || this._paused) return;

      if (!sc || !['stage', 'hell', 'heaven'].includes(sc.name)) return;
      this._paused = true;
      const body = el('div', { class: 'menu-list' });
      const m = this.modal(body, { title: '일시정지', cls: 'pause-modal' });
      const titleEl = m.card.querySelector('.mtitle');
      let view = 'root';
      const onKey = (e) => { if (e.code === 'Escape' && view !== 'root') { e.preventDefault(); e.stopPropagation(); back(); } };
      document.addEventListener('keydown', onKey, true);
      const done = () => { this._paused = false; document.removeEventListener('keydown', onKey, true); m.close(); };
      this._pauseDone = done;
      const add = (label, fn, cls, sub) => {
        const b = el('button', { class: 'btn ' + (cls || '') }, label, sub ? el('small', {}, sub) : null);
        b.onclick = () => { MG.Audio.sfx('ui'); fn(); }; body.appendChild(b); return b;

      const back = () => (view === 'chapters' ? moveMenu() : rootMenu());

      const blocked = sc.name === 'hell' ? '지옥 시험 중에는 구간을 옮길 수 없어요.' : sc.name === 'heaven' ? '천국 승급 시험 중에는 구간을 옮길 수 없어요.' : null;

    },

<script>/* js/data/HistoryData.js */
/* HistoryData — 데이터 로더와 문제 은행(출제 선택 로직)
 * 데이터 원본은 data/*.json (코드와 분리). 단일 파일 빌드에서는 window.MG_BUNDLED_DATA를 사용한다. */
(function () {
  'use strict';
  const MG = window.MG, U = MG.U;
  const FILES = { stages: 'data/stages.json', history: 'data/history_questions.json', heaven: 'data/heaven_questions.json', story: 'data/story.json', bbakji: 'data/bbakji.json', minjun: 'data/minjun.json', companion: 'data/companion.json', tutorial: 'data/tutorial.json' };
  const WEIGHT = { S: 6, A: 4, P: 4, B: 3, C: 2, D: 2, T: 1 };

  const Data = {
    loaded: false, stages: [], stageMap: {}, questions: [], qMap: {}, heaven: null, story: null, bbakji: null,
    async load(onProgress) {
      let raw = window.MG_BUNDLED_DATA;
      if (!raw) {
        raw = {};
        const keys = Object.keys(FILES);
        let n = 0;
        for (const k of keys) {
          const res = await fetch(FILES[k], { cache: 'no-cache' });
          if (!res.ok) throw new Error(FILES[k] + ' 불러오기 실패 (' + res.status + ')');
          raw[k] = await res.json();
          n++; onProgress && onProgress(n / keys.length);
        }
      }
      this.stages = raw.stages.stages;
      this.timeline = raw.stages.timeline || [];
      this.codexInfo = raw.stages.codex || {};
      this.stages.forEach((s, i) => { s.index = i; this.stageMap[s.id] = s; });
      this.questions = raw.history.questions.concat(raw.history.tutorial || []);
      this.questions.forEach((q) => (this.qMap[q.id] = q));
      this.heaven = raw.heaven;
      (raw.heaven.tiers || []).forEach((t) => t.questions.forEach((q) => { q.stage = q.stage || 'heaven'; this.qMap[q.id] = q; }));
      this.story = raw.story;
      this.bbakji = raw.bbakji;
      this.minjun = raw.minjun;
      this.companion = raw.companion;
      this.tutorial = raw.tutorial;
      this.loaded = true;
    },
    stageQuestions(stageId, role) {
      return this.questions.filter((q) => q.stage === stageId && (!role || (q.role || 'q') === role));
    },
    tutorialQuestion() { return this.questions.find((q) => q.stage === 'tutorial'); },
    allPlayable() { return this.questions.filter((q) => q.stage !== 'tutorial'); }
  };

  /* 문제 은행: 같은 문제를 반복하지 않도록 사용 기록을 보며 가중치 추첨 */
  const Bank = {
    pick(stageId, opts) {
      opts = opts || {};
      const used = opts.used || [];
      let pool = (opts.pool || Data.stageQuestions(stageId, opts.role || 'q')).filter((q) => !opts.types || opts.types.includes(q.type));
      const ord = ['S', 'A', 'P', 'B', 'C', 'D'];
      const strongOf = (arr) => { if (!opts.minImp) return arr; const lim = ord.indexOf(opts.minImp); return arr.filter((q) => { const i = ord.indexOf(q.importance); return i >= 0 && i <= lim; }); };
      // 우선순위: 중요 문제 중 미사용 → 전체 중 미사용 → 직전 문제만 제외한 중요 문제 → 전체
      const unused = pool.filter((q) => !used.includes(q.id));
      let fresh = strongOf(unused);
      if (!fresh.length) fresh = unused;
      if (!fresh.length) fresh = strongOf(pool).filter((q) => q.id !== used[used.length - 1]);
      if (!fresh.length) fresh = pool.filter((q) => q.id !== used[used.length - 1]);
      if (!fresh.length) fresh = pool;
      if (!fresh.length) return null;
      const st = MG.State.d;
      const w = fresh.map((q) => {
        let v = WEIGHT[q.importance] || 1;
        const wl = st.wrongLog[q.id];
        if (wl && wl.count > 0) v += 3 + wl.count;
        v /= 1 + (st.seenQ[q.id] || 0) * 0.35;
        return v;
      });
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < fresh.length; i++) { r -= w[i]; if (r <= 0) return fresh[i]; }
      return fresh[fresh.length - 1];
    },
    /* 복습: 오답 기록에서 우선순위 순 */
    reviewList() {
      const st = MG.State.d;
      return Object.keys(st.wrongLog).map((id) => Data.qMap[id]).filter(Boolean)
        .filter((q) => st.wrongLog[q.id].count > 0)
        .sort((a, b) => MG.State.reviewPriority(b) - MG.State.reviewPriority(a));
    }
  };

  MG.Data = Data;
  MG.Bank = Bank;
})();

</script>
<script>/* js/data/MathData.js */
/* MathData — 지옥(안예닮) 공통수학 2 문제 생성기
 * 명제·참거짓·필요충분조건·함수의 정의·정의역/공역/치역·대응 관계 그림·일대일함수/일대일대응·합성함수·역함수·유리함수·무리함수
 * 모든 정답은 코드로 계산한다(사람이 입력한 정답 없음). raw 필드로 테스트에서 독립 재검증한다.
 * 대응 그림 문제는 '집합 연산'이 아니라 두 집합 사이의 화살표 대응(함수 판단) 문제다. */
(function (root) {
  'use strict';

  /* ── 유틸 ── */
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uniq = (arr) => [...new Set(arr)];
  let seq = 0;
  const id = (t) => 'math-' + t + '-' + (++seq) + '-' + Math.floor(Math.random() * 1e5);
  const KO = ['(가)', '(나)', '(다)', '(라)'];

  /* 함수 성질 판정 (대응 = [[x, y], ...]) */
  const Fn = {
    isFunction(X, pairs) { return X.every((x) => pairs.filter((p) => p[0] === x).length === 1); },
    image(X, pairs) { return uniq(pairs.map((p) => p[1])); },
    isInjective(X, pairs) { if (!Fn.isFunction(X, pairs)) return false; const im = pairs.map((p) => p[1]); return uniq(im).length === im.length; },
    isSurjective(X, Y, pairs) { if (!Fn.isFunction(X, pairs)) return false; const im = Fn.image(X, pairs); return Y.every((y) => im.includes(y)); },
    isBijection(X, Y, pairs) { return Fn.isInjective(X, pairs) && Fn.isSurjective(X, Y, pairs); },
    apply(pairs, x) { const p = pairs.find((q) => q[0] === x); return p ? p[1] : undefined; }
  };

  /* SVG 대응 그림 */
  function diagram(X, Y, pairs, opts) {
    opts = opts || {};
    const W = 250, H = 40 + Math.max(X.length, Y.length) * 34, ex = 62, ey = 188;
    const ys = (n, i) => 26 + (H - 52) * (n === 1 ? 0.5 : i / (n - 1));
    let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + (H + 20) + '" width="' + W + '" height="' + (H + 20) + '" role="img" aria-label="대응 그림">';
    s += '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd76a"/></marker></defs>';
    s += '<ellipse cx="' + ex + '" cy="' + (H / 2) + '" rx="38" ry="' + (H / 2 - 4) + '" fill="none" stroke="#f5f3ee" stroke-opacity=".7" stroke-width="2"/>';
    s += '<ellipse cx="' + ey + '" cy="' + (H / 2) + '" rx="38" ry="' + (H / 2 - 4) + '" fill="none" stroke="#f5f3ee" stroke-opacity=".7" stroke-width="2"/>';
    s += '<text x="' + ex + '" y="' + (H + 16) + '" fill="#f5f3ee" font-size="14" text-anchor="middle" font-weight="700">' + (opts.xn || 'X') + '</text>';
    s += '<text x="' + ey + '" y="' + (H + 16) + '" fill="#f5f3ee" font-size="14" text-anchor="middle" font-weight="700">' + (opts.yn || 'Y') + '</text>';
    X.forEach((x, i) => { s += '<text x="' + (ex - 8) + '" y="' + (ys(X.length, i) + 5) + '" fill="#f5f3ee" font-size="15" text-anchor="middle">' + x + '</text>'; });
    Y.forEach((y, i) => { s += '<text x="' + (ey + 8) + '" y="' + (ys(Y.length, i) + 5) + '" fill="#f5f3ee" font-size="15" text-anchor="middle">' + y + '</text>'; });
    pairs.forEach((p) => {
      const i = X.indexOf(p[0]), j = Y.indexOf(p[1]);
      s += '<line x1="' + (ex + 4) + '" y1="' + ys(X.length, i) + '" x2="' + (ey - 6) + '" y2="' + ys(Y.length, j) + '" stroke="#ffd76a" stroke-width="2" marker-end="url(#ah)"/>';

  }
  function chain(X, Y, Z, f, g) {
    const W = 360, H = 40 + 3 * 34;
    const cx = [55, 180, 305];
    const ys = (n, i) => 26 + (H - 52) * (i / (n - 1));
    let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + (H + 20) + '" width="' + W + '" height="' + (H + 20) + '"><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd76a"/></marker></defs>';
    [X, Y, Z].forEach((S, k) => {
      s += '<ellipse cx="' + cx[k] + '" cy="' + (H / 2) + '" rx="34" ry="' + (H / 2 - 4) + '" fill="none" stroke="#f5f3ee" stroke-opacity=".7" stroke-width="2"/>';
      s += '<text x="' + cx[k] + '" y="' + (H + 16) + '" fill="#f5f3ee" font-size="14" text-anchor="middle" font-weight="700">' + ['X', 'Y', 'Z'][k] + '</text>';
      S.forEach((e, i) => { s += '<text x="' + cx[k] + '" y="' + (ys(S.length, i) + 5) + '" fill="#f5f3ee" font-size="15" text-anchor="middle">' + e + '</text>'; });
    });
    const arrow = (A, B, k, pairs, lbl) => {
      pairs.forEach((p) => { s += '<line x1="' + (cx[k] + 12) + '" y1="' + ys(A.length, A.indexOf(p[0])) + '" x2="' + (cx[k + 1] - 14) + '" y2="' + ys(B.length, B.indexOf(p[1])) + '" stroke="#ffd76a" stroke-width="2" marker-end="url(#ah2)"/>'; });
      s += '<text x="' + ((cx[k] + cx[k + 1]) / 2) + '" y="16" fill="#ffd76a" font-size="15" text-anchor="middle" font-weight="700">' + lbl + '</text>';
    };
    arrow(X, Y, 0, f, 'f'); arrow(Y, Z, 1, g, 'g');

  /* 무작위 대응 만들기 */
  function randFunc(X, Y) { return X.map((x) => [x, pick(Y)]); }
  function randInjective(X, Y) { const ys = shuffle(Y).slice(0, X.length); return X.map((x, i) => [x, ys[i]]); }
  function notFunction(X, Y) {
    const f = randFunc(X, Y);
    if (Math.random() < 0.5) { const k = rint(0, X.length - 1); f.splice(k, 1); } // 대응하지 않는 원소
    else { const x = pick(X); const others = Y.filter((y) => y !== Fn.apply(f, x)); f.push([x, pick(others)]); } // 두 개에 대응

  /* 정답 포함, 서로 다른 보기 4개 */
  function pick4(ans, cands) {
    const set = [ans];
    for (const c of cands) { if (set.length >= 4) break; if (!set.includes(c)) set.push(c); }

  function mc(type, stem, options, answer, extra) {

  /* 숫자 보기 4개 (정답 포함, 서로 다름) */
  function numOpts(ans, cands) {

    let d = 1;
    while (set.length < 4) { const c = ans + (d % 2 ? d : -d); if (!set.includes(c)) set.push(c); d++; }

  const GEN = {

        // ② 정수 x: x가 m의 배수이면 x는 n의 배수이다 (참 ⇔ n | m)
        let m = pick([4, 6, 8, 9, 10, 12, 15, 18]), n = pick([2, 3, 4, 5, 6, 9]); items.push({ t: '정수 x에 대하여, x가 ' + m + '의 배수이면 x는 ' + n + '의 배수이다.', v: m % n === 0, raw: ['mul', m, n] });
        // ③ 실수 x: x² = k² 이면 x = k (k ≠ 0 → 거짓) / x = k 이면 x² = k² (참)
        const k = rint(1, 6);

        // ④ 실수 x: |x| < c 이면 x < d (참 ⇔ c ≤ d), c > 0
        const c = rint(1, 6), d2 = rint(-2, 7); items.push({ t: '실수 x에 대하여, |x| < ' + c + ' 이면 x < ' + d2 + ' 이다.', v: c <= d2, raw: ['abs', c, d2] });
        const wantTrue = Math.random() < 0.5;
        const ok = items.filter((it) => it.v === wantTrue).length === 1;
        if (!ok) continue;
        const sh = shuffle(items);
        return mc('prop', '다음 명제 중 ' + (wantTrue ? '참인' : '거짓인') + ' 것은?', sh.map((x) => x.t), sh.findIndex((x) => x.v === wantTrue),
          { raw: { want: wantTrue, items: sh.map((x) => x.raw) }, explain: '명제 p → q가 참이려면 p를 만족하는 모든 x가 q를 만족해야 한다(진리집합 P ⊂ Q). 반례가 하나라도 있으면 거짓.' , why: sh.map((x) => (x.v ? '참 (진리집합 P ⊂ Q)' : '거짓 (반례가 존재)')) });

    necSuf() {

      const fam = rint(0, 2);

      } else {

        if (Math.random() < 0.5) { p = 'x = ' + k; q = 'x² = ' + (k * k); PinQ = true; QinP = false; raw = ['sq', k, 0]; }

    },
    /* 대응 그림: 함수인 것 고르기 */
    mapFunction() {

      const correct = randFunc(X, Y);

      const all = shuffle([correct, ...wrongs]);

    /* 대응 그림: 치역 */
    mapRange() {

      let f; do { f = randFunc(X, Y); } while (Fn.image(X, f).length < 2 || Fn.image(X, f).length > 4);
      const im = Fn.image(X, f).sort();
      const fmt = (st) => '{' + st.join(', ') + '}';
      const missing = Y.filter((y) => !im.includes(y));
      const variants = [fmt(Y), fmt(X), fmt(im.slice(0, -1)), fmt(uniq(im.concat([missing[0]])).sort()), fmt(missing)];
      let opts = [fmt(im)];
      for (const v of variants) { if (opts.length >= 4) break; if (v !== '{}' && !opts.includes(v)) opts.push(v); }

        { figure: diagram(X, Y, f), raw: { X, Y, f, im }, explain: '정의역 X = ' + fmt(X) + ', 공역 Y = ' + fmt(Y) + '. 치역은 실제로 대응된 함숫값의 집합 {f(x) | x ∈ X} = ' + fmt(im) + ' 이며 공역의 부분집합이다.' });

    /* 대응 그림: 일대일대응 / 일대일함수 */

      if (mode === 0) {
        const o = numOpts(p + q, [p - q, -p + q, -p - q, p * q]);
        return mc('rat', '유리함수 y = ' + frac + '의 그래프의 점근선이 x = m, y = n일 때, m + n의 값은?', o.options, o.answer, { raw: { k, p, q, mode }, explain: 'y = k/(x − p) + q 꼴의 점근선은 x = ' + p + ', y = ' + q + ' → m + n = ' + (p + q) + '.' });
      }
      if (mode === 1) {
        const ans = '{x | x ≠ ' + p + '인 실수}';
        const o = pick4(ans, ['{x | x ≠ ' + q + '인 실수}', '{x | x ≠ ' + (-p) + '인 실수}', '실수 전체의 집합', '{x | x > ' + p + '인 실수}', '{x | x ≠ ' + (p + 1) + '인 실수}']);
        return mc('ratdom', '유리함수 y = ' + frac + '의 정의역은?', o.options, o.answer, { raw: { k, p, q, mode }, explain: '분모가 0이 되는 x = ' + p + '를 제외한 실수 전체. 치역은 {y | y ≠ ' + q + '}.' });
      }
      // 함숫값
      let x0; do { x0 = p + pick([1, -1, k, -k, 2, -2]); } while (x0 === p || k % (x0 - p) !== 0);
      const val = k / (x0 - p) + q;
      const o = numOpts(val, [k * (x0 - p) + q, k / (x0 - p) - q, val + 1]);
      return mc('ratval', '유리함수 y = ' + frac + '에서 x = ' + x0 + '일 때 y의 값은?', o.options, o.answer, { raw: { k, p, q, x0, val }, explain: 'y = ' + k + '/(' + x0 + ' − (' + p + ')) + (' + q + ') = ' + val + '.' });
    },
    /* 무리함수 */
    irrational() {
      const a = pick([1, 2, -1, 3, -2]), p = rint(-4, 4), q = rint(-3, 4);
      const mode = rint(0, 2);
      const ps = p > 0 ? ' − ' + p : p < 0 ? ' + ' + (-p) : '';
      const inner = a === 1 ? 'x' + ps : (a === -1 ? '−' : a) + (p === 0 ? 'x' : '(x' + ps + ')');
      const fs = 'y = √(' + inner + ')' + (q > 0 ? ' + ' + q : q < 0 ? ' − ' + (-q) : '');
      if (mode === 0) {
        const ans = a > 0 ? '{x | x ≥ ' + p + '}' : '{x | x ≤ ' + p + '}';
        const o = pick4(ans, ['{x | x ≥ ' + p + '}', '{x | x ≤ ' + p + '}', '{x | x ≥ ' + (-p) + '}', '{x | x ≥ ' + q + '}', '{x | x ≤ ' + (-p) + '}', '{x | x ≥ ' + (p + 1) + '}', '{x | x ≤ ' + (p - 1) + '}']);
        return mc('irrdom', '무리함수 ' + fs + '의 정의역은?', o.options, o.answer, { raw: { a, p, q, mode }, explain: '근호 안이 0 이상: ' + a + '(x − (' + p + ')) ≥ 0 ⇒ ' + (a > 0 ? 'x ≥ ' : 'x ≤ ') + p + '.' });
      }
      if (mode === 1) {
        const ans = '{y | y ≥ ' + q + '}';
        const o = pick4(ans, ['{y | y ≤ ' + q + '}', '{y | y ≥ ' + p + '}', '{y | y ≥ ' + (-q) + '}', '{y | y > ' + q + '}', '{y | y ≥ ' + (q + 1) + '}']);
        return mc('irrrange', '무리함수 ' + fs + '의 치역은?', o.options, o.answer, { raw: { a, p, q, mode }, explain: '√( ) ≥ 0 이므로 y ≥ ' + q + '. (근호 앞 부호가 +일 때)' });
      }
      const s = pick([0, 1, 2, 3]);
      // a(x − p) = s² 를 만족하는 정수 x가 필요 → a | s²
      let x0 = null;
      for (const sv of [s, 2, 1, 0]) { if ((sv * sv) % a === 0) { x0 = p + (sv * sv) / a; var sUsed = sv; break; } }
      const val = sUsed + q;
      const o = numOpts(val, [sUsed * sUsed + q, -sUsed + q, sUsed - q]);
      return mc('irrval', '무리함수 ' + fs + '에서 x = ' + x0 + '일 때 y의 값은?', o.options, o.answer, { raw: { a, p, q, x0, val }, explain: '근호 안 = ' + a + '(' + x0 + ' − (' + p + ')) = ' + (sUsed * sUsed) + ' → √' + (sUsed * sUsed) + ' = ' + sUsed + ' → y = ' + val + '.' });
    }
  };

  const LEVELS = [
    ['propTruth', 'necSuf', 'mapFunction', 'mapRange', 'domRange', 'compLinear', 'invLinear', 'rational', 'irrational'],
    ['necSuf', 'mapFunction', 'mapOneToOne', 'mapRange', 'compDiagram', 'invLinear', 'invDiagram', 'rational', 'irrational', 'propTruth'],
    ['mapOneToOne', 'compDiagram', 'invDiagram', 'necSuf', 'compLinear', 'rational', 'irrational', 'mapRange', 'propTruth'],
    ['mapOneToOne', 'compDiagram', 'invDiagram', 'necSuf', 'compLinear', 'invLinear', 'rational', 'irrational']
  ];

  const MathData = {
    GEN, Fn, diagram,
    generate(level) {
      const L = LEVELS[Math.max(0, Math.min(LEVELS.length - 1, level | 0))];
      const name = L[Math.floor(Math.random() * L.length)];
      const q = GEN[name]();
      q.gen = name;
      q.difficulty = 3 + Math.min(2, level | 0);
      return q;
    }
  };

  root.MG = root.MG || {};
  root.MG.MathData = MathData;
  if (typeof module !== 'undefined' && module.exports) module.exports = MathData;
})(typeof window !== 'undefined' ? window : globalThis);
